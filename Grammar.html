<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar in Use — Chapter Checklist</title>
<style>
  :root{
    --bg:#ffffff;
    --surface:#f7f7f8;
    --border:#e4e4e7;
    --text:#18181b;
    --muted:#71717a;
    --accent:#2563eb;
    --accent-soft:#eff4ff;
    --done:#16a34a;
    --radius:8px;
  }
  [data-theme="dark"]{
    --bg:#1e1e1e;
    --surface:#2a2a2a;
    --border:#3d3d3d;
    --text:#e6e6e6;
    --muted:#9a9a9a;
    --accent:#6ea8fe;
    --accent-soft:#2b3444;
    --done:#4ade80;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    transition:background .2s,color .2s;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 72px}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:20px;
  }
  header h1{font-size:18px;font-weight:600;letter-spacing:-.2px}
  header h1 span{color:var(--muted);font-weight:400}

  .icon-btn{
    width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--bg);color:var(--text);cursor:pointer;font-size:15px;
    display:grid;place-items:center;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- progress panel ---------- */
  .panel{
    border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:16px;
  }
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .bar{
    flex:1;height:6px;border-radius:3px;background:var(--surface);
    overflow:hidden;border:1px solid var(--border);
  }
  .bar i{
    display:block;height:100%;width:0;background:var(--accent);
    transition:width .3s ease;
  }
  .pct{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

  .stats{display:flex;gap:24px}
  .stats div{display:flex;flex-direction:column}
  .stats b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .stats span{font-size:12px;color:var(--muted)}

  .done-msg{
    margin-top:14px;padding:10px 12px;border-radius:var(--radius);
    background:var(--accent-soft);color:var(--accent);
    font-size:13px;font-weight:500;
  }

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}

  .search{position:relative;flex:1 1 220px}
  .search svg{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    color:var(--muted);pointer-events:none;
  }
  input[type="search"]{
    width:100%;padding:8px 12px 8px 32px;font-size:14px;font-family:inherit;
    color:var(--text);background:var(--bg);
    border:1px solid var(--border);border-radius:var(--radius);
    outline:none;transition:.15s;
  }
  input[type="search"]::placeholder{color:var(--muted)}
  input[type="search"]:focus{border-color:var(--accent)}

  .seg{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .seg button{
    padding:8px 12px;font-size:13px;font-family:inherit;font-weight:500;
    background:var(--bg);color:var(--muted);border:none;cursor:pointer;
    border-right:1px solid var(--border);transition:.15s;white-space:nowrap;
  }
  .seg button:last-child{border-right:none}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--accent);color:#fff}

  .btn{
    padding:8px 12px;font-size:13px;font-family:inherit;font-weight:500;
    background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius);
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- list ---------- */
  .group{
    border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;
  }
  .group-head{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:11px 12px;font-family:inherit;font-size:14px;font-weight:600;
    background:var(--surface);color:var(--text);
    border:none;cursor:pointer;text-align:left;transition:.15s;
  }
  .group-head:hover{background:var(--border)}
  .group-head .chev{transition:transform .2s;color:var(--muted);flex:0 0 auto}
  .group.collapsed .chev{transform:rotate(-90deg)}
  .group-head .count{
    margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .group.complete .count{color:var(--done)}

  .group-body{padding:4px 6px 8px}
  .group.collapsed .group-body{display:none}

  .item{
    display:flex;align-items:flex-start;gap:10px;
    padding:7px 6px;border-radius:6px;cursor:pointer;transition:background .12s;
  }
  .item:hover{background:var(--surface)}
  .item input{position:absolute;opacity:0;width:0;height:0}
  .item .box{
    width:18px;height:18px;flex:0 0 auto;margin-top:2px;
    border:1.5px solid var(--border);border-radius:5px;
    display:grid;place-items:center;transition:.15s;
  }
  .item:hover .box{border-color:var(--accent)}
  .item .box svg{
    width:11px;height:11px;stroke:#fff;stroke-width:3.5;
    fill:none;stroke-linecap:round;stroke-linejoin:round;
    opacity:0;transition:opacity .15s;
  }
  .item.on .box{background:var(--accent);border-color:var(--accent)}
  .item.on .box svg{opacity:1}

  .item .n{
    font-size:12px;color:var(--muted);min-width:26px;text-align:right;
    font-variant-numeric:tabular-nums;margin-top:1px;flex:0 0 auto;
  }
  .item .t{font-size:14px}
  .item.on .t{color:var(--muted);text-decoration:line-through}

  .hidden{display:none !important}

  .empty{
    text-align:center;padding:48px 16px;color:var(--muted);font-size:14px;
  }

  @media (max-width:520px){
    .stats{gap:18px}
    .toolbar{gap:6px}
    .seg{flex:1 1 100%}
    .seg button{flex:1}
    .item .t{font-size:13.5px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Grammar in Use <span>· 145 units</span></h1>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="icon-btn" href="index.html" title="Back to challenge" aria-label="Back to challenge" style="text-decoration:none;font-size:16px">←</a>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <section class="panel">
    <div class="bar-row">
      <div class="bar"><i id="fill"></i></div>
      <span class="pct" id="pct">0%</span>
    </div>
    <div class="stats">
      <div><b id="sDone">0</b><span>completed</span></div>
      <div><b id="sLeft">145</b><span>remaining</span></div>
      <div><b id="sSec">0 / 25</b><span>sections</span></div>
    </div>
    <div class="done-msg" id="doneMsg" hidden>All chapters complete. Well done!</div>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input type="search" id="search" placeholder="Search chapters…" autocomplete="off">
    </div>
    <div class="seg" id="filters">
      <button class="on" data-f="all">All</button>
      <button data-f="todo">To do</button>
      <button data-f="done">Done</button>
    </div>
    <button class="btn" id="collapseBtn">Collapse</button>
    <button class="btn" id="resetBtn">Reset</button>
  </div>

  <main id="list"></main>
  <div class="empty" id="empty" hidden>No chapters match your search.</div>

</div>

<script>
/* ============================================================
   DATA — 145 chapters
   ============================================================ */
const TITLES = [
  "Present continuous (I am doing)",
  "Present simple (I do)",
  "Present continuous and present simple 1 (I am doing and I do)",
  "Present continuous and present simple 2 (I am doing and I do)",
  "Past simple (I did)",
  "Past continuous (I was doing)",
  "Present perfect 1 (I have done)",
  "Present perfect 2 (I have done)",
  "Present perfect continuous (I have been doing)",
  "Present perfect continuous and simple (I have been doing and I have done)",
  "How long have you (been)...?",
  "For and since / when...? and how long...?",
  "Present perfect and past 1 (I have done and I did)",
  "Present perfect and past 2 (I have done and I did)",
  "Past perfect (I had done)",
  "Past perfect continuous (I had been doing)",
  "Have and have got",
  "Used to (do)",
  "Present tenses for the future (I am doing / I do)",
  "Going to (I'm going to do)",
  "Will/shall 1",
  "Will/shall 2",
  "I will vs I'm going to",
  "Will be doing / will have done",
  "Can, could, be able to",
  "May and might",
  "Must, mustn't, don't need to",
  "Should",
  "Have to and must",
  "Would you like...? / I'd like...",
  "Imperatives (Do this! Don't do that!)",
  "Used to",
  "Passive 1 (is done / was done)",
  "Passive 2 (is being done / has been done)",
  "Be, have, do in present and past",
  "Regular and irregular verbs",
  "Questions 1 (is it...? do they...?)",
  "Questions 2 (Who saw you? Who did you see?)",
  "Questions 3 (Who is she talking to?)",
  "Questions 4 (What...? Which...? How...?)",
  "Reported speech (She said that...)",
  "Verb + –ing / verb + to",
  "I want you to... / I told you to...",
  "Purpose clauses (I went to the shop to...)",
  "Go (go to, go on, go for, go –ing)",
  "Get",
  "Do and make",
  "Have",
  "I/me, he/him, they/them",
  "My/his/their",
  "Whose...? It's mine/yours/hers...",
  "I/me/my/mine",
  "Myself/yourself/themselves",
  "'s (Kate's camera / my brother's car)",
  "A/an...",
  "Singular and plural (train(s), bus(es))",
  "Countable/uncountable 1 (a bottle / some water)",
  "Countable/uncountable 2 (a cake / some cake / some cakes)",
  "A/an and the",
  "The...",
  "Go to work / go home / go to the cinema",
  "I like music / I hate exams",
  "The... (names of places)",
  "This/that/these/those",
  "One/ones",
  "Some and any",
  "Not + any / no / none",
  "Not + anybody/anyone/anything / nobody/no one",
  "Somebody/anybody/nobody",
  "Everybody/everything",
  "All / all of, most / most of, no / none of",
  "All, most, both, etc.",
  "Each and every",
  "Relative clauses 1 (the woman who...)",
  "Relative clauses 2 (the people we met...)",
  "Relative clauses 3 (whose / whom / where)",
  "Relative clauses 4 (extra information clauses)",
  "Relative clauses 5 (extra information clauses – with which)",
  "Adjectives ending in –ing and –ed (boring / bored etc.)",
  "Adjectives: a nice new house, you look tired",
  "Adjectives and adverbs 1 (quick/quickly)",
  "Adjectives and adverbs 2 (well, fast, late, hard/hardly)",
  "Adjectives and adverbs 3 (comparative: older, more important, etc.)",
  "Adjectives and adverbs 4 (comparative 2: much better / any better / better and better / the sooner the better)",
  "Adjectives and adverbs 5 (superlative: the longest, the most enjoyable, etc.)",
  "Word order 1 (He always goes to work. / I cleaned the house carefully.)",
  "Word order 2 (usually/always/often, etc.)",
  "Still, yet, already, anymore",
  "Even",
  "Although, though, even though, in spite of, despite",
  "In case",
  "Unless",
  "As (reason and time)",
  "Like and as",
  "As if",
  "During and while",
  "By and until",
  "By the time...",
  "As soon as / until / till",
  "If I do... and If I did...",
  "If I knew... I wish I knew...",
  "If I had known... I wish I had known...",
  "Wish...",
  "If I do and If I did (other uses)",
  "If I had done (other uses)",
  "At/on/in (time)",
  "On time and in time / at the end and in the end",
  "In/at/on (position) 1",
  "In/at/on (position) 2",
  "In/at/on (position) 3",
  "To, at, in, into",
  "On, onto",
  "By",
  "Noun + preposition (reason for, cause of, etc.)",
  "Adjective + preposition (good at, interested in, etc.)",
  "Verb + preposition 1 (apologise for, belong to, etc.)",
  "Verb + preposition 2 (depend on, insist on, etc.)",
  "Verb + preposition 3 (suffer from, protect against, etc.)",
  "Phrasal verbs 1 (get up, get on, etc.)",
  "Phrasal verbs 2 (put off, turn up, etc.)",
  "Phrasal verbs 3 (break down, wake up, etc.)",
  "Phrasal verbs 4 (carry on, give up, etc.)",
  "Phrasal verbs 5 (go on, come on, etc.)",
  "Phrasal verbs 6 (take off, put on, etc.)",
  "Phrasal verbs 7 (look after, look for, etc.)",
  "Phrasal verbs 8 (look forward to, look out, etc.)",
  "Have something done",
  "Get something done",
  "There's / there are",
  "It...",
  "What...? Which...?",
  "How...?",
  "How long...?",
  "How often...?",
  "How far...?",
  "How old...?",
  "How much...? How many...?",
  "What is... like?",
  "What... for?",
  "Who...?",
  "Whose...?",
  "Which...?",
  "Where...?",
  "When...?",
  "Why...?"
];

const GROUPS = [
  { name:"Present tenses",               from:1,   to:4   },
  { name:"Past tenses",                  from:5,   to:6   },
  { name:"Present perfect",              from:7,   to:14  },
  { name:"Past perfect",                 from:15,  to:16  },
  { name:"Have & used to",               from:17,  to:18  },
  { name:"Future",                       from:19,  to:24  },
  { name:"Modals",                       from:25,  to:30  },
  { name:"Imperatives & habits",         from:31,  to:32  },
  { name:"Passive & verbs",              from:33,  to:36  },
  { name:"Questions & reported speech",  from:37,  to:41  },
  { name:"Verb patterns",                from:42,  to:44  },
  { name:"Common verbs",                 from:45,  to:48  },
  { name:"Pronouns & possessives",       from:49,  to:54  },
  { name:"Nouns & articles",             from:55,  to:63  },
  { name:"Demonstratives & quantity",    from:64,  to:73  },
  { name:"Relative clauses",             from:74,  to:78  },
  { name:"Adjectives & adverbs",         from:79,  to:85  },
  { name:"Word order & linking",         from:86,  to:95  },
  { name:"Time clauses",                 from:96,  to:99  },
  { name:"Conditionals & wish",          from:100, to:105 },
  { name:"Prepositions of time & place", from:106, to:113 },
  { name:"Preposition combinations",     from:114, to:118 },
  { name:"Phrasal verbs",                from:119, to:126 },
  { name:"Causatives, there & it",       from:127, to:130 },
  { name:"Question words",               from:131, to:145 }
];

const TOTAL     = TITLES.length;
const STORE_KEY = 'giu-simple-v1';
const THEME_KEY = 'giu-simple-theme';
const SHARED_KEY = 'esc-grammar-data'; // read by the main challenge app — see publishShared()

/* ============================================================
   STATE
   ============================================================ */
let done      = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]'));
let collapsed = new Set();
let filter    = 'all';
let query     = '';

/* ============================================================
   DOM
   ============================================================ */
const listEl   = document.getElementById('list');
const emptyEl  = document.getElementById('empty');
const fillEl   = document.getElementById('fill');
const pctEl    = document.getElementById('pct');
const sDone    = document.getElementById('sDone');
const sLeft    = document.getElementById('sLeft');
const sSec     = document.getElementById('sSec');
const doneMsg  = document.getElementById('doneMsg');
const searchEl = document.getElementById('search');
const filterEl = document.getElementById('filters');
const collapseBtn = document.getElementById('collapseBtn');
const resetBtn = document.getElementById('resetBtn');
const themeBtn = document.getElementById('themeBtn');

/* ============================================================
   BUILD LIST
   ============================================================ */
const records = [];

GROUPS.forEach((g, gi) => {
  const size = g.to - g.from + 1;

  const sec = document.createElement('section');
  sec.className = 'group';

  const head = document.createElement('button');
  head.className = 'group-head';
  head.type = 'button';
  head.innerHTML =
    '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
    '<span class="gname"></span><span class="count">0/' + size + '</span>';
  head.querySelector('.gname').textContent = g.name;

  const body = document.createElement('div');
  body.className = 'group-body';

  const items = [];
  for (let n = g.from; n <= g.to; n++) {
    const row = document.createElement('label');
    row.className = 'item';
    row.innerHTML =
      '<input type="checkbox" data-n="' + n + '">' +
      '<span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>' +
      '<span class="n">' + n + '</span>' +
      '<span class="t"></span>';
    row.querySelector('.t').textContent = TITLES[n - 1];
    body.appendChild(row);

    items.push({
      n: n,
      el: row,
      input: row.querySelector('input'),
      hay: (TITLES[n - 1] + ' ' + g.name).toLowerCase()
    });
  }

  head.addEventListener('click', () => {
    if (query || filter !== 'all') return;   // keep open while filtering
    collapsed.has(gi) ? collapsed.delete(gi) : collapsed.add(gi);
    render();
  });

  sec.append(head, body);
  listEl.appendChild(sec);

  records.push({
    gi, items, size,
    sec,
    countEl: head.querySelector('.count')
  });
});

/* ============================================================
   HELPERS
   ============================================================ */
const save = () => {
  try { localStorage.setItem(STORE_KEY, JSON.stringify([...done])); } catch(e){}
  publishShared();
};

/* Broadcasts a small, stable summary (+ the full chapter list) to a shared
   localStorage key so the main English Super Challenge app can show Grammar
   progress without knowing anything about this app's internal storage
   format. Called after every checkbox change and once on load. */
function publishShared(){
  try {
    const groups = GROUPS.map(g => {
      let doneInGroup = 0;
      for (let n = g.from; n <= g.to; n++) if (done.has(n)) doneInGroup++;
      return { name: g.name, from: g.from, to: g.to, size: g.to - g.from + 1, done: doneInGroup };
    });
    const chapters = TITLES.map((title, i) => ({ n: i + 1, title, done: done.has(i + 1) }));
    localStorage.setItem(SHARED_KEY, JSON.stringify({
      total: TOTAL,
      done: done.size,
      pct: TOTAL ? Math.round((done.size / TOTAL) * 100) : 0,
      groups,
      chapters,
      updated_at: new Date().toISOString()
    }));
  } catch (e) {}
}

const filtering = () => query.length > 0 || filter !== 'all';

function match(it){
  const isDone = done.has(it.n);
  if (filter === 'done' && !isDone) return false;
  if (filter === 'todo' && isDone)  return false;
  if (!query) return true;
  if (/^\d+$/.test(query)) return String(it.n).startsWith(query);
  return it.hay.includes(query);
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  /* dashboard */
  const n = done.size;
  const ratio = n / TOTAL;
  fillEl.style.width = (ratio * 100) + '%';
  pctEl.textContent  = Math.round(ratio * 100) + '%';
  sDone.textContent  = n;
  sLeft.textContent  = TOTAL - n;
  doneMsg.hidden     = n !== TOTAL;

  /* groups */
  let cleared = 0, anyVisible = false;
  const isFiltering = filtering();

  records.forEach(rec => {
    let visible = 0, groupDone = 0;

    rec.items.forEach(it => {
      const isDone = done.has(it.n);
      it.el.classList.toggle('on', isDone);
      it.input.checked = isDone;
      if (isDone) groupDone++;

      const show = match(it);
      it.el.classList.toggle('hidden', !show);
      if (show) visible++;
    });

    if (visible) anyVisible = true;

    rec.sec.classList.toggle('hidden', visible === 0);
    rec.sec.classList.toggle('complete', groupDone === rec.size);
    rec.sec.classList.toggle('collapsed', collapsed.has(rec.gi) && !isFiltering);
    rec.countEl.textContent = groupDone + '/' + rec.size;

    if (groupDone === rec.size) cleared++;
  });

  sSec.textContent  = cleared + ' / ' + GROUPS.length;
  emptyEl.hidden    = anyVisible;

  const allCollapsed = GROUPS.every((_, i) => collapsed.has(i));
  collapseBtn.textContent = allCollapsed ? 'Expand' : 'Collapse';
}

/* ============================================================
   EVENTS
   ============================================================ */
listEl.addEventListener('change', e => {
  const input = e.target.closest('input[type="checkbox"]');
  if (!input) return;
  const num = Number(input.dataset.n);
  input.checked ? done.add(num) : done.delete(num);
  save();
  render();
});

searchEl.addEventListener('input', () => {
  query = searchEl.value.trim().toLowerCase();
  render();
});

filterEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  filterEl.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filter = btn.dataset.f;
  render();
});

collapseBtn.addEventListener('click', () => {
  const allCollapsed = GROUPS.every((_, i) => collapsed.has(i));
  collapsed.clear();
  if (!allCollapsed) GROUPS.forEach((_, i) => collapsed.add(i));
  render();
});

resetBtn.addEventListener('click', () => {
  if (!done.size) return;
  if (confirm('Reset all progress?')) {
    done.clear();
    save();
    render();
  }
});

/* ============================================================
   THEME
   ============================================================ */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
}

let savedTheme = 'light';
try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch(e){}
setTheme(savedTheme);

themeBtn.addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});

/* ============================================================
   GO
   ============================================================ */
render();
publishShared(); // make sure the main app has fresh data even if nothing changed this visit
</script>
