<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Builder — Checklists</title>
<style>
  :root{
    --bg:#ffffff;
    --surface:#f7f7f8;
    --border:#e4e4e7;
    --text:#18181b;
    --muted:#71717a;
    --accent:#2563eb;
    --accent-soft:#eff4ff;
    --done:#16a34a;
    --radius:8px;
  }
  [data-theme="dark"]{
    --bg:#1e1e1e;
    --surface:#2a2a2a;
    --border:#3d3d3d;
    --text:#e6e6e6;
    --muted:#9a9a9a;
    --accent:#6ea8fe;
    --accent-soft:#2b3444;
    --done:#4ade80;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    transition:background .2s,color .2s;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 72px}

  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:16px;
  }
  header h1{font-size:18px;font-weight:600;letter-spacing:-.2px}
  header h1 span{color:var(--muted);font-weight:400}

  .header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}

  .icon-btn{
    width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--bg);color:var(--text);cursor:pointer;font-size:15px;
    display:grid;place-items:center;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  a.icon-btn{text-decoration:none;color:var(--text)}

  .tabs{
    display:flex;gap:4px;padding:4px;margin-bottom:12px;
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:1 0 auto;padding:9px 14px;font-size:13px;font-family:inherit;font-weight:600;
    background:transparent;color:var(--muted);border:none;border-radius:6px;
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tab:hover{color:var(--text)}
  .tab.on{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  [data-theme="dark"] .tab.on{box-shadow:0 1px 3px rgba(0,0,0,.4)}

  .variant-row{display:flex;margin-bottom:14px}
  .variant-row[hidden]{display:none}
  .variant-wrap{position:relative;flex:1}
  .variant-select{
    width:100%;
    padding:10px 38px 10px 12px;
    font-size:13.5px;font-family:inherit;font-weight:600;
    color:var(--text);background:var(--bg);
    border:1px solid var(--border);border-radius:var(--radius);
    cursor:pointer;outline:none;
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    transition:border-color .15s;
  }
  .variant-select:hover{border-color:var(--accent)}
  .variant-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .variant-arrow{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    pointer-events:none;color:var(--muted);
  }

  .panel{
    border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:16px;
  }
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .bar{
    flex:1;height:6px;border-radius:3px;background:var(--surface);
    overflow:hidden;border:1px solid var(--border);
  }
  .bar i{
    display:block;height:100%;width:0;background:var(--accent);
    transition:width .3s ease;
  }
  .pct{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

  .stats{display:flex;gap:24px}
  .stats div{display:flex;flex-direction:column}
  .stats b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .stats span{font-size:12px;color:var(--muted)}

  .done-msg{
    margin-top:14px;padding:10px 12px;border-radius:var(--radius);
    background:var(--accent-soft);color:var(--accent);
    font-size:13px;font-weight:500;
  }

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}

  .search{position:relative;flex:1 1 220px}
  .search svg{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    color:var(--muted);pointer-events:none;
  }
  input[type="search"]{
    width:100%;padding:8px 12px 8px 32px;font-size:14px;font-family:inherit;
    color:var(--text);background:var(--bg);
    border:1px solid var(--border);border-radius:var(--radius);
    outline:none;transition:.15s;
  }
  input[type="search"]::placeholder{color:var(--muted)}
  input[type="search"]:focus{border-color:var(--accent)}

  .seg{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .seg button{
    padding:8px 12px;font-size:13px;font-family:inherit;font-weight:500;
    background:var(--bg);color:var(--muted);border:none;cursor:pointer;
    border-right:1px solid var(--border);transition:.15s;white-space:nowrap;
  }
  .seg button:last-child{border-right:none}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--accent);color:#fff}

  .btn{
    padding:8px 12px;font-size:13px;font-family:inherit;font-weight:500;
    background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius);
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}

  .group{
    border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;
  }
  .group-head{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:11px 12px;font-family:inherit;font-size:14px;font-weight:600;
    background:var(--surface);color:var(--text);
    border:none;cursor:pointer;text-align:left;transition:.15s;
  }
  .group-head:hover{background:var(--border)}
  .group-head .chev{transition:transform .2s;color:var(--muted);flex:0 0 auto}
  .group.collapsed .chev{transform:rotate(-90deg)}
  .group-head .count{
    margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .group.complete .count{color:var(--done)}

  .group-body{padding:4px 6px 8px}
  .group.collapsed .group-body{display:none}

  .item{
    display:flex;align-items:flex-start;gap:8px;
    padding:7px 6px;border-radius:6px;
    transition:background .12s;
  }
  .item:hover{background:var(--surface)}

  .item-row{
    display:flex;align-items:flex-start;gap:10px;
    flex:1;min-width:0;cursor:pointer;
  }
  .item-row input{position:absolute;opacity:0;width:0;height:0}

  .item .box{
    width:18px;height:18px;flex:0 0 auto;margin-top:2px;
    border:1.5px solid var(--border);border-radius:5px;
    display:grid;place-items:center;transition:.15s;
  }
  .item:hover .box{border-color:var(--accent)}
  .item .box svg{
    width:11px;height:11px;stroke:#fff;stroke-width:3.5;
    fill:none;stroke-linecap:round;stroke-linejoin:round;
    opacity:0;transition:opacity .15s;
  }
  .item.on .box{background:var(--accent);border-color:var(--accent)}
  .item.on .box svg{opacity:1}

  .item .n{
    font-size:12px;color:var(--muted);min-width:26px;text-align:right;
    font-variant-numeric:tabular-nums;margin-top:1px;flex:0 0 auto;
  }
  .item .t{font-size:14px}
  .item .t em{color:var(--muted);font-style:normal;font-size:12.5px}
  .item.on .t{color:var(--muted);text-decoration:line-through}
  .item.on .t em{color:var(--muted);opacity:.75}

  .date{
    font-family:inherit;font-size:11.5px;
    padding:3px 5px;
    border:1px solid var(--border);border-radius:5px;
    background:var(--bg);color:var(--text);
    width:132px;flex:0 0 auto;
    margin-top:1px;
    visibility:hidden;
    transition:border-color .15s,color .15s;
  }
  .item.on .date{visibility:visible}
  .date:hover{border-color:var(--accent)}
  .date:focus{outline:none;border-color:var(--accent)}
  [data-theme="dark"] .date::-webkit-calendar-picker-indicator{filter:invert(.8)}

  .hidden{display:none !important}

  .empty{
    text-align:center;padding:48px 16px;color:var(--muted);font-size:14px;
  }
  .empty-state{
    text-align:center;
    padding:56px 24px;
    border:1px dashed var(--border);
    border-radius:var(--radius);
    color:var(--muted);
  }
  .empty-state .es-icon{
    font-size:34px;line-height:1;margin-bottom:14px;opacity:.55;
  }
  .empty-state .es-title{
    font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;
  }
  .empty-state .es-hint{
    font-size:13px;line-height:1.6;
  }
  .empty-state code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;
    padding:2px 5px;border-radius:4px;
    background:var(--surface);border:1px solid var(--border);
    color:var(--accent);
  }

  @media (max-width:560px){
    .stats{gap:18px}
    .toolbar{gap:6px}
    .seg{flex:1 1 100%}
    .seg button{flex:1}
    .item .t{font-size:13.5px}
    .date{width:110px;font-size:11px;padding:2px 4px}
    .tab{font-size:12px;padding:8px 10px}
  }
</style>
</head>

    <div class="stats">

  <div class="toolbar">

    <div class="seg" id="filters">

      <button data-f="done">Done</button>
    </div>
    <button class="btn" id="collapseBtn">Expand</button>
    <button class="btn" id="resetBtn">Reset</button>
  </div>

  <main id="list"></main>
  <div class="empty" id="empty" hidden>No items match your search.</div>

  <div class="empty-state" id="emptyState" hidden>
    <div class="es-icon" id="emptyIcon">📝</div>
    <div class="es-title" id="emptyTitle">No entries yet</div>
    <div class="es-hint" id="emptyHint">
      Add data to this variant in the <code>DATASETS</code> object to get started.
    </div>
  </div>

</div>

/* ============================================================
   LOOKUPS + STATE
   ============================================================ */
const TAB_MAP     = {};

  TAB_MAP[tab.id] = tab;
  tab.variants.forEach(v => {
    v.tabId = tab.id;
    VARIANT_MAP[v.id] = v;
  });
});

let activeTabId = DATASETS[0].id;
const activeVariant = {};
DATASETS.forEach(tab => { activeVariant[tab.id] = tab.variants[0].id; });

const state = {};

function loadSaved(storeKey){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(storeKey) || 'null'); } catch(e){}
  if (Array.isArray(raw))             return { done: new Set(raw), dates: {} };
  if (raw && typeof raw === 'object') return { done: new Set(raw.done || []), dates: raw.dates || {} };
  return { done: new Set(), dates: {} };
}

Object.keys(VARIANT_MAP).forEach(vid => {
  const saved = loadSaved(VARIANT_MAP[vid].storeKey);
  state[vid] = {
    done: saved.done,
    dates: saved.dates,
    collapsed: new Set(),
    filter: 'all',
    query: '',
    records: [],
    sections: [],
    total: 0
  };
});

/* ============================================================
   HELPERS
   ============================================================ */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

function currentVariantId(){ return activeVariant[activeTabId]; }
function currentVariant()  { return VARIANT_MAP[currentVariantId()]; }
function currentState()    { return state[currentVariantId()]; }

function save(variantId){
  const st = state[variantId];
  try {
    localStorage.setItem(VARIANT_MAP[variantId].storeKey, JSON.stringify({
      done: [...st.done],
      dates: st.dates
    }));
  } catch(e){}
  publishShared(variantId);
}

/* ============================================================
   SHARED PROGRESS PUBLISHING
   This tracker is a standalone page. Every time progress changes
   (or the page loads) it writes a small summary object to a
   per-book localStorage key so the main English Super Challenge
   dashboard (index.html) can show progress and let the user pick
   a study target — without knowing anything about this app's
   internal data shapes. Mirrors the Grammar tracker's own sync
   key (esc-grammar-data).
   ============================================================ */
function sharedKeyFor(variantId){ return 'esc-vocab-shared-' + variantId; }

function publishShared(variantId){
  const v  = VARIANT_MAP[variantId];
  const st = state[variantId];
  if (!v || !st) return;
  try {
    const total = v.data.reduce((sum, g) => sum + g.items.length, 0);
    const groups = v.data.map((g, gi) => {
      const size = g.items.length;
      let done = 0, base = 0;
      // recompute item numbers the same way buildVariant does
      for (let i = 0; i < gi; i++) base += v.data[i].items.length;
      for (let i = 1; i <= size; i++) if (st.done.has(base + i)) done++;
      return { name: g.name, size, done };
    });
    localStorage.setItem(sharedKeyFor(variantId), JSON.stringify({
      total,
      done: st.done.size,
      pct: total ? Math.round((st.done.size / total) * 100) : 0,
      groups,
      title: v.title,
      label: v.label || 'items',
      updated_at: new Date().toISOString()
    }));
  } catch(e){}
}

/* Publish current state for every book right away, so the main
   dashboard has numbers to show as soon as this tracker has been
   opened once — even before anything has been checked off. */
Object.keys(VARIANT_MAP).forEach(vid => {
  if (VARIANT_MAP[vid].data.length) publishShared(vid);
});

function normalise(it){
  if (typeof it === 'string') return { text: it, sub: '' };
  return { text: it.text || '', sub: it.sub || '' };
}

function match(st, it){
  const isDone = st.done.has(it.n);
  if (st.filter === 'done' && !isDone) return false;
  if (st.filter === 'todo' && isDone)  return false;
  if (!st.query) return true;
  if (/^\d+$/.test(st.query)) return String(it.n).startsWith(st.query);
  return it.hay.includes(st.query);
}

/* ============================================================
   BUILD TOP TABS
   ============================================================ */
DATASETS.forEach(tab => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (tab.id === activeTabId ? ' on' : '');
  btn.dataset.tab = tab.id;
  btn.textContent = tab.title;
  tabsEl.appendChild(btn);
});

/* ============================================================
   BUILD VARIANT LIST
   ============================================================ */
function buildVariant(variantId){
  const v    = VARIANT_MAP[variantId];
  const st   = state[variantId];
  const data = v.data;

  st.records  = [];
  st.sections = [];
  st.total    = data.reduce((sum, g) => sum + g.items.length, 0);
  let counter = 0;

  data.forEach((g, gi) => {
    const size = g.items.length;

    const sec = document.createElement('section');
    sec.className = 'group';

    const head = document.createElement('button');
    head.className = 'group-head';
    head.type = 'button';
    head.innerHTML =
      '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
      '<span class="gname"></span><span class="count">0/' + size + '</span>';
    head.querySelector('.gname').textContent = g.name;

    const body = document.createElement('div');
    body.className = 'group-body';

    const items = [];
    g.items.forEach(rawItem => {
      counter++;
      const n = counter;
      const { text, sub } = normalise(rawItem);

      const row = document.createElement('div');
      row.className = 'item';

      const label = document.createElement('label');
      label.className = 'item-row';
      label.innerHTML =
        '<input type="checkbox" data-n="' + n + '">' +
        '<span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>' +
        '<span class="n">' + n + '</span>' +
        '<span class="t"></span>';

      const titleEl = label.querySelector('.t');
      titleEl.textContent = text;
      if (sub) {
        const em = document.createElement('em');
        em.textContent = ' — ' + sub;
        titleEl.appendChild(em);
      }

      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.className = 'date';
      dateInput.dataset.n = n;
      dateInput.title = 'Date studied';

      row.append(label, dateInput);
      body.appendChild(row);

      items.push({
        n: n,
        el: row,
        input: label.querySelector('input'),
        dateInput: dateInput,
        hay: (text + ' ' + sub + ' ' + g.name).toLowerCase()
      });
    });

    head.addEventListener('click', () => {
      if (st.query || st.filter !== 'all') return;
      st.collapsed.has(gi) ? st.collapsed.delete(gi) : st.collapsed.add(gi);
      render();
    });

    sec.append(head, body);

    st.records.push({
      gi, items, size, sec,
      countEl: head.querySelector('.count')
    });

    st.collapsed.add(gi);
    st.sections.push(sec);
  });
}

Object.keys(VARIANT_MAP).forEach(buildVariant);

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const v  = currentVariant();
  const st = currentState();
  const hasData = v.data.length > 0;

  pageTitle.firstChild.textContent = v.title + ' ';
  pageCount.textContent = '· ' + st.total + ' ' + (v.label || 'items');

  const n     = st.done.size;
  const ratio = st.total ? n / st.total : 0;
  fillEl.style.width = (ratio * 100) + '%';
  pctEl.textContent  = Math.round(ratio * 100) + '%';
  sDone.textContent  = n;
  sLeft.textContent  = st.total - n;
  doneMsg.hidden     = n !== st.total || st.total === 0;

  let cleared = 0, anyVisible = false;
  const isFiltering = st.query.length > 0 || st.filter !== 'all';

  st.records.forEach(rec => {
    let visible = 0, groupDone = 0;

    rec.items.forEach(it => {
      const isDone = st.done.has(it.n);
      it.el.classList.toggle('on', isDone);
      it.input.checked = isDone;
      if (isDone) groupDone++;

      const dateStr = st.dates[it.n] || '';
      if (document.activeElement !== it.dateInput && it.dateInput.value !== dateStr) {
        it.dateInput.value = dateStr;
      }

      const show = match(st, it);
      it.el.classList.toggle('hidden', !show);
      if (show) visible++;
    });

    if (visible) anyVisible = true;

    rec.sec.classList.toggle('hidden', visible === 0);
    rec.sec.classList.toggle('complete', groupDone === rec.size);
    rec.sec.classList.toggle('collapsed', st.collapsed.has(rec.gi) && !isFiltering);
    rec.countEl.textContent = groupDone + '/' + rec.size;

    if (groupDone === rec.size) cleared++;
  });

  sSec.textContent = cleared + ' / ' + v.data.length;

  if (!hasData) {
    /* placeholder empty state ("Soon" or generic) */
    const isSoon = /soon/i.test(v.title);
    emptyIcon.textContent  = isSoon ? '⏳' : '📝';
    emptyTitle.textContent = isSoon ? 'Coming Soon' : 'No entries yet';
    emptyHint.innerHTML    = isSoon
      ? 'This section is being prepared. Check back soon!'
      : 'Add data to this variant in the <code>DATASETS</code> object to get started.';

    emptyStateEl.hidden  = false;
    emptyEl.hidden       = true;
    collapseBtn.disabled = true;
    collapseBtn.style.opacity = '.4';
    collapseBtn.style.cursor  = 'default';
  } else {
    emptyStateEl.hidden = true;
    emptyEl.hidden      = anyVisible;
    collapseBtn.disabled = false;
    collapseBtn.style.opacity = '';
    collapseBtn.style.cursor  = '';

    const allCollapsed = v.data.every((_, i) => st.collapsed.has(i));
    collapseBtn.textContent = allCollapsed ? 'Expand' : 'Collapse';
  }
}

/* ============================================================
   TAB + VARIANT SWITCHING
   ============================================================ */
function selectTab(tabId){
  activeTabId = tabId;

  tabsEl.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('on', t.dataset.tab === tabId);
  });

  buildVariantDropdown();
  showVariant(activeVariant[tabId]);
}

function buildVariantDropdown(){
  const tab = TAB_MAP[activeTabId];

  if (tab.variants.length > 1) {
    variantRow.hidden = false;
    variantSelect.innerHTML = '';
    tab.variants.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = v.title;
      variantSelect.appendChild(opt);
    });
    variantSelect.value = activeVariant[tab.id];
  } else {
    variantRow.hidden = true;
    variantSelect.innerHTML = '';
  }
}

function showVariant(variantId){
  const tab = TAB_MAP[activeTabId];
  activeVariant[tab.id] = variantId;

  if (tab.variants.length > 1) variantSelect.value = variantId;

  listEl.innerHTML = '';
  state[variantId].sections.forEach(sec => listEl.appendChild(sec));

  searchEl.value = state[variantId].query;
  filterEl.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.f === state[variantId].filter);
  });

  render();
}

/* ============================================================
   EVENTS
   ============================================================ */
tabsEl.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn || btn.dataset.tab === activeTabId) return;
  selectTab(btn.dataset.tab);
});

variantSelect.addEventListener('change', () => {
  showVariant(variantSelect.value);
});

listEl.addEventListener('change', e => {
  const vid = currentVariantId();
  const st  = state[vid];

  if (e.target.matches('input.date')) {
    const num = Number(e.target.dataset.n);
    if (e.target.value) st.dates[num] = e.target.value;
    else delete st.dates[num];
    save(vid);
    return;
  }

  const input = e.target.closest('input[type="checkbox"]');
  if (!input) return;
  const num = Number(input.dataset.n);

  if (input.checked) {
    st.done.add(num);
    if (!st.dates[num]) st.dates[num] = todayStr();
  } else {
    st.done.delete(num);
    delete st.dates[num];
  }
  save(vid);
  render();
});

searchEl.addEventListener('input', () => {
  currentState().query = searchEl.value.trim().toLowerCase();
  render();
});

filterEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  filterEl.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  currentState().filter = btn.dataset.f;
  render();
});

collapseBtn.addEventListener('click', () => {
  if (collapseBtn.disabled) return;
  const st = currentState();
  const v  = currentVariant();
  const allCollapsed = v.data.every((_, i) => st.collapsed.has(i));
  st.collapsed.clear();
  if (!allCollapsed) v.data.forEach((_, i) => st.collapsed.add(i));
  render();
});

resetBtn.addEventListener('click', () => {
  const vid = currentVariantId();
  const st  = state[vid];
  if (!st.done.size && !Object.keys(st.dates).length) return;
  if (confirm('Reset all progress for "' + VARIANT_MAP[vid].title + '"?')) {
    st.done.clear();
    st.dates = {};
    save(vid);
    render();
  }
});

function setTheme(t){
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
}

let savedTheme = 'light';
try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch(e){}
setTheme(savedTheme);

themeBtn.addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
