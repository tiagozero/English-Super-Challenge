<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Study Tracker</title>
<script>
  (function(){
    try{
      if (localStorage.getItem('english-study-theme') === 'dark')
        document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();
</script>
<style>
  :root{
    --bg:#f6f6f7; --card:#fff; --line:#e5e5e8; --text:#18181b; --muted:#71717a;
    --accent:#2563eb; --accent-soft:#eef4ff;
    --hover:#fafafa; --soft:#f4f4f5; --icon:#a1a1aa;
    --dot-border:#d4d4d8; --input-border:#dcdce0;
    --entry-bg:#fcfcfd; --star:#d4d4d8; --star-on:#f59e0b;
    --warn-bg:#fef3c7; --warn-text:#92400e;
    --ok-bg:#d1fae5;   --ok-text:#065f46;
    --mark-bg:#fff3b0; --mark-text:#713f12;
    --due-bg:#fee2e2;  --due-text:#b91c1c;
    --rec-bg:#fee2e2;  --rec-text:#b91c1c; --rec-border:#fca5a5;
    --tint-sound:#2563eb;
    --tint-word:#059669;
    --tint-sentence:#7c3aed;
    --tint-connected:#ea580c;
    --tint-writing:#0891b2;
    --shadow:rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e6e8ee; --muted:#8b93a5;
    --accent:#5b8dff; --accent-soft:#1a2540;
    --hover:#1f2530; --soft:#222834; --icon:#6b7280;
    --dot-border:#3a4252; --input-border:#2d3441;
    --entry-bg:#1a1f29; --star:#4b5464; --star-on:#f59e0b;
    --warn-bg:#3d2f10; --warn-text:#fcd34d;
    --ok-bg:#0f3d2e;   --ok-text:#6ee7b7;
    --mark-bg:#4a3410; --mark-text:#fcd34d;
    --due-bg:#4a1818;  --due-text:#fca5a5;
    --rec-bg:#4a1818;  --rec-text:#fca5a5; --rec-border:#7f1d1d;
    --tint-sound:#5b8dff;
    --tint-word:#34d399;
    --tint-sentence:#a78bfa;
    --tint-connected:#fb923c;
    --tint-writing:#22d3ee;
    --shadow:rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:56px;padding:8px 0}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em;margin-right:auto}
  h2{font-size:15px;margin:0;font-weight:600}
  h3{font-size:14px;margin:0;font-weight:600}

  nav.mainnav{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:10px}
  nav.mainnav button{border:0;background:transparent;font:inherit;font-size:13.5px;
    padding:6px 12px;border-radius:8px;color:var(--muted);cursor:pointer}
  nav.mainnav button.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px var(--shadow)}

  .utils{display:flex;gap:6px;align-items:center}
  .util{font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--text);text-decoration:none;line-height:1.2;white-space:nowrap}
  .util:hover{background:var(--hover)}
  .theme-toggle{width:34px;height:34px;border:1px solid var(--line);background:var(--card);
    color:var(--text);border-radius:8px;cursor:pointer;font-size:15px;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center}
  .theme-toggle:hover{background:var(--hover)}

  main{padding:22px 18px 70px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px}

  code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}

  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .mini{width:56px;padding:4px 6px;font-size:13px;text-align:center}

  input,textarea,select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--input-border);
    border-radius:8px;background:var(--card);color:inherit;outline:none;width:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;line-height:1.55}
  input[type=checkbox]{width:auto;accent-color:var(--accent);cursor:pointer}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
  label.inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}

  .btn{font:inherit;font-size:13.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn.tiny{padding:3px 8px;font-size:12px}
  .icon{border:0;background:transparent;color:var(--icon);cursor:pointer;font-size:13px;
    padding:4px 6px;border-radius:6px;line-height:1}
  .icon:hover{background:var(--soft);color:var(--text)}

  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .stat-num{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:2px 0 8px}
  .stat-num .muted{font-size:14px;font-weight:500}
  .stat-foot{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:5px}
  .bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

  .prow{display:grid;grid-template-columns:150px 1fr 62px;gap:12px;align-items:center;
    margin-bottom:10px;font-size:13px}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;
    border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
  .facts b{display:block;font-size:19px;font-weight:600}
  .facts span{font-size:11.5px;color:var(--muted)}

  .review-item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
  .review-item:first-of-type{border-top:0}
  .review-item:hover .rlabel{text-decoration:underline}
  .rlabel{font-size:13.5px}

  /* grammar */
  .lesson{padding:3px 0}
  .lesson-main{display:flex;align-items:center;gap:8px}
  .lesson-title{flex:1;text-align:left;border:0;background:none;font:inherit;font-size:14px;
    cursor:pointer;padding:2px 0;color:inherit;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .lesson.done .lesson-title{color:var(--muted);text-decoration:line-through}
  .dots{display:flex;gap:3px}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--dot-border);background:var(--card);padding:0;cursor:pointer}
  .dot.on{background:var(--accent);border-color:var(--accent)}
  .lesson-detail{padding:6px 0 8px 26px}
  .lesson-list{border-left:2px solid var(--line);padding-left:12px;margin-top:10px}

  .badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--muted);
    white-space:nowrap;display:inline-block}
  .badge.warn{background:var(--warn-bg);color:var(--warn-text)}
  .badge.ok{background:var(--ok-bg);color:var(--ok-text)}
  .badge.ink{background:var(--accent-soft);color:var(--accent)}
  .badge.srs-due{background:var(--due-bg);color:var(--due-text);font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--warn-bg);color:var(--warn-text);
    font-size:12.5px;padding:3px 6px 3px 9px;border-radius:99px;margin:3px 4px 0 0}
  .chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:11px;padding:0 2px}

  /* grammar writing practice */
  .practice{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .practice-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
  .kindseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .kindseg button{border:0;background:var(--card);font:inherit;font-size:12px;padding:4px 11px;cursor:pointer;color:var(--muted)}
  .kindseg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .writing-entry{border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:8px;background:var(--entry-bg)}
  .writing-entry .row{margin-bottom:5px}
  .writing-entry textarea{font-size:13.5px}

  /* grammar in context */
  .ctx-section{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .ctx-section-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .ctx-toggle{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--text);
    cursor:pointer;display:flex;align-items:center;gap:7px;padding:3px 0;min-width:0}
  .ctx-toggle:hover{color:var(--accent)}
  .chev{font-size:10px;color:var(--muted);width:9px;display:inline-block;flex:none}
  .ctx-body{margin-top:8px}
  .hl-preview{font-size:13.5px;padding:8px 11px;border-radius:8px;background:var(--hover);
    margin-top:7px;line-height:1.75;word-break:break-word;min-height:34px}
  .hl-preview .muted{font-size:12.5px}
  .ctx-block{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .ctx-block-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin-bottom:6px}
  .sentence-row{display:flex;gap:6px;align-items:flex-start;padding:6px 0;
    border-top:1px solid var(--line);font-size:13.5px}
  .sentence-row:first-of-type{border-top:0;padding-top:2px}
  .sentence-preview{flex:1;line-height:1.75;word-break:break-word}
  mark{background:var(--mark-bg);color:var(--mark-text);padding:1px 4px;border-radius:4px;font-weight:500}

  /* SRS */
  .srs-panel{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .srs-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
  .srs-title{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .srs-status{font-size:12.5px;color:var(--muted)}
  .srs-status.due{color:var(--due-text);font-weight:600}
  .srs-status.ok{color:var(--ok-text);font-weight:600}
  .srs-stages{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .srs-stage{font-size:11px;padding:3px 8px;border-radius:6px;
    background:var(--soft);color:var(--muted);border:1px solid transparent}
  .srs-stage.current{background:var(--accent-soft);color:var(--accent);
    border-color:var(--accent);font-weight:600}
  .srs-stage.done{background:var(--ok-bg);color:var(--ok-text)}
  .srs-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  .due-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .due-item:first-of-type{border-top:0}
  .due-info{flex:1;min-width:0}

  /* writing */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .targets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .tgroup{border:1px solid var(--line);border-radius:10px;padding:10px}
  .tgroup-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;
    font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
  .titem{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:2px 0}
  .titem.used .ttext{color:var(--muted);text-decoration:line-through}
  .ttext{flex:1;min-width:0;word-break:break-word}
  .small-input{font-size:13px;padding:5px 8px;margin-top:5px}
  .workspace{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .workspace textarea{margin-bottom:8px}
  .versions{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .version{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
  .version .btn{margin-left:auto}

  .bulk{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .bulk textarea{font-size:13px;padding:6px 9px}
  .bulk .row{margin-top:5px}

  /* pronunciation */
  .pr-subnav{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:10px;flex-wrap:wrap}
  .pr-subnav button{border:0;background:transparent;font:inherit;font-size:13px;
    padding:7px 12px;border-radius:8px;color:var(--muted);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  .pr-subnav button:hover{color:var(--text)}
  .pr-subnav button.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px var(--shadow)}
  .pr-subnav .count{font-size:11px;background:var(--soft);color:var(--muted);
    padding:1px 6px;border-radius:99px}
  .pr-subnav button.active .count{background:var(--accent-soft);color:var(--accent)}

  .pr-add{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:14px}
  .pr-add-title{font-size:11.5px;font-weight:600;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted);margin-bottom:8px}

  /* ---- MOSAIC GRID ---- */
  .pr-mosaic-section{padding:14px}
  .pr-mosaic{
    columns: 2;
    column-gap: 14px;
  }
  .pr-mosaic > .pr-card{
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    margin: 0 0 14px 0;
    display: block;
    width: 100%;
  }
  @media (min-width: 960px){
    .pr-mosaic{ columns: 2; }
  }
  @media (max-width: 720px){
    .pr-mosaic{ columns: 1; }
  }

  .pr-card{border:1px solid var(--line);border-radius:12px;padding:13px;
    background:var(--card);position:relative;
    transition:border-color .15s, box-shadow .15s}
  .pr-card:hover{border-color:var(--tint,var(--line));box-shadow:0 2px 8px var(--shadow)}
  .pr-card::before{
    content:'';position:absolute;top:0;left:0;width:100%;height:3px;
    background:var(--tint,var(--accent));
    border-radius:12px 12px 0 0;
  }
  .pr-card.tint-sound     { --tint: var(--tint-sound); }
  .pr-card.tint-word      { --tint: var(--tint-word); }
  .pr-card.tint-sentence  { --tint: var(--tint-sentence); }
  .pr-card.tint-connected { --tint: var(--tint-connected); }
  .pr-card.tint-writing   { --tint: var(--tint-writing); }

  .pr-card.standalone{margin-bottom:14px}

  .pr-card.collapsed{padding-bottom:10px}
  .pr-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-top:3px}
  .pr-card.collapsed .pr-card-head{margin-bottom:0}
  .pr-card-head .grow{min-width:0}
  .pr-card-head-actions{display:flex;align-items:center;gap:2px;flex:none}
  .pr-card-head-actions .star{width:24px;height:24px;padding:0;
    display:flex;align-items:center;justify-content:center}
  .pr-card-head-actions .icon{width:24px;height:24px;padding:0;
    display:flex;align-items:center;justify-content:center}

  .pr-card-collapse{border:0;background:none;color:var(--icon);cursor:pointer;
    font-size:11px;width:24px;height:24px;border-radius:6px;line-height:1;flex:none;
    display:flex;align-items:center;justify-content:center}
  .pr-card-collapse:hover{background:var(--soft);color:var(--text)}

  .pr-card-summary{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;
    font-size:12.5px;color:var(--muted);margin-top:4px}
  .pr-card-summary .badge{margin:0}
  .pr-sound{font-size:24px;font-weight:600;font-family:ui-monospace,SFMono-Regular,monospace;
    letter-spacing:.02em;line-height:1.1}
  .pr-word{font-size:18px;font-weight:600;line-height:1.2;word-break:break-word}
  .pr-ipa{font-family:ui-monospace,SFMono-Regular,monospace;color:var(--muted);
    font-size:13px;margin-left:8px;white-space:nowrap}
  .pr-stress{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;
    color:var(--muted);margin-top:2px}
  .pr-text{font-size:14.5px;line-height:1.55;font-weight:500}

  .pr-examples{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;align-items:center}
  .chip-ex{font-size:12px;background:var(--soft);color:var(--text);
    padding:3px 4px 3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:2px}
  .chip-ex button{border:0;background:none;color:var(--muted);cursor:pointer;
    font-size:11px;padding:0 3px;line-height:1}
  .chip-ex button:hover{color:var(--due-text)}

  .pr-row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
  .pr-label{font-size:11px;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;min-width:70px;flex:none}

  .pr-section-label{font-size:11px;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;margin:11px 0 5px}

  .pr-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center;
    border-top:1px solid var(--line);padding-top:10px}
  .pr-meta{font-size:12px;color:var(--muted);margin-left:auto}

  .rec-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .rec-btn{border:1px solid var(--line);background:var(--card);font:inherit;font-size:12px;
    padding:5px 10px;border-radius:8px;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:5px;color:var(--text)}
  .rec-btn:hover{background:var(--hover)}
  label.rec-btn{cursor:pointer}
  .rec-btn.recording{background:var(--rec-bg);border-color:var(--rec-border);
    color:var(--rec-text);font-weight:600}
  .rec-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:currentColor;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  audio{height:32px;max-width:100%;margin-top:4px;width:100%}

  .video-embed{position:relative;width:100%;aspect-ratio:16/9;
    margin:8px 0;border-radius:10px;overflow:hidden;
    border:1px solid var(--line);background:#000}
  .video-embed iframe{width:100%;height:100%;border:0;display:block}

  .tag-badge{font-size:11px;padding:3px 9px;border-radius:99px;
    background:var(--accent-soft);color:var(--accent);font-weight:600;display:inline-block}
  .tag-select{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
  .tag-select button{border:1px solid var(--line);background:var(--card);font:inherit;
    font-size:11.5px;padding:4px 9px;border-radius:99px;cursor:pointer;color:var(--muted)}
  .tag-select button:hover{background:var(--hover)}
  .tag-select button.on{background:var(--accent-soft);border-color:var(--accent);
    color:var(--accent);font-weight:600}

  .cs-original{font-size:14.5px;font-weight:600;padding:7px 10px}
  .cs-form{font-size:14.5px;font-weight:500;font-style:italic;
    padding:7px 10px;background:var(--accent-soft);
    border-color:transparent;color:var(--accent)}
  .cs-form::placeholder{color:var(--accent);opacity:.55;font-style:italic}

  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:var(--card);font:inherit;font-size:11.5px;padding:5px 9px;
    cursor:pointer;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
  .seg button:last-child{border-right:0}
  .seg button:hover{background:var(--hover)}

<script>
/* ============ constants ============ */
const KEY = 'english-study-tracker-v1';
const THEME_KEY = 'english-study-theme';
const SRS_INTERVALS = [3, 5, 7, 14, 30, 60];
const DAY_MS = 86400000;

const CONNECTED_TAGS = [
  ['linking', 'Linking'],
  ['reduction', 'Reductions'],
  ['flap', 'Flapping'],
  ['glottal', 'Glottal stops'],
  ['weak', 'Weak forms'],
  ['contraction', 'Contractions'],
  ['assimilation', 'Assimilation'],
  ['rhythm', 'Rhythm']
];
const CONNECTED_TAG_MAP = Object.fromEntries(CONNECTED_TAGS);

/* ============ helpers ============ */
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const wordCount = t => (t || '').trim() ? t.trim().split(/\s+/).length : 0;

function renderHighlight(text) {
  return esc(text).replace(/\*\*([\s\S]+?)\*\*/g, '<mark>$1</mark>');
}
function parseList(text) {
  return (text || '').split(/[\n,;]+/)
    .map(s => s.trim().replace(/^(?:[-*•–—]|\d+[.)])\s*/, '').trim())
    .filter(Boolean);
}

function youtubeId(url) {
  if (!url) return '';
  const m = String(url).match(
    /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/
  );
  return m ? m[1] : '';
}
function youtubeEmbed(url) {
  const id = youtubeId(url);
  return id ? `https://www.youtube.com/embed/${id}` : '';
}

/* ============ IndexedDB (audio blobs) ============ */
const DB_NAME = 'english-study-media';
const DB_VERSION = 1;
const AUDIO_STORE = 'audio';
let _dbPromise = null;

function openAudioDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(AUDIO_STORE)) db.createObjectStore(AUDIO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
  return _dbPromise;
}
async function idbPut(id, blob) {
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUDIO_STORE, 'readwrite');
    tx.objectStore(AUDIO_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}
async function idbGet(id) {
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUDIO_STORE, 'readonly');
    const req = tx.objectStore(AUDIO_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDel(id) {
  if (!id) return;
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUDIO_STORE, 'readwrite');
    tx.objectStore(AUDIO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbKeys() {
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUDIO_STORE, 'readonly');
    const req = tx.objectStore(AUDIO_STORE).getAllKeys();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

const audioUrls = new Map();
function revokeAudioUrl(id) {
  if (!id) return;
  if (audioUrls.has(id)) {
    try { URL.revokeObjectURL(audioUrls.get(id)); } catch (e) {}
    audioUrls.delete(id);
  }
}
async function ensureAudioUrl(id) {
  if (!id) return '';
  if (audioUrls.has(id)) return audioUrls.get(id);
  try {
    const blob = await idbGet(id);
    if (!blob) return '';
    const url = URL.createObjectURL(blob);
    audioUrls.set(id, url);
    return url;
  } catch (e) {
    console.warn('ensureAudioUrl failed for', id, e);
    return '';
  }
}

/* ============ SRS ============ */
function srsStart(l, baseTs) {
  const base = baseTs || Date.now();
  l.srs = { level: 0, nextReview: base + SRS_INTERVALS[0] * DAY_MS,
            lastReview: null, reviews: 0 };
}
function srsReview(l) {
  const s = l.srs;
  if (!s || s.level < 0) { srsStart(l); return; }
  if (s.level >= SRS_INTERVALS.length) return;
  s.reviews = (s.reviews || 0) + 1;
  s.lastReview = Date.now();
  s.level++;
  s.nextReview = s.level >= SRS_INTERVALS.length
    ? null : Date.now() + SRS_INTERVALS[s.level] * DAY_MS;
}
function srsAgain(l) {
  const s = l.srs; if (!s) return;
  s.level = 0;
  s.nextReview = Date.now() + SRS_INTERVALS[0] * DAY_MS;
  s.lastReview = Date.now();
}
function srsReset(l) {
  l.srs = { level: -1, nextReview: null, lastReview: null, reviews: 0 };
}
function srsStatus(l) {
  const s = l.srs;
  if (!s || s.level < 0) return { kind: 'none' };
  if (s.level >= SRS_INTERVALS.length) return { kind: 'graduated' };
  const now = Date.now();
  if (s.nextReview !== null && s.nextReview <= now)
    return { kind: 'due', overdue: Math.floor((now - s.nextReview) / DAY_MS) };
  if (s.nextReview === null) return { kind: 'none' };
  return { kind: 'waiting', days: Math.ceil((s.nextReview - now) / DAY_MS) };
}

/* ============ theme ============ */
const themeBtn = document.getElementById('themeToggle');
function syncThemeBtn(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeBtn.textContent = dark ? '☀️' : '🌙';
  themeBtn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
}
themeBtn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) {
    document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem(THEME_KEY, 'light'); }catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    try{ localStorage.setItem(THEME_KEY, 'dark'); }catch(e){}
  }
  syncThemeBtn();
});
syncThemeBtn();

/* ============ storage ============ */
function defaults() {
  return {
    route: 'dashboard',
    targets: { grammar: 3, writing: 2, pronunciation: 3 },
    grammar: { books: [], sessions: [] },
    writing: { projects: [], sessions: [] },
    pronunciation: {
      sounds: [], words: [], sentences: [], connected: [],
      sessions: [], tab: 'sounds'
    }
  };
}

function normCommon(it) {
  if (typeof it.mastery !== 'string') it.mastery = 'new';
  if (typeof it.notes !== 'string') it.notes = '';
  it.difficult = !!it.difficult;
  it.practices = it.practices || 0;
  it.last = it.last || null;
  if (typeof it.videoUrl !== 'string')  it.videoUrl  = '';
  if (typeof it.audioUrl !== 'string')  it.audioUrl  = '';
  if (typeof it.audioFileId !== 'string') it.audioFileId = '';
  if (typeof it.recordingId !== 'string') it.recordingId = '';
  return it;
}
function normSound(it) {
  normCommon(it);
  if (typeof it.symbol !== 'string') it.symbol = '';
  if (!Array.isArray(it.examples)) it.examples = [];
  if (typeof it.difficulty !== 'number') it.difficulty = 0;
  if (typeof it.mouthNotes !== 'string') it.mouthNotes = '';
  return it;
}
function normWord(it) {
  normCommon(it);
  if (typeof it.word !== 'string') it.word = '';
  if (typeof it.ipa !== 'string') it.ipa = '';
  if (typeof it.stress !== 'string') it.stress = '';
  if (it.mastery === 'new') it.mastery = 'practicing';
  return it;
}
function normSentence(it) {
  normCommon(it);
  if (typeof it.text !== 'string') it.text = '';
  if (typeof it.source !== 'string') it.source = '';
  if (typeof it.sourceType !== 'string') it.sourceType = 'other';
  if (typeof it.reps !== 'number') it.reps = 0;
  if (typeof it.targetReps !== 'number') it.targetReps = 10;
  if (!Array.isArray(it.difficultSections)) it.difficultSections = [];
  return it;
}
function normConnected(it) {
  normCommon(it);
  if (typeof it.original !== 'string') {
    it.original = (typeof it.text === 'string') ? it.text : '';
  }
  if (typeof it.connectedForm !== 'string') it.connectedForm = '';
  delete it.text;
  if (!Array.isArray(it.tags)) it.tags = [];
  return it;
}

function normalize(st) {
  (st.grammar.books || []).forEach(b => {
    if (Array.isArray(b.units)) {
      const migrated = [];
      const multiUnit = b.units.length > 1;
      b.units.forEach(u => {
        const unitTitle = (u.title || '').trim();
        (u.lessons || []).forEach(l => {
          if (multiUnit && unitTitle && !l.title.startsWith(unitTitle))
            l.title = unitTitle + ' — ' + l.title;
          migrated.push(l);
        });
      });
      b.lessons = migrated;
      delete b.units;
    }
    if (!Array.isArray(b.lessons)) b.lessons = [];

    b.lessons.forEach(l => {
      if (!Array.isArray(l.mistakes)) l.mistakes = [];
      if (!Array.isArray(l.writings)) l.writings = [];

      const ctx = (l.context && typeof l.context === 'object') ? l.context : {};
      if (!Array.isArray(ctx.sentences)) ctx.sentences = [];
      if (typeof ctx.explanation !== 'string') ctx.explanation = '';

      if (Array.isArray(l.contexts) && l.contexts.length) {
        const extra = [];
        l.contexts.forEach(c => {
          if (c && typeof c.explanation === 'string' && c.explanation) extra.push(c.explanation);
          if (c && Array.isArray(c.sentences)) ctx.sentences.push(...c.sentences);
        });
        if (extra.length) ctx.explanation = [ctx.explanation, ...extra].filter(Boolean).join('\n\n');
      }
      delete l.contexts;
      l.context = ctx;

      if (!l.srs || typeof l.srs !== 'object')
        l.srs = { level: -1, nextReview: null, lastReview: null, reviews: 0 };
      if (typeof l.srs.level !== 'number') l.srs.level = -1;
      if (typeof l.srs.reviews !== 'number') l.srs.reviews = 0;
      if (l.srs.nextReview === undefined) l.srs.nextReview = null;
      if (l.srs.lastReview === undefined) l.srs.lastReview = null;

      if (l.done && l.srs.level < 0) {
        const base = l.doneAt || Date.now();
        l.srs.level = 0;
        l.srs.nextReview = base + SRS_INTERVALS[0] * DAY_MS;
      }
    });
  });

  if (Array.isArray(st.grammar.contexts) && st.grammar.contexts.length) {
    const first = st.grammar.books[0]?.lessons[0];
    if (first) {
      const extra = [];
      st.grammar.contexts.forEach(c => {
        if (c && typeof c.explanation === 'string' && c.explanation) extra.push(c.explanation);
        if (c && Array.isArray(c.sentences)) first.context.sentences.push(...c.sentences);
      });
      if (extra.length)
        first.context.explanation =
          [first.context.explanation, ...extra].filter(Boolean).join('\n\n');
    }
  }
  delete st.grammar.contexts;

  const pr = st.pronunciation;
  if (!Array.isArray(pr.sounds))     pr.sounds = [];
  if (!Array.isArray(pr.words))      pr.words = [];
  if (!Array.isArray(pr.sentences))  pr.sentences = [];
  if (!Array.isArray(pr.connected))  pr.connected = [];
  if (!Array.isArray(pr.sessions))   pr.sessions = [];
  if (typeof pr.tab !== 'string')    pr.tab = 'sounds';

  if (Array.isArray(pr.items)) {
    pr.items.forEach(it => {
      const base = {
        id: it.id || uid(),
        mastery: it.status === 'mastered' ? 'mastered'
               : (it.status === 'practiced' ? 'practicing' : 'new'),
        notes: it.notes || '',
        difficult: !!it.difficult,
        practices: it.practices || 0,
        last: it.last || null,
        videoUrl: '', audioUrl: '',
        audioFileId: '', recordingId: ''
      };
      if (it.type === 'sound') {
        pr.sounds.push(normSound({ ...base, symbol: it.text || '',
          examples: [], difficulty: 0, mouthNotes: '' }));
      } else if (it.type === 'word') {
        pr.words.push(normWord({ ...base, word: it.text || '',
          ipa: '', stress: '' }));
      } else if (it.type === 'sentence') {
        pr.sentences.push(normSentence({ ...base, text: it.text || '',
          source: '', sourceType: 'other', reps: 0, targetReps: 10,
          difficultSections: [] }));
      }
    });
    delete pr.items;
  }
  pr.sounds.forEach(normSound);
  pr.words.forEach(normWord);
  pr.sentences.forEach(normSentence);
  pr.connected.forEach(normConnected);

  (st.writing.projects || []).forEach(p => {
    ['targets','paths','versions','sessions'].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });
  });

  return st;
}

function load() {
  const d = defaults();
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!raw) return d;
  return normalize({
    ...d, ...raw,
    targets:       { ...d.targets,       ...(raw.targets || {}) },
    grammar:       { ...d.grammar,       ...(raw.grammar || {}) },
    writing:       { ...d.writing,       ...(raw.writing || {}) },
    pronunciation: { ...d.pronunciation, ...(raw.pronunciation || {}) }
  });
}

let state = load();
const expanded = new Set();
const ctxOpen  = new Set();
let prFilter = 'all';
const prExpanded = new Set();
let pendingFocus = null;

const drafts = {};
const draftKey = {
  gw: id => 'gw:' + id, gk: id => 'gk:' + id,
  bulk: (pid, type) => 'bulk:' + pid + ':' + type
};

const prDrafts = {
  soundSymbol: '',
  wordWord: '', wordIpa: '', wordStress: '',
  sentenceText: '', sentenceSource: '', sentenceSourceType: 'book',
  csOriginal: '', csForm: ''
};

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { console.warn('localStorage save failed:', e); }
}

/* ============ lookups ============ */
const getBook = id => state.grammar.books.find(b => b.id === id);
const getProject = id => state.writing.projects.find(p => p.id === id);
const allLessons = () => state.grammar.books.flatMap(b => b.lessons);

function findLesson(id) {
  for (const b of state.grammar.books)
    for (const l of b.lessons) if (l.id === id) return l;
  return null;
}
function findLessonBook(id) {
  for (const b of state.grammar.books)
    for (const l of b.lessons) if (l.id === id) return b;
  return null;
}

const prCollections = {
  sound: () => state.pronunciation.sounds,
  word: () => state.pronunciation.words,
  sentence: () => state.pronunciation.sentences,
  connected: () => state.pronunciation.connected
};
function findPrItem(kind, id) {
  const arr = prCollections[kind] ? prCollections[kind]() : null;
  return arr ? arr.find(x => x.id === id) : null;
}
function allPrItems() {
  const p = state.pronunciation;
  return [...p.sounds, ...p.words, ...p.sentences, ...p.connected];
}

/* ============ week helpers ============ */
function startOfWeek() {
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getTime();
}
function weekLabel() {
  const s = new Date(startOfWeek());
  const e = new Date(s); e.setDate(e.getDate() + 6);
  const o = { month:'short', day:'numeric' };
  return s.toLocaleDateString(undefined, o) + ' – ' + e.toLocaleDateString(undefined, o);
}
const thisWeek = arr => arr.filter(s => s.ts >= startOfWeek()).length;

const TTYPES = [
  ['chunk','Chunks'], ['collocation','Collocations'], ['phrasal','Phrasal verbs'],
  ['vocab','Vocabulary'], ['grammar','Grammar']
];

/* ============ shell ============ */
const app = document.getElementById('app');

let scrollToTopOnRender = false;
function render() {
  document.querySelectorAll('.mainnav button').forEach(b =>
    b.classList.toggle('active', b.dataset.route === state.route));
  if (state.route === 'grammar')            renderGrammar();
  else if (state.route === 'writing')       renderWriting();
  else if (state.route === 'pronunciation') renderPronunciation();
  else                                      renderDashboard();
  if (scrollToTopOnRender) { window.scrollTo({ top: 0 }); scrollToTopOnRender = false; }
  if (pendingFocus) {
    const f = app.querySelector(pendingFocus);
    if (f) f.focus();
    pendingFocus = null;
  }
}

/* ============ dashboard ============ */
function statHTML(label, count, target, key) {
  const pct = target ? Math.min(100, Math.round(count / target * 100)) : 0;
  return `<div class="stat">
    <div class="stat-label">${label}</div>
    <div class="stat-num">${count}<span class="muted"> / ${target}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="stat-foot">target <input class="mini" type="number" min="0" max="99"
      value="${target}" data-action="set-target" data-key="${key}"> sessions/wk</div>
  </div>`;
}
function progRow(label, val, total) {
  const pct = total ? Math.round(val / total * 100) : 0;
  return `<div class="prow">
    <span>${label}</span>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <span class="muted small" style="text-align:right">${val}/${total}</span>
  </div>`;
}

function renderDashboard() {
  const t = state.targets;
  const gs = thisWeek(state.grammar.sessions);
  const ws = thisWeek(state.writing.sessions);
  const ps = thisWeek(state.pronunciation.sessions);

  const lessons = allLessons();
  const doneL = lessons.filter(l => l.done).length;
  const gWritings = lessons.reduce((n, l) => n + (l.writings || []).length, 0);
  const gContexts  = lessons.filter(l =>
    l.context.explanation.trim() || l.context.sentences.length).length;
  const gSentences = lessons.reduce((n, l) => n + l.context.sentences.length, 0);
  const gMistakes  = lessons.reduce((n, l) => n + l.mistakes.length, 0);

  const dueLessons = [];
  const upcomingLessons = [];
  state.grammar.books.forEach(b => b.lessons.forEach(l => {
    if (!l.done) return;
    const st = srsStatus(l);
    if (st.kind === 'due') dueLessons.push({ b, l });
    else if (st.kind === 'waiting') upcomingLessons.push({ b, l });
  }));
  dueLessons.sort((a, b) => a.l.srs.nextReview - b.l.srs.nextReview);
  upcomingLessons.sort((a, b) => a.l.srs.nextReview - b.l.srs.nextReview);
  const graduatedCount = lessons.filter(l =>
    l.done && l.srs.level >= SRS_INTERVALS.length).length;

  const prAll = allPrItems();
  const prMastered = prAll.filter(i => i.mastery === 'mastered').length;

  const proj = state.writing.projects;
  const versions = proj.reduce((n, p) => n + p.versions.length, 0);
  const words = proj.reduce((n, p) => n + wordCount(p.current), 0);
  const tTotal = proj.reduce((n, p) => n + p.targets.length, 0);
  const tUsed  = proj.reduce((n, p) => n + p.targets.filter(x => x.used).length, 0);

  const review = [];
  state.grammar.books.forEach(b => b.lessons.forEach(l => {
    if (l.confidence > 0 && l.confidence <= 2) {
      review.push({
        route: 'grammar', type: 'Grammar', label: l.title,
        meta: `${b.title} · confidence ${l.confidence}/5`
      });
    }
  }));
  prAll.forEach(i => {
    if (!i.difficult) return;
    let label = '', meta = '';
    if (i.symbol !== undefined)      { label = i.symbol;   meta = `sound · ${i.mastery}`; }

      meta = `connected speech${i.connectedForm ? ' → ' + i.connectedForm : ''} · ${(i.tags || []).map(k => CONNECTED_TAG_MAP[k] || k).join(', ')}`;

    review.push({ route: 'pronunciation', type: 'Pronunciation', label, meta });

/* ============ SRS panel ============ */
function srsBadgeHTML(l) {
  if (!l.done) return '';
  const st = srsStatus(l);
  if (st.kind === 'none') return '';
  if (st.kind === 'graduated') return `<span class="badge ok" title="SRS complete">SRS ✓</span>`;
  if (st.kind === 'due')       return `<span class="badge srs-due" title="Review due">SRS ●</span>`;
  return `<span class="badge" title="Next in ${st.days}d">SRS ${st.days}d</span>`;
}
function srsPanelHTML(l) {
  if (!l.done) return '';
  const s = l.srs;
  const active = s.level >= 0;
  const graduated = s.level >= SRS_INTERVALS.length;
  const st = srsStatus(l);

  let statusText = '', statusCls = '';
  if (graduated)      { statusText = `Graduated · ${s.reviews} review${s.reviews === 1 ? '' : 's'}`; statusCls = 'ok'; }
  else if (!active)   { statusText = 'Not scheduled'; }
  else if (st.kind === 'due') {
    statusText = st.overdue > 0
      ? `Due ${st.overdue} day${st.overdue === 1 ? '' : 's'} ago` : 'Due today';
    statusCls = 'due';
  } else { statusText = `Next in ${st.days} day${st.days === 1 ? '' : 's'}`; }

  const stagesHTML = SRS_INTERVALS.map((days, i) => {
    let cls = 'srs-stage';
    if (graduated || s.level > i) cls += ' done';
    else if (s.level === i) cls += ' current';
    return `<span class="${cls}">${days}d</span>`;
  }).join('');

  return `<div class="srs-panel">
    <div class="srs-head">
      <span class="srs-title">Spaced repetition</span>
      <span class="srs-status ${statusCls}">${statusText}</span>
    </div>
    ${active ? `<div class="srs-stages">${stagesHTML}<span class="srs-stage ${
      graduated ? 'done' : ''}">✓</span></div>` : ''}
    <div class="srs-actions">
      ${!active ? `<button class="btn small primary" data-action="srs-start" data-lesson="${l.id}">Start schedule</button>`
        : graduated ? `<span class="muted small">All intervals complete.</span>
           <button class="btn small" data-action="srs-reset" data-lesson="${l.id}">Reset</button>`
        : `<button class="btn small primary" data-action="srs-review" data-lesson="${l.id}">Review now ✓</button>
           <button class="btn small" data-action="srs-again" data-lesson="${l.id}">Again</button>
           <button class="btn small" data-action="srs-reset" data-lesson="${l.id}">Reset</button>`}
    </div>
  </div>`;
}

/* ============ recording ============ */
let activeRecorder = null;
let activeChunks = [];
let activeRecording = null;

async function startRecording(kind, itemId) {
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    alert('Recording is not supported in this browser.');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream);
    activeChunks = [];
    rec.ondataavailable = e => { if (e.data.size) activeChunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(activeChunks, { type: 'audio/webm' });
      const audioId = 'rec_' + uid();
      try {
        await idbPut(audioId, blob);
        const it = findPrItem(kind, itemId);
        if (it) {
          if (it.recordingId) {
            revokeAudioUrl(it.recordingId);
            idbDel(it.recordingId).catch(() => {});
          }
          it.recordingId = audioId;
          audioUrls.set(audioId, URL.createObjectURL(blob));
          save();
        }
      } catch (e) {
        console.error('Recording save failed:', e);
        alert('Could not save the recording.');
      }
      activeRecorder = null;
      activeRecording = null;
      render();
    };
    rec.start();
    activeRecorder = rec;
    activeRecording = { kind, id: itemId };
    render();
  } catch (e) {
    alert('Could not access microphone: ' + e.message);
  }
}
function stopRecording() {
  if (activeRecorder && activeRecorder.state !== 'inactive') activeRecorder.stop();
}

/* ============ actions ============ */
function act(a, el) {
  const d = el.dataset;
  const isInput = el.tagName === 'INPUT' || el.tagName === 'TEXTAREA';

  switch (a) {

    case 'goto':
      state.route = d.route;
      scrollToTopOnRender = true;
      break;

    case 'set-target':
      state.targets[d.key] = Math.max(0, +el.value || 0);
      break;

    /* ---------- pronunciation: add items ---------- */
    case 'pr-add-sound': {
      const v = (prDrafts.soundSymbol || '').trim(); if (!v) return;
      state.pronunciation.sounds.unshift(normSound({
        id: uid(), symbol: v, examples: [], difficulty: 0, mouthNotes: '',
        mastery: 'new', notes: '', difficult: false, practices: 0, last: null
      }));
      prDrafts.soundSymbol = '';
      break;
    }
    case 'pr-add-word': {
      const v = (prDrafts.wordWord || '').trim(); if (!v) return;
      state.pronunciation.words.unshift(normWord({
        id: uid(), word: v, ipa: prDrafts.wordIpa || '', stress: prDrafts.wordStress || '',
        mastery: 'practicing', notes: '', difficult: false, practices: 0, last: null
      }));
      prDrafts.wordWord = ''; prDrafts.wordIpa = ''; prDrafts.wordStress = '';
      break;
    }
    case 'pr-add-sentence': {
      const v = (prDrafts.sentenceText || '').trim(); if (!v) return;
      state.pronunciation.sentences.unshift(normSentence({
        id: uid(), text: v, source: prDrafts.sentenceSource || '',
        sourceType: prDrafts.sentenceSourceType || 'other',
        reps: 0, targetReps: 10, difficultSections: [],
        mastery: 'new', notes: '', difficult: false, practices: 0, last: null
      }));
      prDrafts.sentenceText = ''; prDrafts.sentenceSource = '';
      break;
    }
    case 'pr-add-connected': {
      const orig = (prDrafts.csOriginal || '').trim();
      const form = (prDrafts.csForm || '').trim();
      if (!orig && !form) return;
      state.pronunciation.connected.unshift(normConnected({
        id: uid(), original: orig, connectedForm: form, tags: [],
        mastery: 'new', notes: '', difficult: false, practices: 0, last: null
      }));
      prDrafts.csOriginal = ''; prDrafts.csForm = '';
      break;
    }

    /* ---------- pronunciation: common item actions ---------- */
    case 'pr-toggle-card': {
      const key = d.kind + ':' + d.id;
      prExpanded.has(key) ? prExpanded.delete(key) : prExpanded.add(key);
      break;
    }
    case 'pr-toggle-all': {
      const arr = prCollections[d.kind] ? applyPrFilter(prCollections[d.kind]()) : [];
      if (!arr.length) return;
      const allOpen = arr.every(x => prExpanded.has(d.kind + ':' + x.id));
      arr.forEach(x => {
        const key = d.kind + ':' + x.id;
        allOpen ? prExpanded.delete(key) : prExpanded.add(key);
      });
      break;
    }
    case 'pr-star': {
      const it = findPrItem(d.kind, d.id); if (!it) return;
      it.difficult = !it.difficult;
      break;
    }
    case 'pr-del': {
      const arr = prCollections[d.kind] && prCollections[d.kind]();
      if (!arr) return;
      if (!confirm('Delete this item?')) return;
      const idx = arr.findIndex(x => x.id === d.id);
      if (idx >= 0) {
        const it = arr[idx];
        [it.recordingId, it.audioFileId].forEach(aid => {
          if (aid) { revokeAudioUrl(aid); idbDel(aid).catch(() => {}); }
        });
        arr.splice(idx, 1);
      }
      break;
    }
    case 'pr-mastery': {
      const it = findPrItem(d.kind, d.id); if (!it) return;
      it.mastery = d.val;
      break;
    }
    case 'pr-practice': {
      const it = findPrItem(d.kind, d.id); if (!it) return;
      it.practices = (it.practices || 0) + 1;
      it.last = Date.now();
      state.pronunciation.sessions.push({
        id: uid(), ts: Date.now(), kind: d.kind, itemId: it.id
      });
      break;
    }

    /* ---------- media ---------- */
    case 'pr-audio-clear': {
      const it = findPrItem(d.kind, d.id); if (!it) return;
      [it.recordingId, it.audioFileId].forEach(aid => {
        if (aid) { revokeAudioUrl(aid); idbDel(aid).catch(() => {}); }
      });
      it.recordingId = '';
      it.audioFileId = '';
      break;
    }
    case 'pr-rec-toggle': {
      if (activeRecording && activeRecording.kind === d.kind && activeRecording.id === d.id) {
        stopRecording();
        return;
      }
      if (activeRecording) { stopRecording(); return; }
      startRecording(d.kind, d.id);
      return;
    }

    /* ---------- sounds ---------- */
    case 'pr-sound-add-example': {
      const s = findPrItem('sound', d.id); if (!s) return;
      const v = el.value.trim(); if (!v) return;
      parseList(v).forEach(ex => { if (!s.examples.includes(ex)) s.examples.push(ex); });
      pendingFocus = `input[data-action="pr-sound-add-example"][data-id="${s.id}"]`;
      break;
    }
    case 'pr-sound-del-example': {
      const s = findPrItem('sound', d.id); if (!s) return;
      s.examples.splice(+d.idx, 1);
      break;
    }
    case 'pr-sound-difficulty': {
      const s = findPrItem('sound', d.id); if (!s) return;
      s.difficulty = (s.difficulty === +d.val) ? 0 : +d.val;
      break;
    }

    /* ---------- sentences ---------- */
    case 'pr-sentence-rep': {
      const s = findPrItem('sentence', d.id); if (!s) return;
      s.reps = (s.reps || 0) + 1;
      s.last = Date.now();
      state.pronunciation.sessions.push({
        id: uid(), ts: Date.now(), kind: 'sentence', itemId: s.id
      });
      break;
    }
    case 'pr-sentence-reset-reps': {
      const s = findPrItem('sentence', d.id); if (!s) return;
      s.reps = 0;
      break;
    }
    case 'pr-sentence-add-section': {
      const s = findPrItem('sentence', d.id); if (!s) return;
      const v = el.value.trim(); if (!v) return;
      s.difficultSections.push({ id: uid(), text: v });
      pendingFocus = `input[data-action="pr-sentence-add-section"][data-id="${s.id}"]`;
      break;
    }
    case 'pr-sentence-del-section': {
      const s = findPrItem('sentence', d.id); if (!s) return;
      s.difficultSections.splice(+d.idx, 1);
      break;
    }

    /* ---------- connected speech ---------- */
    case 'pr-tag-toggle': {
      const c = findPrItem('connected', d.id); if (!c) return;
      const tag = d.tag;
      const i = c.tags.indexOf(tag);
      if (i >= 0) c.tags.splice(i, 1);
      else c.tags.push(tag);
      break;
    }

    /* ---------- SRS ---------- */
    case 'srs-start':  { const l = findLesson(d.lesson); if (l) srsStart(l); break; }
    case 'srs-review': { const l = findLesson(d.lesson); if (l) srsReview(l); break; }
    case 'srs-again':  { const l = findLesson(d.lesson); if (l) srsAgain(l); break; }
    case 'srs-reset':  {
      const l = findLesson(d.lesson); if (!l) return;
      if (!confirm('Reset spaced repetition for this lesson?')) return;
      srsReset(l);
      break;
    }

    /* ---------- grammar in context ---------- */
    case 'toggle-ctx':
      ctxOpen.has(d.lesson) ? ctxOpen.delete(d.lesson) : ctxOpen.add(d.lesson);
      break;
    case 'add-sentence': {
      const l = findLesson(d.lesson); if (!l) return;
      const v = el.value.trim(); if (!v) return;
      l.context.sentences.push({ id: uid(), text: v });
      pendingFocus = `input[data-action="add-sentence"][data-lesson="${l.id}"]`;
      break;
    }
    case 'del-sentence': {
      const l = findLesson(d.lesson); if (!l) return;
      l.context.sentences = l.context.sentences.filter(s => s.id !== d.sentence);
      break;
    }
    case 'add-mistake': {
      const l = findLesson(d.lesson); if (!l) return;
      const v = el.value.trim(); if (!v) return;
      l.mistakes.push(v);
      pendingFocus = `input[data-action="add-mistake"][data-lesson="${l.id}"]`;
      break;
    }
    case 'del-mistake': {
      const l = findLesson(d.lesson); if (!l) return;
      l.mistakes.splice(+d.idx, 1);
      break;
    }

    /* ---------- grammar books ---------- */
    case 'add-book': {
      const inp = isInput ? el : document.getElementById('new-book');
      const v = inp.value.trim(); if (!v) return;
      state.grammar.books.push({ id: uid(), title: v, lessons: [] });
      break;
    }
    case 'del-book':
      if (!confirm('Delete this book and all its lessons?')) return;
      state.grammar.books = state.grammar.books.filter(b => b.id !== d.book);
      break;
    case 'add-lesson': {
      const b = getBook(d.book); if (!b) return;
      const inp = isInput ? el
        : document.querySelector(`[data-action="add-lesson"][data-book="${d.book}"]`);
      const v = inp.value.trim(); if (!v) return;
      b.lessons.push({
        id: uid(), title: v, done: false, doneAt: null,
        confidence: 0, mistakes: [], writings: [],
        context: { explanation: '', sentences: [] },
        srs: { level: -1, nextReview: null, lastReview: null, reviews: 0 }
      });
      break;
    }
    case 'del-lesson': {
      const b = findLessonBook(d.lesson); if (!b) return;
      b.lessons = b.lessons.filter(l => l.id !== d.lesson);
      state.grammar.sessions = state.grammar.sessions.filter(s => s.lessonId !== d.lesson);
      break;
    }
    case 'toggle-lesson': {
      const l = findLesson(d.lesson); if (!l) return;
      l.done = el.checked;
      l.doneAt = l.done ? Date.now() : null;
      state.grammar.sessions = state.grammar.sessions.filter(s => s.lessonId !== l.id);
      if (l.done) {
        const b = findLessonBook(l.id);
        state.grammar.sessions.push({
          id: uid(), ts: Date.now(), lessonId: l.id,
          label: `${b ? b.title + ' · ' : ''}${l.title}`
        });
        if (!l.srs || l.srs.level < 0) srsStart(l, Date.now());
      }
      break;
    }
    case 'set-conf': {
      const l = findLesson(d.lesson); if (!l) return;
      l.confidence = (l.confidence === +d.val) ? 0 : +d.val;
      break;
    }
    case 'expand-lesson':
      expanded.has(d.lesson) ? expanded.delete(d.lesson) : expanded.add(d.lesson);
      break;
    case 'log-grammar-session':
      state.grammar.sessions.push({ id: uid(), ts: Date.now(), label: 'Study session' });
      break;

    /* ---------- grammar writing practice ---------- */
    case 'gw-kind':
      drafts[draftKey.gk(d.lesson)] = d.val;
      break;
    case 'gw-add': {
      const l = findLesson(d.lesson); if (!l) return;
      const ta = isInput ? el
        : document.querySelector(`textarea[data-action="gw-draft"][data-lesson="${d.lesson}"]`);
      const text = (ta ? ta.value : (drafts[draftKey.gw(d.lesson)] || '')).trim();
      if (!text) return;
      l.writings.push({
        id: uid(), kind: drafts[draftKey.gk(d.lesson)] || 'sentence',
        text, ts: Date.now()
      });
      delete drafts[draftKey.gw(d.lesson)];
      break;
    }
    case 'gw-del': {
      const l = findLesson(d.lesson); if (!l) return;
      l.writings = l.writings.filter(w => w.id !== d.writing);
      break;
    }

    /* ---------- writing ---------- */
    case 'add-project': {
      const inp = isInput ? el : document.getElementById('new-project');
      const v = inp.value.trim(); if (!v) return;
      const id = uid();
      state.writing.projects.push({
        id, title: v, topic: '', structure: '', current: '',
        targets: [], paths: [], versions: [], sessions: []
      });
      expanded.add('p' + id);
      break;
    }
    case 'del-project':
      if (!confirm('Delete this project?')) return;
      state.writing.projects = state.writing.projects.filter(p => p.id !== d.project);
      break;
    case 'expand-project':
      expanded.has('p' + d.project) ? expanded.delete('p' + d.project) : expanded.add('p' + d.project);
      break;
    case 'writing-toggle-all': {
      const projs = state.writing.projects;
      if (!projs.length) return;
      const allOpen = projs.every(p => expanded.has('p' + p.id));
      projs.forEach(p => {
        const key = 'p' + p.id;
        allOpen ? expanded.delete(key) : expanded.add(key);
      });
      break;
    }
    case 'add-bulk': {
      const p = getProject(d.project); if (!p) return;
      const type = d.type;
      const key = draftKey.bulk(p.id, type);
      const ta = document.querySelector(
        `textarea[data-action="bulk-draft"][data-project="${p.id}"][data-type="${type}"]`);
      const text = ta ? ta.value : (drafts[key] || '');
      const items = parseList(text);
      if (!items.length) return;
      const target = type === 'path' ? p.paths : p.targets;
      const seen = new Set(target.map(x => x.text.toLowerCase()));
      items.forEach(t => {
        const k = t.toLowerCase();
        if (seen.has(k)) return;
        seen.add(k);
        target.push(type === 'path'
          ? { id: uid(), text: t }
          : { id: uid(), type, text: t, used: false });
      });
      delete drafts[key];
      break;
    }
    case 'toggle-target': {
      const p = getProject(d.project); if (!p) return;
      const x = p.targets.find(t => t.id === d.target); if (!x) return;
      x.used = el.checked;
      break;
    }
    case 'del-target': {
      const p = getProject(d.project); if (!p) return;
      p.targets = p.targets.filter(t => t.id !== d.target);
      break;
    }
    case 'del-path': {
      const p = getProject(d.project); if (!p) return;
      p.paths = p.paths.filter(x => x.id !== d.path);
      break;
    }
    case 'save-version': {
      const p = getProject(d.project); if (!p) return;
      const ta = document.querySelector(`textarea[data-action="workspace"][data-project="${p.id}"]`);
      const text = ta ? ta.value : p.current;
      if (!text.trim()) return;
      p.current = text;
      p.versions.push({ id: uid(), kind: d.kind, text, ts: Date.now() });
      break;
    }
    case 'load-version': {
      const p = getProject(d.project); if (!p) return;
      const v = p.versions.find(x => x.id === d.version); if (!v) return;
      p.current = v.text;
      break;
    }
    case 'del-version': {
      const p = getProject(d.project); if (!p) return;
      p.versions = p.versions.filter(x => x.id !== d.version);
      break;
    }
    case 'log-writing-session': {
      const p = getProject(d.project); if (!p) return;
      const ts = Date.now();
      p.sessions.push({ id: uid(), ts });
      state.writing.sessions.push({ id: uid(), ts, projectId: p.id });
      break;
    }

    case 'pr-filter':
      prFilter = d.val;
      break;

    default:
      return;
  }
  save();
  render();
}

/* ============ events ============ */
document.querySelector('.mainnav').addEventListener('click', e => {
  const b = e.target.closest('button[data-route]');
  if (!b) return;
  state.route = b.dataset.route;
  save();
  scrollToTopOnRender = true;
  render();
});

app.addEventListener('click', e => {
  const tab = e.target.closest('[data-pr-tab]');
  if (tab) {
    if (activeRecording) stopRecording();
    state.pronunciation.tab = tab.dataset.prTab;
    save();
    scrollToTopOnRender = true;
    render();
    return;
  }
  const el = e.target.closest('[data-action]');

});

app.addEventListener('change', e => {
  const el = e.target;
  const a = el.dataset.action;

  if (a === 'set-target') {
    state.targets[el.dataset.key] = Math.max(0, +el.value || 0);
    save(); render(); return;
  }
  if (a === 'toggle-lesson' || a === 'toggle-target') {
    act(a, el);
    return;
  }
  if (a === 'pr-sentence-target') {
    const s = findPrItem('sentence', el.dataset.id); if (!s) return;
    s.targetReps = Math.max(1, +el.value || 1);
    save(); render(); return;
  }
  if (a === 'pr-draft' && el.tagName === 'SELECT') {
    prDrafts[el.dataset.key] = el.value;
    return;
  }
  if (a === 'pr-audio-upload') {
    const file = el.files && el.files[0];
    el.value = '';
    if (!file) return;
    const it = findPrItem(el.dataset.kind, el.dataset.id);
    if (!it) return;

    const audioId = 'file_' + uid();
    if (it.audioFileId) {
      revokeAudioUrl(it.audioFileId);
      idbDel(it.audioFileId).catch(() => {});
    }
    idbPut(audioId, file).then(() => {
      it.audioFileId = audioId;
      audioUrls.set(audioId, URL.createObjectURL(file));
      save();
      render();
    }).catch(err => {
      console.error(err);
      alert('Could not save file: ' + (err && err.message || err));
    });
    return;
  }
});

app.addEventListener('input', e => {
  const el = e.target;
  const a = el.dataset.action;

  if (a === 'pr-draft') {
    prDrafts[el.dataset.key] = el.value;
    return;
  }

  if (a === 'pr-sound-mouth') {
    const s = findPrItem('sound', el.dataset.id); if (!s) return;
    s.mouthNotes = el.value; save(); return;
  }
  if (a === 'pr-notes') {
    const it = findPrItem(el.dataset.kind, el.dataset.id); if (!it) return;
    it.notes = el.value; save(); return;
  }
  if (a === 'pr-word-field') {
    const w = findPrItem('word', el.dataset.id); if (!w) return;
    w[el.dataset.field] = el.value; save(); return;
  }
  if (a === 'pr-cs-field') {
    const c = findPrItem('connected', el.dataset.id); if (!c) return;
    c[el.dataset.field] = el.value; save(); return;
  }
  if (a === 'pr-media-field') {
    const it = findPrItem(el.dataset.kind, el.dataset.id); if (!it) return;
    it[el.dataset.field] = el.value;
    save();
    if (el.dataset.field === 'videoUrl') {
      const card = el.closest('.pr-card');
      const hadEmbed = !!(card && card.querySelector('.video-embed'));
      const willHave = !!youtubeEmbed(el.value);
      if (hadEmbed !== willHave) {
        pendingFocus = `input[data-action="pr-media-field"][data-kind="${el.dataset.kind}"][data-id="${el.dataset.id}"][data-field="videoUrl"]`;
        render();
      }
    }
    return;
  }

  if (a === 'ctx-explanation') {
    const l = findLesson(el.dataset.lesson); if (!l) return;
    l.context.explanation = el.value;
    const preview = el.closest('.ctx-section')?.querySelector('.hl-preview');
    if (preview) preview.innerHTML = contextPreviewInner(l.context);
    save(); return;
  }
  if (a === 'workspace') {
    const p = getProject(el.dataset.project); if (!p) return;
    p.current = el.value;
    const wc = el.closest('.workspace').querySelector('.wc');
    if (wc) wc.textContent = wordCount(el.value);
    save(); return;
  }
  if (a === 'gw-edit') {
    const l = findLesson(el.dataset.lesson); if (!l) return;
    const w = (l.writings || []).find(x => x.id === el.dataset.writing); if (!w) return;
    w.text = el.value;
    const wc = el.closest('.writing-entry')?.querySelector('.wcount');
    if (wc) wc.textContent = wordCount(el.value) + 'w';
    save(); return;
  }
  if (a === 'gw-draft') { drafts[draftKey.gw(el.dataset.lesson)] = el.value; return; }
  if (a === 'bulk-draft') {
    drafts[draftKey.bulk(el.dataset.project, el.dataset.type)] = el.value;
    const c = el.parentElement.querySelector('.bulk-count');
    if (c) {
      const n = parseList(el.value).length;
      c.textContent = n ? n + ' ready to add' : 'One per line, or separate with commas';
    }
    return;
  }
  if (el.dataset.field) {
    const p = getProject(el.dataset.project); if (!p) return;
    p[el.dataset.field] = el.value;
    save();
  }
});

app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target;
  const a = el.dataset.action;
  const mod = e.ctrlKey || e.metaKey;

  if (a === 'gw-draft' || a === 'bulk-draft') {
    if (!mod) return;
    e.preventDefault();
    act(a === 'gw-draft' ? 'gw-add' : 'add-bulk', el);
    return;
  }
  if (mod || !a) return;
  if (a === 'add-lesson' || a === 'add-sentence' || a === 'add-mistake' ||
      a === 'pr-sound-add-example' || a === 'pr-sentence-add-section') {
    e.preventDefault();
    act(a, el);
  }
});

/* ============ migration + bootstrap ============ */
function dataUrlToBlob(dataUrl) {
  const [meta, data] = String(dataUrl).split(',');
  const mimeMatch = meta.match(/data:([^;]+)/);
  const mime = mimeMatch ? mimeMatch[1] : 'audio/webm';
  if (meta.includes(';base64')) {
    const bin = atob(data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }
  return new Blob([decodeURIComponent(data)], { type: mime });
}

async function migrateLegacyAudio() {
  let changed = false;
  for (const it of allPrItems()) {
    if (typeof it.audioFile === 'string' && it.audioFile.startsWith('data:')) {
      try {
        const id = 'mig_' + uid();
        await idbPut(id, dataUrlToBlob(it.audioFile));
        it.audioFileId = id;
        changed = true;
      } catch (e) { console.warn('migrate audioFile failed', e); }
      delete it.audioFile;
    }
    if (typeof it.recording === 'string' && it.recording.startsWith('data:')) {
      try {
        const id = 'mig_' + uid();
        await idbPut(id, dataUrlToBlob(it.recording));
        it.recordingId = id;
        changed = true;
      } catch (e) { console.warn('migrate recording failed', e); }
      delete it.recording;
    }
  }
  if (changed) save();
}

async function preloadAudioUrls() {
  const ids = new Set();
  for (const it of allPrItems()) {
    if (it.audioFileId) ids.add(it.audioFileId);
    if (it.recordingId) ids.add(it.recordingId);
  }
  for (const id of ids) {
    if (!audioUrls.has(id)) await ensureAudioUrl(id);
  }
}

async function pruneOrphanAudio() {
  try {
    const referenced = new Set();
    for (const it of allPrItems()) {
      if (it.audioFileId) referenced.add(it.audioFileId);
      if (it.recordingId) referenced.add(it.recordingId);
    }
    const keys = await idbKeys();
    for (const key of keys) {
      if (!referenced.has(key)) {
        try { await idbDel(key); } catch (e) {}
      }
    }
  } catch (e) { /* IndexedDB may be unavailable */ }
}

/* ============ start ============ */
(async function bootstrap() {
  try {
    await migrateLegacyAudio();
    await preloadAudioUrls();
    pruneOrphanAudio();
  } catch (e) {
    console.warn('Bootstrap partial failure:', e);
  }
  render();
})();
</script>
