<!DOCTYPE html>
<html lang="en" data-theme="sand">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Study Plan — Roadmap</title>
<style>
  /* =========================================================
     Themes (identical tokens to index.html)
     ========================================================= */
  :root, html[data-theme="sand"]{
    --bg:#FAF7F3; --surface:#FFFFFF; --surface-2:#F4EFE9; --line:#EAE2D8;
    --text:#26211C; --muted:#8A7F73; --reading:#C2703D; --reading-2:#D89A6C;
    --listening:#3F7A6E; --listening-2:#66A093; --xp:#A9855C;
    --good-bg:#E2F0E9;  --good-fg:#2F6B54;
    --warn-bg:#FBF0DC;  --warn-fg:#8A6420;
    --bad-bg:#FBE6E1;   --bad-fg:#9C4230;
    --info-bg:#EAEFF5;  --info-fg:#3E5B78;
    --neutral-bg:#F0ECE6; --neutral-fg:#8A7F73;
    --tag-bg:#F1E7DC;   --tag-fg:#8A5A2B;
    --hover-line:#D6C7B4; --focus-line:#CDBBA6; --dash-line:#C9B9A6;
    --bar-bg:#E5DCD0;
    --hdr-bg:rgba(250,247,243,.88); --backdrop:rgba(38,33,28,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(38,33,28,.04), 0 10px 26px -16px rgba(38,33,28,.28);
    --radius:16px; color-scheme:light;
  }
  html[data-theme="mint"]{
    --bg:#F3F8F4; --surface:#FFFFFF; --surface-2:#E9F1EB; --line:#DAE7DE;
    --text:#1A2620; --muted:#6E8378; --reading:#2F7A57; --reading-2:#68A98A;
    --listening:#2F6E8A; --listening-2:#6EA0B8; --xp:#7A8C4A;
    --good-bg:#DDF0E4; --good-fg:#25674A; --warn-bg:#F7EFD9; --warn-fg:#836018;
    --bad-bg:#F9E3DD; --bad-fg:#943D2B; --info-bg:#E2EEF3; --info-fg:#356278;
    --neutral-bg:#EBEFEA; --neutral-fg:#6E8378; --tag-bg:#E2EFE6; --tag-fg:#2F6B50;
    --hover-line:#C4D6CB; --focus-line:#B6CCBF; --dash-line:#B6CCBF;
    --bar-bg:#DCE8E0; --hdr-bg:rgba(243,248,244,.88); --backdrop:rgba(20,35,27,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(26,38,32,.04), 0 10px 26px -16px rgba(26,38,32,.25);
    color-scheme:light;
  }
  html[data-theme="lavender"]{
    --bg:#F8F6FC; --surface:#FFFFFF; --surface-2:#F0EBF7; --line:#E3DCF0;
    --text:#211C2B; --muted:#7C7489; --reading:#7A5EA8; --reading-2:#A98FD0;
    --listening:#3E7C8A; --listening-2:#74A7B3; --xp:#A9855C;
    --good-bg:#E4F0E8; --good-fg:#2E6B52; --warn-bg:#FBF0DC; --warn-fg:#8A6420;
    --bad-bg:#FBE6E1; --bad-fg:#9C4230; --info-bg:#E7E9F6; --info-fg:#47528F;
    --neutral-bg:#EDE9F1; --neutral-fg:#7C7489; --tag-bg:#EDE4F6; --tag-fg:#6A4E9A;
    --hover-line:#CFC4E0; --focus-line:#C0B2D6; --dash-line:#C0B2D6;
    --bar-bg:#E3DAF0; --hdr-bg:rgba(248,246,252,.88); --backdrop:rgba(28,22,40,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(33,28,43,.04), 0 10px 26px -16px rgba(33,28,43,.28);
    color-scheme:light;
  }
  html[data-theme="midnight"]{
    --bg:#11141A; --surface:#181D25; --surface-2:#212832; --line:#2C3542;
    --text:#E7ECF3; --muted:#8A95A6; --reading:#E29A62; --reading-2:#B9743F;
    --listening:#63B3A2; --listening-2:#3F7A6E; --xp:#CBA97C;
    --good-bg:#17352A; --good-fg:#7FD3AD; --warn-bg:#382C15; --warn-fg:#E8C377;
    --bad-bg:#3A1E19; --bad-fg:#EFA08A; --info-bg:#1B2A3A; --info-fg:#96BEE6;
    --neutral-bg:#262C35; --neutral-fg:#9AA4B2; --tag-bg:#38291B; --tag-fg:#E5BA85;
    --hover-line:#3B4653; --focus-line:#4A5765; --dash-line:#4A5765;
    --bar-bg:#2C3542; --hdr-bg:rgba(17,20,26,.88); --backdrop:rgba(0,0,0,.58);
    --on-accent:#14181E;
    --shadow:0 1px 2px rgba(0,0,0,.32), 0 10px 26px -16px rgba(0,0,0,.72);
    color-scheme:dark;
  }
  html[data-theme="espresso"]{
    --bg:#16120F; --surface:#1F1A15; --surface-2:#2A231C; --line:#392F26;
    --text:#F0E8DF; --muted:#9E9184; --reading:#E39A62; --reading-2:#B9743F;
    --listening:#6FB6A6; --listening-2:#3F7A6E; --xp:#CFAC7C;
    --good-bg:#1B352A; --good-fg:#84D2AE; --warn-bg:#3A2D16; --warn-fg:#EAC57B;
    --bad-bg:#3C1F19; --bad-fg:#F0A48D; --info-bg:#2A2A38; --info-fg:#A0B4D8;
    --neutral-bg:#2C2520; --neutral-fg:#A69A8C; --tag-bg:#3A2A1A; --tag-fg:#E5BA85;
    --hover-line:#463A2F; --focus-line:#54463A; --dash-line:#54463A;
    --bar-bg:#392F26; --hdr-bg:rgba(22,18,15,.88); --backdrop:rgba(0,0,0,.6);
    --on-accent:#1A1512;
    --shadow:0 1px 2px rgba(0,0,0,.38), 0 10px 26px -16px rgba(0,0,0,.78);
    color-scheme:dark;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease;
  }
  button{font-family:inherit}

  /* ---------- Header ---------- */
  .hdr{
    position:sticky;top:0;z-index:50;background:var(--hdr-bg);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .hdr-top{
    max-width:1080px;margin:0 auto;padding:14px 20px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{
    width:36px;height:36px;flex:0 0 auto;border-radius:11px;
    background:linear-gradient(140deg,var(--reading-2),var(--reading));
    color:var(--on-accent);font-size:11px;font-weight:800;letter-spacing:.06em;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px -6px color-mix(in srgb,var(--reading) 70%,transparent);
  }
  .brand-txt h1{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
  .brand-txt p{font-size:12.5px;color:var(--muted)}
  .hdr-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .theme-dots{display:flex;gap:6px;align-items:center;padding:5px 9px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px}
  .tdot{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer;
    transition:transform .12s ease;padding:0}
  .tdot:hover{transform:scale(1.15)}
  .tdot.active{border-color:var(--text);box-shadow:0 0 0 2px var(--surface)}
  @media(max-width:640px){ .theme-dots{display:none} .hdr-actions .back-btn span{display:none} }

  .tabs{
    max-width:1080px;margin:0 auto;padding:0 20px 10px;
    display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs button, .tabs a{
    flex:0 0 auto;border:0;background:transparent;padding:7px 16px;border-radius:999px;
    font-size:13.5px;font-weight:550;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s;text-decoration:none;line-height:1.45;font-family:inherit;
  }
  .tabs button:hover, .tabs a:hover{color:var(--text)}
  .tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .tabs a .ext{font-size:11px;opacity:.7;margin-left:2px}

  /* ---------- Layout ---------- */
  main{max-width:1080px;margin:0 auto;padding:20px 20px 90px}
  .grid{display:grid;gap:14px;margin-bottom:14px}
  .cols-2{grid-template-columns:1fr}
  .cols-3{grid-template-columns:1fr}
  @media(min-width:780px){
    .cols-2{grid-template-columns:1fr 1fr}
    .cols-3{grid-template-columns:repeat(3,1fr)}
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .card-head h2{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .mono{font-variant-numeric:tabular-nums}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid transparent;border-radius:11px;padding:9px 15px;font-size:13.5px;
    font-weight:600;cursor:pointer;white-space:nowrap;
    transition:transform .08s ease,filter .15s ease,background .15s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn-primary{background:var(--reading);color:var(--on-accent);
    box-shadow:0 6px 16px -8px color-mix(in srgb,var(--reading) 75%,transparent)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .icon-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--text)}

  /* ---------- Nav bar ---------- */
  .nav-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--reading) 10%,transparent),
      color-mix(in srgb,var(--reading) 2%,transparent));
    border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px;
    flex-wrap:wrap;
  }
  .nav-bar .nb-main{display:flex;align-items:center;gap:14px;min-width:0}
  .nav-bar .nb-date{display:flex;flex-direction:column;min-width:0}
  .nav-bar .nb-k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .nav-bar .nb-v{font-size:17px;font-weight:680;letter-spacing:-.015em}
  .nav-bar .nb-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .nav-bar .nb-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

  /* ---------- Phase chip / banner ---------- */
  .phase-banner{
    display:flex;justify-content:flex-start;margin:-4px 0 14px;
  }
  .phase-chip{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:650;letter-spacing:.005em;
    padding:6px 12px;border-radius:999px;
    background:color-mix(in srgb,var(--reading) 12%,var(--surface));
    color:var(--reading);
    border:1px solid color-mix(in srgb,var(--reading) 28%,var(--line));
    white-space:nowrap;
  }
  .phase-chip.muted{
    background:var(--surface-2);
    color:var(--muted);
    border-color:var(--line);
  }
  .phase-chip .pc-dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 auto;
    background:var(--reading);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--reading) 22%,transparent);
  }
  .phase-chip.muted .pc-dot{
    background:var(--muted);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--muted) 18%,transparent);
  }
  .phase-chip .pc-rel{color:var(--muted);font-weight:600}

  /* ---------- Week strip ---------- */
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px}
  .ws-day{
    border:1px solid var(--line);background:var(--surface);border-radius:12px;
    padding:9px 6px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .ws-day:hover{border-color:var(--hover-line)}
  .ws-day .ws-dow{font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .ws-day .ws-num{font-size:16px;font-weight:700;margin-top:2px}
  .ws-day .ws-dot{width:6px;height:6px;border-radius:50%;background:var(--bar-bg);margin:5px auto 0}
  .ws-day.today{border-color:var(--reading);background:color-mix(in srgb,var(--reading) 8%,var(--surface))}
  .ws-day.today .ws-num{color:var(--reading)}
  .ws-day.selected{box-shadow:0 0 0 3px color-mix(in srgb,var(--reading) 20%,transparent)}
  .ws-day.past{opacity:.72}

  /* ---------- Progress ---------- */
  .prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .prog-top .pt-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .prog-top .pt-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
  .big-numbers{display:flex;align-items:baseline;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .big-numbers strong{font-size:28px;font-weight:680;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .big-numbers span{font-size:13.5px;color:var(--muted)}
  .bar{position:relative;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .bar.reading i{background:linear-gradient(90deg,var(--reading-2),var(--reading))}
  .bar.listening i{background:linear-gradient(90deg,var(--listening-2),var(--listening))}

  /* ---------- Task list ---------- */
  .task-group{margin-bottom:6px}
  .task-group-head{display:flex;align-items:center;gap:9px;margin:16px 2px 8px}
  .task-group-head:first-child{margin-top:0}
  .gdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .gdot.reading{background:var(--reading)}
  .gdot.listening{background:var(--listening)}
  .task-group-head .gt{font-size:11.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .task-group-head .gn{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);
    padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
  .task-group-head .gline{flex:1;height:1px;background:var(--line);border-radius:1px}

  .task-row{
    display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;
    border:1px solid var(--line);border-radius:13px;background:var(--surface);
    cursor:pointer;transition:border-color .15s,background .15s;
    border-left:3px solid var(--task-color,var(--line));
  }
  .task-row:hover{border-color:var(--hover-line)}
  .task-row.done{background:color-mix(in srgb,var(--good-bg) 45%,var(--surface));
    border-color:color-mix(in srgb,var(--good-fg) 22%,var(--line));
    border-left-color:var(--good-fg)}
  .task-check{
    width:20px;height:20px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--line);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;transition:all .15s ease;
  }
  .task-row.done .task-check{background:var(--good-fg);border-color:var(--good-fg);color:var(--on-accent)}

  /* ---------- Miniature cover (same tile as index.html) ---------- */
  .mini-cover{
    position:relative;flex:0 0 auto;
    width:var(--cover-size,36px);height:var(--cover-size,36px);
    border-radius:calc(var(--cover-size,36px) * .28);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;color:#fff;line-height:1;
    font-size:calc(var(--cover-size,36px) * .46);
    user-select:none;
  }
  .mini-cover .mc-emoji{display:block;line-height:1;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
  .mini-cover .mc-img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block}

  .task-main{flex:1;min-width:0}
  .task-title{font-size:14px;font-weight:620;letter-spacing:-.005em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;display:block}
  .task-row.done .task-title{color:var(--muted);text-decoration:line-through}
  .task-sub{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;display:block}
  .task-sub b{color:var(--reading);font-weight:700}

  .task-amount-edit{
    display:flex;align-items:center;gap:3px;flex:0 0 auto;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;
  }
  .amt-btn{
    width:24px;height:24px;border-radius:6px;border:0;background:transparent;
    color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
    transition:background .12s,color .12s;
  }
  .amt-btn:hover{background:var(--surface);color:var(--text)}
  .amt-input{
    width:46px;border:0;background:transparent;text-align:center;font-size:14px;
    font-weight:750;font-variant-numeric:tabular-nums;color:var(--text);outline:none;padding:0;
    -moz-appearance:textfield;font-family:inherit;
  }
  .amt-input::-webkit-outer-spin-button,
  .amt-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .amt-input:focus{color:var(--reading)}
  .amt-unit{font-size:11px;color:var(--muted);font-weight:650;padding-right:2px;white-space:nowrap}
  .amt-reset{
    width:22px;height:22px;border-radius:6px;border:0;background:transparent;
    color:var(--reading);font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .amt-reset:hover{background:var(--surface)}

  /* ---------- Stat tiles ---------- */
  .stat-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .stat-value{font-size:26px;font-weight:680;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat-value small{font-size:13px;font-weight:550;color:var(--muted);letter-spacing:0}
  .stat-sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
  .empty .em-icon{font-size:28px;opacity:.5;display:block;margin-bottom:10px}
  .empty .em-title{font-size:15px;font-weight:620;color:var(--text);margin-bottom:6px}
  .empty .em-sub{max-width:400px;margin:0 auto 14px;line-height:1.55}

  /* =========================================================
     PLAN EDITOR
     ========================================================= */
  .plan-hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 16px}
  .plan-table{display:flex;flex-direction:column}
  .plan-row{
    --mc:var(--reading);
    display:grid;
    grid-template-columns: minmax(150px,1.6fr) minmax(170px,1.15fr) minmax(200px,1.5fr) minmax(90px,.8fr);
    gap:14px;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line);
    transition:opacity .2s;
  }
  .plan-row:first-child{padding-top:0}
  .plan-row:last-child{border-bottom:0;padding-bottom:0}
  .plan-row.inactive{opacity:.55}
  .plan-head{
    font-size:10.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line);
  }

  .pr-mat{display:flex;align-items:center;gap:10px;min-width:0}
  .pr-mat-txt{min-width:0}
  .pr-title{font-size:13.5px;font-weight:620;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;display:block}
  .pr-cat{font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;font-weight:700;margin-top:1px;display:block}
  .pr-cat .pr-phase-end{
    text-transform:none;letter-spacing:0;font-weight:650;
    color:var(--reading);
  }

  .pr-target{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stepper{display:flex;align-items:center;gap:3px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;padding:3px}
  .step-btn{width:26px;height:26px;border-radius:7px;border:0;background:var(--surface);
    color:var(--text);font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
    box-shadow:0 1px 2px rgba(0,0,0,.06);transition:background .12s,color .12s}
  .step-btn:hover{background:var(--mc);color:var(--on-accent)}
  .step-input{width:56px;border:0;background:transparent;text-align:center;font-size:14.5px;
    font-weight:750;font-variant-numeric:tabular-nums;color:var(--text);outline:none;padding:0;

<script>
/* =========================================================
   Utilities
   ========================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pad2 = n => String(n).padStart(2, '0');

function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseISO(s){ const [y, m, d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function todayISO(){ return toISO(new Date()); }
function startOfWeekISO(iso){
  const d = parseISO(iso);
  const dow = (d.getDay() + 6) % 7;      // Monday = 0
  d.setDate(d.getDate() - dow);
  return toISO(d);
}
function dowOf(iso){ return (parseISO(iso).getDay() + 6) % 7; }
function shortDate(iso){ return parseISO(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function longDate(iso){
  return parseISO(iso).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(p){ return p + '_' + Math.random().toString(36).slice(2, 9); }
function fmtAmount(n){
  const v = Number(n) || 0;
  const r = Math.round(v * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
const DOW_SHORT   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW_LONG    = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DOW_INITIAL = ['M','T','W','T','F','S','S'];

const TYPES = {
  kindle:    { label: 'Kindle',        category: 'reading'   },
  book:      { label: 'Physical book', category: 'reading'   },
  article:   { label: 'Article',       category: 'reading'   },
  manga:     { label: 'Manga',         category: 'reading'   },
  other:     { label: 'Other',         category: 'reading'   },
  audiobook: { label: 'Audiobook',     category: 'listening' },
  podcast:   { label: 'Podcast',       category: 'listening' },
  anime:     { label: 'Anime',         category: 'listening' },
  youTube:   { label: 'YouTube',       category: 'listening' },
  tv:        { label: 'TV',            category: 'listening' },
  film:      { label: 'Film',          category: 'listening' }
};
const TYPE_ORDER = ['kindle','book','article','manga','other','youTube','anime','audiobook','podcast','tv','film'];

/* Priority colour palette (mirrors index.html) */
const PRIORITIES = [
  { id:'p1', hex:'#D5473F', fg:'#FFFFFF', border:false },
  { id:'p2', hex:'#E8B93A', fg:'#3B2F0A', border:false },
  { id:'p3', hex:'#3E7CC4', fg:'#FFFFFF', border:false },
  { id:'p4', hex:'#FFFFFF', fg:'#26211C', border:true  }
];
const DEFAULT_PRIORITY = 'p4';
function priorityMeta(id){ return PRIORITIES.find(p => p.id === id) || PRIORITIES[PRIORITIES.length - 1]; }
function materialTint(m){
  return m.default_category === 'listening' ? 'var(--listening)' : 'var(--reading)';
}
function materialEmoji(m){
  if (m.emoji) return m.emoji;
  const t = m.default_input_type;
  if (t === 'podcast')   return '🎙️';
  if (t === 'audiobook') return '🎧';
  if (t === 'anime')     return '🎞️';
  if (t === 'youTube')   return '▶️';
  if (t === 'tv')        return '📺';
  if (t === 'film')      return '🎬';
  if (t === 'article')   return '📰';
  if (t === 'manga')     return '📘';
  if (t === 'book')      return '📗';
  if (t === 'kindle')    return '📖';
  return '📚';
}

/* =========================================================
   Miniature cover — the same little tile the main app shows
   for a material (cover image when present, tinted emoji tile
   otherwise).
   ========================================================= */
function coverHTML(m, size){
  const url = (m && (m.cover_url || m.cover || m.image_url)) || '';
  const tint = m ? materialTint(m) : 'var(--neutral-bg)';
  return '<span class="mini-cover" aria-hidden="true" ' +
           'style="--cover-size:' + size + 'px;background:' + tint + '">' +
           '<span class="mc-emoji">' + esc(materialEmoji(m)) + '</span>' +
           (url
             ? '<img class="mc-img" src="' + esc(url) + '" alt="" loading="lazy" ' +
               'decoding="async" onerror="this.remove()">'
             : '') +
         '</span>';
}

/* =========================================================
   PHASE GATE — only materials whose phase is "In progress"
   are ever shown. This is strict and non-configurable.

   resolvePhase(m) returns { name, end } where:
     • name is a compact lowercase key ("inprogress", "scheduled", …)
     • end  is a YYYY-MM-DD string or '' when unknown

   The resolver understands several shapes the main app might use:
     • m.phase as a string                 → "In progress"
     • m.phase as an object                → { id, name, end_date }
     • m.phase_id / m.phase_name / m.stage → flat fields
     • m.phase_end / m.phase_end_date      → end date on the material
     • shared.phases[] lookup by id/slug/name
     • shared.challenge.phases[] lookup
   ========================================================= */
const IN_PROGRESS_KEYS = new Set([
  'inprogress',          // "In progress", "in-progress", "in_progress"
  'wip',                 // "WIP"
  'working',             // "Working"
  'workingon',
  'ongoing',             // "Ongoing"
  'current',             // "Current"
  'currentphase',
  'active',              // "Active"
  'started',             // "Started"
  'currentlyreading',
  'currentlylistening',
  'currentlywatching'
]);

function compactKey(s){
  return String(s ?? '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '');
}

function getPhaseList(){
  if (!shared) return [];
  if (Array.isArray(shared.phases)) return shared.phases;
  if (Array.isArray(shared.phaseList)) return shared.phaseList;
  if (Array.isArray(shared.phase_list)) return shared.phase_list;
  if (shared.challenge){
    if (Array.isArray(shared.challenge.phases)) return shared.challenge.phases;
    if (Array.isArray(shared.challenge.phaseList)) return shared.challenge.phaseList;
  }
  return [];
}

function phaseEndOf(rec){
  if (!rec || typeof rec !== 'object') return '';
  const raw = rec.end_date ?? rec.endDate ?? rec.end ?? rec.ends_on ?? rec.endsOn ??
              rec.due ?? rec.due_date ?? rec.dueDate ?? '';
  return raw ? String(raw).slice(0, 10) : '';
}

function phaseNameOf(rec){
  if (!rec) return '';
  if (typeof rec === 'string' || typeof rec === 'number') return String(rec);
  return String(rec.name ?? rec.label ?? rec.title ?? rec.slug ?? '').trim();
}

function findPhaseInList(idOrName){
  const list = getPhaseList();
  if (!list.length || idOrName == null) return null;
  const s = String(idOrName);
  const lower = s.toLowerCase();
  return list.find(p =>
    String(p.id) === s ||
    String(p.slug ?? '') === s ||
    String(p.name ?? '').toLowerCase() === lower ||
    String(p.label ?? '').toLowerCase() === lower
  ) || null;
}

/* Resolve { name, end } for a material's phase. */
function resolvePhase(m){
  if (!m) return { name: '', end: '' };

  // Material-level end date (some apps keep the phase end on the material)
  const flatEnd = m.phase_end || m.phase_end_date || m.phaseEnd || m.phaseEndDate || '';

  // 1. Rich phase object on the material
  if (m.phase && typeof m.phase === 'object'){
    const rec = m.phase;
    let name = phaseNameOf(rec);
    let end  = phaseEndOf(rec) || (flatEnd ? String(flatEnd).slice(0, 10) : '');
    if (!name && rec.id != null){
      const found = findPhaseInList(rec.id);
      if (found){
        name = phaseNameOf(found);
        end  = end || phaseEndOf(found);
      }
    }
    return { name: compactKey(name), end };
  }

  // 2. Flat fields on the material
  const rawFlat = m.phase ?? m.phase_id ?? m.phaseId ??
                  m.phase_name ?? m.phaseName ??
                  m.phase_slug ?? m.phaseSlug ??
                  m.stage ?? m.current_phase ?? m.currentPhase ?? null;

  if (rawFlat == null){
    return { name: '', end: flatEnd ? String(flatEnd).slice(0, 10) : '' };
  }

  // 2a. Try to resolve via the phase list (id / slug / name)
  const found = findPhaseInList(rawFlat);
  if (found){
    return {
      name: compactKey(phaseNameOf(found)),
      end:  phaseEndOf(found) || (flatEnd ? String(flatEnd).slice(0, 10) : '')
    };
  }

  // 2b. Plain string phase name
  return {
    name: compactKey(rawFlat),
    end: flatEnd ? String(flatEnd).slice(0, 10) : ''
  };
}

function isInProgress(m){
  const { name } = resolvePhase(m);
  if (!name) return false;                // strict: no phase → not shown
  return IN_PROGRESS_KEYS.has(name);
}

function countExcludedByPhase(){
  return (shared && shared.materials ? shared.materials : [])
    .filter(m => (m.status || 'active') !== 'archived')
    .filter(m => !isInProgress(m))
    .length;
}

/* End date of the current "In progress" phase (best effort). */
function currentPhaseEnd(){
  // 1. A material that resolves an end date + is in progress
  const mats = (shared && shared.materials ? shared.materials : [])
    .filter(m => (m.status || 'active') !== 'archived');
  let best = null;
  for (const m of mats){
    const { name, end } = resolvePhase(m);
    if (!end) continue;
    if (!IN_PROGRESS_KEYS.has(name)) continue;
    if (!best || end < best.end) best = { name, end };   // earliest end
  }
  if (best) return best;

  // 2. Fall back to the phase list
  const list = getPhaseList();
  for (const p of list){
    const n = compactKey(phaseNameOf(p));
    if (!IN_PROGRESS_KEYS.has(n)) continue;
    const end = phaseEndOf(p);
    if (end && (!best || end < best.end)) best = { name: n, end };
  }
  return best;
}

/* When creating a material from here, reuse whatever phase value the
   library already uses for "in progress" so index.html stays happy. */
function inferInProgressPhase(){
  const sample = (shared && shared.materials ? shared.materials : [])
    .find(m => m.phase && isInProgress(m));
  if (sample) return sample.phase;
  const list = getPhaseList();
  const found = list.find(p => IN_PROGRESS_KEYS.has(compactKey(phaseNameOf(p))));
  if (found) return found.id ?? found.slug ?? found.name ?? 'in_progress';
  return 'in_progress';
}

/* ---------- Phase chip / banner ---------- */
function phaseChipHTML(){
  const info = currentPhaseEnd();
  if (!info){
    return `<span class="phase-chip muted" title="No end date is set on the current phase">
      <span class="pc-dot"></span>In progress · no end date set
    </span>`;
  }
  const days = Math.round((parseISO(info.end) - parseISO(todayISO())) / 86400000);
  let rel;
  if (days < 0)       rel = `${Math.abs(days)}d overdue`;
  else if (days === 0) rel = 'ends today';
  else if (days === 1) rel = 'ends tomorrow';
  else                rel = `${days}d left`;
  return `<span class="phase-chip" title="In progress phase ends ${esc(longDate(info.end))}">
    <span class="pc-dot"></span>Phase ends ${esc(shortDate(info.end))}
    <span class="pc-rel">· ${esc(rel)}</span>
  </span>`;
}
function phaseBannerHTML(){
  const chip = phaseChipHTML();
  if (!chip) return '';
  return `<div class="phase-banner">${chip}</div>`;
}

/* =========================================================

function loadShared(){
  try {
    const raw = localStorage.getItem(SHARED_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return null;
    if (!Array.isArray(s.materials))  s.materials  = [];
    if (!Array.isArray(s.activities)) s.activities = [];
    if (!Array.isArray(s.customChallenges)) s.customChallenges = [];
    if (!s.challenge || typeof s.challenge !== 'object'){
      s.challenge = {
        id: 'challenge_1',
        name: 'English Super Challenge',
        start_date: todayISO(),
        end_date: addDays(todayISO(), 89),
        reading_target_percent: 1000,
        listening_target_minutes: 4500
      };
    }
    if (!s.studyPlan || typeof s.studyPlan !== 'object') s.studyPlan = {};
    return s;
  } catch(e){ return null; }
}
function saveShared(){
  if (!shared) return;
  try { localStorage.setItem(SHARED_KEY, JSON.stringify(shared)); } catch(e){}
}

/* =========================================================
   Material lookups
   ========================================================= */
function materialById(id){ return (shared.materials || []).find(m => m.id === id) || null; }
function plannedMaterials(){
  return (shared.materials || [])
    .filter(m => (m.status || 'active') !== 'archived')
    .filter(isInProgress)                         // ← hard gate: only In progress
    .slice()
    .sort((a, b) => {
      const ca = a.default_category === 'listening' ? 1 : 0;
      const cb = b.default_category === 'listening' ? 1 : 0;
      if (ca !== cb) return ca - cb;
      return (a.title || '').localeCompare(b.title || '');
    });
}
function materialUnit(m){ return m && m.default_category === 'listening' ? 'min' : '%'; }
function materialUnitLong(m){ return m && m.default_category === 'listening' ? 'minutes' : 'percent'; }

/* =========================================================
   Plan model
   ========================================================= */
function readPlan(mid){
  const p = shared && shared.studyPlan ? shared.studyPlan[mid] : null;
  if (!p) return { weekly: 0, days: [], overrides: {} };
  return {
    weekly: Math.max(0, Number(p.weekly) || 0),
    days: Array.isArray(p.days) ? p.days.filter(d => d >= 0 && d <= 6) : [],
    overrides: (p.overrides && typeof p.overrides === 'object') ? p.overrides : {}
  };
}
function ensurePlan(mid){
  if (!shared.studyPlan) shared.studyPlan = {};
  if (!shared.studyPlan[mid]){
    shared.studyPlan[mid] = { weekly: 0, days: [], overrides: {} };
  }
  const p = shared.studyPlan[mid];
  if (!Array.isArray(p.days)) p.days = [];
  if (!p.overrides || typeof p.overrides !== 'object') p.overrides = {};
  p.weekly = Math.max(0, Number(p.weekly) || 0);
  return p;
}
function autoAmount(mid){
  const p = readPlan(mid);
  if (p.weekly <= 0 || !p.days.length) return 0;
  return p.weekly / p.days.length;
}
function scheduledFor(mid, date){
  const p = readPlan(mid);
  if (p.overrides[date] !== undefined){
    const v = Number(p.overrides[date]);
    if (v > 0) return v;
  }
  if (p.weekly <= 0 || !p.days.length) return 0;
  if (!p.days.includes(dowOf(date))) return 0;
  return p.weekly / p.days.length;
}
function isOverridden(mid, date){
  const p = readPlan(mid);
  return p.overrides[date] !== undefined;
}
function weeklyStep(m){ return m && m.default_category === 'listening' ? 15 : 5; }
function dailyStep(m){ return m && m.default_category === 'listening' ? 5 : 1; }

function setOverride(mid, date, val){
  const p = ensurePlan(mid);
  const auto = autoAmount(mid);
  if (Math.abs(val - auto) < 0.01){
    delete p.overrides[date];
  } else {
    p.overrides[date] = Math.max(0, Math.round(val * 10) / 10);
  }
  syncRoadmapActivity(mid, date);
  saveShared();
}
function clearOverride(mid, date){
  const p = ensurePlan(mid);
  delete p.overrides[date];
  syncRoadmapActivity(mid, date);
  saveShared();
}

/* =========================================================
   Activity logging
   ========================================================= */
function totalLogged(mid, date){
  return (shared.activities || [])
    .filter(a => a.material_id === mid && a.logged_on === date)
    .reduce((s, a) => s + (Number(a.amount) || 0), 0);
}
function manualLogged(mid, date){
  return (shared.activities || [])
    .filter(a => a.material_id === mid && a.logged_on === date && a.origin !== 'roadmap')
    .reduce((s, a) => s + (Number(a.amount) || 0), 0);
}
function roadmapActivities(mid, date){
  return (shared.activities || []).filter(a =>
    a.material_id === mid && a.logged_on === date && a.origin === 'roadmap'
  );
}
function isTaskDone(mid, date){
  const sch = scheduledFor(mid, date);
  if (sch <= 0) return false;
  return totalLogged(mid, date) >= sch - 0.001;
}
function removeRoadmapActivities(mid, date){
  shared.activities = shared.activities.filter(a =>
    !(a.material_id === mid && a.logged_on === date && a.origin === 'roadmap')
  );
}
function tickTask(mid, date){
  const m = materialById(mid);
  if (!m) return;
  const sch = scheduledFor(mid, date);
  if (sch <= 0) return;
  const manual = manualLogged(mid, date);
  const need = Math.max(0, sch - manual);
  removeRoadmapActivities(mid, date);
  if (need > 0){
    const now = new Date().toISOString();
    shared.activities.push({
      id: uid('a'),
      challenge_id: shared.challenge.id,
      logged_on: date,
      category: m.default_category || 'reading',
      input_type: m.default_input_type || (m.default_category === 'listening' ? 'podcast' : 'kindle'),
      material_id: mid,
      amount: Math.round(need * 10) / 10,
      unit: materialUnitLong(m),
      note: '',
      origin: 'roadmap',
      created_at: now,
      updated_at: now
    });
  }
  saveShared();
}
function untickTask(mid, date){
  removeRoadmapActivities(mid, date);
  saveShared();
}
function syncRoadmapActivity(mid, date){
  const existing = roadmapActivities(mid, date);
  if (!existing.length) return;
  const sch = scheduledFor(mid, date);
  const manual = manualLogged(mid, date);
  const need = Math.max(0, sch - manual);
  if (need <= 0){
    removeRoadmapActivities(mid, date);
  } else {
    existing[0].amount = Math.round(need * 10) / 10;
    const keepId = existing[0].id;
    shared.activities = shared.activities.filter(a =>
      !(a.material_id === mid && a.logged_on === date && a.origin === 'roadmap' && a.id !== keepId)
    );
  }
}

/* =========================================================
   Day / week helpers
   ========================================================= */
function dayTasks(iso){
  const out = [];
  plannedMaterials().forEach(m => {
    const amt = scheduledFor(m.id, iso);
    if (amt > 0) out.push({ mid: m.id, material: m, amount: amt });
  });
  return out;
}
function dayTotals(iso){
  const tasks = dayTasks(iso);
  let readPlan = 0, listenPlan = 0, readDone = 0, listenDone = 0;
  tasks.forEach(t => {
    const m = t.material;
    const done = isTaskDone(m.id, iso);
    if (m.default_category === 'listening'){
      listenPlan += t.amount;
      if (done) listenDone += t.amount;
    } else {
      readPlan += t.amount;
      if (done) readDone += t.amount;
    }
  });
  const total = tasks.length;
  const doneCount = tasks.filter(t => isTaskDone(t.mid, iso)).length;
  return {
    tasks, total, doneCount,
    readPlan, listenPlan, readDone, listenDone,
    pct: total ? Math.round(doneCount / total * 100) : 0
  };
}
function weekDays(weekStart){
  const out = [];
  for (let i = 0; i < 7; i++) out.push(addDays(weekStart, i));
  return out;
}
function weekTotals(weekStart){
  const days = weekDays(weekStart);
  let readPlan = 0, listenPlan = 0, readDone = 0, listenDone = 0, total = 0, doneCount = 0;
  days.forEach(d => {
    const t = dayTotals(d);
    readPlan += t.readPlan; listenPlan += t.listenPlan;
    readDone += t.readDone; listenDone += t.listenDone;
    total += t.total; doneCount += t.doneCount;
  });
  return {
    days, readPlan, listenPlan, readDone, listenDone, total, doneCount,
    pct: total ? Math.round(doneCount / total * 100) : 0
  };
}
function materialWeekProgress(weekStart){
  const days = weekDays(weekStart);
  const map = {};
  plannedMaterials().forEach(m => { map[m.id] = { plan: 0, done: 0 }; });
  days.forEach(d => {
    plannedMaterials().forEach(m => {
      const amt = scheduledFor(m.id, d);
      if (amt <= 0) return;
      map[m.id].plan += amt;
      if (isTaskDone(m.id, d)) map[m.id].done += amt;
    });
  });
  return plannedMaterials()
    .map(m => ({ m, ...map[m.id] }))
    .filter(x => x.plan > 0);
}

        <div class="em-sub">
          ${nothingInProgress
            ? `${excluded} material${excluded === 1 ? '' : 's'} exist but ${excluded === 1 ? 'is' : 'are'} not in the <b>In progress</b> phase, so ${excluded === 1 ? 'it is' : 'they are'} not shown here. Move them into <b>In progress</b> in the main app to plan them.`
            : 'Add materials in the main app, or create one right here to start planning.'}
        </div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" data-action="quick-add-material">+ Add material</button>
          <a href="index.html" class="btn btn-ghost">Open main app</a>
        </div>
      </div>
    </div>`;
  }

  const rows = mats.map(planRowHTML).join('');
  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <h2>Weekly plan · In progress</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-ghost btn-sm" data-action="quick-add-material">+ Add material</button>
        <button class="btn btn-ghost btn-sm" data-action="reset-plan">Reset plan</button>
        <button class="btn btn-ghost btn-sm" data-action="toggle-plan-editor"
                title="Hide the weekly plan">Hide</button>
      </div>
    </div>
    <p class="plan-hint">
      Set a <b>weekly target</b> for each material and pick the <b>days</b> you want to study it.
      The per-day amount is calculated automatically as <b>weekly ÷ active days</b>.
      You can override any single day from the <b>Daily</b> tab.
      Only materials whose phase is <b>In progress</b> appear here.
      ${excluded ? `<br><span style="color:var(--muted)">${excluded} material${excluded === 1 ? '' : 's'} in other phases ${excluded === 1 ? 'is' : 'are'} hidden.</span>` : ''}
    </p>
    <div class="plan-table">
      <div class="plan-row plan-head">
        <span>Material</span>
        <span>Weekly target</span>
        <span>Active days</span>
        <span>Per day</span>
      </div>
      ${rows}
    </div>
  </div>`;
}

function planHiddenBarHTML(){
  const active = plannedMaterials().filter(m => readPlan(m.id).weekly > 0).length;
  const excluded = countExcludedByPhase();
  return `
  <div class="card plan-collapsed" style="margin-bottom:14px">
    <div class="card-head">
      <h2>Weekly plan</h2>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="pc-meta">
          ${active} material${active === 1 ? '' : 's'} with a target${excluded ? ` · ${excluded} in other phases` : ''}
        </span>
        <button class="btn btn-ghost btn-sm" data-action="toggle-plan-editor">Show</button>
      </div>
    </div>
  </div>`;
}

/* =========================================================
   WEEKLY VIEW — calendar
   ========================================================= */
function weekCalendarHTML(weekStart){
  const days = weekDays(weekStart);
  const today = todayISO();

  const mats = plannedMaterials().filter(m => days.some(d => scheduledFor(m.id, d) > 0));
  if (!mats.length){
    return `<div class="empty"><span class="em-icon">🌤️</span>No tasks scheduled this week.</div>`;
  }

  const headerCells = days.map((d, i) => {
    const cls = ['wc-th', d === today ? 'today' : '', d < today ? 'past' : ''].filter(Boolean).join(' ');
    return `
      <th class="${cls}" data-pick-day="${d}" role="button" tabindex="0"
          title="Open ${esc(longDate(d))}">
        <span class="wc-dow">${DOW_SHORT[i]}</span>
        <span class="wc-day-num">${parseISO(d).getDate()}</span>
      </th>`;
  }).join('');

  const bodyRows = mats.map(m => {
    let plan = 0, done = 0;
    const tint = materialTint(m);
    const unitLabel = materialUnit(m);

    const cells = days.map(d => {
      const amt = scheduledFor(m.id, d);
      const cls = ['wc-cell', d === today ? 'today' : '', d < today ? 'past' : ''].filter(Boolean).join(' ');
      if (amt <= 0) return `<td class="${cls}"></td>`;

      plan += amt;
      const taskDone = isTaskDone(m.id, d);
      if (taskDone) done += amt;
      const overridden = isOverridden(m.id, d);

      return `
      <td class="${cls}">
        <button type="button" class="wc-task ${taskDone ? 'done' : ''} ${overridden ? 'custom' : ''}"
                data-toggle-task="${esc(m.id)}" data-date="${d}"
                style="--task-color:${tint}"
                title="${esc(m.title)} · ${fmtAmount(amt)}${unitLabel}${overridden ? ' (custom)' : ''}${taskDone ? ' · done' : ''}"
                aria-pressed="${taskDone}">
          ${fmtAmount(amt)}${unitLabel}
        </button>
      </td>`;
    }).join('');

    const pct = plan > 0 ? clamp(Math.round(done / plan * 100), 0, 100) : 0;

    return `
      <tr>
        <td class="wc-row-head">
          ${coverHTML(m, 26)}
          <span class="wc-title">${esc(m.title)}</span>
        </td>
        ${cells}
        <td class="wc-cell wc-total">
          <div class="wc-total-val">${fmtAmount(plan)}${unitLabel}</div>
          <div class="wc-total-bar"><i style="width:${pct}%;background:${tint}"></i></div>
        </td>
      </tr>`;
  }).join('');

  const dayStats = days.map(d => dayTotals(d));
  const weekDone = dayStats.reduce((s, t) => s + t.doneCount, 0);
  const weekPlan = dayStats.reduce((s, t) => s + t.total, 0);
  const weekPct = weekPlan ? Math.round(weekDone / weekPlan * 100) : 0;

  const footerCells = days.map((d, i) => {
    const t = dayStats[i];
    const cls = ['wc-cell', d === today ? 'today' : '', d < today ? 'past' : ''].filter(Boolean).join(' ');
    const pct = t.total ? Math.round(t.doneCount / t.total * 100) : 0;
    const complete = t.total > 0 && t.doneCount === t.total;
    return `
      <td class="${cls}">
        <div class="wc-footer-count ${complete ? 'complete' : ''}">${t.doneCount}/${t.total}</div>
        <div class="wc-footer-bar"><i style="width:${pct}%"></i></div>
      </td>`;
  }).join('');

  return `
  <div class="week-calendar">
    <table class="wc-table">
      <thead>
        <tr>
          <th class="wc-th wc-material-col">Material</th>
          ${headerCells}
          <th class="wc-th wc-total-col">Week</th>
        </tr>
      </thead>
      <tbody>${bodyRows}</tbody>
      <tfoot>
        <tr class="wc-footer">
          <td class="wc-row-head wc-footer-head">Completed</td>
          ${footerCells}
          <td class="wc-cell wc-total">
            <div class="wc-total-val">${weekPct}%</div>
            <div class="wc-total-bar"><i style="width:${weekPct}%"></i></div>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>`;
}

function materialQueueHTML(weekStart){
  const rows = materialWeekProgress(weekStart);
  if (!rows.length){
    return `<div class="empty"><span class="em-icon">📚</span>No materials scheduled this week.</div>`;
  }
  return rows.map(({ m, plan: planned, done }) => {
    const pct = planned > 0 ? clamp(Math.round(done / planned * 100), 0, 100) : 0;
    const unit = materialUnit(m);
    const tint = materialTint(m);
    return `
    <div class="mq-item" style="--task-color:${tint}">
      ${coverHTML(m, 40)}
      <div class="mq-main">
        <div class="mq-top">
          <span class="mq-title">${esc(m.title)}</span>
          <span class="mq-pct">${pct}%</span>
        </div>
        <div class="mq-sub">${esc((TYPES[m.default_input_type] || { label: 'Other' }).label)} · ${fmtAmount(done)} / ${fmtAmount(planned)} ${unit} this week</div>
        <div class="mq-bar"><i style="width:${pct}%"></i></div>
      </div>
    </div>`;
  }).join('');
}

function viewWeekly(){
  const ws = selectedWeekStart;
  const today = todayISO();
  const thisWeekStart = startOfWeekISO(today);
  const w = weekTotals(ws);
  const we = addDays(ws, 6);

  const isThisWeek = ws === thisWeekStart;
  const weekLabel = isThisWeek ? 'This week'
    : ws > thisWeekStart ? 'Upcoming week'
    : 'Past week';

  const readPct = w.readPlan > 0 ? clamp(w.readDone / w.readPlan * 100, 0, 100) : 0;
  const listenPct = w.listenPlan > 0 ? clamp(w.listenDone / w.listenPlan * 100, 0, 100) : 0;

  return `
  <div class="nav-bar">
    <div class="nb-main">
      <button class="icon-btn" data-shift-week="-1" aria-label="Previous week">‹</button>
      <div class="nb-date">
        <span class="nb-k">${esc(weekLabel)}</span>
        <span class="nb-v">${esc(shortDate(ws))} – ${esc(shortDate(we))}</span>
        <span class="nb-sub">
          ${w.doneCount} of ${w.total} tasks complete · ${w.pct}%
        </span>
      </div>
      <button class="icon-btn" data-shift-week="1" aria-label="Next week">›</button>
    </div>
    <div class="nb-btns">
      <button class="btn btn-ghost btn-sm" data-action="toggle-plan-editor">
        ${showPlanEditor ? 'Hide weekly plan' : 'Show weekly plan'}
      </button>
      ${!isThisWeek ? '<button class="btn btn-ghost btn-sm" data-goto-this-week>This week</button>' : ''}
      <button class="btn btn-ghost btn-sm" data-goto-daily>Open daily view</button>
    </div>
  </div>

  ${phaseBannerHTML()}

  <div class="grid cols-3">
    <div class="card">
      <div class="stat-label">Weekly reading</div>
      <div class="stat-value">${fmtAmount(w.readDone)} <small>/ ${fmtAmount(w.readPlan)}%</small></div>
      <div class="stat-sub">
        ${w.readPlan > w.readDone
          ? fmtAmount(w.readPlan - w.readDone) + '% remaining'
          : (w.readPlan > 0 ? 'Target reached' : 'Nothing planned')}
      </div>
      <div class="bar reading" style="margin-top:12px"><i style="width:${readPct}%"></i></div>
    </div>
    <div class="card">
      <div class="stat-label">Weekly listening</div>
      <div class="stat-value">${fmtAmount(w.listenDone)} <small>/ ${fmtAmount(w.listenPlan)} min</small></div>
      <div class="stat-sub">
        ${w.listenPlan > w.listenDone
          ? fmtAmount(w.listenPlan - w.listenDone) + ' min remaining'
          : (w.listenPlan > 0 ? 'Target reached' : 'Nothing planned')}
      </div>
      <div class="bar listening" style="margin-top:12px"><i style="width:${listenPct}%"></i></div>
    </div>
    <div class="card">
      <div class="stat-label">Week progress</div>
      <div class="stat-value">${w.pct} <small>%</small></div>
      <div class="stat-sub">${w.doneCount} of ${w.total} scheduled tasks</div>
    </div>
  </div>

  ${showPlanEditor ? planEditorHTML() : planHiddenBarHTML()}

  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <h2>Week at a glance</h2>
      <span style="font-size:11.5px;color:var(--muted)">Tap a cell to tick it off · tap a day header to open</span>
    </div>
    ${weekCalendarHTML(ws)}
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Materials this week</h2>
      <span style="font-size:11.5px;color:var(--muted)">${materialWeekProgress(ws).length} active</span>
    </div>
    ${materialQueueHTML(ws)}
  </div>

  <p class="footnote">
    Edit the <b>weekly target</b> or the <b>active days</b> above — the per-day amount and every
    progress bar update instantly.<br>
    This planner always shows only materials whose phase is <b>In progress</b>.<br>
    The plan lives inside the same shared state as the main app, so it travels with JSON backups.
  </p>`;
}

/* =========================================================
   Render
   ========================================================= */
function render(){
  const app = $('#app');
  if (!shared){
    app.innerHTML = `
    <div class="card">
      <div class="empty">
        <span class="em-icon">🔗</span>
        <div class="em-title">No challenge data yet</div>
        <div class="em-sub">
          This planner shares its data with the main app. Open it first to set up your
          challenge and add some materials, then come back here.
        </div>
        <a href="index.html" class="btn btn-primary">Open main app</a>
      </div>
    </div>`;
    renderThemeDots();
    updateHeader();
    return;
  }
  app.innerHTML = currentView === 'daily' ? viewDaily() : viewWeekly();
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  renderThemeDots();
  updateHeader();
}
function renderPreservingFocus(){
  const active = document.activeElement;
  let key = null, selStart = null, selEnd = null;
  if (active){
    key = active.getAttribute && active.getAttribute('data-focus-key');
    if (key && typeof active.selectionStart === 'number'){
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  }
  render();
  if (key){
    const el = document.querySelector('[data-focus-key="' + key + '"]');
    if (el){
      el.focus();
      if (selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
}

/* =========================================================
   Modals
   ========================================================= */
function openModal(html){
  $('#modalRoot').innerHTML = html;
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  $('#modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}

function openAddMaterialModal(){
  openModal(`
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true" style="max-width:440px">
      <div class="modal-head">
        <h2>New material</h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <form id="addMatForm" class="modal-body" autocomplete="off">
        <div class="field">
          <label for="amTitle">Title <span style="color:var(--bad-fg)">*</span></label>
          <input type="text" id="amTitle" required maxlength="80" placeholder="e.g. Project Hail Mary">
        </div>
        <div class="field">
          <label for="amCreator">Creator</label>
          <input type="text" id="amCreator" maxlength="60" placeholder="Author, host or studio">
        </div>
        <div class="field">
          <label for="amType">Type</label>
          <select id="amType">
            ${TYPE_ORDER.map(t => `<option value="${t}" ${t === 'kindle' ? 'selected' : ''}>${esc(TYPES[t].label)} (${TYPES[t].category})</option>`).join('')}
          </select>
        </div>
        <p class="hint" style="margin:0 0 8px">
          The material is added to the shared library with the <b>In progress</b> phase —
          it will show up in the main app as well.
        </p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add material</button>
        </div>
      </form>
    </div>
  `);
  $('#addMatForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#amTitle').value.trim();
    if (!title){ $('#amTitle').focus(); return; }
    const type = $('#amType').value;
    const mat = {
      id: uid('m'),
      challenge_id: shared.challenge.id,
      title,
      creator: $('#amCreator').value.trim(),
      default_input_type: type,
      default_category: TYPES[type].category,
      status: 'active',
      phase: inferInProgressPhase(),
      cover_url: '',
      priority: DEFAULT_PRIORITY
    };
    shared.materials.push(mat);
    saveShared();
    closeModal();
    render();
  });
  setTimeout(() => $('#amTitle').focus(), 60);
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  /* ---- Theme ---- */
  const themeBtn = e.target.closest('[data-theme-pick]');
  if (themeBtn){ applyTheme(themeBtn.dataset.themePick); render(); return; }

  /* ---- Tabs ---- */
  const tab = e.target.closest('#tabs button[data-view]');
  if (tab){ currentView = tab.dataset.view; render(); return; }

  /* ---- Daily amount steppers (must run before the row toggle) ---- */
  const dayStep = e.target.closest('[data-day-step]');
  if (dayStep){
    e.stopPropagation();
    const mid = dayStep.dataset.mid;
    const date = dayStep.dataset.date;
    const delta = Number(dayStep.dataset.dayStep) || 0;
    const cur = scheduledFor(mid, date);
    const next = Math.max(0, Math.round((cur + delta) * 10) / 10);
    setOverride(mid, date, next);
    renderPreservingFocus();
    return;
  }
  const dayReset = e.target.closest('[data-day-reset]');
  if (dayReset){
    e.stopPropagation();
    clearOverride(dayReset.dataset.mid, dayReset.dataset.date);
    renderPreservingFocus();
    return;
  }

  /* ---- Weekly target steppers ---- */
  const wkStep = e.target.closest('[data-weekly-step]');
  if (wkStep){
    const mid = wkStep.dataset.mid;
    const delta = Number(wkStep.dataset.weeklyStep) || 0;
    const p = ensurePlan(mid);
    const cur = p.weekly || 0;
    const next = Math.max(0, Math.round((cur + delta) * 10) / 10);
    p.weekly = next;
    if (next > 0 && !p.days.length) p.days = [0, 1, 2, 3, 4, 5, 6];
    saveShared();
    renderPreservingFocus();
    return;
  }

  /* ---- Active day toggles ---- */
  const dayPill = e.target.closest('[data-toggle-day]');
  if (dayPill){
    const mid = dayPill.dataset.mid;
    const day = Number(dayPill.dataset.toggleDay);
    const p = ensurePlan(mid);
    const idx = p.days.indexOf(day);
    if (idx >= 0) p.days.splice(idx, 1);
    else { p.days.push(day); p.days.sort((a, b) => a - b); }
    saveShared();
    renderPreservingFocus();
    return;
  }

  /* ---- Toggle a task (only outside the amount editor) ---- */
  const taskEl = e.target.closest('[data-toggle-task]');
  if (taskEl && !e.target.closest('[data-no-toggle]')){
    const mid = taskEl.dataset.toggleTask;
    const date = taskEl.dataset.date;
    if (isTaskDone(mid, date)) untickTask(mid, date);
    else tickTask(mid, date);
    renderPreservingFocus();
    return;
  }

  /* ---- Pick a day ---- */
  const pickDay = e.target.closest('[data-pick-day]');
  if (pickDay){
    selectedDate = pickDay.dataset.pickDay;
    selectedWeekStart = startOfWeekISO(selectedDate);
    currentView = 'daily';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  /* ---- Navigation ---- */
  const shiftDay = e.target.closest('[data-shift-day]');
  if (shiftDay){
    selectedDate = addDays(selectedDate, Number(shiftDay.dataset.shiftDay));
    selectedWeekStart = startOfWeekISO(selectedDate);
    render();
    return;
  }
  const shiftWeek = e.target.closest('[data-shift-week]');
  if (shiftWeek){
    selectedWeekStart = addDays(selectedWeekStart, Number(shiftWeek.dataset.shiftWeek) * 7);
    render();
    return;
  }
  if (e.target.closest('[data-goto-today]')){
    selectedDate = todayISO();
    selectedWeekStart = startOfWeekISO(selectedDate);
    render();
    return;
  }
  if (e.target.closest('[data-goto-this-week]')){
    selectedWeekStart = startOfWeekISO(todayISO());
    render();
    return;
  }
  if (e.target.closest('[data-goto-weekly]')){
    currentView = 'weekly';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (e.target.closest('[data-goto-daily]')){
    currentView = 'daily';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  /* ---- Complete / clear a whole day ---- */
  const completeDay = e.target.closest('[data-complete-day]');
  if (completeDay){
    const iso = completeDay.dataset.completeDay;
    const tasks = dayTasks(iso);
    const allDone = tasks.length > 0 && tasks.every(t => isTaskDone(t.mid, iso));
    tasks.forEach(t => {
      if (allDone) untickTask(t.mid, iso);
      else tickTask(t.mid, iso);
    });
    saveShared();
    render();
    return;
  }

  /* ---- Modal + toolbar actions ---- */
  const actionEl = e.target.closest('[data-action]');
  if (actionEl){
    const action = actionEl.dataset.action;
    if (action === 'close-modal'){ closeModal(); return; }
    if (action === 'quick-add-material'){ openAddMaterialModal(); return; }
    if (action === 'toggle-plan-editor'){
      setPlanVisible(!showPlanEditor);
      render();
      return;
    }
    if (action === 'reset-plan'){
      if (confirm('Reset every weekly target and active day back to zero? Your ticks stay in the activity log.')){
        shared.studyPlan = {};
        saveShared();
        render();
      }
      return;
    }
  }
});

/* Number inputs commit on change (blur / Enter) so typing isn't interrupted */
document.addEventListener('change', e => {
  const t = e.target;
  if (!t || !t.matches) return;

  if (t.matches('[data-weekly-input]')){
    const mid = t.dataset.weeklyInput;
    const val = Math.max(0, Number(t.value) || 0);
    const p = ensurePlan(mid);
    p.weekly = Math.round(val * 10) / 10;
    if (p.weekly > 0 && !p.days.length) p.days = [0, 1, 2, 3, 4, 5, 6];
    saveShared();
    renderPreservingFocus();
    return;
  }
  if (t.matches('[data-day-input]')){
    const mid = t.dataset.dayInput;
    const date = t.dataset.date;
    const val = Math.max(0, Number(t.value) || 0);
    setOverride(mid, date, Math.round(val * 10) / 10);
    renderPreservingFocus();
    return;
  }
});

/* Keyboard: Enter / Space toggles tasks and day cards */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot').innerHTML){ closeModal(); return; }
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const target = e.target;
  if (!target || !target.closest) return;

  const taskEl = target.closest('[data-toggle-task]');
  if (taskEl && target === taskEl){
    e.preventDefault();
    const mid = taskEl.dataset.toggleTask;
    const date = taskEl.dataset.date;
    if (isTaskDone(mid, date)) untickTask(mid, date);
    else tickTask(mid, date);
    renderPreservingFocus();
    return;
  }
  const dayEl = target.closest('[data-pick-day]');
  if (dayEl && target === dayEl){
    e.preventDefault();
    selectedDate = dayEl.dataset.pickDay;
    selectedWeekStart = startOfWeekISO(selectedDate);
    currentView = 'daily';
    render();
  }
});

/* Live sync: react to writes from index.html in another tab */
window.addEventListener('storage', e => {
  if (e.key === SHARED_KEY){
    const next = loadShared();
    if (next){ shared = next; render(); }
  } else if (e.key === THEME_KEY){
    applyTheme(e.newValue || 'sand');
    render();
  }
});

/* =========================================================
   Boot
   ========================================================= */
applyTheme(currentTheme);
shared = loadShared();
render();
</script>
