<!DOCTYPE html>
<html lang="en" data-theme="sand">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Study Plan — Roadmap</title>
<style>
  :root, html[data-theme="sand"]{
    --bg:#FAF7F3; --surface:#FFFFFF; --surface-2:#F4EFE9; --line:#EAE2D8;
    --text:#26211C; --muted:#8A7F73; --reading:#C2703D; --reading-2:#D89A6C;
    --listening:#3F7A6E; --listening-2:#66A093; --xp:#A9855C;
    --good-bg:#E2F0E9;  --good-fg:#2F6B54;
    --warn-bg:#FBF0DC;  --warn-fg:#8A6420;
    --bad-bg:#FBE6E1;   --bad-fg:#9C4230;
    --info-bg:#EAEFF5;  --info-fg:#3E5B78;
    --neutral-bg:#F0ECE6; --neutral-fg:#8A7F73;
    --tag-bg:#F1E7DC;   --tag-fg:#8A5A2B;
    --hover-line:#D6C7B4; --focus-line:#CDBBA6; --dash-line:#C9B9A6;
    --bar-bg:#E5DCD0;
    --hdr-bg:rgba(250,247,243,.88); --backdrop:rgba(38,33,28,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(38,33,28,.04), 0 10px 26px -16px rgba(38,33,28,.28);
    --radius:16px; color-scheme:light;
  }
  html[data-theme="mint"]{
    --bg:#F3F8F4; --surface:#FFFFFF; --surface-2:#E9F1EB; --line:#DAE7DE;
    --text:#1A2620; --muted:#6E8378; --reading:#2F7A57; --reading-2:#68A98A;
    --listening:#2F6E8A; --listening-2:#6EA0B8; --xp:#7A8C4A;
    --good-bg:#DDF0E4; --good-fg:#25674A; --warn-bg:#F7EFD9; --warn-fg:#836018;
    --bad-bg:#F9E3DD; --bad-fg:#943D2B; --info-bg:#E2EEF3; --info-fg:#356278;
    --neutral-bg:#EBEFEA; --neutral-fg:#6E8378; --tag-bg:#E2EFE6; --tag-fg:#2F6B50;
    --hover-line:#C4D6CB; --focus-line:#B6CCBF; --dash-line:#B6CCBF;
    --bar-bg:#DCE8E0; --hdr-bg:rgba(243,248,244,.88); --backdrop:rgba(20,35,27,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(26,38,32,.04), 0 10px 26px -16px rgba(26,38,32,.25);
    color-scheme:light;
  }
  html[data-theme="lavender"]{
    --bg:#F8F6FC; --surface:#FFFFFF; --surface-2:#F0EBF7; --line:#E3DCF0;
    --text:#211C2B; --muted:#7C7489; --reading:#7A5EA8; --reading-2:#A98FD0;
    --listening:#3E7C8A; --listening-2:#74A7B3; --xp:#A9855C;
    --good-bg:#E4F0E8; --good-fg:#2E6B52; --warn-bg:#FBF0DC; --warn-fg:#8A6420;
    --bad-bg:#FBE6E1; --bad-fg:#9C4230; --info-bg:#E7E9F6; --info-fg:#47528F;
    --neutral-bg:#EDE9F1; --neutral-fg:#7C7489; --tag-bg:#EDE4F6; --tag-fg:#6A4E9A;
    --hover-line:#CFC4E0; --focus-line:#C0B2D6; --dash-line:#C0B2D6;
    --bar-bg:#E3DAF0; --hdr-bg:rgba(248,246,252,.88); --backdrop:rgba(28,22,40,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(33,28,43,.04), 0 10px 26px -16px rgba(33,28,43,.28);
    color-scheme:light;
  }
  html[data-theme="midnight"]{
    --bg:#11141A; --surface:#181D25; --surface-2:#212832; --line:#2C3542;
    --text:#E7ECF3; --muted:#8A95A6; --reading:#E29A62; --reading-2:#B9743F;
    --listening:#63B3A2; --listening-2:#3F7A6E; --xp:#CBA97C;
    --good-bg:#17352A; --good-fg:#7FD3AD; --warn-bg:#382C15; --warn-fg:#E8C377;
    --bad-bg:#3A1E19; --bad-fg:#EFA08A; --info-bg:#1B2A3A; --info-fg:#96BEE6;
    --neutral-bg:#262C35; --neutral-fg:#9AA4B2; --tag-bg:#38291B; --tag-fg:#E5BA85;
    --hover-line:#3B4653; --focus-line:#4A5765; --dash-line:#4A5765;
    --bar-bg:#2C3542; --hdr-bg:rgba(17,20,26,.88); --backdrop:rgba(0,0,0,.58);
    --on-accent:#14181E;
    --shadow:0 1px 2px rgba(0,0,0,.32), 0 10px 26px -16px rgba(0,0,0,.72);
    color-scheme:dark;
  }
  html[data-theme="espresso"]{
    --bg:#16120F; --surface:#1F1A15; --surface-2:#2A231C; --line:#392F26;
    --text:#F0E8DF; --muted:#9E9184; --reading:#E39A62; --reading-2:#B9743F;
    --listening:#6FB6A6; --listening-2:#3F7A6E; --xp:#CFAC7C;
    --good-bg:#1B352A; --good-fg:#84D2AE; --warn-bg:#3A2D16; --warn-fg:#EAC57B;
    --bad-bg:#3C1F19; --bad-fg:#F0A48D; --info-bg:#2A2A38; --info-fg:#A0B4D8;
    --neutral-bg:#2C2520; --neutral-fg:#A69A8C; --tag-bg:#3A2A1A; --tag-fg:#E5BA85;
    --hover-line:#463A2F; --focus-line:#54463A; --dash-line:#54463A;
    --bar-bg:#392F26; --hdr-bg:rgba(22,18,15,.88); --backdrop:rgba(0,0,0,.6);
    --on-accent:#1A1512;
    --shadow:0 1px 2px rgba(0,0,0,.38), 0 10px 26px -16px rgba(0,0,0,.78);
    color-scheme:dark;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease;
  }
  button{font-family:inherit}

  .hdr{
    position:sticky;top:0;z-index:50;background:var(--hdr-bg);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .hdr-top{
    max-width:1080px;margin:0 auto;padding:14px 20px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{
    width:36px;height:36px;flex:0 0 auto;border-radius:11px;
    background:linear-gradient(140deg,var(--reading-2),var(--reading));
    color:var(--on-accent);font-size:11px;font-weight:800;letter-spacing:.06em;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px -6px color-mix(in srgb,var(--reading) 70%,transparent);
  }
  .brand-txt h1{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
  .brand-txt p{font-size:12.5px;color:var(--muted)}
  .hdr-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .theme-dots{display:flex;gap:6px;align-items:center;padding:5px 9px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px}
  .tdot{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer;
    transition:transform .12s ease;padding:0}
  .tdot:hover{transform:scale(1.15)}
  .tdot.active{border-color:var(--text);box-shadow:0 0 0 2px var(--surface)}
  @media(max-width:640px){ .theme-dots{display:none} .hdr-actions .back-btn span{display:none} }

  .tabs{
    max-width:1080px;margin:0 auto;padding:0 20px 10px;
    display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs button, .tabs a{
    flex:0 0 auto;border:0;background:transparent;padding:7px 16px;border-radius:999px;
    font-size:13.5px;font-weight:550;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s;text-decoration:none;line-height:1.45;font-family:inherit;
  }
  .tabs button:hover, .tabs a:hover{color:var(--text)}
  .tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .tabs a .ext{font-size:11px;opacity:.7;margin-left:2px}

  main{max-width:1080px;margin:0 auto;padding:20px 20px 90px}
  .grid{display:grid;gap:14px;margin-bottom:14px}
  .cols-2{grid-template-columns:1fr}
  .cols-3{grid-template-columns:1fr}
  @media(min-width:780px){
    .cols-2{grid-template-columns:1fr 1fr}
    .cols-3{grid-template-columns:repeat(3,1fr)}
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .card-head h2{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

  .phase-banner{
    display:flex;align-items:center;gap:14px;margin-bottom:14px;
    border:1px solid var(--line);border-radius:14px;padding:12px 16px;
    background:linear-gradient(90deg,
      color-mix(in srgb,var(--info-bg) 80%,transparent),
      color-mix(in srgb,var(--info-bg) 22%,transparent));
    flex-wrap:wrap;
  }
  .phase-banner.warn{
    border-color:color-mix(in srgb,var(--warn-fg) 28%,var(--line));
    background:linear-gradient(90deg,
      color-mix(in srgb,var(--warn-bg) 85%,transparent),
      color-mix(in srgb,var(--warn-bg) 22%,transparent));
  }
  .phase-banner.ended{
    border-color:color-mix(in srgb,var(--bad-fg) 28%,var(--line));
    background:linear-gradient(90deg,
      color-mix(in srgb,var(--bad-bg) 85%,transparent),
      color-mix(in srgb,var(--bad-bg) 22%,transparent));
  }
  .phase-banner .pb-icon{
    width:38px;height:38px;flex:0 0 auto;border-radius:11px;
    background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:19px;
    box-shadow:0 2px 4px rgba(0,0,0,.05);
  }
  .phase-banner.warn .pb-icon{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn-fg) 30%,var(--line))}
  .phase-banner.ended .pb-icon{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad-fg) 30%,var(--line))}
  .phase-banner .pb-main{flex:1 1 220px;min-width:0}
  .phase-banner .pb-k{
    font-size:10.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);display:block;margin-bottom:2px;
  }
  .phase-banner .pb-v{
    font-size:16px;font-weight:680;letter-spacing:-.015em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;
  }
  .phase-banner .pb-v .pb-name{color:var(--text)}
  .phase-banner .pb-v .pb-sep{color:var(--muted);font-weight:500;margin:0 6px}
  .phase-banner .pb-v .pb-end{color:var(--info-fg);font-weight:620}
  .phase-banner .pb-v .pb-arrow{color:var(--muted);font-weight:500;margin:0 4px}
  .phase-banner.warn .pb-v .pb-end{color:var(--warn-fg)}
  .phase-banner.ended .pb-v .pb-end{color:var(--bad-fg)}
  .phase-banner .pb-sub{font-size:12px;color:var(--muted);margin-top:2px;display:block}
  .phase-banner .pb-badge{
    flex:0 0 auto;font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;
    padding:7px 13px;border-radius:999px;white-space:nowrap;
    background:var(--surface);border:1px solid var(--line);color:var(--info-fg);
  }
  .phase-banner.warn .pb-badge{
    background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn-fg) 30%,var(--line));color:var(--warn-fg);
  }
  .phase-banner.ended .pb-badge{
    background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad-fg) 30%,var(--line));color:var(--bad-fg);
  }
  .btn{
    border:1px solid transparent;border-radius:11px;padding:9px 15px;font-size:13.5px;
    font-weight:600;cursor:pointer;white-space:nowrap;
    transition:transform .08s ease,filter .15s ease,background .15s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
  .btn-primary{background:var(--reading);color:var(--on-accent);
    box-shadow:0 6px 16px -8px color-mix(in srgb,var(--reading) 75%,transparent)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .icon-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--text)}

  .nav-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--reading) 10%,transparent),
      color-mix(in srgb,var(--reading) 2%,transparent));
    border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px;
    flex-wrap:wrap;
  }
  .nav-bar .nb-main{display:flex;align-items:center;gap:14px;min-width:0}
  .nav-bar .nb-date{display:flex;flex-direction:column;min-width:0}
  .nav-bar .nb-k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .nav-bar .nb-v{font-size:17px;font-weight:680;letter-spacing:-.015em}
  .nav-bar .nb-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .nav-bar .nb-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px}
  .ws-day{
    border:1px solid var(--line);background:var(--surface);border-radius:12px;
    padding:9px 6px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .ws-day:hover{border-color:var(--hover-line)}
  .ws-day .ws-dow{font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .ws-day .ws-num{font-size:16px;font-weight:700;margin-top:2px}
  .ws-day .ws-dot{width:6px;height:6px;border-radius:50%;background:var(--bar-bg);margin:5px auto 0}
  .ws-day.today{border-color:var(--reading);background:color-mix(in srgb,var(--reading) 8%,var(--surface))}
  .ws-day.today .ws-num{color:var(--reading)}
  .ws-day.selected{box-shadow:0 0 0 3px color-mix(in srgb,var(--reading) 20%,transparent)}
  .ws-day.past{opacity:.72}

  .prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .prog-top .pt-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .prog-top .pt-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
  .big-numbers{display:flex;align-items:baseline;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .big-numbers strong{font-size:28px;font-weight:680;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .big-numbers span{font-size:13.5px;color:var(--muted)}
  .bar{position:relative;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .bar.reading i{background:linear-gradient(90deg,var(--reading-2),var(--reading))}
  .bar.listening i{background:linear-gradient(90deg,var(--listening-2),var(--listening))}

  .task-group{margin-bottom:6px}
  .task-group-head{display:flex;align-items:center;gap:9px;margin:16px 2px 8px}
  .task-group-head:first-child{margin-top:0}
  .gdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .gdot.reading{background:var(--reading)}
  .gdot.listening{background:var(--listening)}
  .task-group-head .gt{font-size:11.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .task-group-head .gn{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);
    padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
  .task-group-head .gline{flex:1;height:1px;background:var(--line);border-radius:1px}

  .task-row{
    display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;
    border:1px solid var(--line);border-radius:13px;background:var(--surface);
    cursor:pointer;transition:border-color .15s,background .15s;
    border-left:3px solid var(--task-color,var(--line));
  }
  .task-row:hover{border-color:var(--hover-line)}
  .task-row.done{background:color-mix(in srgb,var(--good-bg) 45%,var(--surface));
    border-color:color-mix(in srgb,var(--good-fg) 22%,var(--line));
    border-left-color:var(--good-fg)}
  .task-check{
    width:20px;height:20px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--line);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;transition:all .15s ease;
  }
  .task-row.done .task-check{background:var(--good-fg);border-color:var(--good-fg);color:var(--on-accent)}

  .mini-cover{
    position:relative;flex:0 0 auto;
    width:var(--cover-size,36px);height:var(--cover-size,36px);
    border-radius:calc(var(--cover-size,36px) * .28);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;color:#fff;line-height:1;
    font-size:calc(var(--cover-size,36px) * .46);
    user-select:none;
  }
  .mini-cover .mc-emoji{display:block;line-height:1;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
  .mini-cover .mc-img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block}

  .task-main{flex:1;min-width:0}
  .task-title{font-size:14px;font-weight:620;letter-spacing:-.005em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;display:block}
  .task-row.done .task-title{color:var(--muted);text-decoration:line-through}
  .task-sub{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;display:block}
  .task-sub b{color:var(--reading);font-weight:700}

  .task-amount-edit{
    display:flex;align-items:center;gap:3px;flex:0 0 auto;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;
  }
  .amt-btn{
    width:24px;height:24px;border-radius:6px;border:0;background:transparent;
    color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
    transition:background .12s,color .12s;
  }
  .amt-btn:hover{background:var(--surface);color:var(--text)}
  .amt-input{
    width:46px;border:0;background:transparent;text-align:center;font-size:14px;
    font-weight:750;font-variant-numeric:tabular-nums;color:var(--text);outline:none;padding:0;
    -moz-appearance:textfield;font-family:inherit;
  }
  .amt-input::-webkit-outer-spin-button,
  .amt-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .amt-input:focus{color:var(--reading)}
  .amt-unit{font-size:11px;color:var(--muted);font-weight:650;padding-right:2px;white-space:nowrap}
  .amt-reset{
    width:22px;height:22px;border-radius:6px;border:0;background:transparent;
    color:var(--reading);font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .amt-reset:hover{background:var(--surface)}

  .stat-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .stat-value{font-size:26px;font-weight:680;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat-value small{font-size:13px;font-weight:550;color:var(--muted);letter-spacing:0}
  .stat-sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
  .empty .em-icon{font-size:28px;opacity:.5;display:block;margin-bottom:10px}
  .empty .em-title{font-size:15px;font-weight:620;color:var(--text);margin-bottom:6px}
  .empty .em-sub{max-width:400px;margin:0 auto 14px;line-height:1.55}

  .plan-hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 16px}
  .plan-table{display:flex;flex-direction:column}
  .plan-row{
    --mc:var(--reading);
    display:grid;
    grid-template-columns: minmax(150px,1.6fr) minmax(170px,1.15fr) minmax(200px,1.5fr) minmax(90px,.8fr);
    gap:14px;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line);
    transition:opacity .2s;
  }

<script>
/* =========================================================
   Utilities
   ========================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pad2 = n => String(n).padStart(2, '0');

function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseISO(s){ const [y, m, d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function todayISO(){ return toISO(new Date()); }
function startOfWeekISO(iso){
  const d = parseISO(iso);
  const dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return toISO(d);
}
function dowOf(iso){ return (parseISO(iso).getDay() + 6) % 7; }
function shortDate(iso){ return parseISO(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function longDate(iso){
  return parseISO(iso).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function mediumDate(iso){
  return parseISO(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function daysBetween(a, b){
  if (!a || !b) return null;
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}
function normISO(v){
  if (!v) return '';
  if (typeof v === 'number'){
    const s = String(v);
    if (s.length === 8) return s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8);
    return '';
  }
  if (typeof v === 'object'){
    if (typeof v.getFullYear === 'function') return toISO(v);
    return '';
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0];
  const d = new Date(s);
  if (!isNaN(d.getTime())) return toISO(d);
  return '';
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(p){ return p + '_' + Math.random().toString(36).slice(2, 9); }
function fmtAmount(n){
  const v = Number(n) || 0;
  const r = Math.round(v * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
const DOW_SHORT   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW_LONG    = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DOW_INITIAL = ['M','T','W','T','F','S','S'];

const TYPES = {
  kindle:    { label: 'Kindle',        category: 'reading'   },
  book:      { label: 'Physical book', category: 'reading'   },
  article:   { label: 'Article',       category: 'reading'   },
  manga:     { label: 'Manga',         category: 'reading'   },
  other:     { label: 'Other',         category: 'reading'   },
  audiobook: { label: 'Audiobook',     category: 'listening' },
  podcast:   { label: 'Podcast',       category: 'listening' },
  anime:     { label: 'Anime',         category: 'listening' },
  youTube:   { label: 'YouTube',       category: 'listening' },
  tv:        { label: 'TV',            category: 'listening' },
  film:      { label: 'Film',          category: 'listening' }
};
const TYPE_ORDER = ['kindle','book','article','manga','other','youTube','anime','audiobook','podcast','tv','film'];

const PRIORITIES = [
  { id:'p1', hex:'#D5473F', fg:'#FFFFFF', border:false },
  { id:'p2', hex:'#E8B93A', fg:'#3B2F0A', border:false },
  { id:'p3', hex:'#3E7CC4', fg:'#FFFFFF', border:false },
  { id:'p4', hex:'#FFFFFF', fg:'#26211C', border:true  }
];
const DEFAULT_PRIORITY = 'p4';
function priorityMeta(id){ return PRIORITIES.find(p => p.id === id) || PRIORITIES[PRIORITIES.length - 1]; }
function materialTint(m){
  return m.default_category === 'listening' ? 'var(--listening)' : 'var(--reading)';
}
function materialEmoji(m){
  if (m.emoji) return m.emoji;
  const t = m.default_input_type;
  if (t === 'podcast')   return '🎙️';
  if (t === 'audiobook') return '🎧';
  if (t === 'anime')     return '🎞️';
  if (t === 'youTube')   return '▶️';
  if (t === 'tv')        return '📺';
  if (t === 'film')      return '🎬';
  if (t === 'article')   return '📰';
  if (t === 'manga')     return '📘';
  if (t === 'book')      return '📗';
  if (t === 'kindle')    return '📖';
  return '📚';
}
function coverHTML(m, size){
  const url = (m && (m.cover_url || m.cover || m.image_url)) || '';
  const tint = m ? materialTint(m) : 'var(--neutral-bg)';
  return '<span class="mini-cover" aria-hidden="true" ' +
           'style="--cover-size:' + size + 'px;background:' + tint + '">' +
           '<span class="mc-emoji">' + esc(materialEmoji(m)) + '</span>' +
           (url
             ? '<img class="mc-img" src="' + esc(url) + '" alt="" loading="lazy" ' +
               'decoding="async" onerror="this.remove()">'
             : '') +
         '</span>';
}

/* =========================================================
   Phases
   ========================================================= */
function computedPhases(){
  if (!shared) return [];
  const ch = shared.challenge || {};
  const start = normISO(ch.start_date) || todayISO();
  const end   = normISO(ch.end_date)   || addDays(start, 89);
  const totalDays = Math.max(1, (daysBetween(start, end) || 0) + 1);

  const fallback = [
    { id: 'ph1', name: 'Foundation',   focus: '', materials: [] },
    { id: 'ph2', name: 'Momentum',     focus: '', materials: [] },
    { id: 'ph3', name: 'Acceleration', focus: '', materials: [] },
    { id: 'ph4', name: 'Final Sprint', focus: '', materials: [] }
  ];
  const raw = (shared.roadmap && Array.isArray(shared.roadmap.phases) && shared.roadmap.phases.length === 4)
    ? shared.roadmap.phases
    : fallback;

  return raw.map((p, i) => {
    const startIdx = Math.floor(i * totalDays / 4);
    const endIdx   = Math.max(startIdx, Math.floor((i + 1) * totalDays / 4) - 1);
    return {
      index: i,
      id: p.id || fallback[i].id,
      name: p.name || fallback[i].name,
      focus: p.focus || '',
      materials: Array.isArray(p.materials) ? p.materials.slice() : [],
      startDate: addDays(start, startIdx),
      endDate: addDays(start, endIdx)
    };
  });
}

function currentPhaseInfo(){
  const phases = computedPhases();
  if (!phases.length) return null;
  const today = todayISO();

  let chosen = phases.find(p => today >= p.startDate && today <= p.endDate);
  if (!chosen){
    chosen = today < phases[0].startDate
      ? phases[0]
      : phases[phases.length - 1];
  }

  const daysLeft = daysBetween(today, chosen.endDate);
  return {
    index: chosen.index,
    name: chosen.name,
    startISO: chosen.startDate,
    endISO: chosen.endDate,
    daysLeft
  };
}

function anyPhaseHasAssignments(){
  return computedPhases().some(p => p.materials.length > 0);
}
function currentPhaseMaterialIds(){
  const info = currentPhaseInfo();
  if (!info) return new Set();
  const phase = computedPhases()[info.index];
  return new Set(phase ? phase.materials : []);
}
function isInCurrentPhase(m){
  if (!m) return false;
  if (!anyPhaseHasAssignments()) return true;
  return currentPhaseMaterialIds().has(m.id);
}
function countExcludedByPhase(){
  if (!anyPhaseHasAssignments()) return 0;
  const ids = currentPhaseMaterialIds();
  return (shared && shared.materials ? shared.materials : [])
    .filter(m => (m.status || 'active') !== 'archived')
    .filter(m => !ids.has(m.id))
    .length;
}

function phaseBannerHTML(){
  const info = currentPhaseInfo();
  if (!info) return '';

  const hasEnd   = !!info.endISO;
  const hasStart = !!info.startISO;
  const hasRange = hasStart && hasEnd;

  let state = '', icon = '⏳', badge = '', sub = '', endLabel = '';

  if (hasEnd){
    endLabel = shortDate(info.endISO);
    const d = info.daysLeft;
    if (d < 0){
      state = 'ended'; icon = '⚠️';
      badge = `${Math.abs(d)} day${Math.abs(d) === 1 ? '' : 's'} ago`;
      sub = `The ${esc(info.name)} phase ended on ${esc(mediumDate(info.endISO))}.`;
    } else if (d === 0){
      state = 'warn'; icon = '🔥'; badge = 'Ends today';
      sub = `Final day of the ${esc(info.name)} phase.`;
    } else if (d === 1){
      state = 'warn'; icon = '🔥'; badge = '1 day left';
      sub = `Wrap up the ${esc(info.name)} phase by tomorrow.`;
    } else if (d <= 3){
      state = 'warn'; icon = '🔥'; badge = `${d} days left`;
      sub = `Only ${d} days left in the ${esc(info.name)} phase.`;
    } else {
      badge = `${d} days left`;
      sub = `${d} days remaining in the ${esc(info.name)} phase.`;
    }
  } else {
    sub = 'No end date set for this phase.';
    badge = 'No deadline';
  }

  let mainLine = `<span class="pb-name">${esc(info.name)}</span>`;
  if (hasRange){
    mainLine += `<span class="pb-sep">·</span>` +
                `<span class="pb-end">${esc(shortDate(info.startISO))}</span>` +
                `<span class="pb-arrow">→</span>` +
                `<span class="pb-end">${esc(shortDate(info.endISO))}</span>`;
  } else if (hasEnd){
    mainLine += `<span class="pb-sep">·</span>` +
                `<span class="pb-end">ends ${esc(endLabel)}</span>`;
  } else if (hasStart){
    mainLine += `<span class="pb-sep">·</span>` +
                `<span class="pb-end">since ${esc(shortDate(info.startISO))}</span>`;
  }

  return `
  <div class="phase-banner ${state}">
    <span class="pb-icon" aria-hidden="true">${icon}</span>
    <div class="pb-main">
      <span class="pb-k">Current phase</span>
      <span class="pb-v">${mainLine}</span>
      <span class="pb-sub">${sub}</span>
    </div>
    <span class="pb-badge">${esc(badge)}</span>
  </div>`;
}

/* =========================================================
   Theme
   ========================================================= */
const THEME_KEY = 'esc-theme';
const THEMES = [
  { id:'sand',     name:'Sand',     color:'#C2703D' },
  { id:'mint',     name:'Mint',     color:'#2F7A57' },
  { id:'lavender', name:'Lavender', color:'#7A5EA8' },
  { id:'midnight', name:'Midnight', color:'#E29A62' },
  { id:'espresso', name:'Espresso', color:'#E39A62' }
];
let currentTheme = 'sand';
try { currentTheme = localStorage.getItem(THEME_KEY) || 'sand'; } catch(e){}
if (!THEMES.some(t => t.id === currentTheme)) currentTheme = 'sand';
function applyTheme(id){
  if (!THEMES.some(t => t.id === id)) id = 'sand';
  currentTheme = id;
  document.documentElement.setAttribute('data-theme', id);
  try { localStorage.setItem(THEME_KEY, id); } catch(e){}
}

/* =========================================================
   Shared state
   ========================================================= */
const SHARED_KEY = 'english-super-challenge-v2-clean';
let shared = null;

function defaultRoadmapPhases(){
  return [
    { id: 'ph1', name: 'Foundation',   focus: 'Build the daily habit and explore formats.',      materials: [] },
    { id: 'ph2', name: 'Momentum',     focus: 'Increase reading volume; add a second material.', materials: [] },
    { id: 'ph3', name: 'Acceleration', focus: 'Push pace and grow listening time.',               materials: [] },
    { id: 'ph4', name: 'Final Sprint', focus: 'Finish strong and hit your targets.',               materials: [] }
  ];
}

function loadShared(){
  try {
    const raw = localStorage.getItem(SHARED_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return null;
    if (!Array.isArray(s.materials))  s.materials  = [];
    if (!Array.isArray(s.activities)) s.activities = [];
    if (!Array.isArray(s.customChallenges)) s.customChallenges = [];
    if (!s.challenge || typeof s.challenge !== 'object'){
      s.challenge = {
        id: 'challenge_1',
        name: 'English Super Challenge',
        start_date: todayISO(),
        end_date: addDays(todayISO(), 89),
        reading_target_percent: 1000,
        listening_target_minutes: 4500
      };
    }
    if (!s.studyPlan || typeof s.studyPlan !== 'object') s.studyPlan = {};
    if (!s.roadmap || typeof s.roadmap !== 'object') s.roadmap = {};
    if (!Array.isArray(s.roadmap.phases) || s.roadmap.phases.length !== 4){
      s.roadmap.phases = defaultRoadmapPhases();
    } else {
      s.roadmap.phases = s.roadmap.phases.map((p, i) => ({
        id: p.id || defaultRoadmapPhases()[i].id,
        name: p.name || defaultRoadmapPhases()[i].name,
        focus: p.focus || '',
        materials: Array.isArray(p.materials) ? p.materials.filter(id => typeof id === 'string') : []
      }));
    }
    return s;
  } catch(e){ return null; }
}
function saveShared(){
  if (!shared) return;
  try { localStorage.setItem(SHARED_KEY, JSON.stringify(shared)); } catch(e){}
}

/* =========================================================
   Materials
   ========================================================= */
function materialById(id){ return (shared.materials || []).find(m => m.id === id) || null; }
function plannedMaterials(){
  return (shared.materials || [])
    .filter(m => (m.status || 'active') !== 'archived')
    .filter(isInCurrentPhase)
    .slice()
    .sort((a, b) => {
      const ca = a.default_category === 'listening' ? 1 : 0;
      const cb = b.default_category === 'listening' ? 1 : 0;
      if (ca !== cb) return ca - cb;
      return (a.title || '').localeCompare(b.title || '');
    });
}
function materialUnit(m){ return m && m.default_category === 'listening' ? 'min' : '%'; }
function materialUnitLong(m){ return m && m.default_category === 'listening' ? 'minutes' : 'percent'; }

/* =========================================================
   Plan model
   ========================================================= */
function readPlan(mid){
  const p = shared && shared.studyPlan ? shared.studyPlan[mid] : null;
  if (!p) return { weekly: 0, days: [], overrides: {} };
  return {
    weekly: Math.max(0, Number(p.weekly) || 0),
    days: Array.isArray(p.days) ? p.days.filter(d => d >= 0 && d <= 6) : [],
    overrides: (p.overrides && typeof p.overrides === 'object') ? p.overrides : {}
  };
}
function ensurePlan(mid){
  if (!shared.studyPlan) shared.studyPlan = {};
  if (!shared.studyPlan[mid]){
    shared.studyPlan[mid] = { weekly: 0, days: [], overrides: {} };
  }
  const p = shared.studyPlan[mid];
  if (!Array.isArray(p.days)) p.days = [];
  if (!p.overrides || typeof p.overrides !== 'object') p.overrides = {};
  p.weekly = Math.max(0, Number(p.weekly) || 0);
  return p;
}
function autoAmount(mid){
  const p = readPlan(mid);
  if (p.weekly <= 0 || !p.days.length) return 0;
  return p.weekly / p.days.length;
}
function scheduledFor(mid, date){
  const p = readPlan(mid);
  if (p.overrides[date] !== undefined){
    const v = Number(p.overrides[date]);
    if (v > 0) return v;
  }
  if (p.weekly <= 0 || !p.days.length) return 0;
  if (!p.days.includes(dowOf(date))) return 0;
  return p.weekly / p.days.length;
}
function isOverridden(mid, date){
  const p = readPlan(mid);
  return p.overrides[date] !== undefined;
}
function weeklyStep(m){ return m && m.default_category === 'listening' ? 15 : 5; }
function dailyStep(m){ return m && m.default_category === 'listening' ? 5 : 1; }

function setOverride(mid, date, val){
  const p = ensurePlan(mid);
  const auto = autoAmount(mid);
  if (Math.abs(val - auto) < 0.01){
    delete p.overrides[date];
  } else {
    p.overrides[date] = Math.max(0, Math.round(val * 10) / 10);
  }
  syncRoadmapActivity(mid, date);
  saveShared();
}
function clearOverride(mid, date){
  const p = ensurePlan(mid);
  delete p.overrides[date];
  syncRoadmapActivity(mid, date);
  saveShared();
}

/* =========================================================
   Activity logging
   ---------------------------------------------------------
   totalLogged() sums the material's activity entries for a
   given day. Only entries whose unit matches the material's
   plan unit are counted, so a minutes-based focus entry does
   not pollute a percent-based reading target.
   ========================================================= */
function totalLogged(mid, date){
  const m = materialById(mid);
  const isListening = m && m.default_category === 'listening';
  return (shared.activities || [])
    .filter(a => a.material_id === mid && a.logged_on === date)
    .filter(a => {
      // Focus-session entries are recorded in minutes.
      // They only count toward the planned target for listening
      // materials (whose plan is also in minutes). Reading targets
      // are measured in percent, so a minute-based focus entry must
      // not inflate them.
      if (a.origin === 'focus' && a.unit === 'minutes' && !isListening) return false;
      return true;
    })
    .reduce((s, a) => s + (Number(a.amount) || 0), 0);
}
function manualLogged(mid, date){
  return (shared.activities || [])
    .filter(a => a.material_id === mid && a.logged_on === date && a.origin !== 'roadmap')
    .reduce((s, a) => s + (Number(a.amount) || 0), 0);
}
function roadmapActivities(mid, date){
  return (shared.activities || []).filter(a =>
    a.material_id === mid && a.logged_on === date && a.origin === 'roadmap'
  );
}
function isTaskDone(mid, date){
  const sch = scheduledFor(mid, date);
  if (sch <= 0) return false;
  return totalLogged(mid, date) >= sch - 0.001;
}
function removeRoadmapActivities(mid, date){
  shared.activities = shared.activities.filter(a =>
    !(a.material_id === mid && a.logged_on === date && a.origin === 'roadmap')
  );
}
function tickTask(mid, date){
  const m = materialById(mid);
  if (!m) return;
  const sch = scheduledFor(mid, date);
  if (sch <= 0) return;
  const manual = manualLogged(mid, date);
  const need = Math.max(0, sch - manual);
  removeRoadmapActivities(mid, date);
  if (need > 0){
    const now = new Date().toISOString();
    shared.activities.push({
      id: uid('a'),
      challenge_id: shared.challenge.id,
      logged_on: date,
      category: m.default_category || 'reading',
      input_type: m.default_input_type || (m.default_category === 'listening' ? 'podcast' : 'kindle'),
      material_id: mid,
      amount: Math.round(need * 10) / 10,
      unit: materialUnitLong(m),
      note: '',
      origin: 'roadmap',
      created_at: now,
      updated_at: now
    });
  }
  saveShared();
}
function untickTask(mid, date){
  removeRoadmapActivities(mid, date);
  saveShared();
}
function syncRoadmapActivity(mid, date){
  const existing = roadmapActivities(mid, date);
  if (!existing.length) return;
  const sch = scheduledFor(mid, date);
  const manual = manualLogged(mid, date);
  const need = Math.max(0, sch - manual);
  if (need <= 0){
    removeRoadmapActivities(mid, date);
  } else {
    existing[0].amount = Math.round(need * 10) / 10;
    const keepId = existing[0].id;
    shared.activities = shared.activities.filter(a =>
      !(a.material_id === mid && a.logged_on === date && a.origin === 'roadmap' && a.id !== keepId)
    );
  }
}

/* =========================================================
   Focus → shared activity bridge
   ---------------------------------------------------------
   IMPORTANT: this logs the ACTUAL focus session minutes.
   It never uses the scheduled amount, so the planned target
   is preserved and the recorded activity reflects what was
   really studied.
   ========================================================= */
function recordFocusInShared(m, minutes, date){
  if (!shared || !m) return;
  const mins = Math.round((Number(minutes) || 0) * 10) / 10;
  if (mins <= 0) return;
  date = date || todayISO();
  const now = new Date().toISOString();
  shared.activities.push({
    id: uid('a'),
    challenge_id: shared.challenge.id,
    logged_on: date,
    category: m.default_category || 'reading',
    input_type: m.default_input_type || 'other',
    material_id: m.id,
    amount: mins,
    unit: 'minutes',
    note: 'Focus session',
    origin: 'focus',
    created_at: now,
    updated_at: now
  });
  saveShared();
}

/* =========================================================
   Day / week helpers
   ========================================================= */
function dayTasks(iso){
  const out = [];
  plannedMaterials().forEach(m => {
    const amt = scheduledFor(m.id, iso);
    if (amt > 0) out.push({ mid: m.id, material: m, amount: amt });
  });
  return out;
}
function dayTotals(iso){
  const tasks = dayTasks(iso);
  let readPlan = 0, listenPlan = 0, readDone = 0, listenDone = 0;
  tasks.forEach(t => {
    const m = t.material;
    const done = isTaskDone(m.id, iso);
    if (m.default_category === 'listening'){
      listenPlan += t.amount;
      if (done) listenDone += t.amount;
    } else {
      readPlan += t.amount;
      if (done) readDone += t.amount;
    }
  });
  const total = tasks.length;
  const doneCount = tasks.filter(t => isTaskDone(t.mid, iso)).length;
  return {
    tasks, total, doneCount,
    readPlan, listenPlan, readDone, listenDone,
    pct: total ? Math.round(doneCount / total * 100) : 0
  };
}
function weekDays(weekStart){
  const out = [];
  for (let i = 0; i < 7; i++) out.push(addDays(weekStart, i));
  return out;
}
function weekTotals(weekStart){
  const days = weekDays(weekStart);
  let readPlan = 0, listenPlan = 0, readDone = 0, listenDone = 0, total = 0, doneCount = 0;
  days.forEach(d => {
    const t = dayTotals(d);
    readPlan += t.readPlan; listenPlan += t.listenPlan;
    readDone += t.readDone; listenDone += t.listenDone;
    total += t.total; doneCount += t.doneCount;
  });
  return {
    days, readPlan, listenPlan, readDone, listenDone, total, doneCount,
    pct: total ? Math.round(doneCount / total * 100) : 0
  };
}
function materialWeekProgress(weekStart){
  const days = weekDays(weekStart);
  const map = {};
  plannedMaterials().forEach(m => { map[m.id] = { plan: 0, done: 0 }; });
  days.forEach(d => {
    plannedMaterials().forEach(m => {
      const amt = scheduledFor(m.id, d);
      if (amt <= 0) return;
      map[m.id].plan += amt;
      if (isTaskDone(m.id, d)) map[m.id].done += amt;
    });
  });
  return plannedMaterials()
    .map(m => ({ m, ...map[m.id] }))
    .filter(x => x.plan > 0);
}

/* =========================================================
   Focus sessions (Pomodoro)
   ========================================================= */
const FOCUS_KEY = 'esc-focus-plan';
const RING_C = 2 * Math.PI * 54;
const BASE_TITLE = document.title;
const MAX_SESSIONS_PER_MATERIAL = 24;

const NUM_FIELDS = {
  minutes:      { min: 5, max: 180, step: 5 },
  breakMinutes: { min: 0, max: 60,  step: 5 }
};

let focusState = { groups: [], timer: null, log: [], pendingLog: null };
let builder = { items: [], minutes: 50, breakMinutes: 10, editId: null };
let focusTick = null;
let audioCtx = null;

/* --- audio --- */
function ensureAudio(){
  if (audioCtx) return audioCtx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  } catch(e){ audioCtx = null; }
  return audioCtx;
}
document.addEventListener('pointerdown', () => {
  const ctx = ensureAudio();
  if (ctx && ctx.state === 'suspended'){ try { ctx.resume(); } catch(e){} }
});
function chime(long){
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime + 0.02;
    const notes = long ? [523.25, 659.25, 783.99, 1046.50] : [880, 1174.66];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      const at = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.18, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.42);
      o.connect(g); g.connect(ctx.destination);
      o.start(at); o.stop(at + 0.46);
    });
  } catch(e){}
}

/* --- group data model --- */
function normaliseItems(raw){
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(it => it && typeof it.mid === 'string')
    .map(it => ({
      mid: it.mid,
      count: clamp(Math.round(Number(it.count) || 1), 1, MAX_SESSIONS_PER_MATERIAL)
    }));
}
function groupItems(g){
  const items = normaliseItems(g && g.items);
  if (items.length) return items;
  return normaliseItems((g && g.mids || []).map(mid => ({ mid, count: 1 })));
}
function groupSessions(g){
  return groupItems(g).reduce((s, it) => s + it.count, 0);
}
function groupQueue(g){
  const q = [];
  groupItems(g).forEach(it => {
    for (let i = 0; i < it.count; i++) q.push(it.mid);
  });
  return q;
}

/* --- persistence --- */
function loadFocusState(){
  let s = null;
  try {
    const raw = localStorage.getItem(FOCUS_KEY);
    if (raw) s = JSON.parse(raw);
  } catch(e){ s = null; }
  if (!s || typeof s !== 'object') s = {};
  if (!Array.isArray(s.groups)) s.groups = [];
  if (!Array.isArray(s.log)) s.log = [];
  if (!s.timer || typeof s.timer !== 'object') s.timer = null;

  s.groups = s.groups
    .filter(g => g && typeof g === 'object')
    .map(g => {
      let items = normaliseItems(g.items);
      if (!items.length){
        const mids = Array.isArray(g.mids) ? g.mids.filter(x => typeof x === 'string') : [];
        const wanted = clamp(Math.round(Number(g.sessions) || mids.length || 1),
                             1, MAX_SESSIONS_PER_MATERIAL);
        items = mids.map(mid => ({ mid, count: 1 }));
        let extra = wanted - items.length;
        let i = 0;
        while (extra > 0 && items.length){
          items[i % items.length].count =
            Math.min(MAX_SESSIONS_PER_MATERIAL, items[i % items.length].count + 1);
          extra--; i++;
        }
      }
      const sessions = Math.max(1, items.reduce((sum, it) => sum + it.count, 0));
      return {
        id: g.id || uid('fg'),
        items,
        mids: items.map(it => it.mid),
        sessions,
        minutes: clamp(Math.round(Number(g.minutes) || 25), 1, 240),
        breakMinutes: clamp(Math.round(Number(g.breakMinutes) || 0), 0, 120),
        done: Math.max(0, Math.round(Number(g.done) || 0)),
        doneDate: normISO(g.doneDate) || todayISO(),
        created_at: g.created_at || new Date().toISOString()
      };
    })
    .filter(g => g.items.length);

  const today = todayISO();
  s.groups.forEach(g => {
    if (g.doneDate !== today){ g.done = 0; g.doneDate = today; }
    if (g.done > g.sessions) g.done = g.sessions;
  });

  if (s.timer){
    const g = s.groups.find(x => x.id === s.timer.groupId);
    if (!g){
      s.timer = null;
    } else {
      s.timer.phase = s.timer.phase === 'break' ? 'break' : 'work';
      s.timer.running = !!s.timer.running;
      s.timer.total = Math.max(1, Number(s.timer.total) || 1);
      s.timer.remaining = Math.max(0, Number(s.timer.remaining) || 0);
      s.timer.endsAt = s.timer.running
        ? (Number(s.timer.endsAt) || (Date.now() + s.timer.remaining))
        : null;
      if (s.timer.running && Date.now() >= s.timer.endsAt) s.timer.remaining = 0;
    }
  }

  if (s.pendingLog && typeof s.pendingLog === 'object'){
    const p = s.pendingLog;
    const g = s.groups.find(x => x.id === p.groupId);
    if (g && typeof p.mid === 'string' && materialById(p.mid)){
      s.pendingLog = {
        groupId: p.groupId,
        mid: p.mid,
        minutes: Math.max(0, Number(p.minutes) || 0),
        date: normISO(p.date) || todayISO()
      };
    } else {
      s.pendingLog = null;
    }
  } else {
    s.pendingLog = null;
  }

  return s;
}
function saveFocusState(){
  try { localStorage.setItem(FOCUS_KEY, JSON.stringify(focusState)); } catch(e){}
}

/* --- lookups --- */
function focusGroup(id){ return focusState.groups.find(g => g.id === id) || null; }
function activeGroup(){ return focusState.timer ? focusGroup(focusState.timer.groupId) : null; }
function sessionMaterial(g, index){
  if (!g) return null;
  const q = groupQueue(g);
  if (!q.length) return null;
  const i = ((index % q.length) + q.length) % q.length;
  return materialById(q[i]);
}
function focusLogOn(date){ return focusState.log.filter(l => l.date === date); }
function focusMinutesOn(date){
  return focusLogOn(date).reduce((s, l) => s + (Number(l.minutes) || 0), 0);
}

/* --- formatting --- */
function fmtClock(ms){
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`;
}
function fmtMinutes(mins){
  const m = Math.round(mins || 0);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

/* --- timer core --- */
function timerRemaining(){
  const t = focusState.timer;
  if (!t) return 0;
  if (t.running && t.endsAt) return Math.max(0, t.endsAt - Date.now());
  return Math.max(0, t.remaining || 0);
}
function startFocusTick(){
  if (focusTick) return;
  focusTick = setInterval(() => {
    const t = focusState.timer;
    if (!t || !t.running){ stopFocusTick(); return; }
    if (timerRemaining() <= 0){ finishPhase(); return; }
    paintTimer();
  }, 250);
}
function stopFocusTick(){
  if (focusTick){ clearInterval(focusTick); focusTick = null; }
}
function updateDocTitle(suffix){
  document.title = suffix ? `${suffix} · ${BASE_TITLE}` : BASE_TITLE;
}
function paintTimer(){
  const t = focusState.timer;
  if (!t){ updateDocTitle(''); return; }
  const rem = timerRemaining();
  const digits = document.querySelector('[data-timer-digits]');
  if (digits){
    digits.textContent = fmtClock(rem);
    const ring = document.querySelector('[data-timer-ring]');
    if (ring){
      const frac = t.total > 0 ? clamp(rem / t.total, 0, 1) : 0;
      ring.setAttribute('stroke-dashoffset', (RING_C * (1 - frac)).toFixed(2));
    }
  }
  const seg = document.querySelector('[data-live-seg]');
  if (seg && t.phase === 'work' && t.total > 0){
    const filled = clamp(1 - rem / t.total, 0, 1);
    seg.style.width = (filled * 100).toFixed(1) + '%';
  }
  updateDocTitle(fmtClock(rem) + (t.phase === 'break' ? ' · break' : ' · focus'));
}

function startFocusTimer(gid){
  if (focusState.pendingLog){ openFocusLogModal(); return; }
  const g = focusGroup(gid);
  if (!g) return;
  const t = focusState.timer;

  if (t && t.groupId === gid && !t.running && t.remaining > 0){
    t.running = true;
    t.endsAt = Date.now() + t.remaining;
  } else {
    if (g.done >= g.sessions){ g.done = 0; g.doneDate = todayISO(); }
    const ms = g.minutes * 60000;
    focusState.timer = {
      groupId: gid,
      phase: 'work',
      running: true,
      total: ms,
      remaining: ms,
      endsAt: Date.now() + ms
    };
  }
  saveFocusState();
  startFocusTick();
  render();
}
function pauseFocusTimer(){
  const t = focusState.timer;
  if (!t || !t.running) return;
  t.remaining = timerRemaining();
  t.running = false;
  t.endsAt = null;
  saveFocusState();
  stopFocusTick();
  render();
}
function resetFocusPhase(){
  const t = focusState.timer;
  if (!t) return;
  const g = focusGroup(t.groupId);
  const mins = t.phase === 'break'
    ? (g ? g.breakMinutes : 5)
    : (g ? g.minutes : 25);
  const ms = Math.max(1, mins) * 60000;
  t.total = ms;
  t.remaining = ms;
  t.running = false;
  t.endsAt = null;
  saveFocusState();
  stopFocusTick();
  render();
}
function stopFocusTimer(){
  if (!focusState.timer) return;
  focusState.timer = null;
  stopFocusTick();
  saveFocusState();
  render();
}

function advancePhase(opts){
  opts = opts || {};
  const t = focusState.timer;
  if (!t) return;
  const g = focusGroup(t.groupId);
  const wasWork = t.phase === 'work';

  if (wasWork && g){
    g.done = Math.min(g.sessions, g.done + 1);
    g.doneDate = todayISO();
  }

  const groupFinished = wasWork && g && g.done >= g.sessions;

  if (groupFinished){
    focusState.timer = null;
    saveFocusState();
    stopFocusTick();
    if (opts.chime) chime(true);
    render();
    return;
  }

  if (wasWork && g && g.breakMinutes > 0){
    t.phase = 'break';
    t.total = g.breakMinutes * 60000;
  } else {
    t.phase = 'work';
    t.total = (g ? g.minutes : 25) * 60000;
  }
  t.remaining = t.total;
  t.endsAt = null;
  t.running = false;
  saveFocusState();
  stopFocusTick();
  if (opts.chime) chime(false);
  render();
}

function finishPhase(opts){
  opts = opts || {};
  const t = focusState.timer;
  if (!t) return;
  const g = focusGroup(t.groupId);
  const wasWork = t.phase === 'work';

  if (wasWork && g && !opts.silent){
    const mat = sessionMaterial(g, g.done);
    if (mat){
      t.running = false;
      t.remaining = 0;
      t.endsAt = null;
      focusState.pendingLog = {
        groupId: g.id,
        mid: mat.id,
        minutes: g.minutes,
        date: todayISO()
      };
      saveFocusState();
      stopFocusTick();
      chime(false);
      render();
      openFocusLogModal();
      return;
    }
  }
  advancePhase({ chime: !opts.silent });
}

function confirmFocusLog(){
  const p = focusState.pendingLog;
  if (!p) return;
  const mat = materialById(p.mid);
  const g = focusGroup(p.groupId);

  focusState.pendingLog = null;

  if (mat){
    // Internal focus log (used by the Focus tab stats)
    focusState.log.push({
      id: uid('fl'),
      groupId: p.groupId,
      mid: p.mid,
      mids: g ? g.mids.slice() : [],
      minutes: p.minutes,
      date: p.date,
      ended_at: new Date().toISOString()
    });
    if (focusState.log.length > 500) focusState.log = focusState.log.slice(-500);

    // Write the ACTUAL minutes into the shared activity log.
    recordFocusInShared(mat, p.minutes, p.date);
  }

  saveFocusState();
  closeModal();
  advancePhase({ chime: false });
}

function skipFocusLog(){
  if (!focusState.pendingLog){ closeModal(); return; }
  focusState.pendingLog = null;
  saveFocusState();
  closeModal();
  advancePhase({ chime: false });
}

/* --- builder helpers --- */
function resetBuilder(){
  builder.editId = null;
  builder.items = [];
}
function builderFind(mid){ return builder.items.find(it => it.mid === mid) || null; }
function builderTotalSessions(){
  return builder.items.reduce((s, it) => s + (it.count || 0), 0);
}

/* --- group management --- */
function createFocusGroup(autoStart){
  const items = builder.items
    .filter(it => materialById(it.mid) && it.count > 0)
    .map(it => ({ mid: it.mid, count: clamp(Math.round(it.count), 1, MAX_SESSIONS_PER_MATERIAL) }));
  if (!items.length) return;

  const sessions = items.reduce((s, it) => s + it.count, 0);
  let gid = null;

  if (builder.editId){
    const g = focusGroup(builder.editId);
    if (g){
      g.items = items;
      g.mids = items.map(it => it.mid);
      g.sessions = sessions;
      g.minutes = builder.minutes;
      g.breakMinutes = builder.breakMinutes;
      if (g.done > sessions) g.done = 0;
      gid = g.id;
    }
  }
  if (!gid){
    const g = {
      id: uid('fg'),
      items,
      mids: items.map(it => it.mid),
      sessions,
      minutes: builder.minutes,
      breakMinutes: builder.breakMinutes,
      done: 0,
      doneDate: todayISO(),
      created_at: new Date().toISOString()
    };
    focusState.groups.push(g);
    gid = g.id;
  }

  resetBuilder();
  saveFocusState();
  render();
  if (autoStart) startFocusTimer(gid);
}
function editFocusGroup(id){
  const g = focusGroup(id);
  if (!g) return;
  builder.editId = g.id;
  builder.items = groupItems(g)
    .filter(it => materialById(it.mid))
    .map(it => ({ mid: it.mid, count: it.count }));
  builder.minutes = g.minutes;
  builder.breakMinutes = g.breakMinutes;
  render();
  const el = document.querySelector('[data-builder-anchor]');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function removeFocusGroup(id){
  if (!confirm('Remove this session group?')) return;
  focusState.groups = focusState.groups.filter(g => g.id !== id);
  if (focusState.timer && focusState.timer.groupId === id){
    focusState.timer = null;
    stopFocusTick();
  }
  if (focusState.pendingLog && focusState.pendingLog.groupId === id){
    focusState.pendingLog = null;
    closeModal();
  }
  if (builder.editId === id) resetBuilder();
  saveFocusState();
  render();
}

/* --- focus view markup --- */
function ringHTML(rem, total, phase, idle){
  const frac = total > 0 ? clamp(rem / total, 0, 1) : 0;
  const off = RING_C * (1 - frac);
  const cls = idle ? 'is-idle' : (phase === 'break' ? 'is-break' : '');
  return `
  <div class="ring ${cls}">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
      <circle class="ring-fg" data-timer-ring cx="60" cy="60" r="54"
              stroke-dasharray="${RING_C.toFixed(2)}"
              stroke-dashoffset="${off.toFixed(2)}"></circle>
    </svg>
    <div class="ring-in">
      <span class="ring-digits" data-timer-digits>${fmtClock(rem)}</span>
      <span class="ring-phase">${idle ? 'Ready' : (phase === 'break' ? 'Break' : 'Focus')}</span>
    </div>
  </div>`;
}

function segBarHTML(g){
  const q = groupQueue(g);
  if (!q.length) return '';
  const done = clamp(g.done, 0, q.length);
  const t = focusState.timer;
  const isActive = !!t && t.groupId === g.id;
  const isWorking = isActive && t.phase === 'work' && t.total > 0;
  const curFrac = isWorking ? clamp(1 - timerRemaining() / t.total, 0, 1) : 0;

  const segs = q.map((mid, i) => {
    const m = materialById(mid);
    const color = m ? materialTint(m) : 'var(--reading)';
    let cls = 'fg-seg';
    let inner = '';
    if (i < done){
      cls += ' done';
    } else if (i === done && isWorking && curFrac > 0){
      cls += ' current';
      inner = `<i data-live-seg style="width:${(curFrac * 100).toFixed(1)}%"></i>`;
    }
    return `<span class="${cls}" style="--seg:${color}">${inner}</span>`;
  }).join('');

  return `<div class="fg-segbar" role="img"
    aria-label="${done} of ${q.length} sessions complete">${segs}</div>`;
}

function timerCardHTML(){
  const today = todayISO();
  const todayMin = focusMinutesOn(today);
  const todayCount = focusLogOn(today).length;
  const weekStart = startOfWeekISO(today);
  const weekMin = weekDays(weekStart).reduce((s, d) => s + focusMinutesOn(d), 0);

  const t = focusState.timer;
  const g = activeGroup();
  let body;

  if (!t || !g){
    body = `
      <div class="timer-top">
        ${ringHTML(0, 1, 'work', true)}
        <div class="timer-meta">
          <span class="timer-title">Ready when you are</span>
          <span class="timer-sub">${focusState.groups.length
            ? 'Press <b>Start</b> on a session group below — the timer keeps running while you browse other tabs.'
            : 'Build a session group below: pick today’s materials, give each one a number of sessions, then choose how long each session should be.'}</span>
        </div>
      </div>`;
  } else {
    const rem = timerRemaining();
    const isBreak = t.phase === 'break';
    const totalSessions = groupSessions(g);
    const idx = clamp(g.done, 0, totalSessions - 1);
    const mat = sessionMaterial(g, isBreak ? Math.min(g.done, totalSessions - 1) : g.done);
    const typeLabel = mat ? (TYPES[mat.default_input_type] || { label: 'Other' }).label : '';
    const subParts = [];
    subParts.push(isBreak ? 'Break' : `Session ${idx + 1} of ${totalSessions}`);
    if (typeLabel) subParts.push(typeLabel);
    if (mat && mat.creator) subParts.push(mat.creator);

    const q = groupQueue(g);
    const dotsHTML = q.map((mid, i) => {
      const m = materialById(mid);
      const color = m ? materialTint(m) : 'var(--reading)';
      let cls = 'sdot';
      if (i < g.done) cls += ' done';
      else if (i === g.done) cls += ' current' + (isBreak ? ' is-break' : '');
      return `<span class="${cls}" style="--dot:${color}"></span>`;
    }).join('');

    body = `
      <div class="timer-top">
        ${ringHTML(rem, t.total, t.phase, false)}
        <div class="timer-meta">
          <span class="timer-title">${esc(mat ? mat.title : 'Session')}</span>
          <span class="timer-sub">${subParts.map(esc).join(' · ')}</span>

          <div class="session-dots" aria-hidden="true">${dotsHTML}</div>

          <div class="timer-controls">
            ${t.running
              ? `<button class="btn btn-primary" data-focus-pause>Pause</button>`
              : `<button class="btn btn-primary" data-focus-start="${esc(g.id)}">
                   ${rem > 0 && rem < t.total ? 'Resume' : 'Start'}
                 </button>`}
            <button class="btn btn-ghost" data-focus-reset-phase>Reset</button>
            <button class="btn btn-ghost" data-focus-skip>${isBreak ? 'Skip break' : 'Skip session'}</button>
            <button class="btn btn-ghost" data-focus-stop>End</button>
          </div>
        </div>
      </div>`;
  }

  return `
  <div class="card timer-card">
    <div class="card-head">
      <h2>Focus timer</h2>
      <span style="font-size:11.5px;color:var(--muted)">Pomodoro</span>
    </div>
    ${body}
    <div class="focus-stat-row">
      <div class="focus-stat">
        <div class="fs-k">Focus today</div>
        <div class="fs-v">${fmtMinutes(todayMin)}</div>
      </div>
      <div class="focus-stat">
        <div class="fs-k">Sessions today</div>
        <div class="fs-v">${todayCount}<small> logged</small></div>
      </div>
      <div class="focus-stat">
        <div class="fs-k">This week</div>
        <div class="fs-v">${fmtMinutes(weekMin)}</div>
      </div>
    </div>
  </div>`;
}

function groupListHTML(){
  const items = focusState.groups
    .filter(g => groupItems(g).some(it => materialById(it.mid)))
    .map(g => {
      const gItems = groupItems(g);
      const mats = gItems.map(it => materialById(it.mid)).filter(Boolean);
      if (!mats.length) return '';
      const first = mats[0];
      const tint = materialTint(first);
      const total = gItems.reduce((s, it) => s + it.count, 0);
      const isActive = !!focusState.timer && focusState.timer.groupId === g.id;
      const running = isActive && focusState.timer.running;
      const complete = g.done >= total;
      const title = mats.length === 1
        ? first.title
        : `${mats.length} materials · ${total} sessions`;

      const queue = groupQueue(g);

      const matsHTML = gItems.map(it => {
        const m = materialById(it.mid);
        if (!m) return '';
        const idxs = [];
        queue.forEach((mid, i) => { if (mid === it.mid) idxs.push(i + 1); });
        const sessLabel = it.count === 1 ? '1 session' : `${it.count} sessions`;
        const subParts = [(TYPES[m.default_input_type] || { label: 'Other' }).label];
        if (m.creator) subParts.push(m.creator);
        if (gItems.length > 1) subParts.push(`Sessions ${idxs.join(', ')}`);
        return `
        <div class="fg-mat" style="--fg-mat-color:${materialTint(m)}">
          ${coverHTML(m, 30)}
          <span class="fg-mat-txt">
            <span class="fg-mat-title">${esc(m.title)}</span>
            <span class="fg-mat-sub">${subParts.map(esc).join(' · ')}</span>
          </span>
          <span class="fg-mat-badge">${esc(sessLabel)}</span>
        </div>`;
      }).join('');

      return `
      <div class="fg-item ${isActive ? 'active' : ''} ${complete ? 'complete' : ''}"
           style="--fg-color:${tint}">
        <div class="fg-head">
          <div class="fg-head-txt">
            <span class="fg-title">${esc(title)}</span>
            <span class="fg-sub">
              ${total} × ${g.minutes} min${g.breakMinutes ? ` · ${g.breakMinutes} min break` : ''} ·
              ${esc(fmtMinutes(total * g.minutes))} total
            </span>
          </div>
          <div class="fg-actions">
            ${running
              ? `<button class="btn btn-ghost btn-sm" data-focus-pause>Pause</button>`
              : `<button class="btn btn-primary btn-sm" data-focus-start="${esc(g.id)}">
                   ${isActive ? 'Resume' : (complete ? 'Restart' : 'Start')}
                 </button>`}
            <button class="btn btn-ghost btn-sm" data-focus-edit="${esc(g.id)}">Edit</button>
            <button class="btn btn-ghost btn-sm" data-focus-remove="${esc(g.id)}">Remove</button>
          </div>
        </div>

        <div class="fg-mats">${matsHTML}</div>

        <div class="fg-progress">
          ${segBarHTML(g)}
          <span class="fg-sub">
            ${g.done} of ${total} session${total === 1 ? '' : 's'} done today${complete ? ' · complete 🎉' : ''}
          </span>
        </div>
      </div>`;
    })
    .filter(Boolean)
    .join('');

  if (!items) return '';

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <h2>Session groups</h2>
      <span style="font-size:11.5px;color:var(--muted)">${focusState.groups.length} saved</span>
    </div>
    <div class="fg-list">${items}</div>
  </div>`;
}

function numFieldHTML(label, key, value){
  const cfg = NUM_FIELDS[key];
  return `
  <div class="num-field">
    <label>${esc(label)}</label>
    <div class="num-ctl">
      <button class="nbtn" type="button" data-num-step="${key}" data-delta="${-cfg.step}"
              data-focus-key="nf-${key}-d" aria-label="Decrease ${esc(label)}">−</button>
      <input class="step-input" type="number" inputmode="numeric"
             data-num-input="${key}" data-focus-key="nf-${key}-in"
             value="${value}" min="${cfg.min}" max="${cfg.max}"
             aria-label="${esc(label)}">
      <button class="nbtn" type="button" data-num-step="${key}" data-delta="${cfg.step}"
              data-focus-key="nf-${key}-i" aria-label="Increase ${esc(label)}">+</button>
    </div>
  </div>`;
}

function allocRowHTML(it, idx){
  const m = materialById(it.mid);
  if (!m) return '';
  const tint = materialTint(m);
  const typeLabel = (TYPES[m.default_input_type] || { label: 'Other' }).label;
  const isFirst = idx === 0;
  const isLast = idx === builder.items.length - 1;
  return `
  <div class="alloc-row" style="--alloc-color:${tint}">
    ${coverHTML(m, 30)}
    <span class="alloc-txt">
      <span class="alloc-title">${esc(m.title)}</span>
      <span class="alloc-sub">${esc(typeLabel)}${m.creator ? ' · ' + esc(m.creator) : ''}</span>
    </span>

    <span class="alloc-order">
      <button type="button" class="ord-btn" data-alloc-move="${idx}" data-dir="-1"
              data-focus-key="ao-up-${esc(m.id)}" ${isFirst ? 'disabled' : ''}
              aria-label="Move ${esc(m.title)} up">▲</button>
      <button type="button" class="ord-btn" data-alloc-move="${idx}" data-dir="1"
              data-focus-key="ao-dn-${esc(m.id)}" ${isLast ? 'disabled' : ''}
              aria-label="Move ${esc(m.title)} down">▼</button>
    </span>

    <span class="alloc-step">
      <button type="button" class="nbtn" data-alloc-step="${idx}" data-delta="-1"
              data-focus-key="as-dec-${esc(m.id)}"
              aria-label="Fewer sessions for ${esc(m.title)}">−</button>
      <input class="alloc-input" type="number" inputmode="numeric"
             data-alloc-input="${idx}" data-focus-key="as-in-${esc(m.id)}"
             value="${it.count}" min="1" max="${MAX_SESSIONS_PER_MATERIAL}"
             aria-label="Sessions for ${esc(m.title)}">
      <button type="button" class="nbtn" data-alloc-step="${idx}" data-delta="1"
              data-focus-key="as-inc-${esc(m.id)}"
              aria-label="More sessions for ${esc(m.title)}">+</button>
    </span>
    <span class="alloc-unit">${it.count === 1 ? 'session' : 'sessions'}</span>

    <button type="button" class="alloc-remove" data-alloc-remove="${idx}"
            data-focus-key="as-rm-${esc(m.id)}"
            aria-label="Remove ${esc(m.title)} from this group">✕</button>
  </div>`;
}

function builderCardHTML(){
  const today = todayISO();
  const tasks = dayTasks(today);
  const seen = new Set();
  const mats = [];
  tasks.forEach(t => {
    if (!seen.has(t.mid)){ seen.add(t.mid); mats.push(t.material); }
  });

  if (!mats.length){
    return `
    <div class="card" data-builder-anchor>
      <div class="card-head"><h2>New session group</h2></div>
      <div class="empty">
        <span class="em-icon">🌤️</span>
        <div class="em-title">Nothing planned for today</div>
        <div class="em-sub">
          Focus sessions are built from <b>today's plan</b>. Schedule a material in the
          Daily or Weekly view first, then come back here.
        </div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-ghost" data-goto-weekly>Open weekly plan</button>
          <button class="btn btn-ghost" data-goto-daily>Open daily view</button>
        </div>
      </div>
    </div>`;
  }

  const editing = !!builder.editId;
  const totalSessions = builderTotalSessions();
  const total = totalSessions * builder.minutes;
  const breakTotal = builder.breakMinutes * Math.max(0, totalSessions - 1);
  const canCreate = builder.items.length > 0 && totalSessions > 0;

  const allocRows = builder.items.map((it, idx) => allocRowHTML(it, idx)).join('');

  const bd = builder.items.map(it => {
    const m = materialById(it.mid);
    if (!m) return '';
    return `<span class="bd-chip" style="--bd:${materialTint(m)}">${it.count} × ${esc(m.title)}</span>`;
  }).join('');

  return `
  <div class="card" data-builder-anchor style="margin-bottom:14px">
    <div class="card-head">
      <h2>${editing ? 'Edit session group' : 'New session group'}</h2>
      <span style="font-size:11.5px;color:var(--muted)">From today's plan</span>
    </div>

    <div class="builder-chips">
      ${mats.map(m => {
        const on = !!builderFind(m.id);
        const tint = materialTint(m);
        const style = on
          ? `border-color:${tint};background:color-mix(in srgb,${tint} 10%,var(--surface))`
          : '';
        return `
        <button type="button" class="mchip ${on ? 'on' : ''}"
                data-chip-mid="${esc(m.id)}"
                data-focus-key="chip-${esc(m.id)}"
                style="${style}"
                aria-pressed="${on}">
          ${coverHTML(m, 26)}
          <span class="mchip-txt">
            ${esc(m.title)}
            <span class="mchip-cat">${m.default_category === 'listening' ? 'Listening' : 'Reading'}</span>
          </span>
        </button>`;
      }).join('')}
    </div>

    ${builder.items.length ? `
    <div class="alloc-wrap">
      <div class="alloc-head">
        <span>Sessions per material</span>
        <span class="alloc-total">${totalSessions} total</span>
      </div>
      <div class="alloc-list">${allocRows}</div>
    </div>` : `
    <p class="hint" style="margin:14px 0 0">
      Pick at least one material above, then choose how many sessions each one gets.
    </p>`}

    <div class="num-row">
      ${numFieldHTML('Minutes per session', 'minutes', builder.minutes)}
      ${numFieldHTML('Break (minutes)', 'breakMinutes', builder.breakMinutes)}
    </div>

    <div class="info-row">
      <span class="info-dot"></span>
      <span>When a session ends, a popup appears asking you to <b>log it</b>.
        The <b>actual session time</b> is written into the shared activity log —
        the planned target is never used as the completed amount.</span>
    </div>

    ${builder.items.length ? `
    <div class="builder-breakdown">${bd}</div>
    <p class="builder-total">
      <b>${totalSessions} session${totalSessions === 1 ? '' : 's'} × ${builder.minutes} min = ${esc(fmtMinutes(total))}</b>
      of focus${breakTotal ? ` + ${esc(fmtMinutes(breakTotal))} of breaks` : ''}
    </p>` : ''}

    <div class="modal-actions" style="justify-content:flex-start;margin-top:16px">
      <button class="btn btn-primary" data-focus-create ${canCreate ? '' : 'disabled'}>
        ${editing ? 'Save changes' : 'Create group'}
      </button>
      ${editing
        ? `<button class="btn btn-ghost" data-focus-cancel-edit>Cancel</button>`
        : `<button class="btn btn-ghost" data-focus-create-start ${canCreate ? '' : 'disabled'}>Create &amp; start</button>`}
    </div>
  </div>`;
}

function viewFocus(){
  return `
  ${phaseBannerHTML()}
  ${timerCardHTML()}
  ${groupListHTML()}
  ${builderCardHTML()}
  <p class="footnote">
    Build a group from <b>today's plan</b> — pick materials, then give each one its own
    number of sessions (e.g. <b>2 × Material A + 1 × Material B = 3 × 50 min</b>).<br>
    When a session ends, a <b>“Log activity” popup</b> appears and records the
    <b>actual session time</b> — the planned target stays untouched and is only used for progress.<br>
    Groups are stored separately from the main challenge data, so nothing here can
    overwrite your materials or plan.
  </p>`;
}

/* =========================================================
   DAILY VIEW
   ========================================================= */
function weekStripHTML(){
  const ws = startOfWeekISO(selectedDate);
  const today = todayISO();
  return `
  <div class="week-strip">
    ${weekDays(ws).map(d => {
      const t = dayTotals(d);
      const cls = [
        'ws-day',
        d === today ? 'today' : '',
        d < today ? 'past' : '',
        d === selectedDate ? 'selected' : ''
      ].filter(Boolean).join(' ');
      const dotStyle = t.total && t.pct === 100
        ? 'background:var(--good-fg)'
        : (t.total ? 'background:var(--reading)' : '');
      return `
      <div class="${cls}" data-pick-day="${d}" role="button" tabindex="0"
           title="${esc(longDate(d))}">
        <div class="ws-dow">${DOW_SHORT[dowOf(d)]}</div>
        <div class="ws-num">${parseISO(d).getDate()}</div>
        <div class="ws-dot" style="${dotStyle}"></div>
      </div>`;
    }).join('')}
  </div>`;
}

function taskRowHTML(iso, task){
  const m = task.material;
  const done = isTaskDone(m.id, iso);
  const overridden = isOverridden(m.id, iso);
  const unitLabel = materialUnit(m);
  const step = dailyStep(m);
  const tint = materialTint(m);

  return `
  <div class="task-row ${done ? 'done' : ''}"
       data-toggle-task="${esc(m.id)}" data-date="${iso}"
       style="--task-color:${tint}"
       role="checkbox" aria-checked="${done}" tabindex="0">
    <span class="task-check" aria-hidden="true">✓</span>
    ${coverHTML(m, 36)}
    <span class="task-main">
      <span class="task-title">${esc(m.title)}</span>
      <span class="task-sub">
        ${esc((TYPES[m.default_input_type] || { label: 'Other' }).label)} · ${esc(m.creator || '—')}${overridden ? ' · <b>custom</b>' : ''}
      </span>
    </span>
    <span class="task-amount-edit" data-no-toggle>
      <button class="amt-btn" type="button"
              data-day-step="${-step}" data-mid="${esc(m.id)}" data-date="${iso}"
              data-focus-key="dy-dec-${esc(m.id)}-${iso}"
              aria-label="Decrease ${esc(m.title)}">−</button>
      <input class="amt-input" type="number" inputmode="decimal"
             data-day-input="${esc(m.id)}" data-date="${iso}"
             data-focus-key="dy-in-${esc(m.id)}-${iso}"
             value="${fmtAmount(task.amount)}" min="0" step="${step}"
             aria-label="${esc(m.title)} amount for this day">
      <span class="amt-unit">${unitLabel}</span>
      <button class="amt-btn" type="button"
              data-day-step="${step}" data-mid="${esc(m.id)}" data-date="${iso}"
              data-focus-key="dy-inc-${esc(m.id)}-${iso}"
              aria-label="Increase ${esc(m.title)}">+</button>
      ${overridden ? `
      <button class="amt-reset" type="button"
              data-day-reset="${esc(m.id)}" data-date="${iso}"
              data-focus-key="dy-rst-${esc(m.id)}-${iso}"
              title="Reset to plan (${fmtAmount(autoAmount(m.id))}${unitLabel})"
              aria-label="Reset to plan">↺</button>` : ''}
    </span>
  </div>`;
}

function taskGroupHTML(iso, category){
  const tasks = dayTasks(iso).filter(t => (t.material.default_category === 'listening' ? 'listening' : 'reading') === category);
  if (!tasks.length) return '';
  const doneCount = tasks.filter(t => isTaskDone(t.mid, iso)).length;
  const isRead = category === 'reading';
  return `
  <div class="task-group">
    <div class="task-group-head">
      <span class="gdot ${category}"></span>
      <span class="gt">${isRead ? 'Reading' : 'Listening'}</span>
      <span class="gn">${doneCount}/${tasks.length}</span>
      <span class="gline"></span>
    </div>
    ${tasks.map(t => taskRowHTML(iso, t)).join('')}
  </div>`;
}

function progressCardHTML(label, cls, doneAmt, planAmt, unit){
  const pct = planAmt > 0 ? clamp(doneAmt / planAmt * 100, 0, 100) : 0;
  return `
  <div class="card">
    <div class="prog-top">
      <span class="pt-label">${label}</span>
      <span class="pt-val">${Math.round(pct)}%</span>
    </div>
    <div class="big-numbers">
      <strong>${fmtAmount(doneAmt)}</strong>
      <span>/ ${fmtAmount(planAmt)} ${unit}</span>
    </div>
    <div class="bar ${cls}"><i style="width:${pct}%"></i></div>
    <div class="stat-sub" style="margin-top:10px">
      ${planAmt > doneAmt
        ? fmtAmount(planAmt - doneAmt) + ' ' + unit + ' still to go'
        : (planAmt > 0 ? 'Target reached — nice work' : 'Nothing scheduled')}
    </div>
  </div>`;
}

function viewDaily(){
  const iso = selectedDate;
  const today = todayISO();
  const t = dayTotals(iso);
  const isToday = iso === today;
  const isFuture = iso > today;

  const relative =
    isToday ? 'Today' :
    iso === addDays(today, -1) ? 'Yesterday' :
    iso === addDays(today, 1) ? 'Tomorrow' :
    DOW_LONG[dowOf(iso)];

  const tasksHtml = t.tasks.length
    ? taskGroupHTML(iso, 'reading') + taskGroupHTML(iso, 'listening')
    : `<div class="empty">
         <span class="em-icon">🌤️</span>
         Nothing scheduled for this day — a rest day.
         <div style="margin-top:12px">
           <button class="btn btn-ghost btn-sm" data-goto-weekly>Edit weekly plan</button>
         </div>
       </div>`;

  return `
  ${phaseBannerHTML()}
  ${weekStripHTML()}

  <div class="nav-bar">
    <div class="nb-main">
      <button class="icon-btn" data-shift-day="-1" aria-label="Previous day">‹</button>
      <div class="nb-date">
        <span class="nb-k">${esc(relative)}</span>
        <span class="nb-v">${esc(longDate(iso))}</span>
        <span class="nb-sub">
          ${t.doneCount} of ${t.total} tasks · ${fmtAmount(t.readPlan)}% reading ·
          ${fmtAmount(t.listenPlan)} min listening
        </span>
      </div>
      <button class="icon-btn" data-shift-day="1" aria-label="Next day">›</button>
    </div>
    <div class="nb-btns">
      ${!isToday ? '<button class="btn btn-ghost btn-sm" data-goto-today>Jump to today</button>' : ''}
      ${t.total ? `
      <button class="btn btn-primary btn-sm" data-complete-day="${iso}">
        ${t.doneCount === t.total ? 'Clear day' : 'Complete all'}
      </button>` : ''}
      ${isToday && t.total ? `<button class="btn btn-ghost btn-sm" data-goto-focus>Focus timer →</button>` : ''}
    </div>
  </div>

  <div class="grid cols-2">
