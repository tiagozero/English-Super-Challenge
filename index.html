function viewMaterials(){
  const all = state.materials;

  /* type counts for the chips */
  const typeCounts = {};
  TYPE_ORDER.forEach(t => { typeCounts[t] = 0; });
  all.forEach(m => {
    if (typeCounts[m.default_input_type] === undefined) typeCounts[m.default_input_type] = 0;
    typeCounts[m.default_input_type]++;
  });

  /* apply filters */
  const q = materialsFilter.q.trim().toLowerCase();
  const filtered = all.filter(m => {
    if (materialsFilter.category !== 'all' && m.default_category !== materialsFilter.category) return false;
    if (materialsFilter.type !== 'all' && m.default_input_type !== materialsFilter.type) return false;
    if (q){
      const hay = ((m.title || '') + ' ' + (m.creator || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const groups = CATEGORY_ORDER
    .map(cat => ({
      id: cat,
      label: CATEGORY_LABEL[cat],
      items: filtered.filter(m => m.default_category === cat).sort(materialSorter)
    }))
    .filter(g => g.items.length);

  const hasFilter = !!q || materialsFilter.type !== 'all' || materialsFilter.category !== 'all';
  const hiddenActiveCount =
    (!materialsFiltersOpen ? 1 : 0) *
    ((materialsFilter.category !== 'all' ? 1 : 0) + (materialsFilter.type !== 'all' ? 1 : 0));

  const catChips = `
    <div class="mat-chip-row">
      <button class="chip ${materialsFilter.category === 'all' ? 'active' : ''}" data-matcat="all">All materials</button>
      <button class="chip ${materialsFilter.category === 'reading' ? 'active' : ''}" data-matcat="reading">Reading</button>
      <button class="chip ${materialsFilter.category === 'listening' ? 'active' : ''}" data-matcat="listening">Listening</button>
    </div>`;

  const typeChips = `
    <div class="mat-chip-row">
      <button class="chip ${materialsFilter.type === 'all' ? 'active' : ''}" data-mattype="all">All types</button>
      ${TYPE_ORDER.map(t => `
        <button class="chip ${materialsFilter.type === t ? 'active' : ''}" data-mattype="${t}">
          ${escapeHtml(TYPES[t].label)}
          <span style="opacity:.6;font-weight:600">${typeCounts[t] || 0}</span>
        </button>
      `).join('')}
    </div>`;

  const body = groups.length
    ? groups.map(g => `
        <div class="mat-group-head">
          <span class="gdot ${g.id}"></span>
          <span class="gt">${escapeHtml(g.label)}</span>
          <span class="gn">${g.items.length}</span>
          <span class="gline"></span>
        </div>
        ${materialsView === 'grid'
          ? `<div class="mat-grid">${g.items.map(materialCardHTML).join('')}</div>`
          : `<div>${g.items.map(materialRowHTML).join('')}</div>`}
      `).join('')
    : `<div class="empty">
         <div class="em-icon">${all.length ? '🔍' : '📚'}</div>
         <div class="em-title">${all.length ? 'No materials match' : 'No materials yet'}</div>
         <div class="em-sub">${all.length
           ? 'Try a different type filter or clear the search.'
           : 'Materials are created automatically when you log an activity with a new title — or add them manually, or import a CSV.'}</div>
         ${all.length
           ? '<button class="btn btn-ghost" data-action="clear-material-filters">Clear filters</button>'
           : `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-primary" data-action="add-material">+ Add material</button>
                <button class="btn btn-ghost" data-action="import-materials">⬆ Import CSV</button>
              </div>`}
       </div>`;

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="mat-toolbar">
      <div class="mat-search">
        <input type="text" id="matSearch" placeholder="Search materials…" value="${escapeHtml(materialsFilter.q)}" autocomplete="off">
      </div>
      <button class="btn btn-ghost filter-toggle" data-action="toggle-mat-filters"
              aria-expanded="${materialsFiltersOpen ? 'true' : 'false'}"
              title="${materialsFiltersOpen ? 'Hide filters' : 'Show filters'}">
        ${materialsFiltersOpen ? 'Filters ▾' : 'Filters ▸'}
        ${hiddenActiveCount ? `<span class="fcount">${hiddenActiveCount}</span>` : ''}
      </button>
      <div class="seg" id="matViewSeg">
        <button data-matview="grid" class="${materialsView === 'grid' ? 'active' : ''}" title="Grid view">▦ Grid</button>
        <button data-matview="list" class="${materialsView === 'list' ? 'active' : ''}" title="List view">☰ List</button>
      </div>
      <button class="btn btn-ghost" data-action="import-materials">⬆ CSV</button>
      <button class="btn btn-primary" data-action="add-material">+ Add</button>
    </div>

    <div class="mat-filters-wrap ${materialsFiltersOpen ? '' : 'collapsed'}">
      ${catChips}
      ${typeChips}
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap">
      <div style="font-size:12.5px;color:var(--muted)">
        ${filtered.length} of ${all.length} material${all.length === 1 ? '' : 's'}
        ${hasFilter ? ' · filtered' : ''}
      </div>
      ${hasFilter ? '<button class="link-btn" data-action="clear-material-filters">Clear filters</button>' : ''}
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head">
      <h2>Materials by type</h2>
      <button class="info-btn" data-action="info-materials" title="How materials work" aria-label="How materials work">i</button>
    </div>
    ${body}
  </div>`;
}

/* =========================================================
   Render
   ========================================================= */
function render(){
  const app = $('#app');
  if (currentView === 'dashboard')        app.innerHTML = viewDashboard();
  else if (currentView === 'profile')     app.innerHTML = viewProfile();
  else if (currentView === 'challenges')  app.innerHTML = viewChallenges();
  else if (currentView === 'leaderboard') app.innerHTML = viewLeaderboard();
  else if (currentView === 'history')     app.innerHTML = viewHistory();
  else if (currentView === 'progress')    app.innerHTML = viewProgress();
  else                                    app.innerHTML = viewMaterials();

  updateHeader();
  updateTabs();
  updateCountdowns();
}

function updateTabs(){
  $$('#tabs button[data-nav]').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === currentView);
  });
}

function updateHeader(){
  const s = getStats();
  $('#hdrSub').innerHTML =
    `Day ${s.elapsed} of ${s.totalDays} · ${s.daysLeft} days left · ` +
    `⏳ <span class="mono" data-countdown="day">--:--:--</span> until 00:00`;

  const p = state.profile;
  const av = $('#hdrAvatar');
  const nm = $('#hdrName');
  if (av){
    av.textContent = profileAvatarContent(p);
    av.style.background = profileColor();
    av.style.fontSize = (p && p.avatar_emoji) ? '15px' : '11px';
    av.style.fontWeight = (p && p.avatar_emoji) ? '400' : '750';
  }
  if (nm){
    nm.textContent = (p && p.display_name) ? p.display_name : 'Profile';
  }
}

function renderPreservingFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  let selStart = null, selEnd = null;
  if (active && typeof active.selectionStart === 'number'){
    selStart = active.selectionStart;
    selEnd = active.selectionEnd;
  }
  render();
  if (id){
    const el = document.getElementById(id);
    if (el){
      el.focus();
      if (selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* ignore */ }
      }
    }
  }
}

          <div class="picker-label">Emoji</div>
          <div class="emoji-grid" id="emojiGrid">
            <button type="button" data-emoji="" title="Use initials" class="${draft.avatar_emoji === '' ? 'active' : ''}" style="font-size:11px;font-weight:700;color:var(--muted)">A–Z</button>
            ${AVATAR_EMOJIS.map(e => `
              <button type="button" data-emoji="${e}" class="${draft.avatar_emoji === e ? 'active' : ''}">${e}</button>
            `).join('')}
          </div>

          <div class="picker-label">Color</div>
          <div class="swatch-row" id="swatchRow">
            ${AVATAR_COLORS.map(c => `
              <button type="button" class="swatch ${draft.avatar_color === c ? 'active' : ''}"
                      data-color="${c}" style="background:${c}" aria-label="Color ${c}"></button>
            `).join('')}
          </div>

          <div class="field">
            <label for="pfName">Display name <span style="color:var(--bad-fg)">*</span></label>
            <input type="text" id="pfName" required maxlength="40"
                   placeholder="e.g. Alex Rivera" value="${escapeHtml(draft.display_name)}">
          </div>

          <div class="field">
            <label for="pfHandle">Handle <span style="font-weight:500;text-transform:none">(optional)</span></label>
            <input type="text" id="pfHandle" maxlength="24"
                   placeholder="e.g. alex.reads" value="${escapeHtml(draft.handle)}">
            <div style="font-size:11.5px;color:var(--muted);margin-top:-4px">Shown as @yourhandle on the leaderboard.</div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title"><span class="dotnum">2</span> About you</div>

          <div class="field">
            <label for="pfBio">Short bio <span style="font-weight:500;text-transform:none">(optional)</span></label>
            <textarea id="pfBio" rows="3" maxlength="200"
                      placeholder="A sentence or two about you and your reading / listening habits…">${escapeHtml(draft.bio)}</textarea>
          </div>

          <div class="two-col">
            <div class="field">
              <label for="pfCountry">Country</label>
              <select id="pfCountry">${countryOptions}</select>

            <div class="field">
              <label for="pfBirthday">Birthday</label>
              <input type="date" id="pfBirthday" value="${escapeHtml(draft.birthday)}">
            </div>

          <div class="field">
            <label for="pfTimezone">Timezone</label>
            <input type="text" id="pfTimezone" value="${escapeHtml(draft.timezone)}" placeholder="e.g. Europe/Lisbon">
            <div style="font-size:11.5px;color:var(--muted);margin-top:-4px">Auto-detected — edit if needed.</div>
          </div>
        </div>

        <div class="form-section">

          <div class="two-col">

          <div class="field">

            <div class="chips" id="levelChips">
              ${LEVELS.map(l => `
                <button type="button" class="chip ${draft.level === l.id ? 'active' : ''}" data-level="${l.id}">
                  ${escapeHtml(l.label)} <span style="opacity:.7;font-weight:500">· ${escapeHtml(l.sub)}</span>
                </button>

        <div class="form-section">
          <div class="form-section-title"><span class="dotnum">4</span> Goals &amp; routine</div>

          <div class="field">
            <label for="pfGoal">My goal <span style="font-weight:500;text-transform:none">(optional)</span></label>
            <textarea id="pfGoal" rows="3" maxlength="200"
                      placeholder="Why are you doing this challenge? e.g. Read 20 books this year and finish my first audiobook series.">${escapeHtml(draft.goal)}</textarea>
          </div>

          <div class="two-col">
            <div class="field">
              <label for="pfReminder">Daily reminder time</label>
              <input type="time" id="pfReminder" value="${escapeHtml(draft.daily_reminder)}">
            </div>
            <div class="field">
              <label for="pfUnits">Measurement units</label>
              <select id="pfUnits">
                <option value="metric"   ${draft.units === 'metric'   ? 'selected' : ''}>Metric (pages / minutes)</option>
                <option value="imperial" ${draft.units === 'imperial' ? 'selected' : ''}>Imperial (pages / minutes)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title"><span class="dotnum">5</span> Favorite genres</div>
          <div class="chips" id="genreChips">
            ${GENRES.map(g => `
              <button type="button" class="chip ${draft.favorite_genres.includes(g) ? 'active' : ''}" data-genre="${escapeHtml(g)}">${escapeHtml(g)}</button>
            `).join('')}
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title"><span class="dotnum">6</span> Social &amp; privacy</div>

          <div class="field">
            <label for="pfTwitter">Twitter / X</label>
            <input type="text" id="pfTwitter" placeholder="@username or full URL" value="${escapeHtml(draft.social_twitter)}">
          </div>
          <div class="field">
            <label for="pfGoodreads">Goodreads</label>
            <input type="text" id="pfGoodreads" placeholder="Profile URL or username" value="${escapeHtml(draft.social_goodreads)}">
          </div>
          <div class="field">
            <label for="pfWebsite">Website / blog</label>
            <input type="text" id="pfWebsite" placeholder="https://…" value="${escapeHtml(draft.social_website)}">
          </div>

          <div class="field">
            <label>Profile visibility</label>
            <div class="chips" id="visChips">
              <button type="button" class="chip ${draft.visibility === 'private' ? 'active' : ''}" data-vis="private">Private</button>
              <button type="button" class="chip ${draft.visibility === 'public' ? 'active' : ''}"  data-vis="public">Public</button>
            </div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:6px">
              Private means only you see the details. Public shows your bio, languages and social links on the profile page.
            </div>
          </div>
        </div>

        <div class="modal-actions" style="margin-top:20px">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">${editing ? 'Save profile' : 'Create profile'}</button>
        </div>
      </form>
    </div>
  `);

  /* --- live preview --- */
  const preview = $('#avatarPreview');
  function refreshPreview(){
    const name = $('#pfName').value.trim() || 'You';
    const emoji = draft.avatar_emoji;
    preview.textContent = emoji || initialsOf(name);
    preview.style.background = draft.avatar_color;
    preview.style.fontSize = emoji ? '34px' : '26px';
  }

  $('#emojiGrid').addEventListener('click', e => {
    const b = e.target.closest('button[data-emoji]');
    if (!b) return;
    draft.avatar_emoji = b.dataset.emoji;
    $$('#emojiGrid button').forEach(x => x.classList.toggle('active', x === b));
    refreshPreview();
  });

  $('#swatchRow').addEventListener('click', e => {
    const b = e.target.closest('button[data-color]');
    if (!b) return;
    draft.avatar_color = b.dataset.color;
    $$('#swatchRow .swatch').forEach(x => x.classList.toggle('active', x === b));
    refreshPreview();
  });

  $('#levelChips').addEventListener('click', e => {
    const b = e.target.closest('.chip[data-level]');
    if (!b) return;
    draft.level = b.dataset.level;
    $$('#levelChips .chip').forEach(x => x.classList.toggle('active', x === b));
  });

  $('#genreChips').addEventListener('click', e => {
    const b = e.target.closest('.chip[data-genre]');
    if (!b) return;
    const g = b.dataset.genre;
    const idx = draft.favorite_genres.indexOf(g);
    if (idx >= 0) draft.favorite_genres.splice(idx, 1);
    else draft.favorite_genres.push(g);
    b.classList.toggle('active');
  });

  $('#visChips').addEventListener('click', e => {
    const b = e.target.closest('.chip[data-vis]');
    if (!b) return;
    draft.visibility = b.dataset.vis;
    $$('#visChips .chip').forEach(x => x.classList.toggle('active', x === b));
  });

  $('#pfName').addEventListener('input', refreshPreview);
  refreshPreview();

  $('#profileForm').addEventListener('submit', e => {
    e.preventDefault();
    const display_name = $('#pfName').value.trim();
    if (!display_name){ $('#pfName').focus(); return; }

    let handle = $('#pfHandle').value.trim();
    handle = handle.replace(/^@+/, '');

    const now = new Date().toISOString();
    const newProfile = {
      id: (state.profile && state.profile.id) || uid('p'),
      display_name,
      handle,
      avatar_emoji:  draft.avatar_emoji,
      avatar_color:  draft.avatar_color,
      bio:           $('#pfBio').value.trim(),
      country:       $('#pfCountry').value,
      timezone:      $('#pfTimezone').value.trim(),
      native_language: $('#pfNative').value,
      target_language: $('#pfTarget').value,
      level:         draft.level,
      goal:          $('#pfGoal').value.trim(),
      daily_reminder: $('#pfReminder').value || '19:00',
      units:         $('#pfUnits').value,
      favorite_genres: draft.favorite_genres.slice(),
      social_twitter:   $('#pfTwitter').value.trim(),
      social_goodreads: $('#pfGoodreads').value.trim(),
      social_website:   $('#pfWebsite').value.trim(),
      birthday:      $('#pfBirthday').value,
      visibility:    draft.visibility,
      created_at:    (state.profile && state.profile.created_at) || now,
      updated_at:    now
    };

    state.profile = newProfile;
    saveState();
    closeModal();

    if (!editing) currentView = 'profile';
    render();
  });

  setTimeout(() => $('#pfName').focus(), 60);
}

/* =========================================================
   Character modal (create / edit)
   ========================================================= */
function openRivalModal(rival){
  const editing = !!rival;
  const r = rival || {
    name: '', handle: '', color: AVATAR_COLORS[0], avatar_emoji: '',
    avgXp: 50, intensity: 3, split: 0.5, phase: Math.random() * 10
  };

  const draft = {
    name: r.name || '',
    handle: String(r.handle || '').replace(/^@+/, ''),
    color: r.color || AVATAR_COLORS[0],
    avatar_emoji: r.avatar_emoji || '',
    avgXp: Math.max(0, Number(r.avgXp) || 0),
    intensity: clamp(Number(r.intensity) || 3, 1, 5),
    split: clamp(Number(r.split) ?? 0.5, 0, 1),
    phase: Number(r.phase) || 0
  };

  openModal(`
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>${editing ? 'Edit character' : 'New character'}</h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <form id="rivalForm" class="modal-body" autocomplete="off">

        <div class="form-section">
          <div class="form-section-title"><span class="dotnum">1</span> Avatar &amp; identity</div>

          <div class="avatar-preview-row">
            <div class="avatar-preview" id="rivalPreview" style="background:${escapeHtml(draft.color)}"></div>
            <div class="avatar-preview-label">
              How this character appears on the leaderboard. Pick an emoji and a color.
            </div>
          </div>

          <div class="picker-label">Emoji</div>
          <div class="emoji-grid" id="rivalEmojiGrid">
            <button type="button" data-emoji="" title="Use initials" class="${draft.avatar_emoji === '' ? 'active' : ''}" style="font-size:11px;font-weight:700;color:var(--muted)">A–Z</button>
            ${AVATAR_EMOJIS.map(e => `
              <button type="button" data-emoji="${e}" class="${draft.avatar_emoji === e ? 'active' : ''}">${e}</button>
            `).join('')}
          </div>

          <div class="picker-label">Color</div>
          <div class="swatch-row" id="rivalSwatchRow">
            ${AVATAR_COLORS.map(c => `
              <button type="button" class="swatch ${draft.color === c ? 'active' : ''}"
                      data-color="${c}" style="background:${c}" aria-label="Color ${c}"></button>
            `).join('')}
          </div>

          <div class="field">
            <label for="rivalName">Display name <span style="color:var(--bad-fg)">*</span></label>
            <input type="text" id="rivalName" required maxlength="40"
                   placeholder="e.g. Luna Park" value="${escapeHtml(draft.name)}">
          </div>

          <div class="field">
            <label for="rivalHandle">Handle <span style="font-weight:500;text-transform:none">(optional)</span></label>
            <input type="text" id="rivalHandle" maxlength="24"
                   placeholder="e.g. luna_reads" value="${escapeHtml(draft.handle)}">
            <div style="font-size:11.5px;color:var(--muted);margin-top:-4px">Shown as @handle on the leaderboard.</div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title"><span class="dotnum">2</span> Performance</div>

          <div class="field">
            <label for="rivalAvgXp">Average XP per day</label>
            <div class="amount-row">
              <input type="number" id="rivalAvgXp" min="0" max="500" step="0.5" inputmode="decimal"
                     value="${draft.avgXp}">
              <div class="seg" style="align-items:center">
                <span style="font-size:12.5px;color:var(--muted);padding:0 12px">XP / day</span>
              </div>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:-4px" id="rivalXpPreview"></div>
          </div>

          <div class="field">
            <label for="rivalIntensity">
              Intensity
              <span style="font-weight:500;text-transform:none;color:var(--muted)" id="rivalIntensityLabel"></span>
            </label>
            <input type="range" id="rivalIntensity" min="1" max="5" step="0.1" value="${draft.intensity}">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px">
              <span>Casual · erratic</span>
              <span>Intense · consistent</span>
            </div>
          </div>

          <div class="field">
            <label for="rivalSplit">
              Focus
              <span style="font-weight:500;text-transform:none;color:var(--muted)" id="rivalSplitLabel"></span>
            </label>
            <input type="range" id="rivalSplit" min="0" max="100" step="5" value="${Math.round(draft.split * 100)}">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px">
              <span>🎧 Listening</span>
              <span>📖 Reading</span>
            </div>
          </div>

          <p class="hint" style="margin-top:4px">
            <b>Average XP</b> sets the daily pace. <b>Intensity</b> controls how consistently they hit it —
            higher intensity means fewer rest days and less day-to-day swing.
          </p>
        </div>

        <div class="modal-actions" style="margin-top:20px">
          ${editing
            ? `<button type="button" class="btn btn-ghost" data-action="delete-rival" data-id="${r.id}"
                       style="color:var(--bad-fg);margin-right:auto">Delete</button>`
            : ''}
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">${editing ? 'Save character' : 'Create character'}</button>
        </div>
      </form>
    </div>
  `);

  const preview       = $('#rivalPreview');
  const avgInput      = $('#rivalAvgXp');
  const intensityIn   = $('#rivalIntensity');
  const splitIn       = $('#rivalSplit');
  const xpPreview     = $('#rivalXpPreview');
  const intensityLbl  = $('#rivalIntensityLabel');
  const splitLbl      = $('#rivalSplitLabel');

  function refresh(){
    const name = $('#rivalName').value.trim() || '?';
    preview.textContent = draft.avatar_emoji || initialsOf(name);
    preview.style.background = draft.color;
    preview.style.fontSize = draft.avatar_emoji ? '34px' : '26px';

    const avg = Math.max(0, Number(avgInput.value) || 0);
    const split = clamp(Number(splitIn.value) / 100, 0, 1);
    const readXp = avg * split;
    const listenXp = avg * (1 - split);
    const pages = Math.round(readXp * 2);
    const minutes = Math.round(listenXp * 2);

    xpPreview.textContent = `≈ ${fmt(pages)} pages + ${fmt(minutes)} min per day`;

    const iv = Number(intensityIn.value) || 3;
    let il;
    if (iv < 2)        il = '· very casual';
    else if (iv < 3)   il = '· casual';
    else if (iv < 3.8) il = '· steady';
    else if (iv < 4.5) il = '· intense';
    else               il = '· relentless';
    intensityLbl.textContent = il;

    let sl;
    if (split >= 0.8)      sl = '· mostly reading';
    else if (split >= 0.6) sl = '· reading-leaning';
    else if (split > 0.4)  sl = '· balanced';
    else if (split > 0.2)  sl = '· listening-leaning';
    else                   sl = '· mostly listening';
    splitLbl.textContent = sl;
  }

  $('#rivalEmojiGrid').addEventListener('click', e => {
    const b = e.target.closest('button[data-emoji]');
    if (!b) return;
    draft.avatar_emoji = b.dataset.emoji;
    $$('#rivalEmojiGrid button').forEach(x => x.classList.toggle('active', x === b));
    refresh();
  });

  $('#rivalSwatchRow').addEventListener('click', e => {
    const b = e.target.closest('button[data-color]');
    if (!b) return;
    draft.color = b.dataset.color;
    $$('#rivalSwatchRow .swatch').forEach(x => x.classList.toggle('active', x === b));
    refresh();
  });

  $('#rivalName').addEventListener('input', refresh);
  avgInput.addEventListener('input', refresh);
  intensityIn.addEventListener('input', refresh);
  splitIn.addEventListener('input', refresh);

  refresh();

  $('#rivalForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#rivalName').value.trim();
    if (!name){ $('#rivalName').focus(); return; }

    const handle = $('#rivalHandle').value.trim().replace(/^@+/, '');
    const avgXp = Math.max(0, Number(avgInput.value) || 0);
    const intensity = clamp(Number(intensityIn.value) || 3, 1, 5);
    const split = clamp(Number(splitIn.value) / 100, 0, 1);

    if (editing){
      const target = state.rivals.find(x => x.id === r.id);
      if (target){
        Object.assign(target, {
          name, handle,
          avatar_emoji: draft.avatar_emoji,
          color: draft.color,
          avgXp, intensity, split
        });
      }
    } else {
      state.rivals.push({
        id: uid('r'),
        name, handle,
        avatar_emoji: draft.avatar_emoji,
        color: draft.color,
        avgXp, intensity, split,
        phase: Math.random() * 10
      });
    }

    saveState();
    closeModal();
    render();
  });

  setTimeout(() => $('#rivalName').focus(), 60);
}

            <input type="number" id="logAmount" min="1" step="1" inputmode="numeric"

              <button type="button" data-unit="pages" class="${draft.unit === 'pages' ? 'active' : ''}">Pages</button>

        <div class="field">
          <label for="logNote">Note <span style="font-weight:500;text-transform:none">(optional)</span></label>

          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>

        </div>
      </form>
    </div>
  `);

  const typeChips = $('#typeChips');
  const unitSeg   = $('#unitSeg');
  const titleInput = $('#logTitle');
  const acList    = $('#acList');
  const amountInput = $('#logAmount');

  function applyType(t){
    draft.input_type = t;
    draft.category = TYPES[t].category;
    draft.unit = TYPES[t].unit;
    $$('.chip', typeChips).forEach(c => c.classList.toggle('active', c.dataset.type === t));
    $$('button', unitSeg).forEach(b => b.classList.toggle('active', b.dataset.unit === draft.unit));
    amountInput.placeholder = draft.unit === 'pages' ? 'Pages' : 'Minutes';
  }

  function updateAC(){
    const q = titleInput.value.trim().toLowerCase();
    const matches = state.materials
      .filter(m => m.status !== 'archived' || m.id === draft.material_id)
      .filter(m => !q || m.title.toLowerCase().includes(q))
      .slice(0, 6);

    if (!matches.length){ acList.classList.remove('open'); acList.innerHTML = ''; return; }

    acList.innerHTML = matches.map(m => `
      <div class="ac-item" data-mat="${m.id}">
        <span>${escapeHtml(m.title)}</span>
        <small>${escapeHtml(m.creator || (TYPES[m.default_input_type] || { label: '' }).label)}</small>
      </div>`).join('');
    acList.classList.add('open');
  }

  typeChips.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    applyType(chip.dataset.type);
  });

  unitSeg.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    draft.unit = btn.dataset.unit;
    $$('button', unitSeg).forEach(b => b.classList.toggle('active', b.dataset.unit === draft.unit));
    amountInput.placeholder = draft.unit === 'pages' ? 'Pages' : 'Minutes';
  });

  titleInput.addEventListener('input', () => {
    draft.material_id = null;
    updateAC();
  });
  titleInput.addEventListener('focus', updateAC);
  titleInput.addEventListener('blur', () => setTimeout(() => acList.classList.remove('open'), 160));

  acList.addEventListener('mousedown', e => {
    const item = e.target.closest('.ac-item');
    if (!item) return;
    e.preventDefault();
    const m = materialById(item.dataset.mat);
    if (!m) return;
    titleInput.value = m.title;
    draft.material_id = m.id;
    applyType(m.default_input_type);
    acList.classList.remove('open');
    amountInput.focus();
  });

  $('#logForm').addEventListener('submit', e => {
    e.preventDefault();
    const amount = Number(amountInput.value);
    if (!amount || amount <= 0){ amountInput.focus(); return; }

    const loggedOn = $('#logDate').value || todayISO();
    const note = $('#logNote').value.trim();
    const title = titleInput.value.trim();

    let materialId = draft.material_id;
    if (title){
      const current = materialId ? materialById(materialId) : null;
      if (!current || current.title.toLowerCase() !== title.toLowerCase()){
        const byTitle = state.materials.find(m => m.title.toLowerCase() === title.toLowerCase());
        if (byTitle){
          materialId = byTitle.id;
        } else {
          const nm = {
            id: uid('m'),
            challenge_id: ch.id,
            title,
            creator: '',
            default_input_type: draft.input_type,
            default_category: draft.category,
            status: 'active',
            cover_url: ''
          };
          state.materials.push(nm);
          materialId = nm.id;
        }
      }
    } else {
      materialId = null;
    }

    const nowIso = new Date().toISOString();

    if (editing){
      const idx = state.activities.findIndex(a => a.id === activity.id);
      if (idx >= 0){
        state.activities[idx] = {
          ...state.activities[idx],
          logged_on: loggedOn,
          category: draft.category,
          input_type: draft.input_type,
          material_id: materialId,
          amount,
          unit: draft.unit,
          note,
          updated_at: nowIso
        };
      }
    } else {
      state.activities.push({
        id: uid('a'),
        challenge_id: ch.id,
        logged_on: loggedOn,
        category: draft.category,
        input_type: draft.input_type,
        material_id: materialId,
        amount,
        unit: draft.unit,
        note,
        created_at: nowIso,
        updated_at: nowIso
      });
    }

    saveState();
    closeModal();
    render();
  });

  setTimeout(() => amountInput.focus(), 60);
}

/* =========================================================
   CSV import — parsing + normalisation
   ========================================================= */
function parseCSVRows(text){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  const s = String(text || '').replace(/^\uFEFF/, ''); // strip BOM

  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (inQuotes){
      if (c === '"'){
        if (s[i + 1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += c;
      }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function normalizeMaterialType(raw, categoryRaw){
  const s = String(raw || '').trim().toLowerCase();
  const cat = String(categoryRaw || '').trim().toLowerCase();

  if (s){
    if (TYPES[s]) return s;
    for (const k of TYPE_ORDER){
      if (TYPES[k].label.toLowerCase() === s) return k;
    }
    if (/audio|audio-?book/.test(s)) return 'audiobook';
    if (/pod/.test(s))               return 'podcast';
    if (/kindle|e-?book|ebook|ereader/.test(s)) return 'kindle';
    if (/paper|physical|hardcover|paperback|\bbook\b/.test(s)) return 'book';
    if (/article|blog|essay|news/.test(s)) return 'article';
    if (/\btv\b|show|series|netflix/.test(s)) return 'tv';
    if (/film|movie|cinema/.test(s)) return 'film';
  }
  if (cat === 'listening') return 'audiobook';
  if (cat === 'reading')   return 'kindle';
  return 'other';
}

function normalizeMaterialStatus(raw){
  const s = String(raw || '').trim().toLowerCase();
  if (s === 'completed' || s === 'complete' || s === 'done' || s === 'finished') return 'completed';
  if (s === 'archived' || s === 'archive' || s === 'inactive') return 'archived';
  return 'active';
}

function parseMaterialsCSV(text){
  const rows = parseCSVRows(text);
  const errors = [];
  const out = [];

  if (!rows.length) return { rows: out, errors: ['The file appears to be empty.'] };

  const first = rows[0].map(c => String(c || '').trim().toLowerCase());
  const hasHeader = first.includes('title') || first.includes('name');

  let idx;
  let startIdx;

  if (hasHeader){
    idx = {
      title:    first.findIndex(h => h === 'title' || h === 'name'),
      creator:  first.findIndex(h => h === 'creator' || h === 'author' || h === 'host'),
      type:     first.findIndex(h => h === 'type' || h === 'input_type' || h === 'default_input_type' || h === 'format'),
      category: first.findIndex(h => h === 'category'),
      status:   first.findIndex(h => h === 'status')
    };
    startIdx = 1;
  } else {
    idx = { title: 0, creator: 1, type: 2, category: -1, status: 3 };
    startIdx = 0;
  }

  if (idx.title < 0) errors.push('No "title" column found — the first column will be used as the title.');

  for (let i = startIdx; i < rows.length; i++){
    const r = rows[i];
    if (!r || !r.length) continue;
    if (r.every(c => !String(c || '').trim())) continue;

    const get = k => (idx[k] >= 0 && r[idx[k]] !== undefined) ? String(r[idx[k]]).trim() : '';

    const title = get('title');
    if (!title){
      errors.push(`Row ${i + 1}: missing title — skipped.`);
      continue;
    }

    const typeKey = normalizeMaterialType(get('type'), get('category'));

    out.push({
      title,
      creator: get('creator'),
      default_input_type: typeKey,
      default_category: TYPES[typeKey].category,
      status: normalizeMaterialStatus(get('status'))
    });
  }

  return { rows: out, errors };
}

function materialsCSVTemplate(){
  const lines = ['title,creator,type,status'];
  lines.push('Project Hail Mary,Andy Weir,book,active');
  lines.push('Atomic Habits,James Clear,kindle,active');
  lines.push('The Daily,The New York Times,podcast,active');
  lines.push('Dune,Frank Herbert,audiobook,completed');
  lines.push('How to Learn a Language,Benny Lewis,article,archived');
  return lines.join('\n');
}

function openMaterialsImportModal(){
  let pending = [];
  let pendingErrors = [];

  openModal(`
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>Import materials from CSV</h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <p class="hint" style="margin:0 0 6px">
          Upload a CSV with a header row. These columns are recognised:
        </p>
        <div class="csv-cols">
          <code>title</code><code>creator</code><code>type</code><code>status</code>
        </div>
        <p class="hint" style="margin:0 0 14px">
          <b>title</b> is required. <b>type</b> accepts keys like <code>kindle</code>, <code>book</code>,
          <code>podcast</code>, <code>audiobook</code>, <code>tv</code>, <code>film</code>,
          <code>article</code>, <code>other</code> — or their labels ("Physical book").<br>
          <b>status</b> can be <code>active</code>, <code>completed</code> or <code>archived</code> (defaults to active).
        </p>

        <div class="csv-drop" id="csvDrop">
          <span class="big">📄</span>
          <div>Drag &amp; drop your CSV here, or
            <button type="button" class="link-btn" id="csvBrowse" style="color:var(--reading);font-weight:700">browse files</button>
          </div>
        </div>
        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" style="display:none">

        <div id="csvPreview"></div>
        <div id="csvNote"></div>

        <div class="modal-actions" style="margin-top:20px">
          <button type="button" class="btn btn-ghost" data-action="download-csv-template">⬇ Template</button>
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="csvImportBtn" disabled>Import</button>
        </div>
      </div>
    </div>
  `);

  const drop       = $('#csvDrop');
  const fileInput  = $('#csvFile');
  const preview    = $('#csvPreview');
  const note       = $('#csvNote');
  const importBtn  = $('#csvImportBtn');

  function renderPreview(){
    if (!pending.length && !pendingErrors.length){
      preview.innerHTML = '';
      note.innerHTML = '';
      importBtn.disabled = true;
      return;
    }

    if (pending.length){
      const rowsHtml = pending.slice(0, 50).map(r => `
        <tr>
          <td>${escapeHtml(r.title)}</td>
          <td>${escapeHtml(r.creator || '—')}</td>
          <td>${escapeHtml((TYPES[r.default_input_type] || { label: 'Other' }).label)}</td>
          <td>${escapeHtml(r.status)}</td>
        </tr>`).join('');

      preview.innerHTML = `
        <div class="csv-preview">
          <table>
            <thead><tr><th>Title</th><th>Creator</th><th>Type</th><th>Status</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        ${pending.length > 50 ? `<div style="font-size:12px;color:var(--muted);margin-top:8px">Showing first 50 of ${pending.length} rows.</div>` : ''}
      `;
    } else {
      preview.innerHTML = '';
    }

    const notes = [];
    if (pending.length){
      const existing = new Set(state.materials.map(m => (m.title || '').trim().toLowerCase()));
      const dupes = pending.filter(r => existing.has(r.title.toLowerCase())).length;
      notes.push(`<div class="csv-note ok"><b>${pending.length}</b> material${pending.length === 1 ? '' : 's'} ready to import.${dupes ? ` <span style="color:var(--warn-fg)">${dupes} duplicate title${dupes === 1 ? '' : 's'} will be skipped.</span>` : ''}</div>`);
    }
    if (pendingErrors.length){
      notes.push(`<div class="csv-note warn">${pendingErrors.length} row${pendingErrors.length === 1 ? '' : 's'} skipped: ${escapeHtml(pendingErrors.slice(0, 3).join(' '))}${pendingErrors.length > 3 ? ' …' : ''}</div>`);
    }
    note.innerHTML = notes.join('');

    importBtn.disabled = pending.length === 0;
  }

  function handleFile(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const parsed = parseMaterialsCSV(String(e.target.result || ''));
      pending = parsed.rows;
      pendingErrors = parsed.errors;
      renderPreview();
    };
    reader.onerror = () => {
      pending = [];
      pendingErrors = ['Could not read that file.'];
      renderPreview();
    };
    reader.readAsText(file);
  }

  $('#csvBrowse').addEventListener('click', () => fileInput.click());
  drop.addEventListener('click', e => {
    if (e.target.closest('#csvBrowse')) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    handleFile(f);
    e.target.value = '';
  });

  ['dragenter', 'dragover'].forEach(ev => {
    drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(ev => {
    drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(f);
  });

  importBtn.addEventListener('click', () => {
    if (!pending.length) return;
    const existing = new Set(state.materials.map(m => (m.title || '').trim().toLowerCase()));
    let added = 0, skipped = 0;

    pending.forEach(r => {
      const key = r.title.trim().toLowerCase();
      if (existing.has(key)){ skipped++; return; }
      existing.add(key);
      state.materials.push({
        id: uid('m'),
        challenge_id: state.challenge.id,
        title: r.title,
        creator: r.creator,
        default_input_type: r.default_input_type,
        default_category: r.default_category,
        status: r.status,
        cover_url: ''
      });
      added++;
    });

    saveState();
    closeModal();
    render();

    if (added && skipped){
      alert(`Imported ${added} material${added === 1 ? '' : 's'}. ${skipped} duplicate${skipped === 1 ? '' : 's'} skipped.`);
    } else if (added){
      alert(`Imported ${added} material${added === 1 ? '' : 's'}.`);
    } else {
      alert('Nothing to import — every title already exists.');
    }
  });
}

}

/* =========================================================
   Settings modal
   ========================================================= */
function openSettings(){
  const ch = state.challenge;
  const actCount = state.activities.length;
  const matCount = state.materials.length;
  const chCount  = state.customChallenges.length;
  const rivalCount = (state.rivals || []).length;
  const hasProfile = !!state.profile;

  openModal(`
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>Challenge settings</h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <form id="setForm" class="modal-body" autocomplete="off">
        <div class="field">
          <label for="setName">Challenge name</label>
          <input type="text" id="setName" value="${escapeHtml(ch.name)}">
        </div>
        <div class="field">
          <label for="setStart">Start date</label>
          <input type="date" id="setStart" value="${ch.start_date}">
        </div>
        <p class="hint">The challenge is 90 days long — the end date is set automatically.</p>
        <div class="field">
          <label for="setRead">Reading target (pages)</label>
          <input type="number" id="setRead" min="1" step="1" value="${ch.reading_target_pages}">
        </div>
        <div class="field">
          <label for="setListen">Listening target (minutes)</label>
          <input type="number" id="setListen" min="1" step="1" value="${ch.listening_target_minutes}">
        </div>

        <div class="data-block">
          <div class="data-title">Appearance</div>
          <p class="hint" style="margin:0 0 12px">
            Currently using the <b>${escapeHtml((THEMES.find(t => t.id === currentTheme) || THEMES[0]).name)}</b> theme.
            Five themes available — three light, two dark.
          </p>
          <button type="button" class="btn btn-ghost" data-action="open-theme">🎨 Change theme</button>
        </div>

        <div class="data-block">
          <div class="data-title">Profile</div>
          <p class="hint" style="margin:0 0 12px">
            ${hasProfile
              ? 'Your profile is active. You can edit it from the Profile tab at any time.'
              : 'No profile yet — create one to personalize the app and appear on the leaderboard.'}
          </p>
          <button type="button" class="btn btn-ghost" data-action="open-profile">
            ${hasProfile ? 'Edit profile' : 'Create profile'}
          </button>
        </div>

        <div class="data-block">
          <div class="data-title">Characters</div>
          <p class="hint" style="margin:0 0 12px">
            ${rivalCount} character${rivalCount === 1 ? '' : 's'} on the leaderboard.
            Create, edit, or delete them from the Leaderboard tab — or reset them all to the defaults below.
          </p>
          <div class="data-btns">
            <button type="button" class="btn btn-ghost" data-action="reset-rivals">↺ Reset characters</button>
          </div>
        </div>

        <div class="data-block">
          <div class="data-title">Data</div>
          <div class="data-btns">
            <button type="button" class="btn btn-ghost" data-action="export-json">⬇ Export JSON</button>
            <button type="button" class="btn btn-ghost" data-action="export-csv">⬇ Export CSV</button>
            <button type="button" class="btn btn-ghost" data-action="import-json">⬆ Import JSON</button>
          </div>
          <p class="hint" style="margin-top:12px">
            Export JSON saves a full backup (profile, ${actCount} activit${actCount === 1 ? 'y' : 'ies'},
            ${matCount} material${matCount === 1 ? '' : 's'}, ${chCount} challenge${chCount === 1 ? '' : 's'},
            ${rivalCount} character${rivalCount === 1 ? '' : 's'}, and settings).
            Export CSV lists activities only. Import replaces your current data.
          </p>
          <input type="file" id="importFile" accept=".json,application/json" style="display:none">
        </div>

        <div class="modal-actions" style="justify-content:space-between">
          <button type="button" class="btn btn-ghost" data-action="reset-all">Reset all data</button>
          <button type="submit" class="btn btn-primary">Save settings</button>
        </div>
      </form>
    </div>
  `);

  $('#setForm').addEventListener('submit', e => {
    e.preventDefault();
    ch.name = $('#setName').value.trim() || 'English Super Challenge';
    ch.start_date = $('#setStart').value || ch.start_date;
    ch.end_date = addDays(ch.start_date, 89);
    ch.reading_target_pages = Math.max(1, Number($('#setRead').value) || 6000);
    ch.listening_target_minutes = Math.max(1, Number($('#setListen').value) || 4500);
    saveState();
    closeModal();
    render();
  });
}

/* =========================================================
   Event handling
   ========================================================= */
document.addEventListener('click', e => {
  /* Theme pick */
  const themeBtn = e.target.closest('[data-theme-pick]');
  if (themeBtn){
    applyTheme(themeBtn.dataset.themePick);
    openThemeModal();   /* re-render the picker so the check moves */
    render();
    return;
  }

  /* Materials: view toggle */
  const viewBtn = e.target.closest('[data-matview]');
  if (viewBtn){
    materialsView = viewBtn.dataset.matview === 'list' ? 'list' : 'grid';
    try { localStorage.setItem(MATVIEW_KEY, materialsView); } catch (err) {}
    render();
    return;
  }

  /* Materials: category filter */
  const catBtn = e.target.closest('[data-matcat]');
  if (catBtn){
    materialsFilter.category = catBtn.dataset.matcat;
    render();
    return;
  }

  /* Materials: type filter */
  const typeBtn = e.target.closest('[data-mattype]');
  if (typeBtn){
    materialsFilter.type = typeBtn.dataset.mattype;
    render();
    return;
  }

  const navBtn = e.target.closest('[data-nav]');
  if (navBtn){
    currentView = navBtn.dataset.nav;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const metricBtn = e.target.closest('[data-metric]');
  if (metricBtn){
    progressMetric = metricBtn.dataset.metric;
    render();
    return;
  }

  const lbBtn = e.target.closest('[data-lbrange]');
  if (lbBtn){
    leaderboardRange = lbBtn.dataset.lbrange;
    render();
    return;
  }

  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;

  switch (action){
    case 'open-log':
      openLogModal(null);
      break;

    case 'close-modal':
      closeModal();
      break;

    /* ---- Info modals ---- */
    case 'info-materials':
      infoMaterials();
      break;

    case 'info-xp':
      infoXp();
      break;

    /* ---- Theme ---- */
    case 'open-theme':
      openThemeModal();
      break;

    /* ---- Profile ---- */
    case 'open-profile':
      openProfileModal(state.profile ? 'edit' : 'create');
      break;

    case 'welcome-create':
      localStorage.setItem(WELCOME_KEY, '1');
      openProfileModal('create');
      break;

    case 'close-welcome':
      localStorage.setItem(WELCOME_KEY, '1');
      closeModal();
      break;

    case 'open-settings':
      openSettings();
      break;

    /* ---- Characters ---- */
    case 'new-rival':
      openRivalModal(null);
      break;

    case 'edit-rival': {
      const r = (state.rivals || []).find(x => x.id === actionEl.dataset.id);
      if (r) openRivalModal(r);
      break;
    }

    case 'delete-rival': {
      const id = actionEl.dataset.id;
      const r = (state.rivals || []).find(x => x.id === id);
      if (!r) break;
      if (confirm(`Delete the character "${r.name}"?`)){
        state.rivals = state.rivals.filter(x => x.id !== id);
        saveState();
        closeModal();
        render();
      }
      break;
    }

    case 'reset-rivals':
      if (confirm('Reset all characters to their default values? Your custom characters will be lost.')){
        state.rivals = defaultRivals();
        saveState();
        closeModal();
        render();
      }
      break;

    /* ---- Activities ---- */
    case 'edit-activity': {
      const a = state.activities.find(x => x.id === actionEl.dataset.id);
      if (a) openLogModal(a);
      break;
    }

    case 'delete-activity': {
      const id = actionEl.dataset.id;
      const a = state.activities.find(x => x.id === id);
      if (!a) break;
      if (confirm(`Delete this ${fmt(a.amount)} ${a.unit === 'pages' ? 'page' : 'minute'} entry?`)){
        state.activities = state.activities.filter(x => x.id !== id);
        saveState();
        render();
      }
      break;
    }

    /* ---- Materials ---- */
    case 'add-material':
      openMaterialModal(null);
      break;

    case 'import-materials':
      openMaterialsImportModal();
      break;

    case 'download-csv-template':
      downloadMaterialsCSVTemplate();
      break;

    case 'toggle-mat-filters':
      materialsFiltersOpen = !materialsFiltersOpen;
      try { localStorage.setItem(MATFILTERS_KEY, materialsFiltersOpen ? '1' : '0'); } catch (err) {}
      render();
      break;

    case 'clear-material-filters':
      materialsFilter = { q: '', type: 'all', category: 'all' };
      render();
      break;

    case 'edit-material': {
      const m = materialById(actionEl.dataset.id);
      if (m) openMaterialModal(m);
      break;
    }

    case 'delete-material': {
      const id = actionEl.dataset.id;
      const m = materialById(id);
      if (!m) break;
      const count = state.activities.filter(a => a.material_id === id).length;
      const msg = count
        ? `Delete "${m.title}"? Its ${count} logged entr${count === 1 ? 'y' : 'ies'} will be kept but unlinked.`
        : `Delete "${m.title}"?`;
      if (confirm(msg)){
        state.materials = state.materials.filter(x => x.id !== id);
        state.activities.forEach(a => { if (a.material_id === id) a.material_id = null; });
        saveState();
        render();
      }
      break;
    }

    /* ---- Challenges ---- */
    case 'new-challenge':
      openChallengeModal(null);
      break;

    case 'edit-challenge': {
      const c = state.customChallenges.find(x => x.id === actionEl.dataset.id);
      if (c) openChallengeModal(c);
      break;
    }

    case 'delete-challenge': {
      const c = state.customChallenges.find(x => x.id === actionEl.dataset.id);
      if (!c) break;
      if (confirm(`Delete the challenge "${c.title}"?`)){
        state.customChallenges = state.customChallenges.filter(x => x.id !== c.id);
        saveState();
        render();
      }
      break;
    }

    case 'add-preset': {
      const p = CHALLENGE_PRESETS[Number(actionEl.dataset.preset)];
      if (!p) break;
      state.customChallenges.push({
        id: uid('c'),
        title: p.title,
        scope: p.scope,
        category: p.category,
        target: p.target,
        created_at: new Date().toISOString()
      });
      saveState();
      render();
      break;
    }

    /* ---- History ---- */
    case 'clear-filters':
      historyFilters = { from: '', to: '', category: 'all', type: 'all', material: 'all', q: '' };
      render();
      break;

    /* ---- Data ---- */
    case 'export-json':
      exportJSON();
      break;

    case 'export-csv':
      exportCSV();
      break;

    case 'import-json': {
      const fileInput = document.getElementById('importFile');
      if (fileInput) fileInput.click();
      break;
    }

    case 'reset-all':
      if (confirm('Reset everything? Your profile, activities, materials, challenges and settings will be permanently cleared.')){
        resetAll();
        closeModal();
        render();
      }
      break;
  }
});

/* ---- Filter inputs & file import ---- */
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'histFrom'){ historyFilters.from = t.value; render(); }
  else if (t.id === 'histTo'){ historyFilters.to = t.value; render(); }
  else if (t.id === 'histCategory'){ historyFilters.category = t.value; render(); }
  else if (t.id === 'histType'){ historyFilters.type = t.value; render(); }
  else if (t.id === 'histMaterial'){ historyFilters.material = t.value; render(); }
  else if (t.id === 'importFile'){
    const file = t.files && t.files[0];
    if (file) importJSONFile(file);
    t.value = '';
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'histSearch'){
    historyFilters.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderPreservingFocus, 220);
  }
  else if (e.target.id === 'matSearch'){
    materialsFilter.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderPreservingFocus, 220);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal();
});

/* =========================================================
   Boot
   ========================================================= */
applyTheme(currentTheme);
loadState();
render();
startTicker();
setTimeout(maybeShowWelcome, 700);
</script>
</body>
</html>
