  if (catBtn){ materialsFilter.category = catBtn.dataset.matcat; render(); return; }
  const typeBtn = e.target.closest('[data-mattype]');
  if (typeBtn){ materialsFilter.type = typeBtn.dataset.mattype; render(); return; }
  const matViewBtn = e.target.closest('[data-matview]');
  if (matViewBtn){
    materialsViewMode = matViewBtn.dataset.matview;
    try { localStorage.setItem(MATVIEW_KEY, materialsViewMode); } catch (err) {}
    render();
    return;
  }

  /* Roadmap view toggle */
  const rmViewBtn = e.target.closest('[data-rmview]');
  if (rmViewBtn){
    roadmapView = rmViewBtn.dataset.rmview;
    try { localStorage.setItem(RMVIEW_KEY, roadmapView); } catch (err) {}
    render();
    return;
  }

  /* Roadmap phase toggle */
  const rmPhaseToggle = e.target.closest('[data-action="rm-toggle-phase"]');
  if (rmPhaseToggle){
    const idx = Number(rmPhaseToggle.dataset.idx);
    roadmapOpenPhases[idx] = !roadmapOpenPhases[idx];
    render();
    return;
  }

  /* Roadmap week toggle */
  const rmWeekToggle = e.target.closest('[data-action="rm-toggle-week"]');
  if (rmWeekToggle){
    const idx = Number(rmWeekToggle.dataset.idx);
    roadmapOpenWeeks[idx] = !roadmapOpenWeeks[idx];
    render();
    return;
  }

  /* Nav */
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn){
    currentView = navBtn.dataset.nav;
    if (navBtn.dataset.rmview && ['phases','weeks','days','materials'].includes(navBtn.dataset.rmview)){
      roadmapView = navBtn.dataset.rmview;
      try { localStorage.setItem(RMVIEW_KEY, roadmapView); } catch (err) {}
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const metricBtn = e.target.closest('[data-metric]');
  if (metricBtn){ progressMetric = metricBtn.dataset.metric; render(); return; }

  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;

  switch (action){
    case 'open-log': openLogModal(null); break;
    case 'close-modal': closeModal(); break;

    /* Info */
    case 'info-materials': infoMaterials(); break;
    case 'info-roadmap': infoRoadmap(); break;

    /* Theme */
    case 'open-theme': openThemeModal(); break;

    /* Roadmap */
    case 'rm-edit-phases': openRmEditPhases(); break;
    case 'rm-add-milestone': openRmMilestoneModal(null); break;
    case 'rm-day-note': openRmDayNoteModal(actionEl.dataset.date); break;
    case 'rm-day-detail': openRmDayDetailModal(actionEl.dataset.date); break;
    case 'rm-heat-colorby':
      heatColorBy = actionEl.dataset.mode;
      try { localStorage.setItem(HEATCOLORBY_KEY, heatColorBy); } catch (err) {}
      render();
      break;
    case 'rm-clear-day-note': {
      delete state.roadmap.dailyNotes[actionEl.dataset.date];
      saveState(); closeModal(); render();
      break;
    }
    case 'rm-toggle-milestone': {
      const ms = state.roadmap.milestones.find(m => m.id === actionEl.dataset.id);
      if (ms){ ms.done = !ms.done; saveState(); render(); }
      break;
    }
    case 'rm-delete-milestone': {
      const id = actionEl.dataset.id;
      const ms = state.roadmap.milestones.find(m => m.id === id);
      if (!ms) break;
      if (confirm(`Delete the milestone "${ms.title}"?`)){
        state.roadmap.milestones = state.roadmap.milestones.filter(m => m.id !== id);
        saveState(); render();
      }
      break;
    }
    case 'rm-edit-milestone': {
      const ms = state.roadmap.milestones.find(m => m.id === actionEl.dataset.id);
      if (ms) openRmMilestoneModal(ms);
      break;
    }
    case 'rm-remove-week-material': {
      const idx = actionEl.dataset.idx;
      const mid = actionEl.dataset.mid;
      if (Array.isArray(state.roadmap.weeklyMaterials[idx])){
        state.roadmap.weeklyMaterials[idx] = state.roadmap.weeklyMaterials[idx].filter(id => id !== mid);
        saveState(); render();
      }
      break;
    }
    case 'rm-queue-up': {
      const phase = state.roadmap.phases[Number(actionEl.dataset.phase)];
      const i = Number(actionEl.dataset.idx);
      if (!phase || !Array.isArray(phase.materials) || i <= 0) break;
      [phase.materials[i - 1], phase.materials[i]] = [phase.materials[i], phase.materials[i - 1]];
      saveState(); render();
      break;
    }
    case 'rm-queue-down': {
      const phase = state.roadmap.phases[Number(actionEl.dataset.phase)];
      const i = Number(actionEl.dataset.idx);
      if (!phase || !Array.isArray(phase.materials) || i >= phase.materials.length - 1) break;
      [phase.materials[i + 1], phase.materials[i]] = [phase.materials[i], phase.materials[i + 1]];
      saveState(); render();
      break;
    }
    case 'rm-queue-remove': {
      const phase = state.roadmap.phases[Number(actionEl.dataset.phase)];
      const i = Number(actionEl.dataset.idx);
      if (!phase || !Array.isArray(phase.materials)) break;
      phase.materials.splice(i, 1);
      saveState(); render();
      break;
    }

    /* Profile */
    case 'open-profile': openProfileModal(state.profile ? 'edit' : 'create'); break;
    case 'welcome-create':
      localStorage.setItem(WELCOME_KEY, '1');
      openProfileModal('create');
      break;
    case 'close-welcome':
      localStorage.setItem(WELCOME_KEY, '1');
      closeModal();
      break;
    case 'open-settings': openSettings(); break;

    /* Activities */
    case 'edit-activity': {
      const a = state.activities.find(x => x.id === actionEl.dataset.id);
      if (a) openLogModal(a);
      break;
    }
    case 'delete-activity': {
      const id = actionEl.dataset.id;
      const a = state.activities.find(x => x.id === id);
      if (!a) break;
      if (confirm(`Delete this ${fmt(a.amount)}${a.unit === 'percent' ? '%' : '-minute'} entry?`)){
        state.activities = state.activities.filter(x => x.id !== id);
        saveState(); render();
      }
      break;
    }

    /* Materials */
    case 'add-material': openMaterialModal(null); break;
    case 'import-materials': openMaterialsImportModal(); break;
    case 'download-csv-template': downloadMaterialsCSVTemplate(); break;
    case 'toggle-mat-filters':
      materialsFiltersOpen = !materialsFiltersOpen;
      try { localStorage.setItem(MATFILTERS_KEY, materialsFiltersOpen ? '1' : '0'); } catch (err) {}
      render();
      break;
    case 'toggle-quickadd':
      quickAddOpen = !quickAddOpen;
      try { localStorage.setItem(QUICKADD_KEY, quickAddOpen ? '1' : '0'); } catch (err) {}
      render();
      break;
    case 'clear-material-filters':
      materialsFilter = { q: '', type: 'all', category: 'all' };
      render();
      break;
    case 'edit-material': {
      const m = materialById(actionEl.dataset.id);
      if (m) openMaterialModal(m);
      break;
    }
    case 'delete-material': {
      const id = actionEl.dataset.id;
      const m = materialById(id);
      if (!m) break;
      const count = state.activities.filter(a => a.material_id === id).length;
      const msg = count
        ? `Delete "${m.title}"? Its ${count} logged entr${count === 1 ? 'y' : 'ies'} will be kept but unlinked.`
        : `Delete "${m.title}"?`;
      if (confirm(msg)){
        state.materials = state.materials.filter(x => x.id !== id);
        state.activities.forEach(a => { if (a.material_id === id) a.material_id = null; });
        Object.keys(state.roadmap.weeklyMaterials).forEach(k => {
          state.roadmap.weeklyMaterials[k] = state.roadmap.weeklyMaterials[k].filter(mid => mid !== id);
        });
        state.roadmap.phases.forEach(p => { p.materials = p.materials.filter(mid => mid !== id); });
        saveState(); render();
      }
      break;
    }
    case 'toggle-subtasks': {
      const id = actionEl.dataset.id;
      if (expandedSubtasks.has(id)) expandedSubtasks.delete(id); else expandedSubtasks.add(id);
      render();
      break;
    }
    case 'toggle-material-subtask': {
      const m = materialById(actionEl.dataset.id);
      if (!m || !Array.isArray(m.subtasks)) break;
      const st = m.subtasks.find(s => s.id === actionEl.dataset.sub);
      if (st){ st.done = !st.done; saveState(); render(); }
      break;
    }

    /* Challenges */
    case 'new-challenge': openChallengeModal(null); break;
    case 'edit-challenge': {
      const c = state.customChallenges.find(x => x.id === actionEl.dataset.id);
      if (c) openChallengeModal(c);
      break;
    }
    case 'delete-challenge': {
      const c = state.customChallenges.find(x => x.id === actionEl.dataset.id);
      if (!c) break;
      if (confirm(`Delete the challenge "${c.title}"?`)){
        state.customChallenges = state.customChallenges.filter(x => x.id !== c.id);
        saveState(); render();
      }
      break;
    }
    case 'add-preset': {
      const group = actionEl.dataset.group === 'intensive' ? INTENSIVE_CHALLENGE_PRESETS : CHALLENGE_PRESETS;
      const p = group[Number(actionEl.dataset.preset)];
      if (!p) break;
      state.customChallenges.push({
        id: uid('c'), title: p.title, scope: p.scope,
        category: p.category, target: p.target,
        created_at: new Date().toISOString()
      });
      saveState(); render();
      break;
    }

    /* History */
    case 'clear-filters':
      historyFilters = { from: '', to: '', category: 'all', type: 'all', material: 'all', q: '' };
      render();
      break;

    /* Data */
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import-json': {
      const fileInput = document.getElementById('importFile');
      if (fileInput) fileInput.click();
      break;
    }
    case 'reset-all':
      if (confirm('Reset everything? Your profile, activities, materials, challenges, roadmap and settings will be permanently cleared.')){
        resetAll(); closeModal(); render();
      }
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'histFrom'){ historyFilters.from = t.value; render(); }
  else if (t.id === 'histTo'){ historyFilters.to = t.value; render(); }
  else if (t.id === 'histCategory'){ historyFilters.category = t.value; render(); }
  else if (t.id === 'histType'){ historyFilters.type = t.value; render(); }
  else if (t.id === 'histMaterial'){ historyFilters.material = t.value; render(); }
  else if (t.id === 'importFile'){
    const file = t.files && t.files[0];
    if (file) importJSONFile(file);
    t.value = '';
  }
  else if (t.matches && t.matches('[data-action="rm-add-week-material"]')){
    const idx = t.dataset.idx;
    const mid = t.value;
    if (mid){
      if (!Array.isArray(state.roadmap.weeklyMaterials[idx])) state.roadmap.weeklyMaterials[idx] = [];
      if (!state.roadmap.weeklyMaterials[idx].includes(mid)) state.roadmap.weeklyMaterials[idx].push(mid);
      saveState(); render();
    }
  }
  else if (t.matches && t.matches('[data-action="rm-add-phase-material"]')){
    const targetIdx = Number(t.dataset.idx);
    const phase = state.roadmap.phases[targetIdx];
    const mid = t.value;
    if (phase && mid){
      // Exclusive: a material can only live in one phase's queue, so drop
      // it from every other phase before adding it here.
      state.roadmap.phases.forEach((p, i) => {
        if (i === targetIdx || !Array.isArray(p.materials)) return;
        p.materials = p.materials.filter(id => id !== mid);
      });
      if (!Array.isArray(phase.materials)) phase.materials = [];
      if (!phase.materials.includes(mid)) phase.materials.push(mid);
      saveState(); render();
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'histSearch'){
    historyFilters.q = t.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderPreservingFocus, 220);
  } else if (t.id === 'matSearch'){
    materialsFilter.q = t.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderPreservingFocus, 220);
  } else if (t.matches && t.matches('[data-action="rm-set-week-note"]')){
    const idx = t.dataset.idx;
    const val = t.value.slice(0, 200);
    if (val) state.roadmap.weeklyNotes[idx] = val;
    else delete state.roadmap.weeklyNotes[idx];
    clearTimeout(weekNoteTimer);
    weekNoteTimer = setTimeout(saveState, 400);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal();
});

/* =========================================================
   Boot
   ========================================================= */
applyTheme(currentTheme);
loadState();
render();
startTicker();
setTimeout(maybeShowWelcome, 700);
</script>
</body>
</html>
