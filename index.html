<!DOCTYPE html>
<html lang="en" data-theme="sand">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>English Super Challenge</title>
<style>
  /* =========================================================
     Themes
     ========================================================= */
  :root, html[data-theme="sand"]{
    --bg:#FAF7F3;
    --surface:#FFFFFF;
    --surface-2:#F4EFE9;
    --line:#EAE2D8;
    --text:#26211C;
    --muted:#8A7F73;
    --reading:#C2703D;
    --reading-2:#D89A6C;
    --listening:#3F7A6E;
    --listening-2:#66A093;
    --xp:#A9855C;
    --good-bg:#E2F0E9;  --good-fg:#2F6B54;
    --ok-bg:#EBF1E7;    --ok-fg:#4B6B36;
    --warn-bg:#FBF0DC;  --warn-fg:#8A6420;
    --bad-bg:#FBE6E1;   --bad-fg:#9C4230;
    --info-bg:#EAEFF5;  --info-fg:#3E5B78;
    --neutral-bg:#F0ECE6; --neutral-fg:#8A7F73;
    --tag-bg:#F1E7DC;   --tag-fg:#8A5A2B;
    --hover-line:#D6C7B4;
    --focus-line:#CDBBA6;
    --dash-line:#C9B9A6;
    --bar-bg:#E5DCD0;
    --prompt-border:#E4D6C5;
    --hdr-bg:rgba(250,247,243,.88);
    --backdrop:rgba(38,33,28,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(38,33,28,.04), 0 10px 26px -16px rgba(38,33,28,.28);
    --radius:16px;
    color-scheme:light;
  }

  html[data-theme="mint"]{
    --bg:#F3F8F4;
    --surface:#FFFFFF;
    --surface-2:#E9F1EB;
    --line:#DAE7DE;
    --text:#1A2620;
    --muted:#6E8378;
    --reading:#2F7A57;
    --reading-2:#68A98A;
    --listening:#2F6E8A;
    --listening-2:#6EA0B8;
    --xp:#7A8C4A;
    --good-bg:#DDF0E4;  --good-fg:#25674A;
    --ok-bg:#E5EFE3;    --ok-fg:#4A6B34;
    --warn-bg:#F7EFD9;  --warn-fg:#836018;
    --bad-bg:#F9E3DD;   --bad-fg:#943D2B;
    --info-bg:#E2EEF3;  --info-fg:#356278;
    --neutral-bg:#EBEFEA; --neutral-fg:#6E8378;
    --tag-bg:#E2EFE6;   --tag-fg:#2F6B50;
    --hover-line:#C4D6CB;
    --focus-line:#B6CCBF;
    --dash-line:#B6CCBF;
    --bar-bg:#DCE8E0;
    --prompt-border:#D5E5DB;
    --hdr-bg:rgba(243,248,244,.88);
    --backdrop:rgba(20,35,27,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(26,38,32,.04), 0 10px 26px -16px rgba(26,38,32,.25);
    color-scheme:light;
  }

  html[data-theme="lavender"]{
    --bg:#F8F6FC;
    --surface:#FFFFFF;
    --surface-2:#F0EBF7;
    --line:#E3DCF0;
    --text:#211C2B;
    --muted:#7C7489;
    --reading:#7A5EA8;
    --reading-2:#A98FD0;
    --listening:#3E7C8A;
    --listening-2:#74A7B3;
    --xp:#A9855C;
    --good-bg:#E4F0E8;  --good-fg:#2E6B52;
    --ok-bg:#EBF1E7;    --ok-fg:#4B6B36;
    --warn-bg:#FBF0DC;  --warn-fg:#8A6420;
    --bad-bg:#FBE6E1;   --bad-fg:#9C4230;
    --info-bg:#E7E9F6;  --info-fg:#47528F;
    --neutral-bg:#EDE9F1; --neutral-fg:#7C7489;
    --tag-bg:#EDE4F6;   --tag-fg:#6A4E9A;
    --hover-line:#CFC4E0;
    --focus-line:#C0B2D6;
    --dash-line:#C0B2D6;
    --bar-bg:#E3DAF0;
    --prompt-border:#E0D6EE;
    --hdr-bg:rgba(248,246,252,.88);
    --backdrop:rgba(28,22,40,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(33,28,43,.04), 0 10px 26px -16px rgba(33,28,43,.28);
    color-scheme:light;
  }

  html[data-theme="midnight"]{
    --bg:#11141A;
    --surface:#181D25;
    --surface-2:#212832;
    --line:#2C3542;
    --text:#E7ECF3;
    --muted:#8A95A6;
    --reading:#E29A62;
    --reading-2:#B9743F;
    --listening:#63B3A2;
    --listening-2:#3F7A6E;
    --xp:#CBA97C;
    --good-bg:#17352A;  --good-fg:#7FD3AD;
    --ok-bg:#26331C;    --ok-fg:#B3D48C;
    --warn-bg:#382C15;  --warn-fg:#E8C377;
    --bad-bg:#3A1E19;   --bad-fg:#EFA08A;
    --info-bg:#1B2A3A;  --info-fg:#96BEE6;
    --neutral-bg:#262C35; --neutral-fg:#9AA4B2;
    --tag-bg:#38291B;   --tag-fg:#E5BA85;
    --hover-line:#3B4653;
    --focus-line:#4A5765;
    --dash-line:#4A5765;
    --bar-bg:#2C3542;
    --prompt-border:#33404E;
    --hdr-bg:rgba(17,20,26,.88);
    --backdrop:rgba(0,0,0,.58);
    --on-accent:#14181E;
    --shadow:0 1px 2px rgba(0,0,0,.32), 0 10px 26px -16px rgba(0,0,0,.72);
    color-scheme:dark;
  }

  html[data-theme="espresso"]{
    --bg:#16120F;
    --surface:#1F1A15;
    --surface-2:#2A231C;
    --line:#392F26;
    --text:#F0E8DF;
    --muted:#9E9184;
    --reading:#E39A62;
    --reading-2:#B9743F;
    --listening:#6FB6A6;
    --listening-2:#3F7A6E;
    --xp:#CFAC7C;
    --good-bg:#1B352A;  --good-fg:#84D2AE;
    --ok-bg:#2A331D;    --ok-fg:#B7D590;
    --warn-bg:#3A2D16;  --warn-fg:#EAC57B;
    --bad-bg:#3C1F19;   --bad-fg:#F0A48D;
    --info-bg:#2A2A38;  --info-fg:#A0B4D8;
    --neutral-bg:#2C2520; --neutral-fg:#A69A8C;
    --tag-bg:#3A2A1A;   --tag-fg:#E5BA85;
    --hover-line:#463A2F;
    --focus-line:#54463A;
    --dash-line:#54463A;
    --bar-bg:#392F26;
    --prompt-border:#3E332A;
    --hdr-bg:rgba(22,18,15,.88);
    --backdrop:rgba(0,0,0,.6);
    --on-accent:#1A1512;
    --shadow:0 1px 2px rgba(0,0,0,.38), 0 10px 26px -16px rgba(0,0,0,.78);
    color-scheme:dark;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transition:background .2s ease, color .2s ease;
  }
  button{font-family:inherit}

  /* ---------- Header ---------- */
  .hdr{
    position:sticky;top:0;z-index:50;
    background:var(--hdr-bg);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .hdr-top{
    max-width:1080px;margin:0 auto;
    padding:14px 20px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{
    width:36px;height:36px;flex:0 0 auto;border-radius:11px;
    background:linear-gradient(140deg,var(--reading-2),var(--reading));
    color:var(--on-accent);font-size:11px;font-weight:800;letter-spacing:.06em;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px -6px color-mix(in srgb, var(--reading) 70%, transparent);
  }
  .brand-txt{min-width:0}
  .brand-txt h1{font-size:15.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-txt p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}

  /* Profile pill in header */
  .profile-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:3px 12px 3px 3px;
    cursor:pointer;transition:background .15s, border-color .15s;
    font-family:inherit;color:var(--text);min-width:0;
  }
  .profile-btn:hover{background:var(--surface-2);border-color:var(--hover-line)}
  .profile-avatar-sm{
    width:28px;height:28px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;font-weight:700;line-height:1;
  }
  .profile-name-sm{
    font-size:13px;font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:110px;
  }
  @media(max-width:640px){
    .profile-btn{padding:3px}
    .profile-btn .profile-name-sm{display:none}
  }

  .tabs{
    max-width:1080px;margin:0 auto;
    padding:0 20px 10px;
    display:flex;gap:5px;overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs button,
  .tabs a{
    flex:0 0 auto;border:0;background:transparent;
    padding:7px 14px;border-radius:999px;
    font-size:13.5px;font-weight:550;color:var(--muted);
    cursor:pointer;transition:background .15s,color .15s;
    text-decoration:none;display:inline-block;line-height:1.45;
    font-family:inherit;
  }
  .tabs button:hover,
  .tabs a:hover{color:var(--text)}
  .tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .tabs a .ext{font-size:11px;opacity:.7;margin-left:1px}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid transparent;border-radius:11px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
    transition:transform .08s ease, filter .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.975)}
  .btn-primary{background:var(--reading);color:var(--on-accent);box-shadow:0 6px 16px -8px color-mix(in srgb, var(--reading) 75%, transparent)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn-block{width:100%;margin-top:14px;padding:13px}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--text)}
  .link-btn{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:8px}
  .link-btn:hover{color:var(--text);background:var(--surface-2)}
  .link-btn.danger:hover{color:var(--bad-fg);background:var(--bad-bg)}

  /* Small round info button */
  .info-btn{
    width:26px;height:26px;border-radius:50%;flex:0 0 auto;
    border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-size:12px;font-weight:800;font-style:normal;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;line-height:1;
    transition:background .15s,color .15s,border-color .15s;
    font-family:Georgia,"Times New Roman",serif;
  }
  .info-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--hover-line)}

  /* Info modal body */
  .info-body{font-size:13.5px;line-height:1.65;color:var(--text)}
  .info-body p{margin:0 0 11px}
  .info-body p:last-child{margin-bottom:0}
  .info-body b{font-weight:650}
  .info-body code{
    background:var(--surface-2);border:1px solid var(--line);
    border-radius:6px;padding:1px 6px;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  /* ---------- Layout ---------- */
  main{max-width:1080px;margin:0 auto;padding:20px 20px 120px}
  .grid{display:grid;gap:14px;margin-bottom:14px}
  .cols-2,.cols-3{grid-template-columns:1fr}
  @media(min-width:780px){
    .cols-2{grid-template-columns:1fr 1fr}
    .cols-3{grid-template-columns:repeat(3,1fr)}
  }
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .card-head h2{
    font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  }

  /* ---------- Countdown / period clock ---------- */
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .lb-clock{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:linear-gradient(90deg,color-mix(in srgb, var(--reading) 10%, transparent),color-mix(in srgb, var(--reading) 2%, transparent));
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  }
  .lb-clock .k{
    display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:3px;
  }
  .lb-clock-cell .v{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .lb-clock-main strong{
    display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;
    line-height:1.05;color:var(--reading);
  }
  .lb-clock-side{text-align:right}
  @media(max-width:520px){
    .lb-clock{gap:12px}
    .lb-clock-main strong{font-size:26px}
    .lb-clock-side{text-align:left}
  }

  /* ---------- Profile page ---------- */
  .profile-hero{
    display:flex;gap:18px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);margin-bottom:14px;flex-wrap:wrap;
  }
  .profile-avatar-lg{
    width:84px;height:84px;border-radius:24px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:38px;font-weight:700;line-height:1;
    box-shadow:0 10px 22px -12px rgba(0,0,0,.5);
  }
  .profile-hero-main{flex:1;min-width:0}
  .profile-hero-main h2{
    font-size:22px;font-weight:680;letter-spacing:-.02em;line-height:1.2;
  }
  .profile-handle{
    font-size:13.5px;color:var(--muted);margin-top:2px;font-weight:550;
  }
  .profile-bio{
    font-size:13.5px;color:var(--text);margin-top:9px;line-height:1.55;max-width:560px;
  }
  .profile-meta{
    display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;
    font-size:12.5px;color:var(--muted);
  }
  .profile-meta span{display:inline-flex;align-items:center;gap:5px}
  .profile-hero-actions{
    display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap;
  }
  .profile-empty{
    text-align:center;padding:36px 20px;
  }
  .profile-empty .em-icon{font-size:34px;margin-bottom:14px;opacity:.6}

  /* Profile completeness bar */
  .completeness{
    margin-top:14px;padding:12px 14px;
    background:var(--surface-2);border-radius:12px;
  }
  .completeness-top{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-size:12.5px;margin-bottom:8px;
  }
  .completeness-top b{font-weight:680;font-size:13.5px}
  .completeness-bar{height:7px;background:var(--bar-bg);border-radius:999px;overflow:hidden}
  .completeness-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--reading-2),var(--reading));transition:width .4s ease}

  /* Detail rows */
  .det{
    display:flex;align-items:flex-start;gap:11px;
    padding:10px 0;border-bottom:1px solid var(--line);
  }
  .det:last-child{border-bottom:0;padding-bottom:0}
  .det:first-child{padding-top:0}
  .det-icon{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);font-size:14px;
  }
  .det-main{flex:1;min-width:0}
  .det-k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .det-v{font-size:13.5px;font-weight:550;margin-top:1px;word-break:break-word}
  .det-v.muted{color:var(--muted);font-weight:500;font-style:italic}

  /* Genre tags */
  .tag-list{display:flex;flex-wrap:wrap;gap:7px}
  .tag{
    font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
    background:var(--tag-bg);color:var(--tag-fg);
  }
  .tag.empty{background:transparent;color:var(--muted);font-weight:500;font-style:italic;padding:0}

  /* Social links */
  .social-row{
    display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
  }
  .social-row:last-child{border-bottom:0;padding-bottom:0}
  .social-row:first-child{padding-top:0}
  .social-row .s-ic{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);font-size:14px;
  }
  .social-row .s-main{flex:1;min-width:0}
  .social-row .s-k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .social-row .s-v{font-size:13.5px;font-weight:550;color:var(--reading);text-decoration:none;word-break:break-all}
  .social-row .s-v:hover{text-decoration:underline}

  /* ---------- Avatar picker ---------- */
  .avatar-preview-row{
    display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;
  }
  .avatar-preview{
    width:72px;height:72px;border-radius:20px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:32px;font-weight:700;line-height:1;
  }
  .avatar-preview-label{font-size:12.5px;color:var(--muted);max-width:240px}

  .picker-label{
    font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .emoji-grid{
    display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:14px;
  }
  .emoji-grid button{
    aspect-ratio:1;border:1px solid var(--line);background:var(--surface);
    border-radius:10px;font-size:18px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s ease, border-color .15s;
    padding:0;
  }
  .emoji-grid button:hover{border-color:var(--hover-line);transform:scale(1.06)}
  .emoji-grid button.active{border-color:var(--reading);box-shadow:0 0 0 2px color-mix(in srgb, var(--reading) 25%, transparent)}
  @media(max-width:520px){.emoji-grid{grid-template-columns:repeat(8,1fr)}}

  .swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .swatch{
    width:30px;height:30px;border-radius:9px;border:2px solid transparent;
    cursor:pointer;transition:transform .08s ease;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .swatch:hover{transform:scale(1.08)}
  .swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}

  /* ---------- Range input ---------- */
  input[type=range]{
    width:100%;height:6px;
    -webkit-appearance:none;appearance:none;
    background:var(--surface-2);border-radius:999px;
    outline:none;padding:0;border:0;margin:6px 0 2px;
    box-shadow:none;
  }
  input[type=range]:focus{box-shadow:none}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;
    background:var(--reading);cursor:pointer;
    border:2px solid var(--surface);
    box-shadow:0 2px 6px color-mix(in srgb, var(--reading) 45%, transparent);
  }
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);
    background:var(--reading);cursor:pointer;
    box-shadow:0 2px 6px color-mix(in srgb, var(--reading) 45%, transparent);
  }

  /* Section header inside modal */
  .form-section{
    margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  }
  .form-section:first-of-type{margin-top:6px;padding-top:0;border-top:0}
  .form-section-title{
    font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
    display:flex;align-items:center;gap:7px;
  }
  .form-section-title .dotnum{
    width:18px;height:18px;border-radius:50%;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--muted);letter-spacing:0;
  }

  /* ---------- Progress cards ---------- */
  .progress-card .pct{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .big-numbers{display:flex;align-items:baseline;gap:7px;margin-bottom:14px;flex-wrap:wrap}
  .big-numbers strong{font-size:31px;font-weight:680;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .big-numbers span{font-size:13.5px;color:var(--muted)}
  .bar{position:relative;height:10px;background:var(--surface-2);border-radius:999px}
  .bar-fill{height:100%;border-radius:999px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .reading .bar-fill{background:linear-gradient(90deg,var(--reading-2),var(--reading))}
  .listening .bar-fill{background:linear-gradient(90deg,var(--listening-2),var(--listening))}
  .bar-ideal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.22;border-radius:2px}
  .bar-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .pace-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pace-tag.good{background:var(--good-bg);color:var(--good-fg)}
  .pace-tag.ok{background:var(--ok-bg);color:var(--ok-fg)}
  .pace-tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
  .pace-tag.bad{background:var(--bad-bg);color:var(--bad-fg)}

  /* ---------- Stat cards ---------- */
  .stat-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .stat-value{font-size:27px;font-weight:680;letter-spacing:-.025em;margin-top:7px;font-variant-numeric:tabular-nums}
  .stat-value small{font-size:13px;font-weight:550;color:var(--muted);letter-spacing:0}
  .stat-sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  /* ---------- Pace rows ---------- */
  .pace-row{padding:11px 0;border-bottom:1px solid var(--line)}
  .pace-row:last-child{border-bottom:0;padding-bottom:0}
  .pace-row:first-child{padding-top:0}
  .pace-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .pace-row-top .lbl{font-size:13.5px;font-weight:600}
  .pace-row-top .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pace-row-top .val b{color:var(--text);font-weight:650}
  .mini-bar{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .mini-bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
  .reading .mini-bar i{background:var(--reading)}
  .listening .mini-bar i{background:var(--listening)}

  /* ---------- Activity list ---------- */
  .act{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .act:last-of-type{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dot.reading{background:var(--reading)}
  .dot.listening{background:var(--listening)}
  .act-main{flex:1;min-width:0}
  .act-title{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-meta{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-amount{font-size:14px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
  .act-amount small{font-size:11.5px;font-weight:550;color:var(--muted)}
  .act-actions{display:flex;gap:2px;flex:0 0 auto}

  /* ---------- History ---------- */
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  @media(min-width:780px){.filters{grid-template-columns:repeat(3,1fr)}}
  .filters .full{grid-column:1/-1}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field > label{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.01em}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],textarea,select{
    width:100%;border:1px solid var(--line);background:var(--surface);
    border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit;
    color:var(--text);outline:none;transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none;appearance:none;
  }
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238A7F73' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
  input:focus,textarea:focus,select:focus{border-color:var(--focus-line);box-shadow:0 0 0 3px color-mix(in srgb, var(--reading) 12%, transparent)}
  textarea{resize:vertical;min-height:56px}
  .day-group{margin-bottom:18px}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .day-head .d{font-size:13.5px;font-weight:650}
  .day-head .tot{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- Materials ---------- */
  .mat{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
  .mat:last-child{border-bottom:0}
  .mat-icon{
    width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:750;letter-spacing:.03em;color:var(--on-accent);
  }
  .mat-icon.reading{background:linear-gradient(140deg,var(--reading-2),var(--reading))}
  .mat-icon.listening{background:linear-gradient(140deg,var(--listening-2),var(--listening))}
  .mat-main{flex:1;min-width:0}
  .mat-title{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .mat-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
  .pill.active{background:var(--good-bg);color:var(--good-fg)}
  .pill.completed{background:var(--info-bg);color:var(--info-fg)}
  .pill.archived{background:var(--neutral-bg);color:var(--neutral-fg)}
  .mat-tot{font-size:12.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}

  /* Materials toolbar */
  .mat-toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;
  }
  .mat-search{flex:1;min-width:170px}
  .mat-search input{padding:9px 13px;font-size:14px}
  .mat-toolbar .seg button{padding:8px 12px;font-size:12.5px}

  .mat-chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .mat-chip-row .chip{padding:6px 11px;font-size:12.5px}

  .mat-filters-wrap{
    overflow:hidden;
    transition:max-height .28s ease, opacity .2s ease, margin .2s ease;
    max-height:400px;
    opacity:1;
  }
  .mat-filters-wrap.collapsed{
    max-height:0;
    opacity:0;
  }

  .mat-group-head{
    display:flex;align-items:center;gap:9px;margin:20px 2px 12px;
  }
  .mat-group-head:first-of-type{margin-top:6px}
  .mat-group-head .gdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .mat-group-head .gdot.reading{background:var(--reading)}
  .mat-group-head .gdot.listening{background:var(--listening)}
  .mat-group-head .gt{font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .mat-group-head .gn{
    font-size:11.5px;font-weight:700;color:var(--muted);
    background:var(--surface-2);padding:2px 9px;border-radius:999px;
  }
  .mat-group-head .gline{flex:1;height:1px;background:var(--line);border-radius:1px}

  /* Filter toggle button with active badge */
  .filter-toggle{display:inline-flex;align-items:center;gap:6px}
  .filter-toggle .fcount{
    font-size:10.5px;font-weight:800;
    background:var(--reading);color:var(--on-accent);
    border-radius:999px;padding:1px 7px;line-height:1.5;
  }

  /* Grid view */
  .mat-grid{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  }
  @media(max-width:520px){
    .mat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  }
  .mat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    display:flex;flex-direction:column;gap:9px;
    min-width:0;
    box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .1s ease;
  }
  .mat-card:hover{border-color:var(--hover-line);transform:translateY(-1px)}
  .mat-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .mat-card-actions{display:flex;gap:0;flex:0 0 auto;margin:-4px -4px 0 0}
  .mat-card-actions .link-btn{font-size:12px;padding:3px 6px}
  .mat-card-title{
    font-size:14.5px;font-weight:640;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;
  }
  .mat-card-sub{
    font-size:12.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mat-card-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
  .mat-type-pill{
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
    letter-spacing:.04em;text-transform:uppercase;
    background:var(--surface-2);color:var(--muted);
  }
  .mat-card-tot{
    font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
    margin-top:auto;padding-top:8px;border-top:1px solid var(--line);
  }

  /* ---------- Charts ---------- */
  .seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .chart{display:flex;gap:3px;height:170px;position:relative}
  .chart .col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .chart .bar-wrap{flex:1;display:flex;align-items:flex-end}
  .chart .fill{width:100%;border-radius:4px;min-height:3px;transition:height .4s ease}
  .chart .fill.reading{background:var(--reading)}
  .chart .fill.listening{background:var(--listening)}
  .chart .fill.muted{background:var(--surface-2)}
  .chart .lbl{font-size:9.5px;color:var(--muted);text-align:center;flex:0 0 auto;height:12px;line-height:12px;white-space:nowrap;overflow:hidden}
  .target-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--dash-line);pointer-events:none}
  .chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
  .chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .cum-chart{width:100%;height:190px;display:block;border-radius:10px;overflow:visible}
  .chart-note{font-size:11.5px;color:var(--muted);margin-top:10px}

  /* ---------- Challenges ---------- */
  .chal{padding:14px 0;border-bottom:1px solid var(--line)}
  .chal:last-child{border-bottom:0;padding-bottom:0}
  .chal:first-child{padding-top:0}
  .chal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .chal-title{font-size:14.5px;font-weight:620;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
  .chal-actions{display:flex;gap:2px;flex:0 0 auto}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
  .badge.daily{background:var(--tag-bg);color:var(--tag-fg)}
  .badge.weekly{background:var(--info-bg);color:var(--info-fg)}
  .badge.done{background:var(--good-bg);color:var(--good-fg)}
  .chal-bar{height:8px;background:var(--surface-2);border-radius:999px;margin:11px 0 8px;overflow:hidden}
  .chal-bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
  .chal-bar.reading i{background:linear-gradient(90deg,var(--reading-2),var(--reading))}
  .chal-bar.listening i{background:linear-gradient(90deg,var(--listening-2),var(--listening))}
  .chal-bar.xp i{background:linear-gradient(90deg,var(--reading-2),var(--xp))}
  .chal-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
  .chal-timer{
    display:flex;align-items:center;gap:6px;margin-top:7px;
    font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .chal-timer b{color:var(--text);font-weight:650}

  /* ---------- Leaderboard ---------- */
  .lb-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .lb-row:last-child{border-bottom:0}
  .lb-row.you{
    background:linear-gradient(90deg,color-mix(in srgb, var(--reading) 10%, transparent),transparent);
    border-radius:12px;padding-left:8px;padding-right:8px;margin:0 -8px;border-bottom-color:transparent;
  }
  .lb-rank{width:26px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .lb-row.you .lb-rank{color:var(--reading)}
  .lb-avatar{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:750;letter-spacing:.03em}
  .lb-main{flex:1;min-width:0}
  .lb-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .lb-name{font-size:13.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-handle{font-size:11.5px;color:var(--muted);font-weight:500}
  .lb-xp{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .lb-bar{height:5px;background:var(--surface-2);border-radius:999px;margin:5px 0 4px;overflow:hidden}
  .lb-bar i{display:block;height:100%;border-radius:999px;background:var(--reading-2);transition:width .4s ease}
  .lb-row.you .lb-bar i{background:var(--reading)}
  .lb-sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  .lb-edit{
    width:32px;height:32px;border-radius:9px;flex:0 0 auto;
    border:1px solid transparent;background:transparent;
    color:var(--muted);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s, color .15s, border-color .15s;
    padding:0;line-height:1;
  }
  .lb-edit:hover{background:var(--surface-2);color:var(--text);border-color:var(--line)}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:100;animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    position:fixed;z-index:101;left:50%;bottom:0;width:100%;max-width:560px;
    transform:translateX(-50%);
    background:var(--surface);border-radius:22px 22px 0 0;
    max-height:93vh;overflow-y:auto;
    box-shadow:0 -10px 40px -12px rgba(0,0,0,.45);
  }
  @media(min-width:640px){
    .modal{top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:22px;max-height:88vh}
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 20px 14px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--surface);border-radius:22px 22px 0 0;z-index:2;
  }
  .modal-head h2{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .modal-body{padding:18px 20px 22px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
  .hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
  .welcome-lead{
    font-size:14px;line-height:1.6;color:var(--text);
    background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-bottom:18px;
  }
  .welcome-lead b{font-weight:650}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1px solid var(--line);background:var(--surface);color:var(--text);
    padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:550;cursor:pointer;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--hover-line)}
  .chip.active{background:var(--text);color:var(--bg);border-color:transparent}
  .chip.active[data-cat="reading"]{background:var(--reading);color:var(--on-accent)}
  .chip.active[data-cat="listening"]{background:var(--listening);color:var(--on-accent)}
  .chip.active[data-cat="xp"]{background:var(--xp);color:var(--on-accent)}

  .ac{position:relative}
  .ac-list{
    position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:20;
    background:var(--surface);border:1px solid var(--line);border-radius:13px;
    box-shadow:0 14px 30px -14px rgba(0,0,0,.35);
    max-height:210px;overflow-y:auto;display:none;
  }
  .ac-list.open{display:block}
  .ac-item{padding:10px 13px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .ac-item:hover{background:var(--surface-2)}
  .ac-item small{color:var(--muted);font-size:11.5px;flex:0 0 auto}

  .amount-row{display:flex;gap:10px;align-items:stretch}
  .amount-row input{flex:1;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
  .amount-row .seg{flex:0 0 auto;align-items:center}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.two-col{grid-template-columns:1fr}}

  /* ---------- Data section (inside settings modal) ---------- */
  .data-block{
    margin-top:8px;padding-top:18px;border-top:1px solid var(--line);
  }
  .data-block .data-title{
    font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }
  .data-btns{display:flex;gap:8px;flex-wrap:wrap}
  .data-btns .btn{flex:1 1 auto;justify-content:center;display:inline-flex;align-items:center;gap:6px}

  /* ---------- CSV import ---------- */
  .csv-drop{
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:26px 16px;
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
    transition:border-color .15s, background .15s;
    cursor:pointer;
    background:var(--surface);
  }
  .csv-drop:hover{border-color:var(--hover-line)}
  .csv-drop.over{border-color:var(--reading);background:var(--surface-2)}
  .csv-drop .big{font-size:26px;display:block;margin-bottom:8px;opacity:.65}
  .csv-cols{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
  .csv-cols code{
    background:var(--surface-2);border:1px solid var(--line);
    border-radius:8px;padding:4px 9px;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);
  }
  .csv-preview{
    margin-top:14px;max-height:210px;overflow:auto;
    border:1px solid var(--line);border-radius:12px;
  }
  .csv-preview table{width:100%;border-collapse:collapse;font-size:12.5px}
  .csv-preview th,.csv-preview td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .csv-preview th{
    background:var(--surface-2);font-weight:700;color:var(--muted);
    font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    position:sticky;top:0;
  }
  .csv-preview tr:last-child td{border-bottom:0}
  .csv-note{font-size:12.5px;margin-top:12px;line-height:1.5}
  .csv-note.err{color:var(--bad-fg)}
  .csv-note.ok{color:var(--good-fg)}
  .csv-note.warn{color:var(--warn-fg)}

  /* ---------- Theme picker ---------- */
  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:420px){.theme-grid{grid-template-columns:1fr}}
  .theme-card{
    border:1.5px solid var(--line);background:var(--surface);
    border-radius:14px;padding:12px;cursor:pointer;text-align:left;
    transition:border-color .15s, transform .08s;
    font-family:inherit;color:var(--text);
  }
  .theme-card:hover{border-color:var(--hover-line)}
  .theme-card:active{transform:scale(.98)}
  .theme-card.active{border-color:var(--reading);box-shadow:0 0 0 3px color-mix(in srgb, var(--reading) 18%, transparent)}
  .theme-swatches{display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px}

const fmt  = n => Math.round(Number(n) || 0).toLocaleString('en-US');
const fmt1 = n => (Math.round((Number(n) || 0) * 10) / 10).toLocaleString('en-US');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pad2 = n => String(n).padStart(2, '0');

function toISO(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseISO(s){
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(iso, n){
  const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d);
}
function diffDays(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function todayISO(){ return toISO(new Date()); }
function minISO(a, b){ return a < b ? a : b; }
function maxISO(a, b){ return a > b ? a : b; }
function uid(p){ return p + '_' + Math.random().toString(36).slice(2, 9); }
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function startOfWeekISO(iso){
  const d = parseISO(iso);
  const dow = (d.getDay() + 6) % 7; // Monday = 0
  d.setDate(d.getDate() - dow);
  return toISO(d);
}
function prettyDate(iso){
  const d = parseISO(iso);
  const t = todayISO();
  if (iso === t) return 'Today';
  if (iso === addDays(t, -1)) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function initialsOf(name){
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

/* Deterministic pseudo-random helpers (used for the demo characters) */
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =========================================================
   Countdown helpers
   ========================================================= */
function msUntilNextMidnight(){
  const now = new Date();
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
  return Math.max(0, end - now);
}
function msUntilWeekEnd(){
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (7 - dow), 0, 0, 0, 0);
  return Math.max(0, end - now);
}
function msUntilChallengeEnd(){
  const e = parseISO(state.challenge.end_date);
  const end = new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1, 0, 0, 0, 0);
  return Math.max(0, end - new Date());
}
function msFor(kind){
  if (kind === 'day')       return msUntilNextMidnight();
  if (kind === 'week')      return msUntilWeekEnd();
  if (kind === 'challenge') return msUntilChallengeEnd();
  return 0;
}
function fmtCountdown(ms){
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
}
function resetTimeLabel(kind){
  const now = new Date();
  if (kind === 'day') return '00:00';
  if (kind === 'week'){
    const dow = (now.getDay() + 6) % 7;
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (7 - dow));
    return end.toLocaleDateString('en-US', { weekday: 'short' }) + ' 00:00';
  }
  if (kind === 'challenge'){
    const e = parseISO(state.challenge.end_date);
    return e.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' 23:59';
  }
  return '—';
}
function nowClock(){
  const d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
let tickTimer = null;
function updateCountdowns(){
  $$('[data-countdown]').forEach(el => {
    el.textContent = fmtCountdown(msFor(el.dataset.countdown));
  });
  $$('[data-now]').forEach(el => {
    el.textContent = nowClock();
  });
}
function startTicker(){
  if (tickTimer) clearInterval(tickTimer);
  updateCountdowns();
  tickTimer = setInterval(updateCountdowns, 1000);
}

/* =========================================================
   Persistence
   ========================================================= */
function normalizeState(s){
  if (!s || typeof s !== 'object') return null;
  if (!Array.isArray(s.materials))    s.materials = [];
  if (!Array.isArray(s.activities))   s.activities = [];
  if (!Array.isArray(s.customChallenges)) s.customChallenges = [];
  if (s.profile === undefined) s.profile = null;
  if (s.profile && typeof s.profile !== 'object') s.profile = null;
  if (s.profile){
    if (!Array.isArray(s.profile.favorite_genres)) s.profile.favorite_genres = [];
  }

  /* --- Characters --- */
  if (!Array.isArray(s.rivals) || s.rivals.length === 0){
    s.rivals = defaultRivals();
  } else {
    /* Migrate old rival format (read/listen/rest) to new (avgXp/intensity/split) */
    s.rivals = s.rivals.map(r => {
      if (r && r.avgXp !== undefined) {
        // already new format — normalise
        return {
          id: r.id || uid('r'),
          name: r.name || 'Character',
          handle: String(r.handle || '').replace(/^@+/, ''),
          color: r.color || AVATAR_COLORS[0],
          avatar_emoji: r.avatar_emoji || '',
          avgXp: Math.max(0, Number(r.avgXp) || 0),
          intensity: clamp(Number(r.intensity) || 3, 1, 5),
          split: clamp(Number(r.split) ?? 0.5, 0, 1),
          phase: Number(r.phase) || 0
        };
      }
      // Legacy: derive from read/listen/rest
      const read = Number(r.read) || 0;
      const listen = Number(r.listen) || 0;
      const totalXp = (read + listen) * 0.5;
      const rest = Number(r.rest) || 0.08;
      return {
        id: r.id || uid('r'),
        name: r.name || 'Character',
        handle: String(r.handle || '').replace(/^@+/, ''),
        color: r.color || AVATAR_COLORS[0],
        avatar_emoji: r.avatar_emoji || '',
        avgXp: totalXp > 0 ? totalXp : 50,
        intensity: clamp(Math.round(((0.20 - rest) / 0.038) * 10) / 10, 1, 5) || 3,
        split: totalXp > 0 ? read / (read + listen) : 0.5,
        phase: Number(r.phase) || 0
      };
    });
  }

  return s;
}

function profileCompleteness(){
  const p = state.profile;
  if (!p) return 0;
  const checks = [
    !!p.display_name && p.display_name.trim(),
    !!p.handle && p.handle.trim(),
    !!p.bio && p.bio.trim(),
    !!p.country && p.country.trim(),
    !!p.native_language,
    !!p.target_language,
    !!p.level,
    !!p.goal && p.goal.trim(),
    !!p.birthday,
    (p.favorite_genres || []).length > 0,
    !!(p.social_twitter || p.social_goodreads || p.social_website)
  ];
  const filled = checks.filter(Boolean).length;
  return Math.round((filled / checks.length) * 100);
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `esc-backup-${todayISO()}.json`);
}

function csvEscape(v){
  const s = String(v ?? '');
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV(){
  const rows = [];
  rows.push(['date','category','type','material','creator','amount','unit','xp','note'].join(','));
  state.activities
    .slice()
    .sort((a, b) => a.logged_on < b.logged_on ? -1 : a.logged_on > b.logged_on ? 1 : 0)
    .forEach(a => {
      const m = materialById(a.material_id);
      rows.push([
        a.logged_on,
        a.category,
        a.input_type,
        m ? m.title : '',
        m ? (m.creator || '') : '',
        a.amount,
        a.unit,
        (a.category === 'reading' ? xpFrom(a.amount, 0) : xpFrom(0, a.amount)).toFixed(1),
        a.note || ''
      ].map(csvEscape).join(','));
    });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  downloadBlob(blob, `esc-activities-${todayISO()}.csv`);
}

function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err){
      alert('Could not read that file. Please choose a valid JSON backup.');
      return;
    }

    const candidate = (data && data.challenge && Array.isArray(data.activities) && Array.isArray(data.materials))
      ? data
      : (data && data.state) ? data.state : null;

    if (!candidate || !candidate.challenge || !Array.isArray(candidate.activities) || !Array.isArray(candidate.materials)){
      alert('This file does not look like a valid English Super Challenge backup.');
      return;
    }

    const actCount = candidate.activities.length;
    const matCount = candidate.materials.length;
    const chCount  = Array.isArray(candidate.customChallenges) ? candidate.customChallenges.length : 0;
    const rivalCount = Array.isArray(candidate.rivals) ? candidate.rivals.length : 0;
    const hasProfile = !!(candidate.profile && candidate.profile.display_name);
    const ok = confirm(
      `Import this backup?\n\n` +
      `• ${actCount} activit${actCount === 1 ? 'y' : 'ies'}\n` +
      `• ${matCount} material${matCount === 1 ? '' : 's'}\n` +
      `• ${chCount} challenge${chCount === 1 ? '' : 's'}\n` +
      `• ${rivalCount} character${rivalCount === 1 ? '' : 's'}\n` +
      `• Profile: ${hasProfile ? 'included' : 'none'}\n\n` +
      `This will replace your current data.`
    );
    if (!ok) return;

    state = normalizeState({
      challenge: candidate.challenge,
      profile: candidate.profile || null,
      materials: candidate.materials,
      activities: candidate.activities,
      customChallenges: candidate.customChallenges,
      rivals: candidate.rivals
    });
    saveState();
    closeModal();
    render();
    alert('Import complete.');
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
}

/* =========================================================
   Stats
   ========================================================= */
function actsInRange(from, to){
  return state.activities.filter(a =>
    (!from || a.logged_on >= from) && (!to || a.logged_on <= to)
  );
}
function sumCategory(list, category){
  return list.filter(a => a.category === category)
             .reduce((s, a) => s + (Number(a.amount) || 0), 0);
}
function materialById(id){ return state.materials.find(m => m.id === id) || null; }

function getStats(){
  const ch = state.challenge;
  const today = todayISO();

  const totalDays   = Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const elapsed     = clamp(diffDays(ch.start_date, today) + 1, 0, totalDays);
  const daysLeft    = Math.max(1, totalDays - elapsed + 1);

  const readingTotal   = sumCategory(state.activities, 'reading');
  const listeningTotal = sumCategory(state.activities, 'listening');

  const readTarget   = Number(ch.reading_target_pages) || 1;
  const listenTarget = Number(ch.listening_target_minutes) || 1;

  const readPct   = readingTotal / readTarget * 100;
  const listenPct = listeningTotal / listenTarget * 100;

  const readDailyRate   = readTarget / totalDays;
  const listenDailyRate = listenTarget / totalDays;

  const readRequired   = Math.max(0, readTarget - readingTotal) / daysLeft;
  const listenRequired = Math.max(0, listenTarget - listeningTotal) / daysLeft;

  const idealReadPct   = elapsed / totalDays * 100;
  const idealListenPct = elapsed / totalDays * 100;

  const weekStart = maxISO(startOfWeekISO(today), ch.start_date);
  const weekEnd   = minISO(today, ch.end_date);
  const weekDays  = Math.max(0, diffDays(weekStart, weekEnd) + 1);
  const weekRead     = sumCategory(actsInRange(weekStart, weekEnd), 'reading');
  const weekListen   = sumCategory(actsInRange(weekStart, weekEnd), 'listening');
  const weekReadExp  = readDailyRate * weekDays;
  const weekListenExp = listenDailyRate * weekDays;

  const dayIdx   = clamp(diffDays(ch.start_date, today) + 1, 1, totalDays);
  const monthIdx = Math.min(2, Math.floor((dayIdx - 1) / 30));
  const monthStart = addDays(ch.start_date, monthIdx * 30);
  const monthEnd   = minISO(addDays(ch.start_date, monthIdx * 30 + 29), ch.end_date);
  const monthCut   = minISO(today, monthEnd);
  const monthDays  = monthStart <= monthCut ? diffDays(monthStart, monthCut) + 1 : 0;
  const monthRead     = sumCategory(actsInRange(monthStart, monthCut), 'reading');
  const monthListen   = sumCategory(actsInRange(monthStart, monthCut), 'listening');
  const monthReadExp  = readDailyRate * monthDays;
  const monthListenExp = listenDailyRate * monthDays;

  return {
    ch, today, totalDays, elapsed, daysLeft,
    readingTotal, listeningTotal, readTarget, listenTarget,
    readPct, listenPct, readRequired, listenRequired,
    readDailyRate, listenDailyRate, idealReadPct, idealListenPct,
    monthIdx, monthStart, monthEnd, monthDays,
    weekStart, weekEnd, weekDays,
    weekRead, weekListen, weekReadExp, weekListenExp,
    monthRead, monthListen, monthReadExp, monthListenExp
  };
}

function paceStatePct(actualPct, idealPct){
  const d = actualPct - idealPct;
  if (d >= 2)  return { cls: 'good', label: 'Ahead of pace' };
  if (d >= -3) return { cls: 'ok',   label: 'On pace' };
  if (d >= -10) return { cls: 'warn', label: 'Slightly behind' };
  return { cls: 'bad', label: 'Behind pace' };
}
function paceStateRatio(val, exp){
  if (!exp) return { cls: 'ok', label: '—' };
  const r = val / exp;
  if (r >= 1.02) return { cls: 'good', label: 'Ahead' };
  if (r >= 0.97) return { cls: 'ok',   label: 'On pace' };
  if (r >= 0.85) return { cls: 'warn', label: 'Slightly behind' };
  return { cls: 'bad', label: 'Behind' };
}

/* =========================================================
   Custom daily / weekly challenges
   ========================================================= */
function challengeUnit(cat){
  if (cat === 'listening') return 'minutes';
  if (cat === 'xp') return 'XP';
  return 'pages';
}
function chalHintText(scope, cat){
  const u = challengeUnit(cat);
  return scope === 'daily'
    ? `Resets every day at 00:00 — aim for ${u} per day.`
    : `Runs Monday to Sunday — ends Monday 00:00.`;
}
function periodRange(scope){
  const t = todayISO();
  if (scope === 'weekly'){
    const ws = startOfWeekISO(t);
    return { from: ws, to: addDays(ws, 6) };
  }
  return { from: t, to: t };
}
function challengeValue(ch, from, to){
  const list = actsInRange(from, to);
  const p = sumCategory(list, 'reading');
  const m = sumCategory(list, 'listening');
  if (ch.category === 'listening') return m;
  if (ch.category === 'xp')        return xpFrom(p, m);
  return p;
}
function challengeStreak(ch){
  const today = todayISO();
  const chStart = state.challenge.start_date;
  let streak = 0;

  if (ch.scope === 'daily'){
    for (let d = today; d >= chStart; d = addDays(d, -1)){
      const ok = challengeValue(ch, d, d) >= ch.target;
      if (ok) streak++;
      else if (d === today) continue;
      else break;
    }
  } else {
    let ws = startOfWeekISO(today);
    for (let i = 0; i < 52; i++){
      const we = addDays(ws, 6);
      if (we < chStart) break;
      const from = maxISO(ws, chStart);
      const to   = minISO(we, today);
      const ok = challengeValue(ch, from, to) >= ch.target;
      if (ok) streak++;
      else if (i > 0) break;
      ws = addDays(ws, -7);
    }
  }
  return streak;
}

function challengeRowHTML(ch){
  const { from, to } = periodRange(ch.scope);
  const unit = challengeUnit(ch.category);
  const value = challengeValue(ch, from, to);
  const done = value >= ch.target;
  const pct = clamp(ch.target ? value / ch.target * 100 : 0, 0, 100);
  const streak = challengeStreak(ch);
  const remaining = Math.max(0, ch.target - value);
  const periodLabel = ch.scope === 'daily'
    ? prettyDate(from)
    : `Week of ${parseISO(from).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;

  const cdKind = ch.scope === 'daily' ? 'day' : 'week';
  const cdVerb = ch.scope === 'daily' ? 'until reset' : 'until week ends';
  const finishesAt = resetTimeLabel(cdKind);

  return `
  <div class="chal">
    <div class="chal-top">
      <div class="chal-title">
        ${escapeHtml(ch.title)}
        <span class="badge ${ch.scope}">${ch.scope}</span>
        ${done ? '<span class="badge done">✓ done</span>' : ''}
      </div>
      <div class="chal-actions">
        <button class="link-btn" data-action="edit-challenge" data-id="${ch.id}">Edit</button>
        <button class="link-btn danger" data-action="delete-challenge" data-id="${ch.id}">Delete</button>
      </div>
    </div>
    <div class="chal-bar ${ch.category}"><i style="width:${pct}%"></i></div>
    <div class="chal-meta">
      <span>${fmt(value)} / ${fmt(ch.target)} ${unit} · ${escapeHtml(periodLabel)}</span>
      <span>${done ? 'Complete' : fmt(remaining) + ' to go'}${streak ? ' · 🔥 ' + streak + (ch.scope === 'daily' ? 'd' : 'w') : ''}</span>
    </div>
    <div class="chal-timer">
      ⏳ <b class="mono" data-countdown="${cdKind}">--:--:--</b>
      ${cdVerb} · finishes ${escapeHtml(finishesAt)}
    </div>
  </div>`;
}

/* =========================================================
   Leaderboard — you + editable characters
   ========================================================= */
function lbRangeISO(){
  const t = todayISO();
  const ch = state.challenge;
  if (leaderboardRange === 'today') return { from: t, to: t, label: 'Today' };
  if (leaderboardRange === 'week')  return { from: startOfWeekISO(t), to: t, label: 'This week' };
  return { from: ch.start_date, to: minISO(t, ch.end_date), label: 'Full challenge' };
}
function userStatsIn(from, to){
  const ch = state.challenge;
  const f = maxISO(from, ch.start_date);
  const t = minISO(to, todayISO());
  if (f > t) return { pages: 0, minutes: 0, xp: 0, days: 0 };
  const list = actsInRange(f, t);
  const pages = sumCategory(list, 'reading');
  const minutes = sumCategory(list, 'listening');
  return { pages, minutes, xp: xpFrom(pages, minutes), days: diffDays(f, t) + 1 };
}

/* Deterministic daily stats for a character */
function rivalDayStats(rival, idx, dateISO){
  const rng = mulberry32(hashStr(rival.id + '|' + dateISO));
  const r1 = rng(), r2 = rng();

  const intensity = clamp(Number(rival.intensity) || 3, 1, 5);

  /* Rest probability — higher intensity means fewer skipped days */
  const rest = Math.max(0, 0.20 - intensity * 0.038);
  if (r1 < rest) return { pages: 0, minutes: 0, xp: 0 };

  /* Variance — higher intensity means more consistent output */
  const variance = Math.max(0.10, 0.85 - intensity * 0.13);
  const phase = Number(rival.phase) || 0;
  const swing = 1 + variance * Math.sin((idx + phase) / 8);
  const noise = 1 + variance * (r2 - 0.5) * 1.4;
  const dayXp = Math.max(0, (Number(rival.avgXp) || 0) * swing * noise);

  const split = clamp(Number(rival.split) ?? 0.5, 0, 1);
  const readXp = dayXp * split;
  const listenXp = dayXp * (1 - split);
  const pages = Math.round(readXp * 2);      // 0.5 XP per page
  const minutes = Math.round(listenXp * 2);  // 0.5 XP per minute
  return { pages, minutes, xp: xpFrom(pages, minutes) };
}

function rivalStats(rival, from, to){
  const ch = state.challenge;
  const start = maxISO(from, ch.start_date);
  const end   = minISO(to, todayISO());
  if (start > end) return { pages: 0, minutes: 0, xp: 0, days: 0 };

  let pages = 0, minutes = 0, days = 0;
  for (let d = start; d <= end; d = addDays(d, 1)){
    days++;
    const idx = diffDays(ch.start_date, d);
    const s = rivalDayStats(rival, idx, d);
    pages += s.pages;
    minutes += s.minutes;
  }
  return { pages, minutes, xp: xpFrom(pages, minutes), days };
}

function leaderboardEntries(){
  const { from, to } = lbRangeISO();
  const entries = [];

  const u = userStatsIn(from, to);
  const p = state.profile;
  entries.push({
    id: 'you',
    name: profileDisplayName(),
    handle: profileHandle(),
    color: profileColor(),
    initials: profileAvatarContent(p),
    isEmoji: !!(p && p.avatar_emoji),
    you: true,
    pages: u.pages, minutes: u.minutes, xp: u.xp
  });

  (state.rivals || []).forEach(r => {
    const s = rivalStats(r, from, to);
    entries.push({
      id: r.id,
      name: r.name,
      handle: r.handle ? (r.handle.startsWith('@') ? r.handle : '@' + r.handle) : '',
      color: r.color || '#26211C',
      initials: r.avatar_emoji || initialsOf(r.name),
      isEmoji: !!r.avatar_emoji,
      you: false,
      pages: s.pages, minutes: s.minutes, xp: s.xp
    });
  });

  entries.sort((a, b) => b.xp - a.xp || b.pages - a.pages || a.name.localeCompare(b.name));
  return entries;
}

function progressCard(s, kind){
  const isRead = kind === 'reading';
  const value  = isRead ? s.readingTotal : s.listeningTotal;
  const target = isRead ? s.readTarget : s.listenTarget;
  const unit   = isRead ? 'pages' : 'minutes';
  const rawPct = isRead ? s.readPct : s.listenPct;
  const ideal  = isRead ? s.idealReadPct : s.idealListenPct;
  const st     = paceStatePct(rawPct, ideal);
  const barPct = clamp(rawPct, 0, 100);
  const remaining = Math.max(0, target - value);

  return `
  <div class="card progress-card ${kind}">
    <div class="card-head">
      <h2>${isRead ? 'Reading' : 'Listening'}</h2>
      <span class="pct">${rawPct.toFixed(1)}%</span>

      <strong>${fmt(value)}</strong>
      <span>/ ${fmt(target)} ${unit}</span>
    </div>
    <div class="bar">
      <div class="bar-fill" style="width:${barPct}%"></div>
      <div class="bar-ideal" style="left:${clamp(ideal, 0, 99)}%" title="Where you should be today"></div>
    </div>
    <div class="bar-meta">
      <span>${fmt(remaining)} ${unit} to go</span>

}

/* =========================================================
   Views — History
   ========================================================= */
function filteredActivities(){
  const f = historyFilters;
  let list = state.activities.slice();

  if (f.from) list = list.filter(a => a.logged_on >= f.from);
  if (f.to)   list = list.filter(a => a.logged_on <= f.to);
  if (f.category !== 'all') list = list.filter(a => a.category === f.category);
  if (f.type !== 'all')     list = list.filter(a => a.input_type === f.type);
  if (f.material !== 'all') list = list.filter(a => a.material_id === f.material);
  if (f.q.trim()){
    const q = f.q.trim().toLowerCase();
    list = list.filter(a => {
      const m = materialById(a.material_id);
      return (m && m.title.toLowerCase().includes(q)) || (a.note || '').toLowerCase().includes(q);
    });
  }

  list.sort((a, b) =>
    a.logged_on < b.logged_on ? 1 :
    a.logged_on > b.logged_on ? -1 :
    (a.created_at < b.created_at ? 1 : -1)
  );
  return list;
}

function viewHistory(){
  const list = filteredActivities();

  const groups = [];
  const map = new Map();
  list.forEach(a => {
    if (!map.has(a.logged_on)){ const g = { date: a.logged_on, items: [] }; map.set(a.logged_on, g); groups.push(g); }
    map.get(a.logged_on).items.push(a);
  });

  const materialOptions = state.materials
    .slice()
    .sort((a, b) => a.title.localeCompare(b.title))
    .map(m => `<option value="${m.id}" ${historyFilters.material === m.id ? 'selected' : ''}>${escapeHtml(m.title)}</option>`)
    .join('');

  const typeOptions = TYPE_ORDER
    .map(t => `<option value="${t}" ${historyFilters.type === t ? 'selected' : ''}>${TYPES[t].label}</option>`)
    .join('');

  const hasFilters =
    historyFilters.from || historyFilters.to || historyFilters.category !== 'all' ||
    historyFilters.type !== 'all' || historyFilters.material !== 'all' || historyFilters.q.trim();

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Filters</h2>
      ${hasFilters ? '<button class="link-btn" data-action="clear-filters">Clear</button>' : ''}
    </div>
    <div class="filters">
      <div class="field" style="margin-bottom:0">
        <label for="histFrom">From</label>
        <input type="date" id="histFrom" value="${historyFilters.from}">
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="histTo">To</label>
        <input type="date" id="histTo" value="${historyFilters.to}">
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="histCategory">Category</label>
        <select id="histCategory">
          <option value="all" ${historyFilters.category === 'all' ? 'selected' : ''}>All</option>
          <option value="reading" ${historyFilters.category === 'reading' ? 'selected' : ''}>Reading</option>
          <option value="listening" ${historyFilters.category === 'listening' ? 'selected' : ''}>Listening</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="histType">Type</label>
        <select id="histType">
          <option value="all" ${historyFilters.type === 'all' ? 'selected' : ''}>All types</option>
          ${typeOptions}
        </select>
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="histMaterial">Material</label>
        <select id="histMaterial">
          <option value="all" ${historyFilters.material === 'all' ? 'selected' : ''}>All materials</option>
          ${materialOptions}
        </select>
      </div>
      <div class="field full" style="margin-bottom:0">
        <label for="histSearch">Search</label>
        <input type="text" id="histSearch" placeholder="Title or note…" value="${escapeHtml(historyFilters.q)}" autocomplete="off">
      </div>
    </div>
  </div>

  ${groups.length ? groups.map(g => {
    const pages = sumCategory(g.items, 'reading');
    const mins  = sumCategory(g.items, 'listening');
    const parts = [];
    if (pages) parts.push(fmt(pages) + ' pages');
    if (mins)  parts.push(fmt(mins) + ' min');
    parts.push(fmt1(xpFrom(pages, mins)) + ' XP');
    return `
    <div class="day-group">
      <div class="day-head">
        <span class="d">${escapeHtml(prettyDate(g.date))}</span>
        <span class="tot">${parts.join(' · ')}</span>
      </div>
      ${g.items.map(a => activityRow(a, true)).join('')}
    </div>`;
  }).join('') : `
    <div class="card">
      <div class="empty">
        <div class="em-icon">${state.activities.length ? '🔍' : '📖'}</div>

}

/* =========================================================
   Views — Progress
   ========================================================= */
function dailyChartHTML(metric, days){
  const ch = state.challenge;
  const today = todayISO();
  const items = [];
  for (let i = days - 1; i >= 0; i--){
    const date = addDays(today, -i);
    const inChallenge = date >= ch.start_date && date <= ch.end_date;
    const val = inChallenge ? sumCategory(actsInRange(date, date), metric) : 0;
    items.push({ date, val, inChallenge });
  }
  const max = Math.max(...items.map(i => i.val), 1);
  const cls = metric === 'reading' ? 'reading' : 'listening';

  return `
  <div class="chart">
    ${items.map((it, idx) => `
      <div class="col" title="${it.date}: ${fmt(it.val)} ${metric === 'reading' ? 'pages' : 'min'}">
        <div class="bar-wrap">
          <div class="fill ${it.val ? cls : 'muted'}" style="height:${it.val ? Math.max(3, it.val / max * 100) : 2}%"></div>
        </div>
        <span class="lbl">${idx % 3 === 0 ? parseISO(it.date).getDate() : ''}</span>
      </div>`).join('')}
  </div>
  <div class="chart-legend">
    <span><i style="background:${metric === 'reading' ? 'var(--reading)' : 'var(--listening)'}"></i>${metric === 'reading' ? 'Pages read' : 'Minutes listened'}</span>
    <span>Last ${days} days · peak ${fmt(max)}</span>
  </div>`;
}

function weeklyChartHTML(metric){
  const ch = state.challenge;
  const today = todayISO();
  const rate = metric === 'reading'
    ? (Number(ch.reading_target_pages) || 0) / Math.max(1, diffDays(ch.start_date, ch.end_date) + 1)
    : (Number(ch.listening_target_minutes) || 0) / Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);

  const thisWeekStart = startOfWeekISO(today);
  const weeks = [];
  for (let i = 5; i >= 0; i--){
    const ws = addDays(thisWeekStart, -7 * i);
    const we = addDays(ws, 6);
    const from = maxISO(ws, ch.start_date);
    const to   = minISO(minISO(we, today), ch.end_date);
    const daysIn = from <= to ? diffDays(from, to) + 1 : 0;
    const val = daysIn ? sumCategory(actsInRange(from, to), metric) : 0;
    weeks.push({ ws, val, exp: rate * daysIn, daysIn, active: from <= to });
  }

  const max = Math.max(...weeks.map(w => Math.max(w.val, w.exp)), 1);
  const cls = metric === 'reading' ? 'reading' : 'listening';
  const CHART_H = 170, LABEL_H = 18, BAR_AREA = CHART_H - LABEL_H;
  const lastExp = weeks[weeks.length - 1].exp;

  return `
  <div class="chart">
    <div class="target-line" style="bottom:${LABEL_H + (lastExp / max) * BAR_AREA}px"></div>
    ${weeks.map(w => `
      <div class="col" title="${w.ws}: ${fmt(w.val)} vs ${fmt(w.exp)} expected">
        <div class="bar-wrap">
          <div class="fill ${w.val ? cls : 'muted'}" style="height:${w.val ? Math.max(3, w.val / max * 100) : 2}%"></div>
        </div>
        <span class="lbl">${parseISO(w.ws).getDate()}/${parseISO(w.ws).getMonth() + 1}</span>
      </div>`).join('')}
  </div>
  <div class="chart-legend">
    <span><i style="background:${metric === 'reading' ? 'var(--reading)' : 'var(--listening)'}"></i>Weekly total</span>
    <span><i style="background:transparent;border-top:1.5px dashed var(--dash-line);width:14px;height:0;border-radius:0"></i>Pace target</span>
  </div>`;
}

function monthlyChartHTML(metric){
  const ch = state.challenge;
  const today = todayISO();
  const totalDays = Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const rate = metric === 'reading'
    ? (Number(ch.reading_target_pages) || 0) / totalDays
    : (Number(ch.listening_target_minutes) || 0) / totalDays;

  const months = [];
  for (let i = 0; i < 3; i++){
    const ms = addDays(ch.start_date, i * 30);
    const me = minISO(addDays(ch.start_date, i * 30 + 29), ch.end_date);
    const cut = minISO(today, me);
    const daysIn = ms <= cut ? diffDays(ms, cut) + 1 : 0;
    const val = daysIn ? sumCategory(actsInRange(ms, cut), metric) : 0;
    months.push({ ms, me, val, exp: rate * daysIn, daysIn });
  }

  const max = Math.max(...months.map(m => Math.max(m.val, m.exp)), 1);
  const cls = metric === 'reading' ? 'reading' : 'listening';

  return `
  <div class="chart">
    ${months.map((m, i) => `
      <div class="col" title="Month ${i + 1}: ${fmt(m.val)} vs ${fmt(m.exp)} expected">
        <div class="bar-wrap">
          <div class="fill ${m.val ? cls : 'muted'}" style="height:${m.val ? Math.max(3, m.val / max * 100) : 2}%"></div>
        </div>
        <span class="lbl">Month ${i + 1}</span>
      </div>`).join('')}
  </div>
  <div class="chart-legend">
    <span><i style="background:${metric === 'reading' ? 'var(--reading)' : 'var(--listening)'}"></i>Month total</span>
    <span>Expected shown on hover</span>
  </div>
  <div class="chart-note">
    ${months.map((m, i) => `Month ${i + 1}: ${fmt(m.val)} / ${fmt(m.exp)}`).join(' &nbsp;·&nbsp; ')}
  </div>`;
}

function cumulativeSVG(metric){
  const ch = state.challenge;
  const today = todayISO();
  const totalDays = Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const target = metric === 'reading'
    ? Number(ch.reading_target_pages) || 1
    : Number(ch.listening_target_minutes) || 1;
  const elapsed = clamp(diffDays(ch.start_date, today) + 1, 0, totalDays);

  const daily = new Array(totalDays + 1).fill(0);
  state.activities.forEach(a => {
    if (a.category !== metric) return;
    const idx = diffDays(ch.start_date, a.logged_on) + 1;
    if (idx >= 1 && idx <= totalDays) daily[idx] += Number(a.amount) || 0;
  });

  let cum = 0;
  const pts = [[0, 0]];
  for (let i = 1; i <= totalDays; i++){
    cum += daily[i];
    if (i <= elapsed) pts.push([i, cum]);
  }
  const maxY = Math.max(target, cum, 1);
  const x = d => (d / totalDays) * 100;
  const y = v => 100 - (v / maxY) * 100;

  const linePath = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(2) + ' ' + y(p[1]).toFixed(2)).join(' ');
  const areaPath = linePath + ` L ${x(pts[pts.length - 1][0]).toFixed(2)} 100 L 0 100 Z`;
  const idealPath = `M 0 100 L 100 ${y(target).toFixed(2)}`;

  const varName = metric === 'reading' ? '--reading' : '--listening';

  return `
  <svg class="cum-chart" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Cumulative progress">
    <line x1="0" y1="100" x2="100" y2="100" style="stroke:var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${areaPath}" style="fill:var(${varName})" fill-opacity="0.10" stroke="none"/>
    <path d="${idealPath}" fill="none" style="stroke:var(--dash-line)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <path d="${linePath}" fill="none" style="stroke:var(${varName})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="chart-legend">
    <span><i style="background:var(${varName})"></i>Your cumulative total</span>
    <span><i style="background:transparent;border-top:1.5px dashed var(--dash-line);width:14px;height:0;border-radius:0"></i>Ideal pace line</span>
    <span>Day ${elapsed} of ${totalDays}</span>
  </div>`;
}

function viewProgress(){
  const ch = state.challenge;
  const totalDays = Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const elapsed = clamp(diffDays(ch.start_date, todayISO()) + 1, 0, totalDays);
  const metric = progressMetric;
  const unit = metric === 'reading' ? 'pages' : 'minutes';
  const target = metric === 'reading' ? Number(ch.reading_target_pages) || 0 : Number(ch.listening_target_minutes) || 0;
  const total = sumCategory(state.activities, metric);
  const idealNow = target / totalDays * elapsed;
  const delta = total - idealNow;
  const noData = state.activities.length === 0;

  return `
  <div class="card" style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div class="seg" id="metricSeg">
      <button data-metric="reading" class="${metric === 'reading' ? 'active' : ''}">Reading (pages)</button>
      <button data-metric="listening" class="${metric === 'listening' ? 'active' : ''}">Listening (minutes)</button>
    </div>
    <div style="font-size:12.5px;color:var(--muted)">
      ${fmt(total)} / ${fmt(target)} ${unit} ·
      <b style="color:${delta >= 0 ? 'var(--good-fg)' : 'var(--bad-fg)'}">${delta >= 0 ? '+' : ''}${fmt(delta)}</b> vs ideal
    </div>
  </div>

  ${noData ? `
  <div class="card" style="margin-bottom:14px">
    <div class="empty">
      <div class="em-icon">📈</div>
      <div class="em-title">No data to chart yet</div>
      <div class="em-sub">Log a few reading or listening sessions and your daily, weekly, monthly, and cumulative progress will appear here.</div>
      <button class="btn btn-primary" data-action="open-log">+ Log activity</button>
    </div>
  </div>` : ''}

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Cumulative progress vs ideal pace</h2></div>
    ${cumulativeSVG(metric)}
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Daily totals</h2><span style="font-size:11.5px;color:var(--muted)">Last 21 days</span></div>
    ${dailyChartHTML(metric, 21)}
  </div>

  <div class="grid cols-2">
    <div class="card">
      <div class="card-head"><h2>Weekly totals</h2><span style="font-size:11.5px;color:var(--muted)">vs pace</span></div>
      ${weeklyChartHTML(metric)}
    </div>
    <div class="card">
      <div class="card-head"><h2>Monthly totals</h2><span style="font-size:11.5px;color:var(--muted)">vs pace</span></div>
      ${monthlyChartHTML(metric)}
    </div>
  </div>`;
}

/* =========================================================
   Views — Materials  (split by type, grid / list, CSV import)
   ========================================================= */
function materialTotals(id){
  const list = state.activities.filter(a => a.material_id === id);
  return {
    pages: sumCategory(list, 'reading'),
    minutes: sumCategory(list, 'listening'),
    count: list.length
  };
}
function materialTotalsText(t){
  const parts = [];
  if (t.pages)   parts.push(fmt(t.pages) + ' pages');
  if (t.minutes) parts.push(fmt(t.minutes) + ' min');
  return parts.length ? parts.join(' · ') : 'Nothing logged yet';
}

const MATERIAL_STATUS_RANK = { active: 0, completed: 1, archived: 2 };
function materialSorter(a, b){
  const r = (MATERIAL_STATUS_RANK[a.status] ?? 3) - (MATERIAL_STATUS_RANK[b.status] ?? 3);
  return r !== 0 ? r : a.title.localeCompare(b.title);
}

function materialRowHTML(m){

function materialCardHTML(m){
