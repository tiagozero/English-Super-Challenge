/* =========================================================
   Roadmap builder
   ========================================================= */
function buildRoadmap(){
  const ch = state.challenge;
  const today = todayISO();
  const totalDays = Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const elapsed = clamp(diffDays(ch.start_date, today) + 1, 0, totalDays);
  const dailyRead = (Number(ch.reading_target_percent) || 0) / totalDays;
  const dailyListen = (Number(ch.listening_target_minutes) || 0) / totalDays;

  // Days
  const days = [];
  for (let i = 0; i < totalDays; i++){
    const date = addDays(ch.start_date, i);
    const acts = state.activities.filter(a => a.logged_on === date);
    const read = sumCategory(acts, 'reading');
    const listen = sumCategory(acts, 'listening');
    const isToday = date === today;
    const isPast = date < today;
    const isFuture = date > today;
    days.push({
      dayNumber: i + 1,
      date,
      weekIndex: Math.floor(i / 7),
      phaseIndex: Math.min(3, Math.floor(i * 4 / totalDays)),
      expectedRead: dailyRead,
      expectedListen: dailyListen,
      actualRead: read,
      actualListen: listen,
      isPast, isToday, isFuture,
      activityCount: acts.length,
      note: state.roadmap.dailyNotes[date] || ''
    });
  }

  // Weeks
  const totalWeeks = Math.ceil(totalDays / 7);
  const weeks = [];
  for (let w = 0; w < totalWeeks; w++){
    const startIdx = w * 7;
    const endIdx = Math.min(totalDays, startIdx + 7);
    const wDays = days.slice(startIdx, endIdx);
    const expectedRead = wDays.length * dailyRead;
    const expectedListen = wDays.length * dailyListen;
    const actualRead = wDays.reduce((s, d) => s + d.actualRead, 0);
    const actualListen = wDays.reduce((s, d) => s + d.actualListen, 0);
    const hasToday = wDays.some(d => d.isToday);
    const allPast = wDays.every(d => d.isPast);
    const status = allPast
      ? weekStatus(actualRead + actualListen, expectedRead + expectedListen)
      : hasToday ? 'current'
      : 'future';
    weeks.push({
      weekIndex: w,
      weekNumber: w + 1,
      startDate: wDays[0].date,
      endDate: wDays[wDays.length - 1].date,
      days: wDays,
      expectedRead, expectedListen, actualRead, actualListen,
      status,
      materialIds: (state.roadmap.weeklyMaterials[w] || []).filter(id => materialById(id)),
      note: state.roadmap.weeklyNotes[w] || ''
    });
  }

  // Phases
  const phases = state.roadmap.phases.map((p, i) => {
    const startIdx = Math.floor(i * totalDays / 4);
    const endIdx = Math.floor((i + 1) * totalDays / 4) - 1;
    const realEnd = Math.max(startIdx, endIdx);
    const pDays = days.slice(startIdx, realEnd + 1);

    // Even-pace, date-range baseline (used whenever this phase has no
    // materials of a given category assigned to it yet).
    const dateExpectedRead = pDays.length * dailyRead;
    const dateExpectedListen = pDays.length * dailyListen;
    const dateActualRead = pDays.reduce((s, d) => s + d.actualRead, 0);
    const dateActualListen = pDays.reduce((s, d) => s + d.actualListen, 0);

    // Material-driven totals: each phase's own exclusive materials
    // drive its Reading/Listening progress, so two phases never mirror
    // the same numbers just because they share a material.
    const phaseMaterials = (p.materials || []).map(id => materialById(id)).filter(Boolean);
    const readingMats = phaseMaterials.filter(m => m.default_category === 'reading');
    const listeningMats = phaseMaterials.filter(m => m.default_category === 'listening');
    // Reading activities are logged as % of each book, so every queued
    // reading material is worth a flat 100% (finishing it) regardless of
    // any custom "Total units" value it carries — that field is ignored
    // here on purpose so stale page-scale targets can't leak into the
    // percent-based phase math. Per-book progress is capped at 100 so a
    // single over-logged book can't inflate the phase total.
    const matExpectedRead = readingMats.length * 100;
    const matActualRead = readingMats.reduce((s, m) => s + Math.min(100, materialLoggedUnits(m)), 0);
    const matExpectedListen = listeningMats.reduce((s, m) => s + (materialHasTarget(m) ? Number(m.total_units) : 0), 0);
    const matActualListen = listeningMats.reduce((s, m) => s + materialLoggedUnits(m), 0);

    // Use the phase's own materials once it has any in that category;
    // if none of them carry a target yet, still show real logged
    // progress against the even-pace baseline rather than dividing by 0.
    const expectedRead = readingMats.length ? matExpectedRead : dateExpectedRead;
    const actualRead = readingMats.length ? matActualRead : dateActualRead;
    const expectedListen = listeningMats.length ? (matExpectedListen || dateExpectedListen) : dateExpectedListen;
    const actualListen = listeningMats.length ? matActualListen : dateActualListen;

    const elapsedRead = pDays.filter(d => !d.isFuture).reduce((s, d) => s + d.actualRead, 0);
    const elapsedListen = pDays.filter(d => !d.isFuture).reduce((s, d) => s + d.actualListen, 0);
    const expectedToDate = pDays.filter(d => !d.isFuture).length;
    const expectedReadToDate = expectedToDate * dailyRead;
    const expectedListenToDate = expectedToDate * dailyListen;
    const hasToday = pDays.some(d => d.isToday);
    const allPast = pDays.every(d => d.isPast);
    const pct = expectedRead + expectedListen > 0
      ? clamp((actualRead + actualListen) / (expectedRead + expectedListen) * 100, 0, 100)
      : 0;
    const idealPct = expectedToDate > 0
      ? clamp((elapsedRead + elapsedListen) / (expectedReadToDate + expectedListenToDate) * 100, 0, 100)
      : 0;
    const status = allPast
      ? weekStatus(actualRead + actualListen, expectedRead + expectedListen)
      : hasToday ? 'current'
      : 'future';
    return {
      index: i,
      id: p.id,
      name: p.name,
      focus: p.focus,
      materials: (p.materials || []).filter(id => materialById(id)),
      startDay: pDays.length ? pDays[0].dayNumber : 0,
      endDay: pDays.length ? pDays[pDays.length - 1].dayNumber : 0,
      startDate: pDays.length ? pDays[0].date : null,
      endDate: pDays.length ? pDays[pDays.length - 1].date : null,
      days: pDays,
      weekIndices: [...new Set(pDays.map(d => d.weekIndex))],
      expectedRead, expectedListen, actualRead, actualListen,
      pct, idealPct, status
    };
  });

    return {
    ch, totalDays, elapsed, daysLeft: Math.max(1, totalDays - elapsed + 1),
    dailyRead, dailyListen, days, weeks, phases
  };
}
function weekStatus(actualSum, expectedSum){
  if (expectedSum <= 0) return 'future';
  const r = actualSum / expectedSum;
  if (r >= 1.0) return 'met';
  if (r >= 0.75) return 'partial';
  return 'missed';
}
function dayStatus(day){
  if (day.isToday) return 'today';
  if (day.isFuture) return 'future';
  const exp = day.expectedRead + day.expectedListen;
  const act = day.actualRead + day.actualListen;
  if (exp <= 0) return 'met';
  const r = act / exp;
  if (r >= 1.0) return 'met';
  if (r >= 0.75) return 'partial';
  if (act > 0) return 'partial';
  return 'missed';
}
function statusLabel(s){
  return ({
    met: 'Hit', partial: 'Partial', missed: 'Missed',
    today: 'Today', future: 'Planned', current: 'In progress'
  })[s] || s;
}
function computeStreaks(rm){
  const past = rm.days.filter(d => d.isPast);
  const metDay = d => {
    const exp = d.expectedRead + d.expectedListen;
    const act = d.actualRead + d.actualListen;
    return exp <= 0 ? true : act >= exp;
  };
  let best = 0, run = 0;
  past.forEach(d => {
    if (metDay(d)){ run++; best = Math.max(best, run); }
    else run = 0;
  });
  let current = 0;
  for (let i = past.length - 1; i >= 0; i--){
    if (metDay(past[i])) current++;
    else break;
  }
  const today = rm.days.find(d => d.isToday);
  if (today && metDay(today)){
    current++;
    best = Math.max(best, current);
  }
  return { current, best };
}

/* =========================================================
   Milestones (auto + custom)
   ========================================================= */
function buildMilestones(rm){
  const ch = state.challenge;
  const today = todayISO();
  const totalDays = rm.totalDays;

  // Auto milestones at 25/50/75/100%
  const auto = [25, 50, 75, 100].map(pct => {
    const dayIdx = Math.max(1, Math.round(totalDays * pct / 100));
    const date = addDays(ch.start_date, dayIdx - 1);
    const title = `${pct}% of the challenge`;
    const description = pct === 100 ? 'Final day — finish the whole challenge.' :
                        pct === 75 ? 'Final stretch: three quarters done.' :
                        pct === 50 ? 'Halfway mark — check your pace.' :
                        'First quarter complete.';
    const targetDate = date;
    // Are we past this target date?
    const reached = today >= targetDate
      ? (pct <= 100) // assume reached once date passes — we could verify progress, but keep simple
      : false;
    const missed = false;
    return {
      id: 'auto-' + pct,
      title, description, date: targetDate,
      auto: true,
      done: reached,
      pct
    };
  });

  // User milestones
  const user = (state.roadmap.milestones || []).map(m => ({
    ...m,
    auto: false
  }));

  const all = [...auto, ...user].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return all;
}

function progressCard(s, kind){
  const isRead = kind === 'reading';
  const value  = isRead ? s.readingTotal : s.listeningTotal;

  const rawPct = isRead ? s.readPct : s.listenPct;
  const ideal  = isRead ? s.idealReadPct : s.idealListenPct;
  const st     = paceStatePct(rawPct, ideal);
  const barPct = clamp(rawPct, 0, 100);
  const remaining = Math.max(0, target - value);
  const suffix = isRead ? '%' : ' minutes';

  return `
  <div class="card progress-card ${kind}">
    <div class="card-head">
      <h2>${isRead ? 'Reading' : 'Listening'}</h2>
      <span class="pct">${rawPct.toFixed(1)}%</span>

      <span>/ ${fmt(target)}${suffix}</span>
    </div>

      <span>${fmt(remaining)}${suffix} to go</span>

/* =========================================================
   Views — Roadmap

function viewRoadmap(){
  const rm = buildRoadmap();
  const milestones = buildMilestones(rm);
  const today = todayISO();
  const totalActualRead = sumCategory(state.activities, 'reading');
  const totalActualListen = sumCategory(state.activities, 'listening');
  const overallReadPct = rm.ch.reading_target_percent ? totalActualRead / rm.ch.reading_target_percent * 100 : 0;
  const overallListenPct = rm.ch.listening_target_minutes ? totalActualListen / rm.ch.listening_target_minutes * 100 : 0;

  // Projection
  const elapsed = rm.elapsed;
  const remaining = rm.daysLeft;
  const readRateSoFar = elapsed > 0 ? totalActualRead / elapsed : 0;
  const listenRateSoFar = elapsed > 0 ? totalActualListen / elapsed : 0;
  const projectedRead = totalActualRead + readRateSoFar * remaining;
  const projectedListen = totalActualListen + listenRateSoFar * remaining;
  const projReadPct = rm.ch.reading_target_percent ? projectedRead / rm.ch.reading_target_percent * 100 : 0;
  const projListenPct = rm.ch.listening_target_minutes ? projectedListen / rm.ch.listening_target_minutes * 100 : 0;

  // Pace check — how you're tracking vs. the even-pace plan, and what's needed to still hit goal
  const idealSoFarRead = rm.dailyRead * elapsed;
  const idealSoFarListen = rm.dailyListen * elapsed;
  const paceRatio = (idealSoFarRead + idealSoFarListen) > 0
    ? (totalActualRead + totalActualListen) / (idealSoFarRead + idealSoFarListen)
    : 1;
  let paceLabel = 'On track', paceBadgeCls = 'weekly', paceStatus = 'ontrack';
  if (paceRatio >= 1.05){ paceLabel = 'Ahead of pace'; paceBadgeCls = 'done'; paceStatus = 'ahead'; }
  else if (paceRatio < 0.9){ paceLabel = 'Behind pace'; paceBadgeCls = 'bad'; paceStatus = 'behind'; }
  const neededDailyRead = remaining > 0 ? Math.max(0, (rm.ch.reading_target_percent || 0) - totalActualRead) / remaining : 0;
  const neededDailyListen = remaining > 0 ? Math.max(0, (rm.ch.listening_target_minutes || 0) - totalActualListen) / remaining : 0;

  // Streaks & consistency
  const streaks = computeStreaks(rm);
  const pastDays = rm.days.filter(d => d.isPast);
  const metDaysCount = pastDays.filter(d => dayStatus(d) === 'met').length;
  const hitRate = pastDays.length ? (metDaysCount / pastDays.length * 100) : 0;

  // Today banner
  const todayDay = rm.days.find(d => d.isToday);
  const todayPhase = todayDay ? rm.phases[todayDay.phaseIndex] : null;

  const todayBanner = todayDay ? `

  // Challenge countdown clock
  const challengeClock = `
  <div class="card" style="margin-bottom:14px">
    <div class="lb-clock">
      <div class="lb-clock-cell"><span class="k">Now (24h)</span><span class="v mono" data-now>--:--:--</span></div>

function roadmapWeeklyChartHTML(rm){
  const weeks = rm.weeks;
  const showEvery = weeks.length > 14 ? Math.ceil(weeks.length / 14) : 1;
  const LABEL_H = 18, BAR_AREA = 170 - LABEL_H;
  function chartFor(metric){
    const cls = metric === 'reading' ? 'reading' : 'listening';
    const unit = metric === 'reading' ? '%' : 'min';
    const vals = weeks.map(w => metric === 'reading' ? w.actualRead : w.actualListen);
    const exps = weeks.map(w => metric === 'reading' ? w.expectedRead : w.expectedListen);
    const max = Math.max(...vals, ...exps, 1);
    const fullWeekExp = (metric === 'reading' ? rm.dailyRead : rm.dailyListen) * 7;
    return `
    <div>
      <div class="stat-label" style="margin-bottom:8px">${metric === 'reading' ? 'Reading' : 'Listening'} by week</div>
      <div class="chart">
        <div class="target-line" style="bottom:${LABEL_H + clamp(fullWeekExp / max, 0, 1) * BAR_AREA}px"></div>
        ${weeks.map((w, i) => {
          const val = metric === 'reading' ? w.actualRead : w.actualListen;
          const exp = metric === 'reading' ? w.expectedRead : w.expectedListen;
          const barHeight = val ? Math.max(3, val / max * 100) : (w.status === 'future' ? 0 : 2);
          return `
          <div class="col" title="Week ${w.weekNumber}: ${fmt(val)} ${unit} vs ${fmt(exp)} ${unit} expected">
            <div class="bar-wrap"><div class="fill ${val ? cls : 'muted'}" style="height:${barHeight}%"></div></div>
            <span class="lbl">${(i % showEvery === 0) ? w.weekNumber : ''}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  return `
  <div class="grid cols-2" style="margin-bottom:0">
    ${chartFor('reading')}
    ${chartFor('listening')}
  </div>
  <div class="chart-legend">
    <span><i style="background:var(--reading)"></i>Percent read</span>
    <span><i style="background:var(--listening)"></i>Minutes listened</span>
    <span><i style="background:transparent;border-top:1.5px dashed var(--dash-line);width:14px;height:0;border-radius:0"></i>Full-week pace target</span>
  </div>`;
}

/* Calendar-style activity heatmap for a phase (one real calendar month
   block per month the phase spans), colored by how much of that day's
   target was logged. Colour source (combined / reading / listening) is
   switchable and persisted. Clicking a day opens its detail modal. */
function monthKeyOf(iso){ return iso.slice(0, 7); }
function nextMonthKey(key){
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
function monthLabelFromKey(key){
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}
function firstOfMonthISO(key){ return key + '-01'; }
function lastOfMonthISO(key){
  const [y, m] = key.split('-').map(Number);
  return toISO(new Date(y, m, 0));
}
function heatMetricValue(d, mode){
  if (mode === 'reading') return { act: d.actualRead, exp: d.expectedRead };
  if (mode === 'listening') return { act: d.actualListen, exp: d.expectedListen };
  return { act: d.actualRead + d.actualListen, exp: d.expectedRead + d.expectedListen };
}
function heatCellLevel(d, mode){
  if (d.isFuture) return 'future';
  const { act, exp } = heatMetricValue(d, mode);
  if (act <= 0) return 'empty';
  const r = exp > 0 ? act / exp : 2;
  if (r >= 1.5) return '4';
  if (r >= 1.0) return '3';
  if (r >= 0.5) return '2';
  return '1';
}
function heatCellText(d){
  if (d.isFuture) return 'planned';
  const parts = [];
  if (d.actualRead > 0) parts.push(fmt(d.actualRead) + '%');
  if (d.actualListen > 0) parts.push(fmt(d.actualListen) + 'm');
  return parts.length ? parts.join(' · ') : '–';
}
function heatAccentVar(mode){
  if (mode === 'listening') return 'var(--listening)';
  if (mode === 'reading') return 'var(--reading)';
  return 'color-mix(in srgb, var(--reading) 60%, var(--listening) 40%)';
}
function roadmapCalendarMonthHTML(key, phase, colorBy){
  const byDate = {};
  phase.days.forEach(d => { byDate[d.date] = d; });
  const monthStart = firstOfMonthISO(key);
  const monthEnd = lastOfMonthISO(key);
  const gridStart = startOfWeekISO(monthStart);
  const gridEnd = addDays(startOfWeekISO(monthEnd), 6);
  const totalCells = diffDays(gridStart, gridEnd) + 1;

  const cells = [];
  for (let i = 0; i < totalCells; i++){
    const date = addDays(gridStart, i);
    if (monthKeyOf(date) !== key){
      cells.push(`<div class="cal-cell pad"></div>`);
      continue;
    }
    const dayNum = parseISO(date).getDate();
    const d = byDate[date];
    if (!d){
      cells.push(`<div class="cal-cell out"><span class="cal-num">${dayNum}</span></div>`);
      continue;
    }
    const level = heatCellLevel(d, colorBy);
    const cls = level === 'future' ? 'future' : (level === 'empty' ? 'empty' : 'lvl-' + level);
    const hasNote = !!d.note;
    cells.push(`
      <div class="cal-cell clickable ${cls}${d.isToday ? ' today' : ''}"
           data-action="rm-day-detail" data-date="${date}"
           ${hasNote ? `title="${escapeHtml(d.note)}"` : ''}>
        ${hasNote ? '<span class="cal-dot"></span>' : ''}
        <span class="cal-num">${dayNum}</span>
        <span class="cal-sub">${escapeHtml(heatCellText(d))}</span>
      </div>`);
  }

  return `
  <div class="cal-month">
    <div class="cal-month-label">${escapeHtml(monthLabelFromKey(key))}</div>
    <div class="cal-weekdays">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="cal-grid">${cells.join('')}</div>
  </div>`;
}
function roadmapPhaseHeatmapHTML(phase, rm){
  const days = phase.days || [];
  if (!days.length){
    return `<div class="rm-heat-empty">No days in this phase yet.</div>`;
  }
  const colorBy = heatColorBy;
  const months = [];
  let mk = monthKeyOf(days[0].date);
  const endKey = monthKeyOf(days[days.length - 1].date);
  while (mk <= endKey){
    months.push(mk);
    mk = nextMonthKey(mk);
  }

  return `
  <div class="rm-heatmap" style="--heat-accent:${heatAccentVar(colorBy)}">
    <div class="rm-heat-toolbar">
      <span class="rm-heat-toolbar-label">Color by</span>
      <div class="heat-colorby">
        <button type="button" class="hcb-btn ${colorBy === 'combined' ? 'active' : ''}" data-action="rm-heat-colorby" data-mode="combined"><span class="hcb-dot combined"></span>Combined</button>
        <button type="button" class="hcb-btn ${colorBy === 'reading' ? 'active' : ''}" data-action="rm-heat-colorby" data-mode="reading"><span class="hcb-dot reading"></span>Reading</button>
        <button type="button" class="hcb-btn ${colorBy === 'listening' ? 'active' : ''}" data-action="rm-heat-colorby" data-mode="listening"><span class="hcb-dot listening"></span>Listening</button>
      </div>
    </div>
    ${months.map(k => roadmapCalendarMonthHTML(k, phase, colorBy)).join('')}
    <div class="rm-heat-legend">
      <span>Less</span>
      <span class="rm-heat-swatch lvl-1"></span>
      <span class="rm-heat-swatch lvl-2"></span>
      <span class="rm-heat-swatch lvl-3"></span>
      <span class="rm-heat-swatch lvl-4"></span>
      <span>More</span>
    </div>
  </div>`;
}

/* Ordered, reorderable "read this then that" material queue per phase —
   merges the Materials library into the Roadmap, styled after the
   Demo-RM phase-queue concept, with progress computed from real logged
   activity / subtask data rather than fixed totals. */
/* Combined progress across every queued material's own target (total_units).
   Materials with no target set don't contribute units, but still count
   toward hasUntargeted so the caller knows the bar is a partial picture. */
/* A material can only belong to ONE phase's queue at a time. Returns the
   set of material ids already claimed by any phase other than excludeIndex. */
function materialsClaimedByOtherPhases(excludeIndex){
  const claimed = new Set();
  (state.roadmap.phases || []).forEach((p, i) => {
    if (i === excludeIndex) return;
    (p.materials || []).forEach(id => claimed.add(id));
  });
  return claimed;
}
function phaseUnitsTotals(phase){
  const rawIds = state.roadmap.phases[phase.index]?.materials || [];
  const items = rawIds.map(id => materialById(id)).filter(Boolean);
  let logged = 0, total = 0, targeted = 0;
  items.forEach(m => {
    if (materialHasTarget(m)){
      targeted++;
      logged += materialLoggedUnits(m);
      total += Number(m.total_units);
    }
  });
  return { logged, total, targeted, count: items.length };
}
function roadmapQueueHTML(phase){
  const rawIds = state.roadmap.phases[phase.index]?.materials || [];
  const items = rawIds.map(id => materialById(id)).filter(Boolean);
  const firstActiveIdx = items.findIndex(m => !materialIsComplete(m));

  const rows = items.length
    ? items.map((m, i) => roadmapQueueItemHTML(phase.index, m, i, {
        isFirst: i === 0,
        isLast: i === items.length - 1,
        isNext: i === firstActiveIdx
      })).join('')
    : `<div class="rm-queue-empty">No materials queued for this phase yet — add one below.</div>`;

  const allDone = items.length > 0 && items.every(materialIsComplete);
  const completeBanner = allDone
    ? `<div class="rm-queue-complete">✓ All materials in this phase are complete</div>` : '';

  const claimedElsewhere = materialsClaimedByOtherPhases(phase.index);
  const options = state.materials
    .filter(m => m.status !== 'archived' && !rawIds.includes(m.id) && !claimedElsewhere.has(m.id))
    .sort((a, b) => a.title.localeCompare(b.title));

  return `
  <div class="rm-queue">
    <div class="rm-queue-label">
      <span class="ql">Reading &amp; listening queue</span>
      <span class="qn">${items.length} item${items.length === 1 ? '' : 's'}</span>
    </div>
    <div class="rm-queue-list">${rows}</div>
    ${completeBanner}
    <div class="rm-queue-add">
      <select data-action="rm-add-phase-material" data-idx="${phase.index}">
        <option value="">+ Add material to queue…</option>
        ${options.map(m => `<option value="${m.id}">${escapeHtml(m.title)}</option>`).join('')}
      </select>
    </div>
  </div>`;
}
function roadmapQueueItemHTML(phaseIndex, m, index, opts){
  const hasTarget = materialHasTarget(m);
  const pct = materialUnitPct(m);
  const isDone = materialIsComplete(m);
  const sp = materialSubtasksSummary(m);
  const itemCls = ['rm-queue-item', isDone ? 'done' : '', opts.isNext ? 'next' : ''].filter(Boolean).join(' ');
  const badge = opts.isNext ? '<span class="badge next">Now</span>'
              : isDone ? '<span class="badge done">✓ Done</span>'
              : '';
  const typeLabel = (TYPES[m.default_input_type] || { label: 'Other' }).label;
  const initials = (m.title || '?').trim().slice(0, 2).toUpperCase();
  // Every color cue on this card — background tint, border, icon, progress
  // bar, "Now" highlight — derives from this one --task-color variable, set
  // straight from the material's own color (blended with the theme via
  // color-mix in CSS) so it updates automatically whenever the material's
  // color or cover changes in the Materials section. No separate setting.
  const matColor = m.color || MATERIAL_COLORS[0].hex;
  const icon = m.cover_url
    ? `<div class="rq-icon has-cover" style="background-image:url('${escapeHtml(m.cover_url)}')"></div>`
    : `<div class="rq-icon">${escapeHtml(initials)}</div>`;
  const subLabel = hasTarget
    ? `${fmt(materialLoggedUnits(m))} / ${fmt(Number(m.total_units))} ${materialUnitLabel(m).toLowerCase()}`
    : (sp ? `${sp.done}/${sp.total} subtasks` : materialTotalsText(materialTotals(m.id)));

  return `
  <div class="${itemCls}" style="--task-color:${escapeHtml(matColor)}">
    <span class="rq-pos">${index + 1}</span>
    ${icon}
    <div class="rq-main">
      <div class="rq-top">
        <span class="rq-title">${escapeHtml(m.title)}</span>
        <span class="rq-badge">${badge || escapeHtml(typeLabel)}</span>
      </div>
      <div class="rq-sub">
        <span>${escapeHtml(subLabel)}</span>
        <span class="sep">·</span>
        <span>${isDone ? 'Complete' : pct + '%'}</span>
      </div>
      <div class="rq-bar ${isDone ? 'complete' : ''}"><i style="width:${pct}%"></i></div>
    </div>
    <div class="rq-actions">
      <button class="rq-action" data-action="rm-queue-up" data-phase="${phaseIndex}" data-idx="${index}" ${opts.isFirst ? 'disabled' : ''} title="Move up" aria-label="Move up">↑</button>
      <button class="rq-action" data-action="rm-queue-down" data-phase="${phaseIndex}" data-idx="${index}" ${opts.isLast ? 'disabled' : ''} title="Move down" aria-label="Move down">↓</button>
      <button class="rq-action danger" data-action="rm-queue-remove" data-phase="${phaseIndex}" data-idx="${index}" title="Remove" aria-label="Remove">✕</button>
    </div>
  </div>`;
}

/* =========================================================
   Views — History
   ========================================================= */
function filteredActivities(){
  const f = historyFilters;
  let list = state.activities.slice();
  if (f.from) list = list.filter(a => a.logged_on >= f.from);
  if (f.to)   list = list.filter(a => a.logged_on <= f.to);
  if (f.category !== 'all') list = list.filter(a => a.category === f.category);
  if (f.type !== 'all')     list = list.filter(a => a.input_type === f.type);
  if (f.material !== 'all') list = list.filter(a => a.material_id === f.material);
  if (f.q.trim()){
    const q = f.q.trim().toLowerCase();
    list = list.filter(a => {
      const m = materialById(a.material_id);
      return (m && m.title.toLowerCase().includes(q)) || (a.note || '').toLowerCase().includes(q);
    });
  }
  list.sort((a, b) =>
    a.logged_on < b.logged_on ? 1 : a.logged_on > b.logged_on ? -1 :
    (a.created_at < b.created_at ? 1 : -1)
  );
  return list;
}
function viewHistory(){
  const list = filteredActivities();
  const groups = [];
  const map = new Map();
  list.forEach(a => {
    if (!map.has(a.logged_on)){ const g = { date: a.logged_on, items: [] }; map.set(a.logged_on, g); groups.push(g); }
    map.get(a.logged_on).items.push(a);
  });
  const materialOptions = state.materials.slice().sort((a, b) => a.title.localeCompare(b.title))
    .map(m => `<option value="${m.id}" ${historyFilters.material === m.id ? 'selected' : ''}>${escapeHtml(m.title)}</option>`).join('');
  const typeOptions = TYPE_ORDER
    .map(t => `<option value="${t}" ${historyFilters.type === t ? 'selected' : ''}>${TYPES[t].label}</option>`).join('');
  const hasFilters =
    historyFilters.from || historyFilters.to || historyFilters.category !== 'all' ||
    historyFilters.type !== 'all' || historyFilters.material !== 'all' || historyFilters.q.trim();

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><h2>Filters</h2>
      ${hasFilters ? '<button class="link-btn" data-action="clear-filters">Clear</button>' : ''}
    </div>
    <div class="filters">
      <div class="field" style="margin-bottom:0"><label for="histFrom">From</label><input type="date" id="histFrom" value="${historyFilters.from}"></div>
      <div class="field" style="margin-bottom:0"><label for="histTo">To</label><input type="date" id="histTo" value="${historyFilters.to}"></div>
      <div class="field" style="margin-bottom:0"><label for="histCategory">Category</label>
        <select id="histCategory">
          <option value="all" ${historyFilters.category === 'all' ? 'selected' : ''}>All</option>
          <option value="reading" ${historyFilters.category === 'reading' ? 'selected' : ''}>Reading</option>
          <option value="listening" ${historyFilters.category === 'listening' ? 'selected' : ''}>Listening</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0"><label for="histType">Type</label>
        <select id="histType"><option value="all" ${historyFilters.type === 'all' ? 'selected' : ''}>All types</option>${typeOptions}</select>
      </div>
      <div class="field" style="margin-bottom:0"><label for="histMaterial">Material</label>
        <select id="histMaterial"><option value="all" ${historyFilters.material === 'all' ? 'selected' : ''}>All materials</option>${materialOptions}</select>
      </div>
      <div class="field full" style="margin-bottom:0"><label for="histSearch">Search</label>
        <input type="text" id="histSearch" placeholder="Title or note…" value="${escapeHtml(historyFilters.q)}" autocomplete="off">
      </div>
    </div>
  </div>
  ${groups.length ? groups.map(g => {
    const pages = sumCategory(g.items, 'reading');
    const mins  = sumCategory(g.items, 'listening');
    const parts = [];
    if (pages) parts.push(fmt(pages) + '%');
    if (mins)  parts.push(fmt(mins) + ' min');
    parts.push(fmt1(xpFrom(pages, mins)) + ' XP');
    return `
    <div class="day-group">
      <div class="day-head">
        <span class="d">${escapeHtml(prettyDate(g.date))}</span>
        <span class="tot">${parts.join(' · ')}</span>

function dailyChartHTML(metric, days){
  const ch = state.challenge;
  const today = todayISO();
  const items = [];
  for (let i = days - 1; i >= 0; i--){
    const date = addDays(today, -i);
    const inChallenge = date >= ch.start_date && date <= ch.end_date;
    const val = inChallenge ? sumCategory(actsInRange(date, date), metric) : 0;
    items.push({ date, val, inChallenge });
  }
  const max = Math.max(...items.map(i => i.val), 1);
  const cls = metric === 'reading' ? 'reading' : 'listening';
  return `
  <div class="chart">
    ${items.map((it, idx) => `
      <div class="col" title="${it.date}: ${fmt(it.val)} ${metric === 'reading' ? '%' : 'min'}">
        <div class="bar-wrap"><div class="fill ${it.val ? cls : 'muted'}" style="height:${it.val ? Math.max(3, it.val / max * 100) : 2}%"></div></div>
        <span class="lbl">${idx % 3 === 0 ? parseISO(it.date).getDate() : ''}</span>
      </div>`).join('')}
  </div>
  <div class="chart-legend">
    <span><i style="background:${metric === 'reading' ? 'var(--reading)' : 'var(--listening)'}"></i>${metric === 'reading' ? 'Percent read' : 'Minutes listened'}</span>
    <span>Last ${days} days · peak ${fmt(max)}</span>
  </div>`;
}
function weeklyChartHTML(metric){
  const ch = state.challenge;
  const today = todayISO();
  const rate = metric === 'reading'
    ? (Number(ch.reading_target_percent) || 0) / Math.max(1, diffDays(ch.start_date, ch.end_date) + 1)
    : (Number(ch.listening_target_minutes) || 0) / Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const thisWeekStart = startOfWeekISO(today);
  const weeks = [];
  for (let i = 5; i >= 0; i--){
    const ws = addDays(thisWeekStart, -7 * i);
    const we = addDays(ws, 6);
    const from = maxISO(ws, ch.start_date);
    const to   = minISO(minISO(we, today), ch.end_date);
    const daysIn = from <= to ? diffDays(from, to) + 1 : 0;
    const val = daysIn ? sumCategory(actsInRange(from, to), metric) : 0;
    weeks.push({ ws, val, exp: rate * daysIn, daysIn, active: from <= to });
  }
  const max = Math.max(...weeks.map(w => Math.max(w.val, w.exp)), 1);
  const cls = metric === 'reading' ? 'reading' : 'listening';
  const CHART_H = 170, LABEL_H = 18, BAR_AREA = CHART_H - LABEL_H;
  const lastExp = weeks[weeks.length - 1].exp;
  return `
  <div class="chart">
    <div class="target-line" style="bottom:${LABEL_H + (lastExp / max) * BAR_AREA}px"></div>
    ${weeks.map(w => `
      <div class="col" title="${w.ws}: ${fmt(w.val)} vs ${fmt(w.exp)} expected">
        <div class="bar-wrap"><div class="fill ${w.val ? cls : 'muted'}" style="height:${w.val ? Math.max(3, w.val / max * 100) : 2}%"></div></div>
        <span class="lbl">${parseISO(w.ws).getDate()}/${parseISO(w.ws).getMonth() + 1}</span>
      </div>`).join('')}
  </div>
  <div class="chart-legend">
    <span><i style="background:${metric === 'reading' ? 'var(--reading)' : 'var(--listening)'}"></i>Weekly total</span>
    <span><i style="background:transparent;border-top:1.5px dashed var(--dash-line);width:14px;height:0;border-radius:0"></i>Pace target</span>
  </div>`;
}
function monthlyChartHTML(metric){
  const ch = state.challenge;
  const today = todayISO();
  const totalDays = Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const rate = metric === 'reading'
    ? (Number(ch.reading_target_percent) || 0) / totalDays
    : (Number(ch.listening_target_minutes) || 0) / totalDays;
  const months = [];
  for (let i = 0; i < 3; i++){
    const ms = addDays(ch.start_date, i * 30);
    const me = minISO(addDays(ch.start_date, i * 30 + 29), ch.end_date);
    const cut = minISO(today, me);
    const daysIn = ms <= cut ? diffDays(ms, cut) + 1 : 0;
    const val = daysIn ? sumCategory(actsInRange(ms, cut), metric) : 0;
    months.push({ ms, me, val, exp: rate * daysIn, daysIn });
  }
  const max = Math.max(...months.map(m => Math.max(m.val, m.exp)), 1);
  const cls = metric === 'reading' ? 'reading' : 'listening';
  return `
  <div class="chart">
    ${months.map((m, i) => `
      <div class="col" title="Month ${i + 1}: ${fmt(m.val)} vs ${fmt(m.exp)} expected">
        <div class="bar-wrap"><div class="fill ${m.val ? cls : 'muted'}" style="height:${m.val ? Math.max(3, m.val / max * 100) : 2}%"></div></div>
        <span class="lbl">Month ${i + 1}</span>
      </div>`).join('')}
  </div>
  <div class="chart-legend">
    <span><i style="background:${metric === 'reading' ? 'var(--reading)' : 'var(--listening)'}"></i>Month total</span>
    <span>Expected shown on hover</span>
  </div>
  <div class="chart-note">
    ${months.map((m, i) => `Month ${i + 1}: ${fmt(m.val)} / ${fmt(m.exp)}`).join(' &nbsp;·&nbsp; ')}
  </div>`;
}
function cumulativeSVG(metric){
  const ch = state.challenge;
  const today = todayISO();
  const totalDays = Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const target = metric === 'reading' ? Number(ch.reading_target_percent) || 1 : Number(ch.listening_target_minutes) || 1;
  const elapsed = clamp(diffDays(ch.start_date, today) + 1, 0, totalDays);
  const daily = new Array(totalDays + 1).fill(0);
  state.activities.forEach(a => {
    if (a.category !== metric) return;
    const idx = diffDays(ch.start_date, a.logged_on) + 1;
    if (idx >= 1 && idx <= totalDays) daily[idx] += Number(a.amount) || 0;
  });
  let cum = 0;
  const pts = [[0, 0]];
  for (let i = 1; i <= totalDays; i++){
    cum += daily[i];
    if (i <= elapsed) pts.push([i, cum]);
  }
  const maxY = Math.max(target, cum, 1);
  const x = d => (d / totalDays) * 100;
  const y = v => 100 - (v / maxY) * 100;
  const linePath = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(2) + ' ' + y(p[1]).toFixed(2)).join(' ');
  const areaPath = linePath + ` L ${x(pts[pts.length - 1][0]).toFixed(2)} 100 L 0 100 Z`;
  const idealPath = `M 0 100 L 100 ${y(target).toFixed(2)}`;
  const varName = metric === 'reading' ? '--reading' : '--listening';
  return `
  <svg class="cum-chart" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Cumulative progress">
    <line x1="0" y1="100" x2="100" y2="100" style="stroke:var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${areaPath}" style="fill:var(${varName})" fill-opacity="0.10" stroke="none"/>
    <path d="${idealPath}" fill="none" style="stroke:var(--dash-line)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <path d="${linePath}" fill="none" style="stroke:var(${varName})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="chart-legend">
    <span><i style="background:var(${varName})"></i>Your cumulative total</span>
    <span><i style="background:transparent;border-top:1.5px dashed var(--dash-line);width:14px;height:0;border-radius:0"></i>Ideal pace line</span>
    <span>Day ${elapsed} of ${totalDays}</span>
  </div>`;
}
function viewProgress(){

  ${noData ? `

/* =========================================================
   Views — Materials
   ========================================================= */
function materialTotals(id){
  const list = state.activities.filter(a => a.material_id === id);
  return { percent: sumCategory(list, 'reading'), minutes: sumCategory(list, 'listening'), count: list.length };
}
function materialTotalsText(t){
  const parts = [];
  if (t.percent) parts.push(fmt(t.percent) + '%');
  if (t.minutes) parts.push(fmt(t.minutes) + ' min');
  return parts.length ? parts.join(' · ') : 'Nothing logged yet';
}
/* ---- Target-based units (total_units / unit / episodes / manual override) ----
   A material can carry an explicit target (m.total_units + m.unit). When it
   does, logged-so-far is computed from real logged activities (percent for
   reading, minutes for listening) unless a manual override (m.manual_units)
   has been set, in which case that number is used directly instead. Older
   materials with no target fall back to the previous subtask/status logic. */
function materialHasTarget(m){ return Number(m.total_units) > 0; }
function materialUnitLabel(m){ return m.unit || defaultUnitFor(m.default_category); }
function materialLoggedUnits(m){
  if (m.manual_units !== null && m.manual_units !== undefined && m.manual_units !== '') {
    return Math.max(0, Number(m.manual_units) || 0);
  }
  const t = materialTotals(m.id);
  return m.default_category === 'listening' ? t.minutes : t.percent;
}
function materialEpisodesLogged(m){
  if (m.manual_episodes !== null && m.manual_episodes !== undefined && m.manual_episodes !== '') {
    return Math.max(0, Number(m.manual_episodes) || 0);
  }
  return materialTotals(m.id).count;
}
function materialUnitPct(m){
  if (materialHasTarget(m)) return clamp(Math.round(materialLoggedUnits(m) / Number(m.total_units) * 100), 0, 100);
  return materialProgressPct(m);
}
function materialIsComplete(m){
  if (materialHasTarget(m)) return materialLoggedUnits(m) >= Number(m.total_units);
  return m.status === 'completed';
}
/* Which phases (by name) a material is queued in, in phase order. */
function materialPhaseTags(m){
  const phases = (state.roadmap && state.roadmap.phases) || [];
  return phases
    .map((p, i) => ((p.materials || []).includes(m.id) ? { index: i, name: p.name || `Phase ${i + 1}` } : null))
    .filter(Boolean);
}

function materialProgressPct(m){
  const sp = materialSubtasksSummary(m);
  if (sp) return sp.total ? Math.round(sp.done / sp.total * 100) : 0;
  if (m.status === 'completed') return 100;
  return materialTotals(m.id).count > 0 ? 50 : 0;
}
function materialProgressBarHTML(m){
  const sp = materialSubtasksSummary(m);
  const hasTarget = materialHasTarget(m);
  const pct = materialUnitPct(m);
  const isDone = materialIsComplete(m);
  const barCls = isDone ? 'complete' : (m.default_category || 'reading');
  const secondary = hasTarget
    ? `${fmt(materialLoggedUnits(m))} / ${fmt(Number(m.total_units))} ${materialUnitLabel(m).toLowerCase()}`
    : (sp ? `${sp.done}/${sp.total} subtasks done` : materialTotalsText(materialTotals(m.id)));
  const pctLabel = isDone ? '✓ Done'
    : ((hasTarget || sp) ? pct + '%' : (pct > 0 ? 'In progress' : 'Not started'));
  return `
    <div class="mat-progress">
      <div class="mat-progress-top">
        <span class="mat-progress-pct${isDone ? ' complete' : ''}">${pctLabel}</span>
        <span class="mat-progress-sub">${escapeHtml(secondary)}</span>
      </div>
      <div class="mat-progress-bar ${barCls}"><i style="width:${pct}%"></i></div>
    </div>`;
}
const MATERIAL_STATUS_RANK = { active: 0, scheduled: 1, completed: 2, archived: 3 };
function materialSorter(a, b){
  const r = (MATERIAL_STATUS_RANK[a.status] ?? 3) - (MATERIAL_STATUS_RANK[b.status] ?? 3);
  return r !== 0 ? r : a.title.localeCompare(b.title);
}
function materialSubtasksSummary(m){
  const list = Array.isArray(m.subtasks) ? m.subtasks : [];
  if (!list.length) return null;
  return { done: list.filter(s => s.done).length, total: list.length };
}
function materialSubtaskInlineHTML(m){

function materialSubtaskProgressHTML(m){

/* =========================================================
   Render
   ========================================================= */
function render(){
  const app = $('#app');
  if (currentView === 'dashboard')        app.innerHTML = viewDashboard();
  else if (currentView === 'profile')     app.innerHTML = viewProfile();
  else if (currentView === 'challenges')  app.innerHTML = viewChallenges();
  else if (currentView === 'roadmap')     app.innerHTML = viewRoadmap();
  else if (currentView === 'history')     app.innerHTML = viewHistory();
  else if (currentView === 'progress')    app.innerHTML = viewProgress();
  else                                    app.innerHTML = viewDashboard();

  updateHeader();
  updateTabs();
  updateCountdowns();
}
function updateTabs(){
  $$('#tabs button[data-nav]').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === currentView);
  });
}
function updateHeader(){
  const s = getStats();
  $('#hdrSub').innerHTML =
    `Day ${s.elapsed} of ${s.totalDays} · ${s.daysLeft} days left · ` +
    `⏳ <span class="mono" data-countdown="day">--:--:--</span> until 00:00`;
  const p = state.profile;
  const av = $('#hdrAvatar');
  const nm = $('#hdrName');
  if (av){
    av.textContent = profileAvatarContent(p);
    av.style.background = profileColor();
    av.style.fontSize = (p && p.avatar_emoji) ? '15px' : '11px';
    av.style.fontWeight = (p && p.avatar_emoji) ? '400' : '750';
  }
  if (nm) nm.textContent = (p && p.display_name) ? p.display_name : 'Profile';
}
function renderPreservingFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  let selStart = null, selEnd = null;
  if (active && typeof active.selectionStart === 'number'){
    selStart = active.selectionStart;
    selEnd = active.selectionEnd;
  }
  render();
  if (id){
    const el = document.getElementById(id);
    if (el){
      el.focus();
      if (selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

/* =========================================================
   Roadmap modals
   ========================================================= */
function openRmEditPhases(){
  const phases = state.roadmap.phases;
  const activeMaterials = state.materials.filter(m => m.status === 'active').sort((a, b) => a.title.localeCompare(b.title));
  const draftPhaseMaterials = phases.map(p => (p.materials || []).slice());

  openModal(`
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>Edit phases</h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <form id="rmPhasesForm" class="modal-body" autocomplete="off">
        <p class="hint" style="margin:0 0 16px">
          Your challenge is split into four equal phases. Give each a name, a short focus description,
          and optionally the materials you plan to use during it. Each material belongs to only one
          phase at a time — picking it here removes it from any other phase.
        </p>
        ${phases.map((p, i) => `
          <div class="form-section">
            <div class="form-section-title"><span class="dotnum">${i + 1}</span> Phase ${i + 1}</div>
            <div class="field">
              <label for="phName${i}">Name</label>
              <input type="text" id="phName${i}" maxlength="40" value="${escapeHtml(p.name)}" placeholder="e.g. Foundation">
            </div>
            <div class="field">
              <label for="phFocus${i}">Focus</label>
              <textarea id="phFocus${i}" rows="2" maxlength="200" placeholder="What should this phase focus on?">${escapeHtml(p.focus)}</textarea>
            </div>
            <div class="field">
              <label>Materials</label>
              ${activeMaterials.length ? `
              <div class="chips" data-phase-materials="${i}">
                ${activeMaterials.map(m => `
                  <button type="button" class="chip ${p.materials.includes(m.id) ? 'active' : ''}" data-mid="${m.id}">${escapeHtml(m.title)}</button>
                `).join('')}
              </div>` : `<p class="hint" style="margin:0">No materials yet — add some in Roadmap → Materials first.</p>`}
            </div>
          </div>
        `).join('')}
        <div class="modal-actions" style="margin-top:20px">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save phases</button>
        </div>
      </form>
    </div>
  `);

  $$('#rmPhasesForm [data-phase-materials]').forEach(wrap => {
    const i = Number(wrap.dataset.phaseMaterials);
    wrap.addEventListener('click', e => {
      const b = e.target.closest('.chip[data-mid]'); if (!b) return;
      const mid = b.dataset.mid;
      const idx = draftPhaseMaterials[i].indexOf(mid);
      if (idx >= 0){
        // Turning this material off for this phase.
        draftPhaseMaterials[i].splice(idx, 1);
        b.classList.remove('active');
      } else {
        // Exclusive: claiming it here means no other phase keeps it.
        draftPhaseMaterials.forEach((list, j) => {
          if (j === i) return;
          const jIdx = list.indexOf(mid);
          if (jIdx >= 0){
            list.splice(jIdx, 1);
            const otherChip = $(`#rmPhasesForm [data-phase-materials="${j}"] .chip[data-mid="${mid}"]`);
            if (otherChip) otherChip.classList.remove('active');
          }
        });
        draftPhaseMaterials[i].push(mid);
        b.classList.add('active');
      }
    });
  });

  $('#rmPhasesForm').addEventListener('submit', e => {
    e.preventDefault();
    for (let i = 0; i < 4; i++){
      state.roadmap.phases[i].name = ($('#phName' + i).value.trim() || `Phase ${i + 1}`).slice(0, 40);
      state.roadmap.phases[i].focus = $('#phFocus' + i).value.trim().slice(0, 200);
      state.roadmap.phases[i].materials = draftPhaseMaterials[i].slice();
    }
    saveState(); closeModal(); render();
  });
}

            <button type="button" class="chip ${m.done ? 'active' : ''}" data-done="1">Complete</button>
          </div>
        </div>` : ''}
        <div class="modal-actions" style="margin-top:20px">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">${editing ? 'Save milestone' : 'Add milestone'}</button>
        </div>
      </form>
    </div>
  `);

  let doneDraft = m.done;
  if (editing){
    $('#msDoneChips').addEventListener('click', e => {
      const b = e.target.closest('.chip[data-done]'); if (!b) return;
      doneDraft = b.dataset.done === '1';
      $$('#msDoneChips .chip').forEach(x => x.classList.toggle('active', x === b));
    });
  }

  $('#rmMsForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#msTitle').value.trim();
    if (!title){ $('#msTitle').focus(); return; }
    const payload = {
      title,
      description: $('#msDescription').value.trim().slice(0, 200),
      date: $('#msDate').value || todayISO(),
      done: editing ? doneDraft : false
    };
    if (editing){
      const target = state.roadmap.milestones.find(x => x.id === existing.id);
      if (target) Object.assign(target, payload);
    } else {
      state.roadmap.milestones.push({ id: uid('ms'), ...payload });
    }
    saveState(); closeModal(); render();
  });
  setTimeout(() => $('#msTitle').focus(), 60);
}

/* =========================================================
   Log activity modal
   ========================================================= */
function openLogModal(activity){
  const ch = state.challenge;
  const editing = !!activity;
  const draft = editing
    ? { id: activity.id, logged_on: activity.logged_on, input_type: activity.input_type,
        category: activity.category, material_id: activity.material_id,
        amount: activity.amount, unit: activity.unit, note: activity.note || '' }
    : { id: null, logged_on: todayISO(), input_type: 'kindle', category: 'reading',
        material_id: null, amount: '', unit: 'percent', note: '' };

  const mat = draft.material_id ? materialById(draft.material_id) : null;
  const titleVal = mat ? mat.title : '';

  const amountAttrsFor = u => u === 'percent'
    ? { min: '0.1', max: '100', step: '0.1', mode: 'decimal', placeholder: '%' }
    : { min: '1', max: '', step: '1', mode: 'numeric', placeholder: 'Minutes' };
  const initAttrs = amountAttrsFor(draft.unit);

  openModal(`
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>${editing ? 'Edit activity' : 'Log activity'}</h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <form id="logForm" class="modal-body" autocomplete="off">
        <div class="field"><label for="logDate">Date</label><input type="date" id="logDate" value="${draft.logged_on}" required></div>
        <div class="field">
          <label>Type</label>
          <div class="chips" id="typeChips">
            ${TYPE_ORDER.map(t => `
              <button type="button" class="chip ${draft.input_type === t ? 'active' : ''}"
                      data-type="${t}" data-cat="${TYPES[t].category}">${TYPES[t].label}</button>
            `).join('')}
          </div>
        </div>
        <div class="field">
          <label for="logTitle">Material</label>
          <div class="ac">
            <input type="text" id="logTitle" placeholder="Title (optional)" value="${escapeHtml(titleVal)}">
            <div class="ac-list" id="acList"></div>
          </div>
        </div>
        <div class="field">
          <label for="logAmount">Amount</label>
          <div class="amount-row">
            <input type="number" id="logAmount" min="${initAttrs.min}" ${initAttrs.max ? `max="${initAttrs.max}"` : ''} step="${initAttrs.step}" inputmode="${initAttrs.mode}"
                   placeholder="${initAttrs.placeholder}"
                   value="${draft.amount === '' ? '' : draft.amount}">
            <div class="seg" id="unitSeg">
              <button type="button" data-unit="percent" class="${draft.unit === 'percent' ? 'active' : ''}">%</button>
              <button type="button" data-unit="minutes" class="${draft.unit === 'minutes' ? 'active' : ''}">Minutes</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="logNote">Note</label>
          <textarea id="logNote" rows="2" placeholder="Anything worth remembering…">${escapeHtml(draft.note)}</textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">${editing ? 'Save changes' : 'Save activity'}</button>
        </div>
      </form>
    </div>
  `);

  const typeChips = $('#typeChips');
  const unitSeg = $('#unitSeg');
  const titleInput = $('#logTitle');
  const acList = $('#acList');
  const amountInput = $('#logAmount');

  function applyAmountInputAttrs(){
    const at = amountAttrsFor(draft.unit);
    amountInput.min = at.min;
    if (at.max) amountInput.max = at.max; else amountInput.removeAttribute('max');
    amountInput.step = at.step;
    amountInput.inputMode = at.mode;
    amountInput.placeholder = at.placeholder;
  }

  function applyType(t){
    draft.input_type = t;
    draft.category = TYPES[t].category;
    draft.unit = TYPES[t].unit;
    $$('.chip', typeChips).forEach(c => c.classList.toggle('active', c.dataset.type === t));
    $$('button', unitSeg).forEach(b => b.classList.toggle('active', b.dataset.unit === draft.unit));
    applyAmountInputAttrs();
  }
  function updateAC(){
    const q = titleInput.value.trim().toLowerCase();
    const matches = state.materials
      .filter(m => m.status !== 'archived' || m.id === draft.material_id)
      .filter(m => !q || m.title.toLowerCase().includes(q))
      .slice(0, 6);
    if (!matches.length){ acList.classList.remove('open'); acList.innerHTML = ''; return; }
    acList.innerHTML = matches.map(m => `
      <div class="ac-item" data-mat="${m.id}">
        <span>${escapeHtml(m.title)}</span>
        <small>${escapeHtml(m.creator || (TYPES[m.default_input_type] || { label: '' }).label)}</small>
      </div>`).join('');
    acList.classList.add('open');
  }
  typeChips.addEventListener('click', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    applyType(chip.dataset.type);
  });
  unitSeg.addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    draft.unit = btn.dataset.unit;
    $$('button', unitSeg).forEach(b => b.classList.toggle('active', b.dataset.unit === draft.unit));
    applyAmountInputAttrs();
  });
  titleInput.addEventListener('input', () => { draft.material_id = null; updateAC(); });
  titleInput.addEventListener('focus', updateAC);
  titleInput.addEventListener('blur', () => setTimeout(() => acList.classList.remove('open'), 160));
  acList.addEventListener('mousedown', e => {
    const item = e.target.closest('.ac-item'); if (!item) return;
    e.preventDefault();
    const m = materialById(item.dataset.mat); if (!m) return;
    titleInput.value = m.title;
    draft.material_id = m.id;
    applyType(m.default_input_type);
    acList.classList.remove('open');
    amountInput.focus();
  });

  $('#logForm').addEventListener('submit', e => {
    e.preventDefault();
    const amount = Number(amountInput.value);
    if (!amount || amount <= 0){ amountInput.focus(); return; }
    const loggedOn = $('#logDate').value || todayISO();
    const note = $('#logNote').value.trim();
    const title = titleInput.value.trim();
    let materialId = draft.material_id;
    if (title){
      const current = materialId ? materialById(materialId) : null;
      if (!current || current.title.toLowerCase() !== title.toLowerCase()){
        const byTitle = state.materials.find(m => m.title.toLowerCase() === title.toLowerCase());
        if (byTitle){ materialId = byTitle.id; }
        else {
          const nm = {
            id: uid('m'), challenge_id: ch.id, title, creator: '',
            default_input_type: draft.input_type, default_category: draft.category,
            status: 'active', cover_url: ''
          };
          state.materials.push(nm);
          materialId = nm.id;
        }
      }
    } else { materialId = null; }
    const nowIso = new Date().toISOString();
    if (editing){
      const idx = state.activities.findIndex(a => a.id === activity.id);
      if (idx >= 0){
        state.activities[idx] = {
          ...state.activities[idx],
          logged_on: loggedOn, category: draft.category, input_type: draft.input_type,
          material_id: materialId, amount, unit: draft.unit, note, updated_at: nowIso
        };
      }
    } else {
      state.activities.push({
        id: uid('a'), challenge_id: ch.id, logged_on: loggedOn,
        category: draft.category, input_type: draft.input_type,
        material_id: materialId, amount, unit: draft.unit, note,
        created_at: nowIso, updated_at: nowIso
      });
    }
    saveState(); closeModal(); render();
  });
  setTimeout(() => amountInput.focus(), 60);
}

          <input type="text" id="matCreator" value="${escapeHtml(m.creator || '')}" placeholder="Author, host or studio">

        <div class="field">

            <div style="flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button type="button" class="btn btn-ghost btn-sm" id="matCoverUploadBtn">⬆ Upload cover</button>
                <button type="button" class="btn btn-ghost btn-sm" id="matCoverRemoveBtn" style="color:var(--bad-fg)">Remove</button>
              </div>
              <p class="hint" style="margin:0">Or paste an image URL</p>
              <input type="text" id="matCoverUrl" placeholder="https://…" value="${coverIsLink ? escapeHtml(coverUrl) : ''}">
            </div>
          </div>
          <input type="file" id="matCoverFile" accept="image/*" style="display:none">
        </div>
        <div class="field"><label for="matType">Default input type</label>
          <select id="matType">
            ${TYPE_ORDER.map(t => `<option value="${t}" ${m.default_input_type === t ? 'selected' : ''}>${TYPES[t].label} (${TYPES[t].category})</option>`).join('')}
          </select>
        </div>
        <div class="two-col">
          <div class="field"><label for="matTotalUnits">Total units</label>
            <input type="number" id="matTotalUnits" min="0" step="1" inputmode="numeric" placeholder="e.g. 320" value="${m.total_units ? escapeHtml(String(m.total_units)) : ''}">
          </div>
          <div class="field"><label for="matUnit">Unit</label>
            <input type="text" id="matUnit" list="matUnitOptions" placeholder="${escapeHtml(defaultUnitFor(m.default_category))}" value="${escapeHtml(m.unit || '')}">
            <datalist id="matUnitOptions">
              ${[...UNIT_SUGGESTIONS.reading, ...UNIT_SUGGESTIONS.listening].map(u => `<option value="${u}"></option>`).join('')}
            </datalist>
          </div>
        </div>
        <div class="field"><label for="matEpisodes">Episodes (optional)</label>
          <input type="number" id="matEpisodes" min="0" step="1" inputmode="numeric" placeholder="e.g. 24" value="${m.episodes_total ? escapeHtml(String(m.episodes_total)) : ''}">
          <p class="hint" style="margin-top:6px">For podcasts, TV shows or audiobook chapters — a second progress readout.</p>
        </div>
        <div class="field">
          <label>Emoji</label>
          <div class="emoji-grid" id="matEmojiGrid" style="grid-template-columns:repeat(7,1fr)">
            <button type="button" data-mat-emoji="" title="Use initials" class="${!m.emoji ? 'active' : ''}" style="font-size:11px;font-weight:700;color:var(--muted)">A–Z</button>
            ${MATERIAL_EMOJI_SUGGESTIONS.map(e => `
              <button type="button" data-mat-emoji="${e}" class="${m.emoji === e ? 'active' : ''}">${e}</button>
            `).join('')}
          </div>
        </div>
        <div class="field">
          <label>Color</label>
          <div class="swatch-row" id="matSwatchRow">
            ${MATERIAL_COLORS.map(c => `
              <button type="button" class="swatch ${(m.color || MATERIAL_COLORS[0].hex) === c.hex ? 'active' : ''}" data-mat-color="${c.hex}" style="background:${c.hex}" title="${escapeHtml(c.name)}" aria-label="Color ${escapeHtml(c.name)}"></button>
            `).join('')}
          </div>
        </div>
        <div class="field"><label for="matManualUnits">Logged units so far (manual override)</label>
          <input type="number" id="matManualUnits" min="0" step="1" inputmode="numeric" placeholder="Auto from logged activities" value="${m.manual_units !== null && m.manual_units !== undefined && m.manual_units !== '' ? escapeHtml(String(m.manual_units)) : ''}">
          <p class="hint" style="margin-top:6px">Normally this comes from your logged activities — set a number here to override the tally, or leave it blank to calculate automatically.</p>
        </div>
        <div class="field"><label for="matStatus">Status</label>
          <select id="matStatus">
            <option value="active" ${m.status === 'active' ? 'selected' : ''}>Active</option>
            <option value="scheduled" ${m.status === 'scheduled' ? 'selected' : ''}>Scheduled</option>
            <option value="completed" ${m.status === 'completed' ? 'selected' : ''}>Completed</option>
            <option value="archived" ${m.status === 'archived' ? 'selected' : ''}>Archived</option>
          </select>
        </div>
        <div class="field"><label for="matDeadline">Deadline (optional)</label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="date" id="matDeadline" value="${m.deadline ? escapeHtml(m.deadline) : ''}" style="flex:1;min-width:150px">
            ${m.deadline ? `<button type="button" class="btn btn-ghost btn-sm" id="matDeadlineClearBtn" style="color:var(--bad-fg)">Remove</button>` : ''}
          </div>
          <p class="hint" style="margin-top:6px">Shows a live countdown in the list until 23:59 that day.</p>
        </div>
        <div class="field">
          <label>Subtasks (optional)</label>
          <div id="matSubtasksList" class="subtask-list"></div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <input type="text" id="matSubtaskInput" placeholder="e.g. Finish chapter 3" maxlength="140" style="flex:1">
            <button type="button" class="btn btn-ghost btn-sm" id="matSubtaskAddBtn">+ Add</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">${editing ? 'Save changes' : 'Add material'}</button>
        </div>
      </form>
    </div>
  `);

  let matEmoji = m.emoji || '';
  let matColor = m.color || MATERIAL_COLORS[0].hex;
  $('#matEmojiGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-mat-emoji]'); if (!b) return;
    matEmoji = b.dataset.matEmoji;
    $$('#matEmojiGrid button').forEach(x => x.classList.toggle('active', x === b));
  });
  $('#matSwatchRow').addEventListener('click', e => {
    const b = e.target.closest('[data-mat-color]'); if (!b) return;
    matColor = b.dataset.matColor;
    $$('#matSwatchRow .swatch').forEach(x => x.classList.toggle('active', x === b));
  });

  const coverThumb = $('#matCoverThumb');
  const coverFileInput = $('#matCoverFile');
  const coverUrlInput = $('#matCoverUrl');

  function refreshCoverThumb(){
    if (coverUrl){
      coverThumb.style.backgroundImage = `url('${coverUrl}')`;
      coverThumb.textContent = '';
    } else {
      coverThumb.style.backgroundImage = '';
      coverThumb.textContent = 'No cover';
    }
  }
  $('#matCoverUploadBtn').addEventListener('click', () => coverFileInput.click());
  $('#matCoverRemoveBtn').addEventListener('click', () => {
    coverUrl = ''; coverUrlInput.value = ''; refreshCoverThumb();
  });
  coverFileInput.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => { coverUrl = encodeImage(img, 500); coverUrlInput.value = ''; refreshCoverThumb(); };
      img.onerror = () => alert('Could not read that image.');
      img.src = ev.target.result;
    };
    reader.onerror = () => alert('Could not read that file.');
    reader.readAsDataURL(f);
  });
  coverUrlInput.addEventListener('input', () => {
    coverUrl = coverUrlInput.value.trim();
    refreshCoverThumb();
  });
  refreshCoverThumb();

  let subtasks = Array.isArray(m.subtasks)
    ? m.subtasks.map(s => ({ id: s.id || uid('st'), title: s.title, done: !!s.done }))
    : [];
  const subtasksList = $('#matSubtasksList');
  function renderSubtasksDraft(){
    if (!subtasks.length){
      subtasksList.innerHTML = `<div style="font-size:12.5px;color:var(--muted);padding:2px 0">No subtasks yet.</div>`;
      return;
    }
    subtasksList.innerHTML = subtasks.map(s => `
      <div class="subtask-row" data-id="${s.id}">
        <input type="checkbox" class="subtask-check" ${s.done ? 'checked' : ''}>
        <span class="subtask-title ${s.done ? 'done' : ''}">${escapeHtml(s.title)}</span>
        <button type="button" class="link-btn danger subtask-del" aria-label="Remove subtask">✕</button>
      </div>
    `).join('');
  }
  renderSubtasksDraft();
  subtasksList.addEventListener('change', e => {
    if (!e.target.classList.contains('subtask-check')) return;
    const row = e.target.closest('.subtask-row');
    const st = subtasks.find(s => s.id === row.dataset.id);
    if (st){ st.done = e.target.checked; renderSubtasksDraft(); }
  });
  subtasksList.addEventListener('click', e => {
    if (!e.target.classList.contains('subtask-del')) return;
    const row = e.target.closest('.subtask-row');
    subtasks = subtasks.filter(s => s.id !== row.dataset.id);
    renderSubtasksDraft();
  });
  function addSubtaskFromInput(){
    const input = $('#matSubtaskInput');
    const title = input.value.trim();
    if (!title) return;
    subtasks.push({ id: uid('st'), title, done: false });
    input.value = '';
    renderSubtasksDraft();
    input.focus();
  }
  $('#matSubtaskAddBtn').addEventListener('click', addSubtaskFromInput);
  $('#matSubtaskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); addSubtaskFromInput(); }
  });

  const deadlineClearBtn = $('#matDeadlineClearBtn');
  if (deadlineClearBtn){
    deadlineClearBtn.addEventListener('click', () => {
      $('#matDeadline').value = '';
      deadlineClearBtn.remove();
    });
  }

  $('#matForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#matTitle').value.trim();
    if (!title) return;
    const type = $('#matType').value;
    const category = TYPES[type].category;
    const totalUnitsRaw = $('#matTotalUnits').value.trim();
    const episodesRaw = $('#matEpisodes').value.trim();
    const manualUnitsRaw = $('#matManualUnits').value.trim();
    const payload = {
      title,
      creator: $('#matCreator').value.trim(),
      default_input_type: type,
      default_category: category,
      status: $('#matStatus').value,
      cover_url: coverUrl,
      deadline: $('#matDeadline').value || null,
      subtasks,
      total_units: totalUnitsRaw ? Math.max(0, Number(totalUnitsRaw) || 0) : null,
      unit: $('#matUnit').value.trim() || defaultUnitFor(category),
      episodes_total: episodesRaw ? Math.max(0, Number(episodesRaw) || 0) : null,
      manual_units: manualUnitsRaw ? Math.max(0, Number(manualUnitsRaw) || 0) : null,
      emoji: matEmoji,
      color: matColor
    };
    if (editing){
      const target = state.materials.find(x => x.id === material.id);
      if (target) Object.assign(target, payload);
    } else {
      state.materials.push({ id: uid('m'), challenge_id: ch.id, ...payload });
    }
    saveState(); closeModal(); render();
  });

/* =========================================================
   CSV import
   ========================================================= */
function parseCSVRows(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const s = String(text || '').replace(/^\uFEFF/, '');
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (inQuotes){
      if (c === '"'){ if (s[i + 1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function normalizeMaterialType(raw, categoryRaw){
  const s = String(raw || '').trim().toLowerCase();
  const cat = String(categoryRaw || '').trim().toLowerCase();
  if (s){
    if (TYPES[s]) return s;
    for (const k of TYPE_ORDER){ if (TYPES[k].label.toLowerCase() === s) return k; }
    if (/audio|audio-?book/.test(s)) return 'audiobook';
    if (/pod/.test(s)) return 'podcast';
    if (/kindle|e-?book|ebook|ereader/.test(s)) return 'kindle';
    if (/paper|physical|hardcover|paperback|\bbook\b/.test(s)) return 'book';
    if (/article|blog|essay|news/.test(s)) return 'article';
    if (/\btv\b|show|series|netflix/.test(s)) return 'tv';
    if (/film|movie|cinema/.test(s)) return 'film';
  }
  if (cat === 'listening') return 'audiobook';
  if (cat === 'reading') return 'kindle';
  return 'other';
}
function normalizeMaterialStatus(raw){
  const s = String(raw || '').trim().toLowerCase();
  if (s === 'completed' || s === 'complete' || s === 'done' || s === 'finished') return 'completed';
  if (s === 'archived' || s === 'archive' || s === 'inactive') return 'archived';
  if (s === 'scheduled' || s === 'schedule' || s === 'upcoming' || s === 'planned') return 'scheduled';
  return 'active';
}
function parseMaterialsCSV(text){
  const rows = parseCSVRows(text);
  const errors = [], out = [];
  if (!rows.length) return { rows: out, errors: ['The file appears to be empty.'] };
  const first = rows[0].map(c => String(c || '').trim().toLowerCase());
  const hasHeader = first.includes('title') || first.includes('name');
  let idx, startIdx;
  if (hasHeader){
    idx = {
      title: first.findIndex(h => h === 'title' || h === 'name'),
      creator: first.findIndex(h => h === 'creator' || h === 'author' || h === 'host'),
      type: first.findIndex(h => h === 'type' || h === 'input_type' || h === 'default_input_type' || h === 'format'),
      category: first.findIndex(h => h === 'category'),
      status: first.findIndex(h => h === 'status')
    };
    startIdx = 1;
  } else {
    idx = { title: 0, creator: 1, type: 2, category: -1, status: 3 };
    startIdx = 0;
  }
  if (idx.title < 0) errors.push('No "title" column found — the first column will be used as the title.');
  for (let i = startIdx; i < rows.length; i++){
    const r = rows[i];
    if (!r || !r.length) continue;
    if (r.every(c => !String(c || '').trim())) continue;
    const get = k => (idx[k] >= 0 && r[idx[k]] !== undefined) ? String(r[idx[k]]).trim() : '';
    const title = get('title');
    if (!title){ errors.push(`Row ${i + 1}: missing title — skipped.`); continue; }
    const typeKey = normalizeMaterialType(get('type'), get('category'));
    out.push({
      title,
      creator: get('creator'),
      default_input_type: typeKey,
      default_category: TYPES[typeKey].category,
      status: normalizeMaterialStatus(get('status'))
    });
  }
  return { rows: out, errors };
}
function materialsCSVTemplate(){
  const lines = ['title,creator,type,status'];
  lines.push('Project Hail Mary,Andy Weir,book,active');
  lines.push('Atomic Habits,James Clear,kindle,active');
  lines.push('The Daily,The New York Times,podcast,scheduled');
  lines.push('Dune,Frank Herbert,audiobook,completed');
  lines.push('How to Learn a Language,Benny Lewis,article,archived');
  return lines.join('\n');
}
function openMaterialsImportModal(){
  let pending = [], pendingErrors = [];
  openModal(`
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>Import materials from CSV</h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <p class="hint" style="margin:0 0 6px">Upload a CSV with a header row. These columns are recognised:</p>
        <div class="csv-cols"><code>title</code><code>creator</code><code>type</code><code>status</code></div>
        <p class="hint" style="margin:0 0 14px">
          <b>title</b> is required. <b>type</b> accepts keys like <code>kindle</code>, <code>book</code>,
          <code>podcast</code>, <code>audiobook</code>, <code>tv</code>, <code>film</code>.<br>
          <b>status</b> can be <code>active</code>, <code>scheduled</code>, <code>completed</code> or <code>archived</code>.
        </p>
        <div class="csv-drop" id="csvDrop">
          <span class="big">📄</span>
          <div>Drag &amp; drop your CSV here, or
            <button type="button" class="link-btn" id="csvBrowse" style="color:var(--reading);font-weight:700">browse files</button>
          </div>
        </div>
        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" style="display:none">
        <div id="csvPreview"></div>
        <div id="csvNote"></div>
        <div class="modal-actions" style="margin-top:20px">
          <button type="button" class="btn btn-ghost" data-action="download-csv-template">⬇ Template</button>
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="csvImportBtn" disabled>Import</button>
        </div>
      </div>
    </div>
  `);
  const drop = $('#csvDrop');
  const fileInput = $('#csvFile');
  const preview = $('#csvPreview');
  const note = $('#csvNote');
  const importBtn = $('#csvImportBtn');

  function renderPreview(){
    if (!pending.length && !pendingErrors.length){
      preview.innerHTML = ''; note.innerHTML = ''; importBtn.disabled = true; return;
    }
    if (pending.length){
      const rowsHtml = pending.slice(0, 50).map(r => `
        <tr>
          <td>${escapeHtml(r.title)}</td>
          <td>${escapeHtml(r.creator || '—')}</td>
          <td>${escapeHtml((TYPES[r.default_input_type] || { label: 'Other' }).label)}</td>
          <td>${escapeHtml(r.status)}</td>
        </tr>`).join('');
      preview.innerHTML = `
        <div class="csv-preview">
          <table><thead><tr><th>Title</th><th>Creator</th><th>Type</th><th>Status</th></tr></thead>
          <tbody>${rowsHtml}</tbody></table>
        </div>
        ${pending.length > 50 ? `<div style="font-size:12px;color:var(--muted);margin-top:8px">Showing first 50 of ${pending.length} rows.</div>` : ''}
      `;
    } else { preview.innerHTML = ''; }
    const notes = [];
    if (pending.length){
      const existing = new Set(state.materials.map(m => (m.title || '').trim().toLowerCase()));
      const dupes = pending.filter(r => existing.has(r.title.toLowerCase())).length;
      notes.push(`<div class="csv-note ok"><b>${pending.length}</b> material${pending.length === 1 ? '' : 's'} ready to import.${dupes ? ` <span style="color:var(--warn-fg)">${dupes} duplicate title${dupes === 1 ? '' : 's'} will be skipped.</span>` : ''}</div>`);
    }
    if (pendingErrors.length){
      notes.push(`<div class="csv-note warn">${pendingErrors.length} row${pendingErrors.length === 1 ? '' : 's'} skipped: ${escapeHtml(pendingErrors.slice(0, 3).join(' '))}${pendingErrors.length > 3 ? ' …' : ''}</div>`);
    }
    note.innerHTML = notes.join('');
    importBtn.disabled = pending.length === 0;
  }
  function handleFile(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const parsed = parseMaterialsCSV(String(e.target.result || ''));
      pending = parsed.rows; pendingErrors = parsed.errors; renderPreview();
    };
    reader.onerror = () => { pending = []; pendingErrors = ['Could not read that file.']; renderPreview(); };
    reader.readAsText(file);
  }
  $('#csvBrowse').addEventListener('click', () => fileInput.click());
  drop.addEventListener('click', e => { if (e.target.closest('#csvBrowse')) return; fileInput.click(); });
  fileInput.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    handleFile(f); e.target.value = '';
  });
  ['dragenter','dragover'].forEach(ev => {
    drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(ev => {
    drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(f);
  });
  importBtn.addEventListener('click', () => {
    if (!pending.length) return;
    const existing = new Set(state.materials.map(m => (m.title || '').trim().toLowerCase()));
    let added = 0, skipped = 0;
    pending.forEach(r => {
      const key = r.title.trim().toLowerCase();
      if (existing.has(key)){ skipped++; return; }
      existing.add(key);
      state.materials.push({
        id: uid('m'), challenge_id: state.challenge.id,
        title: r.title, creator: r.creator,
        default_input_type: r.default_input_type,
        default_category: r.default_category,
        status: r.status, cover_url: ''
      });
      added++;
    });
    saveState(); closeModal(); render();
    if (added && skipped){
      alert(`Imported ${added} material${added === 1 ? '' : 's'}. ${skipped} duplicate${skipped === 1 ? '' : 's'} skipped.`);
    } else if (added){
      alert(`Imported ${added} material${added === 1 ? '' : 's'}.`);
    } else {
      alert('Nothing to import — every title already exists.');
    }
  });
}

    openThemeModal();
    render();
    return;
  }

  /* Materials filters */
