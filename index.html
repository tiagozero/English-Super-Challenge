<!DOCTYPE html>
<html lang="en" data-theme="sand">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>English Super Challenge</title>
<style>
  /* =========================================================
     Themes
     ========================================================= */
  :root, html[data-theme="sand"]{
    --bg:#FAF7F3; --surface:#FFFFFF; --surface-2:#F4EFE9; --line:#EAE2D8;
    --text:#26211C; --muted:#8A7F73; --reading:#C2703D; --reading-2:#D89A6C;
    --listening:#3F7A6E; --listening-2:#66A093; --xp:#A9855C;
    --good-bg:#E2F0E9;  --good-fg:#2F6B54;
    --ok-bg:#EBF1E7;    --ok-fg:#4B6B36;
    --warn-bg:#FBF0DC;  --warn-fg:#8A6420;
    --bad-bg:#FBE6E1;   --bad-fg:#9C4230;
    --info-bg:#EAEFF5;  --info-fg:#3E5B78;
    --neutral-bg:#F0ECE6; --neutral-fg:#8A7F73;
    --tag-bg:#F1E7DC;   --tag-fg:#8A5A2B;
    --hover-line:#D6C7B4; --focus-line:#CDBBA6; --dash-line:#C9B9A6;
    --bar-bg:#E5DCD0; --prompt-border:#E4D6C5;
    --hdr-bg:rgba(250,247,243,.88); --backdrop:rgba(38,33,28,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(38,33,28,.04), 0 10px 26px -16px rgba(38,33,28,.28);
    --radius:16px; color-scheme:light;
  }
  html[data-theme="mint"]{
    --bg:#F3F8F4; --surface:#FFFFFF; --surface-2:#E9F1EB; --line:#DAE7DE;
    --text:#1A2620; --muted:#6E8378; --reading:#2F7A57; --reading-2:#68A98A;
    --listening:#2F6E8A; --listening-2:#6EA0B8; --xp:#7A8C4A;
    --good-bg:#DDF0E4;  --good-fg:#25674A;
    --ok-bg:#E5EFE3;    --ok-fg:#4A6B34;
    --warn-bg:#F7EFD9;  --warn-fg:#836018;
    --bad-bg:#F9E3DD;   --bad-fg:#943D2B;
    --info-bg:#E2EEF3;  --info-fg:#356278;
    --neutral-bg:#EBEFEA; --neutral-fg:#6E8378;
    --tag-bg:#E2EFE6;   --tag-fg:#2F6B50;
    --hover-line:#C4D6CB; --focus-line:#B6CCBF; --dash-line:#B6CCBF;
    --bar-bg:#DCE8E0; --prompt-border:#D5E5DB;
    --hdr-bg:rgba(243,248,244,.88); --backdrop:rgba(20,35,27,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(26,38,32,.04), 0 10px 26px -16px rgba(26,38,32,.25);
    color-scheme:light;
  }
  html[data-theme="lavender"]{
    --bg:#F8F6FC; --surface:#FFFFFF; --surface-2:#F0EBF7; --line:#E3DCF0;
    --text:#211C2B; --muted:#7C7489; --reading:#7A5EA8; --reading-2:#A98FD0;
    --listening:#3E7C8A; --listening-2:#74A7B3; --xp:#A9855C;
    --good-bg:#E4F0E8;  --good-fg:#2E6B52;
    --ok-bg:#EBF1E7;    --ok-fg:#4B6B36;
    --warn-bg:#FBF0DC;  --warn-fg:#8A6420;
    --bad-bg:#FBE6E1;   --bad-fg:#9C4230;
    --info-bg:#E7E9F6;  --info-fg:#47528F;
    --neutral-bg:#EDE9F1; --neutral-fg:#7C7489;
    --tag-bg:#EDE4F6;   --tag-fg:#6A4E9A;
    --hover-line:#CFC4E0; --focus-line:#C0B2D6; --dash-line:#C0B2D6;
    --bar-bg:#E3DAF0; --prompt-border:#E0D6EE;
    --hdr-bg:rgba(248,246,252,.88); --backdrop:rgba(28,22,40,.34);
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(33,28,43,.04), 0 10px 26px -16px rgba(33,28,43,.28);
    color-scheme:light;
  }
  html[data-theme="midnight"]{
    --bg:#11141A; --surface:#181D25; --surface-2:#212832; --line:#2C3542;
    --text:#E7ECF3; --muted:#8A95A6; --reading:#E29A62; --reading-2:#B9743F;
    --listening:#63B3A2; --listening-2:#3F7A6E; --xp:#CBA97C;
    --good-bg:#17352A;  --good-fg:#7FD3AD;
    --ok-bg:#26331C;    --ok-fg:#B3D48C;
    --warn-bg:#382C15;  --warn-fg:#E8C377;
    --bad-bg:#3A1E19;   --bad-fg:#EFA08A;
    --info-bg:#1B2A3A;  --info-fg:#96BEE6;
    --neutral-bg:#262C35; --neutral-fg:#9AA4B2;
    --tag-bg:#38291B;   --tag-fg:#E5BA85;
    --hover-line:#3B4653; --focus-line:#4A5765; --dash-line:#4A5765;
    --bar-bg:#2C3542; --prompt-border:#33404E;
    --hdr-bg:rgba(17,20,26,.88); --backdrop:rgba(0,0,0,.58);
    --on-accent:#14181E;
    --shadow:0 1px 2px rgba(0,0,0,.32), 0 10px 26px -16px rgba(0,0,0,.72);
    color-scheme:dark;
  }
  html[data-theme="espresso"]{
    --bg:#16120F; --surface:#1F1A15; --surface-2:#2A231C; --line:#392F26;
    --text:#F0E8DF; --muted:#9E9184; --reading:#E39A62; --reading-2:#B9743F;
    --listening:#6FB6A6; --listening-2:#3F7A6E; --xp:#CFAC7C;
    --good-bg:#1B352A;  --good-fg:#84D2AE;
    --ok-bg:#2A331D;    --ok-fg:#B7D590;
    --warn-bg:#3A2D16;  --warn-fg:#EAC57B;
    --bad-bg:#3C1F19;   --bad-fg:#F0A48D;
    --info-bg:#2A2A38;  --info-fg:#A0B4D8;
    --neutral-bg:#2C2520; --neutral-fg:#A69A8C;
    --tag-bg:#3A2A1A;   --tag-fg:#E5BA85;
    --hover-line:#463A2F; --focus-line:#54463A; --dash-line:#54463A;
    --bar-bg:#392F26; --prompt-border:#3E332A;
    --hdr-bg:rgba(22,18,15,.88); --backdrop:rgba(0,0,0,.6);
    --on-accent:#1A1512;
    --shadow:0 1px 2px rgba(0,0,0,.38), 0 10px 26px -16px rgba(0,0,0,.78);
    color-scheme:dark;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background .2s ease, color .2s ease;
  }
  button{font-family:inherit}

  /* Header */
  .hdr{
    position:sticky;top:0;z-index:50;
    background:var(--hdr-bg);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .hdr-top{
    max-width:1080px;margin:0 auto;
    padding:14px 20px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{
    width:36px;height:36px;flex:0 0 auto;border-radius:11px;
    background:linear-gradient(140deg,var(--reading-2),var(--reading));
    color:var(--on-accent);font-size:11px;font-weight:800;letter-spacing:.06em;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px -6px color-mix(in srgb, var(--reading) 70%, transparent);
  }
  .brand-txt{min-width:0}
  .brand-txt h1{font-size:15.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-txt p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .profile-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:3px 12px 3px 3px;
    cursor:pointer;transition:background .15s, border-color .15s;
    font-family:inherit;color:var(--text);min-width:0;
  }
  .profile-btn:hover{background:var(--surface-2);border-color:var(--hover-line)}
  .profile-avatar-sm{
    width:28px;height:28px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;font-weight:700;line-height:1;
  }
  .profile-name-sm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  @media(max-width:640px){
    .profile-btn{padding:3px}
    .profile-btn .profile-name-sm{display:none}
  }
  .tabs{
    max-width:1080px;margin:0 auto;
    padding:0 20px 10px;
    display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs button, .tabs a{
    flex:0 0 auto;border:0;background:transparent;
    padding:7px 14px;border-radius:999px;
    font-size:13.5px;font-weight:550;color:var(--muted);
    cursor:pointer;transition:background .15s,color .15s;
    text-decoration:none;display:inline-block;line-height:1.45;
    font-family:inherit;
  }
  .tabs button:hover, .tabs a:hover{color:var(--text)}
  .tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .tabs a .ext{font-size:11px;opacity:.7;margin-left:1px}

  /* Buttons */
  .btn{
    border:1px solid transparent;border-radius:11px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
    transition:transform .08s ease, filter .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.975)}
  .btn-primary{background:var(--reading);color:var(--on-accent);box-shadow:0 6px 16px -8px color-mix(in srgb, var(--reading) 75%, transparent)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn-block{width:100%;margin-top:14px;padding:13px}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--text)}
  .link-btn{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:8px}
  .link-btn:hover{color:var(--text);background:var(--surface-2)}
  .link-btn.danger:hover{color:var(--bad-fg);background:var(--bad-bg)}

  .info-btn{
    width:26px;height:26px;border-radius:50%;flex:0 0 auto;
    border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-size:12px;font-weight:800;font-style:normal;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;line-height:1;
    transition:background .15s,color .15s,border-color .15s;
    font-family:Georgia,"Times New Roman",serif;
  }
  .info-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--hover-line)}

  .info-body{font-size:13.5px;line-height:1.65;color:var(--text)}
  .info-body p{margin:0 0 11px}
  .info-body p:last-child{margin-bottom:0}
  .info-body b{font-weight:650}
  .info-body code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* Layout */
  main{max-width:1080px;margin:0 auto;padding:20px 20px 120px}
  .grid{display:grid;gap:14px;margin-bottom:14px}
  .cols-2,.cols-3{grid-template-columns:1fr}
  @media(min-width:780px){
    .cols-2{grid-template-columns:1fr 1fr}
    .cols-3{grid-template-columns:repeat(3,1fr)}
  }
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .card-head h2{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .lb-clock{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:linear-gradient(90deg,color-mix(in srgb, var(--reading) 10%, transparent),color-mix(in srgb, var(--reading) 2%, transparent));
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  }
  .lb-clock .k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .lb-clock-cell .v{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .lb-clock-main strong{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--reading)}
  .lb-clock-side{text-align:right}
  @media(max-width:520px){
    .lb-clock{gap:12px}
    .lb-clock-main strong{font-size:26px}
    .lb-clock-side{text-align:left}
  }

  /* Profile page */
  .profile-hero{display:flex;gap:18px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:14px;flex-wrap:wrap}
  .profile-avatar-lg{width:84px;height:84px;border-radius:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:700;line-height:1;box-shadow:0 10px 22px -12px rgba(0,0,0,.5)}
  .profile-hero-main{flex:1;min-width:0}
  .profile-hero-main h2{font-size:22px;font-weight:680;letter-spacing:-.02em;line-height:1.2}
  .profile-handle{font-size:13.5px;color:var(--muted);margin-top:2px;font-weight:550}
  .profile-bio{font-size:13.5px;color:var(--text);margin-top:9px;line-height:1.55;max-width:560px}
  .profile-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:12.5px;color:var(--muted)}
  .profile-meta span{display:inline-flex;align-items:center;gap:5px}
  .profile-hero-actions{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
  .profile-empty{text-align:center;padding:36px 20px}
  .profile-empty .em-icon{font-size:34px;margin-bottom:14px;opacity:.6}

  .completeness{margin-top:14px;padding:12px 14px;background:var(--surface-2);border-radius:12px}
  .completeness-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:8px}
  .completeness-top b{font-weight:680;font-size:13.5px}
  .completeness-bar{height:7px;background:var(--bar-bg);border-radius:999px;overflow:hidden}
  .completeness-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--reading-2),var(--reading));transition:width .4s ease}

  .det{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .det:last-child{border-bottom:0;padding-bottom:0}
  .det:first-child{padding-top:0}
  .det-icon{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:14px}
  .det-main{flex:1;min-width:0}
  .det-k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .det-v{font-size:13.5px;font-weight:550;margin-top:1px;word-break:break-word}
  .det-v.muted{color:var(--muted);font-weight:500;font-style:italic}

  .tag-list{display:flex;flex-wrap:wrap;gap:7px}
  .tag{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--tag-bg);color:var(--tag-fg);display:inline-flex;align-items:center;gap:6px}
  .tag.empty{background:transparent;color:var(--muted);font-weight:500;font-style:italic;padding:0}
  .tag-remove{border:none;background:transparent;color:inherit;cursor:pointer;font-size:10px;line-height:1;padding:0;opacity:.6;display:flex;align-items:center}
  .tag-remove:hover{opacity:1}

  .social-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .social-row:last-child{border-bottom:0;padding-bottom:0}
  .social-row:first-child{padding-top:0}
  .social-row .s-ic{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:14px}
  .social-row .s-main{flex:1;min-width:0}
  .social-row .s-k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .social-row .s-v{font-size:13.5px;font-weight:550;color:var(--reading);text-decoration:none;word-break:break-all}
  .social-row .s-v:hover{text-decoration:underline}

  /* Avatar picker */
  .avatar-preview-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .avatar-preview{width:72px;height:72px;border-radius:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700;line-height:1}
  .avatar-preview-label{font-size:12.5px;color:var(--muted);max-width:240px}
  .picker-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .emoji-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:14px}
  .emoji-grid button{
    aspect-ratio:1;border:1px solid var(--line);background:var(--surface);
    border-radius:10px;font-size:18px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s ease, border-color .15s;padding:0;
  }
  .emoji-grid button:hover{border-color:var(--hover-line);transform:scale(1.06)}
  .emoji-grid button.active{border-color:var(--reading);box-shadow:0 0 0 2px color-mix(in srgb, var(--reading) 25%, transparent)}
  @media(max-width:520px){.emoji-grid{grid-template-columns:repeat(8,1fr)}}
  .swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .swatch{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer;transition:transform .08s ease;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .swatch:hover{transform:scale(1.08)}
  .swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}

  input[type=range]{
    width:100%;height:6px;-webkit-appearance:none;appearance:none;
    background:var(--surface-2);border-radius:999px;outline:none;padding:0;border:0;margin:6px 0 2px;box-shadow:none;
  }
  input[type=range]:focus{box-shadow:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--reading);cursor:pointer;border:2px solid var(--surface);box-shadow:0 2px 6px color-mix(in srgb, var(--reading) 45%, transparent)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--reading);cursor:pointer;box-shadow:0 2px 6px color-mix(in srgb, var(--reading) 45%, transparent)}

  .form-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .form-section:first-of-type{margin-top:6px;padding-top:0;border-top:0}
  .form-section-title{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .form-section-title .dotnum{width:18px;height:18px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);letter-spacing:0}

  /* Progress cards */
  .progress-card .pct{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .big-numbers{display:flex;align-items:baseline;gap:7px;margin-bottom:14px;flex-wrap:wrap}
  .big-numbers strong{font-size:31px;font-weight:680;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .big-numbers span{font-size:13.5px;color:var(--muted)}
  .bar{position:relative;height:10px;background:var(--surface-2);border-radius:999px}
  .bar-fill{height:100%;border-radius:999px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .reading .bar-fill{background:linear-gradient(90deg,var(--reading-2),var(--reading))}
  .listening .bar-fill{background:linear-gradient(90deg,var(--listening-2),var(--listening))}
  .bar-ideal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.22;border-radius:2px}
  .bar-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .pace-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pace-tag.good{background:var(--good-bg);color:var(--good-fg)}
  .pace-tag.ok{background:var(--ok-bg);color:var(--ok-fg)}
  .pace-tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
  .pace-tag.bad{background:var(--bad-bg);color:var(--bad-fg)}

  .stat-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .stat-value{font-size:27px;font-weight:680;letter-spacing:-.025em;margin-top:7px;font-variant-numeric:tabular-nums}
  .stat-value small{font-size:13px;font-weight:550;color:var(--muted);letter-spacing:0}
  .stat-sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  .pace-row{padding:11px 0;border-bottom:1px solid var(--line)}
  .pace-row:last-child{border-bottom:0;padding-bottom:0}
  .pace-row:first-child{padding-top:0}
  .pace-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .pace-row-top .lbl{font-size:13.5px;font-weight:600}
  .pace-row-top .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pace-row-top .val b{color:var(--text);font-weight:650}
  .mini-bar{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .mini-bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
  .reading .mini-bar i{background:var(--reading)}
  .listening .mini-bar i{background:var(--listening)}

  .act{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .act:last-of-type{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dot.reading{background:var(--reading)}
  .dot.listening{background:var(--listening)}
  .act-main{flex:1;min-width:0}
  .act-title{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-meta{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-amount{font-size:14px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
  .act-amount small{font-size:11.5px;font-weight:550;color:var(--muted)}
  .act-actions{display:flex;gap:2px;flex:0 0 auto}

  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  @media(min-width:780px){.filters{grid-template-columns:repeat(3,1fr)}}
  .filters .full{grid-column:1/-1}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field > label{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.01em}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],textarea,select{
    width:100%;border:1px solid var(--line);background:var(--surface);
    border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit;
    color:var(--text);outline:none;transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none;appearance:none;
  }
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238A7F73' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
  input:focus,textarea:focus,select:focus{border-color:var(--focus-line);box-shadow:0 0 0 3px color-mix(in srgb, var(--reading) 12%, transparent)}
  textarea{resize:vertical;min-height:56px}
  .day-group{margin-bottom:18px}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .day-head .d{font-size:13.5px;font-weight:650}
  .day-head .tot{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* Materials */
  .mat{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
  .mat:last-child{border-bottom:0}
  .mat-icon{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;letter-spacing:.03em;color:var(--on-accent)}
  .mat-icon.reading{background:linear-gradient(140deg,var(--reading-2),var(--reading))}
  .mat-icon.listening{background:linear-gradient(140deg,var(--listening-2),var(--listening))}
  .mat-icon.has-cover{background-size:cover;background-position:center;color:transparent}
  .mat-cover-thumb{width:84px;height:112px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:6px;flex:0 0 auto}
  .mat-main{flex:1;min-width:0}
  .mat-title{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .mat-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
  .pill.active{background:var(--good-bg);color:var(--good-fg)}
  .pill.scheduled{background:var(--warn-bg);color:var(--warn-fg)}
  .pill.completed{background:var(--info-bg);color:var(--info-fg)}
  .pill.archived{background:var(--neutral-bg);color:var(--neutral-fg)}
  .mat-tot{font-size:12.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}

  .mat-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .mat-search{flex:1;min-width:170px}
  .mat-search input{padding:9px 13px;font-size:14px}
  .mat-toolbar .seg button{padding:8px 12px;font-size:12.5px}
  .mat-chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .mat-chip-row .chip{padding:6px 11px;font-size:12.5px}
  .mat-filters-wrap{overflow:hidden;transition:max-height .28s ease, opacity .2s ease, margin .2s ease;max-height:400px;opacity:1}
  .mat-filters-wrap.collapsed{max-height:0;opacity:0}
  .qa-wrap{overflow:hidden;transition:max-height .28s ease, opacity .2s ease, margin .2s ease;max-height:3000px;opacity:1}
  .qa-wrap.collapsed{max-height:0;opacity:0}

  .mat-group-head{display:flex;align-items:center;gap:9px;margin:20px 2px 12px}
  .mat-group-head:first-of-type{margin-top:6px}
  .mat-group-head .gdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .mat-group-head .gdot.reading{background:var(--reading)}
  .mat-group-head .gdot.listening{background:var(--listening)}
  .mat-group-head .gdot.status-active{background:var(--good-fg)}
  .mat-group-head .gdot.status-scheduled{background:var(--warn-fg)}
  .mat-group-head .gdot.status-completed{background:var(--info-fg)}
  .mat-group-head .gdot.status-archived{background:var(--neutral-fg)}
  .mat-group-head .gt{font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .mat-group-head .gn{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:2px 9px;border-radius:999px}
  .mat-group-head .gline{flex:1;height:1px;background:var(--line);border-radius:1px}

  .filter-toggle{display:inline-flex;align-items:center;gap:6px}
  .filter-toggle .fcount{font-size:10.5px;font-weight:800;background:var(--reading);color:var(--on-accent);border-radius:999px;padding:1px 7px;line-height:1.5}

  /* Intensive preset list */
  .preset-group-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
  .preset-group-head .gt{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .preset-group-head .gline{flex:1;height:1px;background:var(--line)}
  .preset-list{display:flex;flex-direction:column}
  .preset-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--dash-line)}
  .preset-list .preset-row:last-child{border-bottom:0}
  .preset-row-main{display:flex;flex-direction:column;gap:1px;min-width:0}
  .preset-title{font-size:13.5px;font-weight:600}
  .preset-meta{font-size:11.5px;color:var(--muted)}

  .mat-deadline-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--warn-fg);margin-top:2px;font-variant-numeric:tabular-nums}
  .mat-deadline-line b.overdue{color:var(--bad-fg)}

  /* Overdue materials banner */
  .overdue-banner{
    background:linear-gradient(135deg,color-mix(in srgb, var(--bad-fg) 8%, transparent),color-mix(in srgb, var(--bad-fg) 3%, transparent));
    border-color:color-mix(in srgb, var(--bad-fg) 30%, var(--line));
  }
  .overdue-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .overdue-row:last-of-type{border-bottom:0;padding-bottom:0}
  .overdue-title{font-size:13.5px;font-weight:620;display:block}
  .overdue-meta{font-size:12px;color:var(--bad-fg);display:block;margin-top:1px}

  /* Subtasks */
  .subtask-list{display:flex;flex-direction:column;gap:7px;max-height:240px;overflow-y:auto;padding-right:2px}
  .subtask-row{display:flex;align-items:center;gap:9px;padding:2px 0}
  .subtask-row input[type="checkbox"]{width:16px;height:16px;flex:0 0 auto;accent-color:var(--reading);cursor:pointer}
  .subtask-title{flex:1;font-size:13px;word-break:break-word}
  .subtask-title.done{color:var(--muted);text-decoration:line-through}
  .subtask-row .link-btn{padding:2px 6px;font-size:12px}
  .mat-subtask-toggle{
    background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-top:2px;
  }
  .mat-subtask-toggle:hover{color:var(--text)}
  .mat-subtask-bar{flex:0 0 auto;width:64px;height:5px;border-radius:99px;background:var(--bar-bg);overflow:hidden}
  .mat-subtask-bar i{display:block;height:100%;background:var(--reading);border-radius:99px}
  .mat-subtask-inline{margin-top:6px;padding-top:6px;border-top:1px dashed var(--dash-line);display:flex;flex-direction:column;gap:5px}
  .mat-subtask-inline .subtask-row{font-size:12.5px}
  .mat-subtask-inline .subtask-title{font-size:12.5px}
  .mat-progress{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .mat-progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
  .mat-progress-pct{font-weight:750;color:var(--reading)}
  .mat-progress-pct.complete{color:var(--good-fg)}
  .mat-progress-sub{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mat-progress-bar{position:relative;height:8px;background:var(--bar-bg);border-radius:999px;overflow:hidden}
  .mat-progress-bar > i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .mat-progress-bar.reading > i{background:linear-gradient(90deg,var(--reading-2),var(--reading))}
  .mat-progress-bar.listening > i{background:linear-gradient(90deg,var(--listening-2),var(--listening))}
  .mat-progress-bar.complete > i{background:var(--good-fg)}
  .mat .mat-progress{border-top:none;margin-top:6px;padding-top:0}

  /* Materials library — toolbar, stats strip, grid & cards */
  .mat-toolbar-top{justify-content:space-between}
  .mat-lib-title{font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
  .mat-toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lib-stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding:12px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--muted)}
  .lib-stat b{color:var(--text);font-weight:750;font-variant-numeric:tabular-nums}
  .mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .mat-card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px}
  .mat-card-top{display:flex;gap:11px;align-items:flex-start}
  .mat-card-icon{width:38px;height:38px;flex:0 0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:750;color:var(--on-accent)}
  .mat-card-icon.has-cover{background-size:cover;background-position:center}
  .mat-card-titles{min-width:0;flex:1}
  .mat-card-title{font-size:14.5px;font-weight:650;letter-spacing:-.005em;line-height:1.25;word-break:break-word}
  .mat-card-sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mat-card-stats{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .mat-card-figure{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .mat-card-episodes{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .mat-card-status-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mat-card-pct{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .status-pill{font-size:10px;font-weight:750;padding:3px 9px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
  .status-pill.good{background:var(--good-bg);color:var(--good-fg)}
  .status-pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
  .status-pill.info{background:var(--info-bg);color:var(--info-fg)}
  .status-pill.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
  .mat-card-queued{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--dash-line)}
  .mat-card-queued .qlabel{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .mat-card-queued .tag{font-size:11px;font-weight:650;padding:2px 9px;border-radius:999px;background:var(--tag-bg);color:var(--tag-fg)}
  .mat-card-actions{display:flex;justify-content:flex-end;gap:14px;margin-top:2px}

  /* Charts */
  .seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .chart{display:flex;gap:3px;height:170px;position:relative}
  .chart .col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .chart .bar-wrap{flex:1;display:flex;align-items:flex-end}
  .chart .fill{width:100%;border-radius:4px;min-height:3px;transition:height .4s ease}
  .chart .fill.reading{background:var(--reading)}
  .chart .fill.listening{background:var(--listening)}
  .chart .fill.muted{background:var(--surface-2)}
  .chart .lbl{font-size:9.5px;color:var(--muted);text-align:center;flex:0 0 auto;height:12px;line-height:12px;white-space:nowrap;overflow:hidden}
  .target-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--dash-line);pointer-events:none}
  .chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
  .chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .cum-chart{width:100%;height:190px;display:block;border-radius:10px;overflow:visible}
  .chart-note{font-size:11.5px;color:var(--muted);margin-top:10px}

  /* Challenges */
  .chal{padding:14px 0;border-bottom:1px solid var(--line)}
  .chal:last-child{border-bottom:0;padding-bottom:0}
  .chal:first-child{padding-top:0}
  .chal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .chal-title{font-size:14.5px;font-weight:620;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
  .chal-actions{display:flex;gap:2px;flex:0 0 auto}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
  .badge.daily{background:var(--tag-bg);color:var(--tag-fg)}
  .badge.weekly{background:var(--info-bg);color:var(--info-fg)}
  .badge.done{background:var(--good-bg);color:var(--good-fg)}
  .badge.bad{background:var(--bad-bg);color:var(--bad-fg)}
  .chal-bar{height:8px;background:var(--surface-2);border-radius:999px;margin:11px 0 8px;overflow:hidden}
  .chal-bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
  .chal-bar.reading i{background:linear-gradient(90deg,var(--reading-2),var(--reading))}
  .chal-bar.listening i{background:linear-gradient(90deg,var(--listening-2),var(--listening))}
  .chal-bar.xp i{background:linear-gradient(90deg,var(--reading-2),var(--xp))}
  .chal-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
  .chal-timer{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chal-timer b{color:var(--text);font-weight:650}

  /* ================= Roadmap ================= */
  .rm-view-toggle{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
  .rm-stat-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px}
  @media(min-width:640px){.rm-stat-strip{grid-template-columns:repeat(4,1fr)}}
  .rm-today{
    border:1px solid color-mix(in srgb, var(--reading) 45%, var(--line));
    background:linear-gradient(135deg,color-mix(in srgb, var(--reading) 10%, var(--surface)),var(--surface));
    border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);
    display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  }
  .rm-today .rt-day{
    width:64px;height:64px;flex:0 0 auto;border-radius:18px;
    background:linear-gradient(140deg,var(--reading-2),var(--reading));color:var(--on-accent);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:750;line-height:1;
  }
  .rm-today .rt-day small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
  .rm-today .rt-day b{font-size:22px}
  .rm-today .rt-main{flex:1;min-width:200px}
  .rm-today .rt-title{font-size:15.5px;font-weight:680;letter-spacing:-.01em}
  .rm-today .rt-sub{font-size:12.5px;color:var(--muted);margin-top:2px}

  .rm-phase{
    border:1px solid var(--line);background:var(--surface);border-radius:16px;
    padding:0;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);
  }
  .rm-phase-head{
    display:flex;align-items:center;gap:14px;padding:16px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,color-mix(in srgb, var(--reading) 6%, transparent),transparent 60%);
    flex-wrap:wrap;
  }
  .rm-phase-num{
    width:38px;height:38px;flex:0 0 auto;border-radius:11px;
    background:linear-gradient(140deg,var(--reading-2),var(--reading));color:var(--on-accent);
    display:flex;align-items:center;justify-content:center;
    font-weight:750;font-size:14px;
  }
  .rm-phase-head.phase-1 .rm-phase-num{background:linear-gradient(140deg,#8FB07B,#5D7A3F)}
  .rm-phase-head.phase-2 .rm-phase-num{background:linear-gradient(140deg,var(--reading-2),var(--reading))}
  .rm-phase-head.phase-3 .rm-phase-num{background:linear-gradient(140deg,#7AA8A0,var(--listening))}
  .rm-phase-head.phase-4 .rm-phase-num{background:linear-gradient(140deg,#A8567A,#7A3E5E)}
  .rm-phase-main{flex:1;min-width:200px}
  .rm-phase-name{font-size:15.5px;font-weight:680;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rm-phase-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .rm-phase-focus{font-size:12.5px;color:var(--muted);margin-top:4px;font-style:italic}
  .rm-phase-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .rm-phase-pct{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--reading)}

  .rm-phase-bar{padding:0 18px 16px}
  .rm-double-bar{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .rm-dbar{position:relative;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .rm-dbar i{display:block;height:100%;border-radius:999px;transition:width .45s ease}
  .rm-dbar.reading i{background:linear-gradient(90deg,var(--reading-2),var(--reading))}
  .rm-dbar.listening i{background:linear-gradient(90deg,var(--listening-2),var(--listening))}
  .rm-dbar .rm-ideal{
    position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.28;border-radius:2px;
  }
  .rm-dbar-row{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .rm-dbar-row .lbl{width:70px;flex:0 0 auto;text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:10.5px}
  .rm-dbar-row .bar{flex:1}
  .rm-dbar-row .v{min-width:92px;text-align:right;flex:0 0 auto}

  /* Phase activity calendar heatmap */
  .rm-heatmap{padding:16px 18px 18px;border-top:1px solid var(--line)}
  .rm-heat-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .rm-heat-toolbar-label{font-size:12px;font-weight:650;color:var(--muted)}
  .heat-colorby{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .hcb-btn{
    display:flex;align-items:center;gap:6px;border:0;background:transparent;
    padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);
    cursor:pointer;transition:background .15s,color .15s;font-family:inherit;white-space:nowrap;
  }
  .hcb-btn:hover{color:var(--text)}
  .hcb-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .hcb-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .hcb-dot.combined{background:color-mix(in srgb, var(--reading) 60%, var(--listening) 40%)}
  .hcb-dot.reading{background:var(--reading)}
  .hcb-dot.listening{background:var(--listening)}

  .cal-month{margin-top:18px}
  .cal-month-label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 2px 10px}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .cal-weekdays span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:2px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-cell{
    position:relative;border-radius:11px;padding:9px;min-height:72px;
    background:var(--bar-bg);display:flex;flex-direction:column;justify-content:space-between;
    box-sizing:border-box;color:var(--text);
  }
  .cal-cell.pad{background:transparent;visibility:hidden}
  .cal-cell.out{background:transparent;color:var(--muted);opacity:.4}
  .cal-cell.clickable{cursor:pointer;transition:filter .12s ease,transform .08s ease}
  .cal-cell.clickable:hover{filter:brightness(.96)}
  .cal-cell.clickable:active{transform:scale(.98)}
  .cal-cell.empty{background:var(--surface-2);color:var(--muted)}
  .cal-cell.future{background:var(--tag-bg);color:var(--muted)}
  .cal-cell.lvl-1{background:color-mix(in srgb, var(--heat-accent) 28%, var(--bar-bg))}
  .cal-cell.lvl-2{background:color-mix(in srgb, var(--heat-accent) 55%, var(--bar-bg))}
  .cal-cell.lvl-3{background:color-mix(in srgb, var(--heat-accent) 80%, var(--bar-bg));color:var(--on-accent)}
  .cal-cell.lvl-4{background:var(--heat-accent);color:var(--on-accent)}
  .cal-cell.today{outline:2px solid var(--text);outline-offset:-2px}
  .cal-num{font-size:13px;font-weight:700}
  .cal-sub{font-size:10.5px;opacity:.85}
  .cal-dot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
  .rm-heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:14px;font-size:10.5px;color:var(--muted)}
  .rm-heat-swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
  .rm-heat-swatch.lvl-1{background:color-mix(in srgb, var(--heat-accent) 28%, var(--bar-bg))}
  .rm-heat-swatch.lvl-2{background:color-mix(in srgb, var(--heat-accent) 55%, var(--bar-bg))}
  .rm-heat-swatch.lvl-3{background:color-mix(in srgb, var(--heat-accent) 80%, var(--bar-bg))}
  .rm-heat-swatch.lvl-4{background:var(--heat-accent)}
  .rm-heat-empty{padding:16px 18px;font-size:12.5px;color:var(--muted)}

  /* Day-detail modal */
  .rm-detail-sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
  .rm-detail-summary{display:flex;gap:14px;align-items:center;background:var(--surface-2);border-radius:14px;padding:14px;margin-bottom:16px}
  .rm-detail-daybox{
    flex:0 0 auto;width:56px;height:56px;border-radius:14px;background:var(--reading);color:var(--on-accent);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  }
  .rm-detail-daybox small{font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.85}
  .rm-detail-daybox b{font-size:19px;font-weight:800}
  .rm-detail-summary-main{flex:1;min-width:0}
  .rm-detail-summary-title{font-size:14.5px;font-weight:700}
  .rm-detail-summary-sub{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
  .badge-pill{display:inline-block;font-size:10px;font-weight:750;letter-spacing:.04em;padding:3px 10px;border-radius:999px}
  .badge-pill.good{background:var(--good-bg);color:var(--good-fg)}
  .badge-pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
  .badge-pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
  .badge-pill.info{background:var(--info-bg);color:var(--info-fg)}
  .badge-pill.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
  .rm-detail-section{margin-bottom:16px}
  .rm-detail-section-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;
  }
  .rm-detail-empty{font-size:12.5px;color:var(--muted);padding:10px 2px 16px}
  .rm-detail-targets{margin-top:4px}
  .rm-detail-targets-head{font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .rm-detail-targets-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rm-detail-target-box{background:var(--surface-2);border-radius:12px;padding:12px}
  .rm-detail-target-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  .rm-detail-target-val{font-size:16px;font-weight:750;margin-bottom:8px}
  .rm-detail-target-val small{font-size:12px;font-weight:600;color:var(--muted)}
  .rm-detail-target-pct{font-size:11px;color:var(--muted);margin-top:6px}

  .rm-queue{padding:0 18px 18px}
  .rm-queue-label{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .rm-queue-label .ql{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .rm-queue-label .qn{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:2px 9px;border-radius:999px}
  .rm-queue-progress{margin-bottom:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px}
  .rm-progress-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-weight:650;margin-bottom:7px}
  .rm-progress-top .v{color:var(--text);font-variant-numeric:tabular-nums}
  .rm-queue-list{display:flex;flex-direction:column;gap:8px}
  .rm-queue-item{display:flex;align-items:stretch;gap:11px;background:color-mix(in srgb, var(--task-color, var(--line)) 9%, var(--surface-2));border:1px solid color-mix(in srgb, var(--task-color, var(--line)) 30%, var(--line));border-radius:12px;padding:11px 12px;transition:border-color .15s,background .15s;min-width:0}
  .rm-queue-item:hover{border-color:color-mix(in srgb, var(--task-color, var(--hover-line)) 55%, var(--hover-line))}
  .rm-queue-item.done{background:color-mix(in srgb, var(--good-bg) 55%, var(--surface-2));border-color:color-mix(in srgb, var(--good-fg) 25%, var(--line))}
  .rm-queue-item.next{border-color:color-mix(in srgb, var(--task-color, var(--reading)) 70%, var(--line));box-shadow:0 0 0 3px color-mix(in srgb, var(--task-color, var(--reading)) 16%, transparent)}
  .rq-pos{width:22px;height:22px;flex:0 0 auto;align-self:flex-start;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:750;display:flex;align-items:center;justify-content:center}
  .rm-queue-item.done .rq-pos{background:var(--good-fg);color:var(--on-accent);border-color:var(--good-fg)}
  .rm-queue-item.next .rq-pos{background:var(--task-color, var(--reading));color:var(--on-accent);border-color:var(--task-color, var(--reading))}
  .rq-icon{width:34px;height:34px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;color:var(--on-accent);align-self:flex-start;background:var(--task-color, var(--muted))}
  .rq-icon.has-cover{background-size:cover;background-position:center;color:transparent}
  .rq-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .rq-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .rq-title{font-size:13.5px;font-weight:650;letter-spacing:-.005em;word-break:break-word}
  .rq-badge{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .rq-sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rq-sub .sep{color:var(--line)}
  .rq-bar{position:relative;height:7px;background:var(--bar-bg);border-radius:999px;overflow:hidden}
  .rq-bar > i{display:block;height:100%;border-radius:999px;transition:width .4s ease;background:var(--task-color, var(--reading))}
  .rq-bar.complete > i{background:var(--good-fg)}
  .rq-actions{display:flex;flex-direction:column;gap:2px;align-self:flex-start;flex:0 0 auto}
  .rq-action{width:22px;height:20px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;transition:background .12s,color .12s,border-color .12s}
  .rq-action:hover:not(:disabled){background:var(--surface);color:var(--text);border-color:var(--line)}
  .rq-action.danger:hover:not(:disabled){color:var(--bad-fg);background:var(--bad-bg);border-color:transparent}
  .rq-action:disabled{opacity:.25;cursor:not-allowed}
  .rm-queue-empty{padding:14px;text-align:center;font-size:12.5px;color:var(--muted);font-style:italic;background:var(--surface-2);border:1px dashed var(--dash-line);border-radius:12px}
  .rm-queue-complete{margin-top:10px;padding:11px 14px;background:linear-gradient(90deg,color-mix(in srgb, var(--good-bg) 80%, transparent),transparent);border:1px solid color-mix(in srgb, var(--good-fg) 30%, var(--line));border-radius:11px;font-size:12.5px;color:var(--good-fg);font-weight:600;display:flex;align-items:center;gap:8px}
  .rm-queue-add{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .rm-queue-add select{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--text);outline:none}
  .rm-queue-add select:focus{border-color:var(--reading);box-shadow:0 0 0 3px color-mix(in srgb, var(--reading) 14%, transparent)}
  .badge.next{background:var(--task-color, var(--reading));color:var(--on-accent)}

  .rm-week{
    border-top:1px solid var(--line);
    padding:0;
  }
  .rm-week:first-child{border-top:0}
  .rm-week-head{
    display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;
    transition:background .12s ease;
  }
  .rm-week-head:hover{background:var(--surface-2)}
  .rm-week-num{
    width:44px;height:32px;flex:0 0 auto;border-radius:9px;
    background:var(--surface-2);color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:700;line-height:1;font-size:10px;letter-spacing:.03em;text-transform:uppercase;
  }
  .rm-week-num b{font-size:13px;color:var(--text);margin-top:1px}
  .rm-week-head.this-week .rm-week-num{background:var(--reading);color:var(--on-accent)}
  .rm-week-head.this-week .rm-week-num b{color:var(--on-accent)}
  .rm-week-main{flex:1;min-width:0}
  .rm-week-title{font-size:13.5px;font-weight:620;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rm-week-sub{font-size:12px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
  .rm-week-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .rm-week-pct{font-size:12.5px;font-weight:750;color:var(--reading);font-variant-numeric:tabular-nums}
  .rm-chevron{font-size:11px;color:var(--muted);transition:transform .15s ease;display:inline-block}
  .rm-chevron.open{transform:rotate(90deg)}

  .rm-week-body{
    padding:4px 18px 16px;
    border-top:1px dashed var(--line);
    background:color-mix(in srgb, var(--surface-2) 40%, var(--surface));
  }
  .rm-week-focus{
    display:flex;align-items:center;gap:10px;padding:10px 0 12px;flex-wrap:wrap;
  }
  .rm-week-focus .fl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .rm-week-focus select{padding:7px 11px;font-size:13px;max-width:280px;flex:1;min-width:160px}
  .rm-week-focus .note-input{flex:1;min-width:160px;padding:7px 11px;font-size:13px}

  .rm-day{
    display:flex;align-items:center;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .rm-day:last-child{border-bottom:0;padding-bottom:0}
  .rm-day-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .rm-day.status-met .rm-day-dot{background:var(--good-fg);border-color:var(--good-fg)}
  .rm-day.status-partial .rm-day-dot{background:var(--warn-fg);border-color:var(--warn-fg)}
  .rm-day.status-missed .rm-day-dot{background:var(--bad-fg);border-color:var(--bad-fg)}
  .rm-day.status-today .rm-day-dot{background:var(--reading);border-color:var(--reading);box-shadow:0 0 0 4px color-mix(in srgb, var(--reading) 25%, transparent)}
  .rm-day.status-future .rm-day-dot{opacity:.35}

  .rm-day-when{font-size:12.5px;font-weight:650;flex:0 0 auto;width:104px;display:flex;flex-direction:column;gap:1px}
  .rm-day-when small{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .rm-day.status-today .rm-day-when{color:var(--reading)}
  .rm-day.status-future .rm-day-when{color:var(--muted);font-weight:550}

  .rm-day-plan{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .rm-day-plan b{color:var(--text);font-weight:650}
  .rm-day-actual{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right;min-width:120px}
  .rm-day-actual .rd{color:var(--reading)}
  .rm-day-actual .ln{color:var(--listening)}
  .rm-day-actual.muted{color:var(--muted);font-weight:500}
  .rm-day-badge{flex:0 0 auto;font-size:10px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
  .rm-day.status-met .rm-day-badge{background:var(--good-bg);color:var(--good-fg)}
  .rm-day.status-partial .rm-day-badge{background:var(--warn-bg);color:var(--warn-fg)}
  .rm-day.status-missed .rm-day-badge{background:var(--bad-bg);color:var(--bad-fg)}
  .rm-day.status-today .rm-day-badge{background:var(--reading);color:var(--on-accent)}
  .rm-day-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rm-day-actions{display:flex;gap:0;flex:0 0 auto;opacity:0;transition:opacity .12s ease}
  .rm-day:hover .rm-day-actions{opacity:1}
  .rm-day-actions .link-btn{font-size:11.5px;padding:2px 6px}

  .rm-day.status-today{background:color-mix(in srgb, var(--reading) 6%, transparent);border-radius:10px;padding:9px 10px;margin:0 -10px}
  .rm-day.status-future{opacity:.65}

  @media(max-width:640px){
    .rm-day{padding:8px 0;gap:8px;flex-wrap:wrap}
    .rm-day-when{width:auto;min-width:88px}
    .rm-day-plan{flex:1 1 100%;order:3}
    .rm-day-actual{min-width:0;flex:1 1 100%;text-align:left;order:4}
    .rm-day-badge{order:2}
  }

  .rm-milestone{
    display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);
    align-items:flex-start;
  }
  .rm-milestone:last-child{border-bottom:0;padding-bottom:0}
  .rm-milestone:first-child{padding-top:0}
  .rm-ms-icon{
    width:36px;height:36px;border-radius:11px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    background:var(--surface-2);color:var(--muted);
  }
  .rm-milestone.reached .rm-ms-icon{background:var(--good-bg);color:var(--good-fg)}
  .rm-milestone.missed .rm-ms-icon{background:var(--bad-bg);color:var(--bad-fg)}
  .rm-milestone.upcoming .rm-ms-icon{background:var(--surface-2);color:var(--muted)}
  .rm-milestone.auto .rm-ms-icon{border:1px dashed var(--line)}
  .rm-ms-main{flex:1;min-width:0}
  .rm-ms-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .rm-ms-title{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .rm-ms-when{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .rm-ms-desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .rm-ms-badge{font-size:10px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
  .rm-milestone.reached .rm-ms-badge{background:var(--good-bg);color:var(--good-fg)}
  .rm-milestone.missed .rm-ms-badge{background:var(--bad-bg);color:var(--bad-fg)}
  .rm-ms-actions{display:flex;gap:0;flex:0 0 auto}
  .rm-ms-actions .link-btn{font-size:12px}

  .rm-empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
  .rm-empty .big{font-size:26px;opacity:.55;display:block;margin-bottom:8px}

  .rm-projection{
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    padding:14px;border-radius:14px;
    background:linear-gradient(90deg,color-mix(in srgb, var(--listening) 8%, transparent),transparent);
    border:1px solid var(--line);margin-bottom:14px;
  }
  .rm-projection .proj-icon{
    width:44px;height:44px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(140deg,var(--listening-2),var(--listening));color:var(--on-accent);
    display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .rm-projection .proj-main{flex:1;min-width:200px}
  .rm-projection .proj-title{font-size:13.5px;font-weight:650}
  .rm-projection .proj-sub{font-size:12.5px;color:var(--muted);margin-top:2px}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:100;animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    position:fixed;z-index:101;left:50%;bottom:0;width:100%;max-width:560px;
    transform:translateX(-50%);background:var(--surface);border-radius:22px 22px 0 0;
    max-height:93vh;overflow-y:auto;box-shadow:0 -10px 40px -12px rgba(0,0,0,.45);
  }
  @media(min-width:640px){
    .modal{top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:22px;max-height:88vh}
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;

/* =========================================================

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const fmt  = n => Math.round(Number(n) || 0).toLocaleString('en-US');
const fmt1 = n => (Math.round((Number(n) || 0) * 10) / 10).toLocaleString('en-US');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pad2 = n => String(n).padStart(2, '0');

function toISO(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseISO(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function diffDays(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function todayISO(){ return toISO(new Date()); }
function minISO(a, b){ return a < b ? a : b; }
function maxISO(a, b){ return a > b ? a : b; }
function uid(p){ return p + '_' + Math.random().toString(36).slice(2, 9); }
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function startOfWeekISO(iso){
  const d = parseISO(iso);
  const dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return toISO(d);
}
function prettyDate(iso){
  const d = parseISO(iso);
  const t = todayISO();
  if (iso === t) return 'Today';
  if (iso === addDays(t, -1)) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function shortDate(iso){
  const d = parseISO(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function daysRemainingLabel(endIso){
  const today = todayISO();
  if (today > endIso) return 'Phase ended';
  const remaining = diffDays(today, endIso);
  return `${remaining} Day${remaining === 1 ? '' : 's'} Remaining`;
}
function initialsOf(name){
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

/* =========================================================
   Countdown helpers
   ========================================================= */
function msUntilNextMidnight(){
  const now = new Date();
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
  return Math.max(0, end - now);
}
function msUntilWeekEnd(){
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (7 - dow), 0, 0, 0, 0);
  return Math.max(0, end - now);
}
function msUntilChallengeEnd(){
  const e = parseISO(state.challenge.end_date);
  const end = new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1, 0, 0, 0, 0);
  return Math.max(0, end - new Date());
}
function msFor(kind){
  if (kind === 'day')       return msUntilNextMidnight();
  if (kind === 'week')      return msUntilWeekEnd();
  if (kind === 'challenge') return msUntilChallengeEnd();
  return 0;
}
function fmtCountdown(ms){
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
}
/* Per-material deadlines */
function msUntilDeadline(deadlineIso){
  const d = parseISO(deadlineIso);
  const end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0);
  return end - new Date();
}
function fmtCountdownLong(ms){
  const total = Math.max(0, Math.floor(ms / 1000));
  const days = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return (days > 0 ? days + 'd ' : '') + pad2(h) + ':' + pad2(m) + ':' + pad2(s);
}
function fmtDeadlineDate(iso){
  const d = parseISO(iso);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('en-US', sameYear
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' });
}
function resetTimeLabel(kind){
  const now = new Date();
  if (kind === 'day') return '00:00';
  if (kind === 'week'){
    const dow = (now.getDay() + 6) % 7;
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (7 - dow));
    return end.toLocaleDateString('en-US', { weekday: 'short' }) + ' 00:00';
  }
  if (kind === 'challenge'){
    const e = parseISO(state.challenge.end_date);
    return e.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' 23:59';
  }
  return '—';
}
function nowClock(){
  const d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
let tickTimer = null;
function updateCountdowns(){
  $$('[data-countdown]').forEach(el => {
    const kind = el.dataset.countdown;
    if (kind.indexOf('material:') === 0){
      const m = materialById(kind.slice('material:'.length));
      if (!m || !m.deadline){ el.textContent = '—'; el.classList.remove('overdue'); return; }
      const ms = msUntilDeadline(m.deadline);
      if (ms <= 0){
        el.textContent = 'Overdue';
        el.classList.add('overdue');
      } else {
        el.classList.remove('overdue');
        el.textContent = fmtCountdownLong(ms);
      }
      return;
    }
    el.textContent = fmtCountdown(msFor(kind));
  });
  $$('[data-now]').forEach(el => { el.textContent = nowClock(); });
}
function startTicker(){
  if (tickTimer) clearInterval(tickTimer);
  updateCountdowns();
  tickTimer = setInterval(updateCountdowns, 1000);
}

/* =========================================================
   Persistence
   ========================================================= */
function normalizeState(s){
  if (!s || typeof s !== 'object') return null;
  if (!Array.isArray(s.materials))    s.materials = [];
  s.materials = s.materials.map(m => {
    const cover = (m && typeof m.cover_url === 'string' && (m.cover_url.startsWith('data:image') || /^https?:\/\//.test(m.cover_url)))
      ? m.cover_url : '';
    return { ...m, cover_url: cover };
  });
  if (!Array.isArray(s.activities))   s.activities = [];
  if (!Array.isArray(s.customChallenges)) s.customChallenges = [];
  if (s.profile === undefined) s.profile = null;
  if (s.profile && typeof s.profile !== 'object') s.profile = null;
  if (s.profile){ if (!Array.isArray(s.profile.favorite_genres)) s.profile.favorite_genres = []; }

  const dr = defaultRoadmap();
  if (!s.roadmap || typeof s.roadmap !== 'object'){ s.roadmap = dr; }
  else {
    const r = s.roadmap;
    const phases = Array.isArray(r.phases) && r.phases.length === 4 ? r.phases : dr.phases;

    // Weekly materials: normalize to weekIndex -> [materialId, ...].
    // Migrates the old single-material `weeklyFocus` format if that's all we have.
    let weeklyMaterials = {};
    if (r.weeklyMaterials && typeof r.weeklyMaterials === 'object'){
      weeklyMaterials = r.weeklyMaterials;
    } else if (r.weeklyFocus && typeof r.weeklyFocus === 'object'){
      Object.keys(r.weeklyFocus).forEach(k => {
        const id = r.weeklyFocus[k];
        if (id) weeklyMaterials[k] = [id];
      });
    }
    Object.keys(weeklyMaterials).forEach(k => {
      weeklyMaterials[k] = Array.isArray(weeklyMaterials[k])
        ? [...new Set(weeklyMaterials[k].filter(id => typeof id === 'string'))]
        : [];
    });

    s.roadmap = {
      phases: phases.map((p, i) => ({
        id: p.id || dr.phases[i].id,
        name: String(p.name || dr.phases[i].name).slice(0, 40),
        focus: String(p.focus ?? dr.phases[i].focus).slice(0, 200),
        materials: Array.isArray(p.materials) ? [...new Set(p.materials.filter(id => typeof id === 'string'))] : []
      })),
      weeklyMaterials,
      weeklyNotes: (r.weeklyNotes && typeof r.weeklyNotes === 'object') ? r.weeklyNotes : {},
      milestones: Array.isArray(r.milestones) ? r.milestones.map(m => ({
        id: m.id || uid('m'),
        title: String(m.title || 'Milestone').slice(0, 60),
        description: String(m.description || '').slice(0, 200),
        date: m.date || todayISO(),
        done: !!m.done
      })) : [],
      dailyNotes: (r.dailyNotes && typeof r.dailyNotes === 'object') ? r.dailyNotes : {},
      expandedWeeks: (r.expandedWeeks && typeof r.expandedWeeks === 'object') ? r.expandedWeeks : {}
    };
  }

  return s;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportJSON(){
  const payload = {

  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `esc-backup-${todayISO()}.json`);
}
function csvEscape(v){
  const s = String(v ?? '');
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportCSV(){

  state.activities.slice().sort((a, b) => a.logged_on < b.logged_on ? -1 : a.logged_on > b.logged_on ? 1 : 0).forEach(a => {

  const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  downloadBlob(blob, `esc-activities-${todayISO()}.csv`);
}
function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch (err){ alert('Could not read that file. Please choose a valid JSON backup.'); return; }

    const candidate = (data && data.challenge && Array.isArray(data.activities) && Array.isArray(data.materials))

    if (!candidate || !candidate.challenge || !Array.isArray(candidate.activities) || !Array.isArray(candidate.materials)){

    const hasProfile = !!(candidate.profile && candidate.profile.display_name);

/* =========================================================
   Stats
   ========================================================= */
function actsInRange(from, to){
  return state.activities.filter(a => (!from || a.logged_on >= from) && (!to || a.logged_on <= to));
}
function sumCategory(list, category){
  return list.filter(a => a.category === category).reduce((s, a) => s + (Number(a.amount) || 0), 0);
}
function materialById(id){ return state.materials.find(m => m.id === id) || null; }

function getStats(){
  const ch = state.challenge;
  const today = todayISO();

  const totalDays   = Math.max(1, diffDays(ch.start_date, ch.end_date) + 1);
  const elapsed     = clamp(diffDays(ch.start_date, today) + 1, 0, totalDays);
  const daysLeft    = Math.max(1, totalDays - elapsed + 1);

  const readingTotal   = sumCategory(state.activities, 'reading');
  const listeningTotal = sumCategory(state.activities, 'listening');

  const readTarget   = Number(ch.reading_target_percent) || 1;
  const listenTarget = Number(ch.listening_target_minutes) || 1;

  const readPct   = readingTotal / readTarget * 100;
  const listenPct = listeningTotal / listenTarget * 100;

  const readDailyRate   = readTarget / totalDays;
  const listenDailyRate = listenTarget / totalDays;

  const readRequired   = Math.max(0, readTarget - readingTotal) / daysLeft;
  const listenRequired = Math.max(0, listenTarget - listeningTotal) / daysLeft;

  const idealReadPct   = elapsed / totalDays * 100;
  const idealListenPct = elapsed / totalDays * 100;

  const weekStart = maxISO(startOfWeekISO(today), ch.start_date);
  const weekEnd   = minISO(today, ch.end_date);
  const weekDays  = Math.max(0, diffDays(weekStart, weekEnd) + 1);
  const weekRead     = sumCategory(actsInRange(weekStart, weekEnd), 'reading');
  const weekListen   = sumCategory(actsInRange(weekStart, weekEnd), 'listening');
  const weekReadExp  = readDailyRate * weekDays;
  const weekListenExp = listenDailyRate * weekDays;

  const dayIdx   = clamp(diffDays(ch.start_date, today) + 1, 1, totalDays);
  const monthIdx = Math.min(2, Math.floor((dayIdx - 1) / 30));
  const monthStart = addDays(ch.start_date, monthIdx * 30);
  const monthEnd   = minISO(addDays(ch.start_date, monthIdx * 30 + 29), ch.end_date);
  const monthCut   = minISO(today, monthEnd);
  const monthDays  = monthStart <= monthCut ? diffDays(monthStart, monthCut) + 1 : 0;
  const monthRead     = sumCategory(actsInRange(monthStart, monthCut), 'reading');
  const monthListen   = sumCategory(actsInRange(monthStart, monthCut), 'listening');
  const monthReadExp  = readDailyRate * monthDays;
  const monthListenExp = listenDailyRate * monthDays;

  return {
    ch, today, totalDays, elapsed, daysLeft,
    readingTotal, listeningTotal, readTarget, listenTarget,
    readPct, listenPct, readRequired, listenRequired,
    readDailyRate, listenDailyRate, idealReadPct, idealListenPct,
    monthIdx, monthStart, monthEnd, monthDays,
    weekStart, weekEnd, weekDays,
    weekRead, weekListen, weekReadExp, weekListenExp,
    monthRead, monthListen, monthReadExp, monthListenExp
  };
}

function paceStatePct(actualPct, idealPct){
  const d = actualPct - idealPct;
  if (d >= 2)  return { cls: 'good', label: 'Ahead of pace' };
  if (d >= -3) return { cls: 'ok',   label: 'On pace' };
  if (d >= -10) return { cls: 'warn', label: 'Slightly behind' };
  return { cls: 'bad', label: 'Behind pace' };
}
function paceStateRatio(val, exp){
  if (!exp) return { cls: 'ok', label: '—' };
  const r = val / exp;
  if (r >= 1.02) return { cls: 'good', label: 'Ahead' };
  if (r >= 0.97) return { cls: 'ok',   label: 'On pace' };
  if (r >= 0.85) return { cls: 'warn', label: 'Slightly behind' };
  return { cls: 'bad', label: 'Behind' };
}

  const list = actsInRange(from, to);
  const p = sumCategory(list, 'reading');
  const m = sumCategory(list, 'listening');
  if (ch.category === 'listening') return m;
  if (ch.category === 'xp')        return xpFrom(p, m);
  return p;
}
function challengeStreak(ch){
  const today = todayISO();
  const chStart = state.challenge.start_date;
  let streak = 0;

  if (ch.scope === 'daily'){
    for (let d = today; d >= chStart; d = addDays(d, -1)){
      const ok = challengeValue(ch, d, d) >= ch.target;
      if (ok) streak++;
      else if (d === today) continue;
      else break;
    }
  } else {
    let ws = startOfWeekISO(today);
    for (let i = 0; i < 52; i++){
      const we = addDays(ws, 6);
      if (we < chStart) break;
      const from = maxISO(ws, chStart);
      const to   = minISO(we, today);
      const ok = challengeValue(ch, from, to) >= ch.target;
      if (ok) streak++;
      else if (i > 0) break;
      ws = addDays(ws, -7);
    }
  }
  return streak;
}
