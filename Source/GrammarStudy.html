<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Study</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --panel-3:#f9fafb; --border:#e4e7ec;
  --topbar-bg:rgba(255,255,255,.82);
  --text:#1a1d23; --text-2:#374151; --muted:#6b7280; --muted-2:#4b5563;
  --hover:#f3f4f6; --hover-2:#f9fafb; --bar-bg:#eceef1; --badge-bg:#f1f2f4;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef2ff; --accent-text:#4338ca;
  --green:#16a34a; --green-soft:#dcfce7; --green-text:#15803d;
  --red:#dc2626;   --red-soft:#fee2e2;   --red-text:#b91c1c;
  --amber:#d97706; --amber-soft:#fef3c7; --amber-text:#b45309; --amber-border:#fde68a;
  --blue:#0369a1;  --blue-soft:#e0f2fe;  --blue-text:#0369a1;  --blue-border:#bae6fd;
  --purple:#8b5cf6; --purple-soft:#faf5ff;
  --shadow:0 3px 10px rgba(16,24,40,.06);
  --shadow-lg:0 6px 16px rgba(79,70,229,.10);
  --modal-shadow:0 24px 60px rgba(15,23,42,.30);
  --backdrop:rgba(15,23,42,.55);
  --radius:12px; --content-max:1180px;
}
[data-theme="dark"]{
  --bg:#151619; --panel:#1e1f24; --panel-2:#26272d; --panel-3:#26272d; --border:#32343b;
  --topbar-bg:rgba(30,31,36,.82);
  --text:#e9eaee; --text-2:#c8cbd2; --muted:#8c909a; --muted-2:#a8acb6;
  --hover:#282a31; --hover-2:#282a31; --bar-bg:#32343b; --badge-bg:#2c2e35;
  --accent:#6366f1; --accent-hover:#818cf8; --accent-soft:#262a4a; --accent-text:#a5b4fc;
  --green:#4ade80; --green-soft:#16301f; --green-text:#86efac;
  --red:#f87171;   --red-soft:#3a1c1c;   --red-text:#fca5a5;
  --amber:#fbbf24; --amber-soft:#3a2c10; --amber-text:#fcd34d; --amber-border:#5c4515;
  --blue:#38bdf8;  --blue-soft:#12293a;  --blue-text:#7dd3fc;  --blue-border:#1e3a52;
  --purple:#a78bfa; --purple-soft:#2a1f3d;
  --shadow:0 3px 10px rgba(0,0,0,.35);
  --shadow-lg:0 6px 18px rgba(99,102,241,.18);
  --modal-shadow:0 24px 60px rgba(0,0,0,.65);
  --backdrop:rgba(0,0,0,.72);
}
html{transition:background .2s ease}
body,.card,.list-item,.stat,.btn,.input,select,textarea,.modal,.nav-item,
.badge,.bar,.cover,.topic-picker,.report,.modal-foot,.modal-head,th,.check-line,
.import-panel,.alert-card,.example,.issue,table,#topbar,.theme-toggle{
  transition:background-color .2s ease, border-color .2s ease, color .2s ease;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button{font-family:inherit;font-size:inherit}
#app{display:flex;flex-direction:column;min-height:100vh}
#topbar{position:sticky;top:0;z-index:50;width:100%;background:var(--topbar-bg);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap;padding-right:14px;border-right:1px solid var(--border);color:var(--text)}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);flex-shrink:0}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:2px 4px}
.nav::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;cursor:pointer;color:var(--muted-2);font-size:13.5px;font-weight:500;white-space:nowrap;user-select:none;transition:background .12s, color .12s}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-item .ic{font-size:13px;line-height:1;width:14px;text-align:center}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.topbar-stats{font-size:11.5px;color:var(--muted);white-space:nowrap;line-height:1.3;padding-right:6px;border-right:1px solid var(--border)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;cursor:pointer;background:var(--panel-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;user-select:none;transition:background .12s, border-color .12s, color .12s}
.theme-toggle:hover{background:var(--hover);border-color:var(--accent);color:var(--text)}
.theme-toggle .ic{font-size:14px;line-height:1}
main{flex:1;width:100%;max-width:var(--content-max);margin:0 auto;padding:28px 24px 70px;min-width:0}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.3px}
h2{font-size:16px;margin:26px 0 12px;letter-spacing:-.1px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid-2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:8px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat .n{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.clickable{cursor:pointer;transition:border-color .12s, box-shadow .12s}
.clickable:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.topic-card{display:flex;flex-direction:column;gap:8px}
.topic-card .t{font-weight:600;font-size:14.5px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--badge-bg);color:var(--muted-2);white-space:nowrap}
.badge.lvl{background:var(--accent-soft);color:var(--accent-text)}
.badge.green{background:var(--green-soft);color:var(--green-text)}
.badge.red{background:var(--red-soft);color:var(--red-text)}
.badge.amber{background:var(--amber-soft);color:var(--amber-text)}
.badge.blue{background:var(--blue-soft);color:var(--blue-text)}
.badge.grey{background:var(--badge-bg);color:var(--muted-2)}
button.badge{border:none;cursor:pointer;font-family:inherit}
button.badge:hover{filter:brightness(.95)}
.bar{height:7px;border-radius:6px;background:var(--bar-bg);overflow:hidden;width:100%}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.green > i{background:var(--green)}
.bar.amber > i{background:var(--amber)}
.bar.red > i{background:var(--red)}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.12s}
.btn:hover{background:var(--hover);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,select,textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:14px;background:var(--panel);color:var(--text);outline:none}
.input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;line-height:1.5}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-bar > *{width:auto;min-width:150px}
.filter-bar .grow{flex:1;min-width:200px}
.check-line{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13.5px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2);width:auto;color:var(--text-2)}
.check-line input{width:auto;margin:0;accent-color:var(--accent)}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field label{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.form-field.full{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.list-item.clickable:hover{border-color:var(--accent)}
.empty{padding:34px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);font-size:14px}
.cover{width:52px;height:70px;border-radius:7px;overflow:hidden;flex:0 0 52px;background:var(--badge-bg)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.cover.lg{width:76px;height:104px;flex-basis:76px;font-size:22px}
.practice-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.question-text{font-size:17px;line-height:1.55;margin:6px 0 18px;white-space:pre-wrap}
.options{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:11px 15px;border-radius:10px;cursor:pointer;font-size:14.5px;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt.ok{border-color:var(--green);background:var(--green-soft);font-weight:600;color:var(--green-text)}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red-text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;padding:9px;border:1px dashed var(--border);border-radius:10px;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--accent);color:var(--accent-text)}
.chip.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.match-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:9px}
.match-row .left{font-weight:600;font-size:14px}
.match-row select{padding:7px 10px;font-size:13.5px}
.feedback{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:14px}
.feedback.ok{background:var(--green-soft);border:1px solid var(--green);color:var(--green-text)}
.feedback.bad{background:var(--red-soft);border:1px solid var(--red);color:var(--red-text)}
.feedback .head{font-weight:700;margin-bottom:6px}
.feedback .exp{color:var(--text-2);font-size:13.5px}
.level-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;font-size:15px}
.level-head .pill{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px}
.level-head .cnt{font-size:12.5px;color:var(--muted);font-weight:400}
.report{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
.issue{font-size:13px;padding:8px 11px;border-radius:8px;margin-bottom:6px;background:var(--panel-3);border-left:3px solid var(--border);color:var(--text-2)}
.issue.err{border-left-color:var(--red);background:var(--red-soft)}
.issue.warn{border-left-color:var(--amber);background:var(--amber-soft)}
.issue.dup{border-left-color:var(--purple);background:var(--purple-soft)}
.issue.note{border-left-color:var(--blue);background:var(--blue-soft)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--border)}
th{background:var(--panel-2);font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:none}
.explain{font-size:14px;color:var(--text-2);line-height:1.65}
.example{background:var(--panel-3);border-left:3px solid var(--accent);padding:9px 13px;border-radius:0 8px 8px 0;margin-bottom:7px;font-size:14px;color:var(--text-2)}
.divider{height:1px;background:var(--border);margin:18px 0}
.topic-picker{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--panel-2)}
.topic-picker label{display:flex;gap:9px;align-items:center;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--text-2)}
.topic-picker label:hover{background:var(--accent-soft)}
.topic-picker input{width:auto;margin:0;accent-color:var(--accent)}
.topic-picker .tid{color:var(--muted);font-size:11px;font-family:ui-monospace,monospace}
.import-panel{border-color:var(--accent);background:var(--panel-2)}
.import-panel .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.alert-card{background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.alert-card .head{font-weight:700;color:var(--amber-text);margin-bottom:6px}
.alert-card .body{font-size:13.5px;color:var(--text-2)}
.alert-card.blue{background:var(--blue-soft);border-color:var(--blue-border)}
.alert-card.blue .head{color:var(--blue-text)}
.alert-card.blue .body{color:var(--text-2)}
.step-num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;align-items:center;justify-content:center;margin-right:8px}
.interactive-card{cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s,background-color .2s}
.interactive-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.interactive-card .open-hint{font-size:11px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:2px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.modal-backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .15s ease}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:680px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--modal-shadow);animation:slideUp .18s ease}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px}
.modal-body{padding:20px;overflow:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--panel-2);flex-wrap:wrap}
.modal-close{border:none;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 10px;border-radius:8px;font-family:inherit}
.modal-close:hover{background:var(--hover);color:var(--text)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bar-bg);border-radius:10px;border:2px solid var(--panel)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
@media (max-width:900px){
  #topbar{padding:8px 14px;gap:10px}
  .topbar-stats{display:none}
  main{padding:22px 16px 60px}
  .brand{padding-right:10px}
}
@media (max-width:640px){
  .brand .txt{display:none}
  .brand{padding-right:8px}
  .nav-item{padding:7px 9px}
  .nav-item .lbl{display:none}
  .nav-item .ic{font-size:15px;width:auto}
  .theme-toggle .lbl{display:none}
  .theme-toggle{padding:7px 9px}
  main{padding:18px 12px 50px}
  h1{font-size:20px}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="dot"></span><span class="txt">Grammar Study</span></div>
    <nav class="nav">
      <div class="nav-item" data-action="go" data-route="dashboard"><span class="ic">◈</span><span class="lbl">Dashboard</span></div>
      <div class="nav-item" data-action="go" data-route="topics"><span class="ic">▤</span><span class="lbl">Topics</span></div>
      <div class="nav-item" data-action="go" data-route="materials"><span class="ic">▣</span><span class="lbl">Materials</span></div>
      <div class="nav-item" data-action="go" data-route="exercises"><span class="ic">✎</span><span class="lbl">Exercises</span></div>
      <div class="nav-item" data-action="go" data-route="review"><span class="ic">↻</span><span class="lbl">Review</span></div>
      <div class="nav-item" data-action="go" data-route="mistakes"><span class="ic">✕</span><span class="lbl">Mistakes</span></div>
      <div class="nav-item" data-action="go" data-route="progress"><span class="ic">▲</span><span class="lbl">Progress</span></div>
      <div class="nav-item" data-action="go" data-route="import"><span class="ic">↧</span><span class="lbl">Import Data</span></div>
      <div class="nav-item" data-action="go" data-route="export"><span class="ic">↥</span><span class="lbl">Export</span></div>
    </nav>
    <div class="topbar-right">
      <span class="topbar-stats" id="sideFoot"></span>
      <div class="theme-toggle" data-action="toggle-theme" role="button" aria-label="Toggle theme">
        <span class="ic">☾</span><span class="lbl">Dark</span>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="modal-root"></div>

<script>
/* =========================================================
   0. THEME
   ========================================================= */
const THEME_KEY = "grammar-study-theme";
let THEME = (()=>{
  try{ const t = localStorage.getItem(THEME_KEY); if(t === "dark" || t === "light") return t; }catch(e){}
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
})();
function applyTheme(){
  document.documentElement.setAttribute("data-theme", THEME);
  const btn = document.querySelector(".theme-toggle");
  if(btn){
    const ic  = btn.querySelector(".ic");
    const lbl = btn.querySelector(".lbl");
    if(ic)  ic.textContent  = THEME === "dark" ? "☀" : "☾";
    if(lbl) lbl.textContent = THEME === "dark" ? "Light" : "Dark";
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", THEME === "dark" ? "#151619" : "#f5f6f8");
  else{
    const m = document.createElement("meta");
    m.name = "theme-color";
    m.content = THEME === "dark" ? "#151619" : "#f5f6f8";
    document.head.appendChild(m);
  }
}

/* =========================================================
   1. STORAGE
   ========================================================= */
const LS_KEY = "grammar-study-app-v6";
let DB = loadDB();
let view = {name:"dashboard", id:null};
let session = null;
let ui = {};
let impState = { text:"", format:"auto", createMissing:true, report:null, valid:null };
let matImport = null;
let modal = null;

function emptyDB(){ return { topics: [], materials: [], exercises: [], attempts: [], studySeconds: 0 }; }
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      d.topics = d.topics || [];
      d.materials = d.materials || [];
      d.exercises = d.exercises || [];
      d.attempts = d.attempts || [];
      d.studySeconds = d.studySeconds || 0;
      return d;
    }
  }catch(e){ console.warn("Load failed", e); }
  return emptyDB();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }
function libraryIsEmpty(){ return !DB.topics.length && !DB.materials.length && !DB.exercises.length; }

/* =========================================================
   2. HELPERS
   ========================================================= */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s==null?"":s).toLowerCase().trim().replace(/[.,!?;:"'’]/g,"").replace(/\s+/g," "); }
function pct(n,d){ return d ? Math.round((n/d)*100) : 0; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function accepts(ans){ return Array.isArray(ans) ? ans : String(ans==null?"":ans).split("|"); }
function fmtTime(sec){
  sec = Math.round(sec||0);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  if(h) return h+"h "+m+"m";
  if(m) return m+"m";
  return sec+"s";
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function slugify(s){
  return String(s||"").toLowerCase().trim().replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,60);
}
function uniqueTopicId(base){
  let id = slugify(base) || "topic";
  if(!findTopic(id)) return id;
  let i = 2; while(findTopic(id+"-"+i)) i++;
  return id+"-"+i;
}
function uniqueMaterialId(base){
  let id = slugify(base) || "material";
  if(!findMaterial(id)) return id;
  let i = 2; while(findMaterial(id+"-"+i)) i++;
  return id+"-"+i;
}
const findTopic = id => DB.topics.find(t=>t.id===id);
const findMaterial = id => DB.materials.find(m=>m.id===id);
const findEx = id => DB.exercises.find(e=>e.id===id);
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const MATERIAL_TYPES = ["book","pdf","course","website","notes","custom"];
const UNIT_LABELS = ["Unit","Lesson","Page","Chapter","Module","Section"];

function materialFallbackLevel(m){
  if(!m || !m.level) return "";
  const first = String(m.level).split(/[^A-Za-z0-9]+/).filter(Boolean)[0];
  if(!first) return "";
  const up = first.toUpperCase();
  return LEVELS.includes(up) ? up : "";
}
function dominantExerciseLevel(topicId){
  const counts = {};
  DB.exercises.forEach(e=>{ if(e.topic_id !== topicId || !e.level) return; counts[e.level] = (counts[e.level]||0) + 1; });
  const entries = Object.entries(counts).sort((a,b)=> b[1]-a[1]);
  return entries.length ? entries[0][0] : "";
}
function titleFromId(id){
  return String(id||"").split(/[-_\s]+/).filter(Boolean).map(w=> w.charAt(0).toUpperCase() + w.slice(1)).join(" ") || "Untitled topic";
}
function typeLabel(t){
  return {
    multiple_choice:"Multiple choice", fill_blank:"Fill in the blank",
    error_correction:"Error correction", transformation:"Transformation",
    word_order:"Word order", matching:"Matching", completion:"Completion",
    production:"Production"
  }[t] || t;
}

/* =========================================================
   3. STATS
   ========================================================= */
function attemptsFor(exId){ return DB.attempts.filter(a=>a.exerciseId===exId); }
function exStats(id){
  const a = attemptsFor(id);
  const correct = a.filter(x=>x.correct).length;
  const total = a.length;
  const last = total ? a[total-1] : null;
  return {correct, total, wrong: total-correct, mastery: total ? correct/total : 0, last};
}
function exStatus(id){
  const s = exStats(id);
  if(s.total === 0) return "new";
  if(s.mastery >= 0.85 && s.total >= 2 && s.last && s.last.correct) return "mastered";
  if(s.mastery >= 0.6 && s.last && s.last.correct) return "reviewing";
  return "learning";
}
function statusBadge(st){
  const map = { new:['grey','New'], learning:['red','Needs work'], reviewing:['amber','Reviewing'], mastered:['green','Mastered'] };
  const [c,l] = map[st] || map.new;
  return `<span class="badge ${c}">${l}</span>`;
}
function topicStats(topicId){
  const exs = DB.exercises.filter(e=>e.topic_id===topicId);
  const ids = new Set(exs.map(e=>e.id));
  const at = DB.attempts.filter(a=>ids.has(a.exerciseId));
  const correct = at.filter(a=>a.correct).length;
  const mastered = exs.filter(e=>exStatus(e.id)==="mastered").length;
  const attempted = exs.filter(e=>exStats(e.id).total>0).length;
  return { exercises: exs.length, attempted, mastered, attempts: at.length, correct,
    accuracy: pct(correct, at.length), progress: pct(mastered, exs.length), wrong: at.length - correct };
}
function materialStats(materialId){
  const m = findMaterial(materialId);
  if(!m) return {progress:0, exercises:0, topics:0, practiced:0, mastered:0};
  const exs = DB.exercises.filter(e=>e.material_id===materialId);
  const mastered = exs.filter(e=>exStatus(e.id)==="mastered").length;
  const practiced = exs.filter(e=>exStats(e.id).total>0).length;
  const progress = m.total ? pct(m.current, m.total) : 0;
  return { progress, exercises: exs.length, topics: (m.topics||[]).length, practiced, mastered };
}
function overallStats(){
  const totalEx = DB.exercises.length;
  const mastered = DB.exercises.filter(e=>exStatus(e.id)==="mastered").length;
  const attemptedEx = DB.exercises.filter(e=>exStats(e.id).total>0).length;
  const totalAt = DB.attempts.length;
  const correctAt = DB.attempts.filter(a=>a.correct).length;
  const topicsStudied = new Set(DB.attempts.map(a=>a.topicId)).size;
  const topicsTotal = DB.topics.length;
  return { totalEx, mastered, attemptedEx, totalAt, correctAt,
    accuracy: pct(correctAt, totalAt), topicsStudied, topicsTotal,
    progress: pct(mastered, totalEx), studySeconds: DB.studySeconds||0 };
}
function reviewQueue(includeNew){
  const scored = [];
  DB.exercises.forEach(ex=>{
    const s = exStats(ex.id);
    const st = exStatus(ex.id);
    if(!includeNew && s.total === 0) return;
    if(st === "mastered") return;
    const priority = s.wrong*3 + (s.last && !s.last.correct ? 4 : 0) + (s.total===0 ? 1 : 0) - s.mastery*2;
    scored.push({ex, s, st, priority});
  });
  scored.sort((a,b)=> b.priority - a.priority);
  return scored;
}
function mistakeList(){
  const byEx = {};
  DB.attempts.forEach(a=>{
    if(a.correct) { if(byEx[a.exerciseId]) byEx[a.exerciseId].resolved = true; return; }
    if(!byEx[a.exerciseId] || byEx[a.exerciseId].ts < a.ts){
      byEx[a.exerciseId] = {exerciseId:a.exerciseId, userAnswer:a.userAnswer, ts:a.ts, resolved:false};
    } else { byEx[a.exerciseId].resolved = false; }
  });
  return Object.values(byEx).filter(m=>!m.resolved)
    .map(m=>({...m, ex: findEx(m.exerciseId)})).filter(m=>m.ex).sort((a,b)=> b.ts - a.ts);
}
function topicsNeedingReview(){
  const map = {};
  DB.exercises.forEach(ex=>{
    const s = exStats(ex.id);
    const st = exStatus(ex.id);
    if(st === "mastered" || st === "new") return;
    if(!map[ex.topic_id]) map[ex.topic_id] = {wrong:0, total:0, exercises:0};
    map[ex.topic_id].wrong += s.wrong;
    map[ex.topic_id].total += s.total;
    map[ex.topic_id].exercises++;
  });
  return Object.entries(map).map(([id,v])=>({topic:findTopic(id), ...v}))
    .filter(x=>x.topic).sort((a,b)=> b.wrong - a.wrong);
}
function exercisesWithUnknownTopics(){
  const missing = new Map(); const list = [];
  DB.exercises.forEach(e=>{
    if(e.topic_id && !findTopic(e.topic_id)){
      list.push(e);
      missing.set(e.topic_id, (missing.get(e.topic_id)||0) + 1);
    }
  });
  return { list, missing: Array.from(missing.entries()).map(([id,count])=>({id,count})) };
}
function topicsWithMismatchedLevels(){
  const out = [];
  DB.topics.forEach(t=>{
    const exs = DB.exercises.filter(e=>e.topic_id===t.id && e.level);
    if(!exs.length) return;
    const counts = {};
    exs.forEach(e=>{ counts[e.level] = (counts[e.level]||0) + 1; });
    const entries = Object.entries(counts).sort((a,b)=> b[1]-a[1]);
    const [topLevel, topCount] = entries[0];
    if(topLevel && topLevel !== t.level && topCount >= Math.ceil(exs.length/2)){
      out.push({ topic: t, suggested: topLevel, exercises: exs.length, matching: topCount });
    }
  });
  return out;
}
function createStubTopic(id, materialId, levelOverride){
  id = String(id||"").trim();
  if(!id) return null;
  const existing = findTopic(id);
  if(existing) return existing;
  let level = levelOverride;
  if(!level) level = dominantExerciseLevel(id);
  if(!level) level = materialFallbackLevel(findMaterial(materialId));
  if(!level || !LEVELS.includes(level)) level = "A1";
  const t = { id, title: titleFromId(id), level, explanation: "", examples: [] };
  DB.topics.push(t);
  return t;
}

   ========================================================= */
function openTopicModal(topicId, type){
  const t = findTopic(topicId);
  if(!t) return;
  modal = { topicId, type, editing: false };
  document.body.style.overflow = "hidden";
  paintModal();
}
function closeModal(){
  modal = null;
  document.body.style.overflow = "";
  const root = document.getElementById("modal-root");
  if(root) root.innerHTML = "";
}
function paintModal(){
  const root = document.getElementById("modal-root");
  if(!root) return;
  if(!modal){ root.innerHTML = ""; return; }
  const t = findTopic(modal.topicId);
  if(!t){ closeModal(); return; }
  const isExpl = modal.type === "explanation";
  const title = isExpl ? "Grammar Explanation" : "Examples";
  let bodyHTML = "";
  if(modal.editing){
    if(isExpl){
      bodyHTML = `<textarea class="input" id="modal-input" rows="12"
        placeholder="Write the rule in your own words…">${esc(t.explanation||"")}</textarea>`;
    } else {
      bodyHTML = `<div class="small muted" style="margin-bottom:8px">One example per line. Empty lines are ignored.</div>
        <textarea class="input" id="modal-input" rows="12"
        placeholder="I have been studying English for three years.
She's been working since 8am.">${esc((t.examples||[]).join("\n"))}</textarea>`;
    }
  } else {
    if(isExpl){
      bodyHTML = t.explanation
        ? `<div class="explain" style="white-space:pre-wrap">${esc(t.explanation)}</div>`
        : `<div class="empty" style="padding:26px">No explanation yet.<br><br><span class="small">Click <strong>Edit</strong> below to write one.</span></div>`;
    } else {
      bodyHTML = (t.examples && t.examples.length)
        ? t.examples.map((ex,i)=>`<div class="example" style="display:flex;gap:8px"><span class="muted small" style="font-weight:700;min-width:18px">${i+1}.</span><span>${esc(ex)}</span></div>`).join("")
        : `<div class="empty" style="padding:26px">No examples yet.<br><br><span class="small">Click <strong>Edit</strong> below to add some.</span></div>`;
    }
  }
  const footerHTML = modal.editing
    ? `<button class="btn" data-action="modal-cancel">Cancel</button><button class="btn primary" data-action="modal-save">Save</button>`
    : `<button class="btn" data-action="modal-close">Close</button><button class="btn primary" data-action="modal-edit">Edit</button>`;
  root.innerHTML = `
    <div class="modal-backdrop" data-action="modal-backdrop">
      <div class="modal">
        <div class="modal-head">
          <div>
            <div style="font-weight:700;font-size:15px">${esc(title)}</div>
            <div class="small muted" style="margin-top:2px">${esc(t.title)}<span class="badge lvl" style="margin-left:6px">${esc(t.level)}</span></div>
          </div>
          <button class="modal-close" data-action="modal-close" title="Close (Esc)">×</button>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        <div class="modal-foot">${footerHTML}</div>
      </div>
    </div>`;
}

   5. ROUTER
   ========================================================= */
function go(name, id){
  if(name === "material"){ if(matImport && matImport.materialId !== id) matImport = null; } else { matImport = null; }
  if(modal) closeModal();
  view = {name, id: id||null};
  if(name !== "practice"){ session = null; }
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

function render(){
  const el = document.getElementById("main");
  let html = "";
  switch(view.name){
    case "dashboard":      html = viewDashboard(); break;
    case "topics":         html = viewTopics(); break;
    case "topic-form":     html = viewTopicForm(view.id); break;
    case "topic":          html = viewTopicDetail(view.id); break;
    case "materials":      html = viewMaterials(); break;
    case "material-form":  html = viewMaterialForm(view.id); break;
    case "material":       html = viewMaterialDetail(view.id); break;
    case "import":         html = viewImport(); break;
    case "exercises":      html = viewExercises(); break;
    case "practice":       html = viewPractice(); break;
    case "review":         html = viewReview(); break;
    case "mistakes":       html = viewMistakes(); break;
    case "progress":       html = viewProgress(); break;
    case "export":         html = viewExport(); break;
    default: html = viewDashboard();
  }
  el.innerHTML = html;
  document.querySelectorAll(".nav-item").forEach(n=>{
    const route = n.dataset.route;
    let on = route === view.name;
    if(view.name === "topic" || view.name === "topic-form") on = route === "topics";
    if(view.name === "material" || view.name === "material-form") on = route === "materials";
    n.classList.toggle("active", on);
  });
  const sf = document.getElementById("sideFoot");
  if(sf) sf.textContent = `${DB.topics.length} topics · ${DB.exercises.length} ex · ${DB.materials.length} materials`;
  if(modal) paintModal();
}

}

function viewTopicDetail(id){

/* ---- Detect the type of a single sample object ---- */
function detectObjectKind(o){
  if(!o || typeof o !== "object") return null;
  let exScore = 0, matScore = 0, topScore = 0;

  if(o.question !== undefined) exScore += 3;
  if(o.answer !== undefined)   exScore += 2;
  if(o.topic_id !== undefined) exScore += 2;
  if(o.type !== undefined && EXERCISE_TYPES.includes(o.type)) exScore += 4;
  if(o.options || o.words || o.pairs) exScore += 2;

  if(o.author !== undefined)    matScore += 3;
  if(o.total !== undefined)     matScore += 2;
  if(o.unitLabel !== undefined) matScore += 4;
  if(o.cover !== undefined)     matScore += 2;
  if(o.current !== undefined)   matScore += 2;
  if(o.type !== undefined && MATERIAL_TYPES.includes(o.type)) matScore += 3;
  if(o.title !== undefined && o.description !== undefined && exScore === 0) matScore += 2;

  if(o.explanation !== undefined && o.level !== undefined && o.title !== undefined && exScore === 0 && matScore === 0) topScore += 4;
  if(o.examples !== undefined && o.explanation !== undefined) topScore += 2;

  if(exScore === 0 && matScore === 0 && topScore === 0) return null;
  if(exScore >= matScore && exScore >= topScore) return "exercises";
  if(matScore >= topScore) return "materials";
  return "topics";
}

function coerceMaterial(o){
  return {
    id: String(o.id||"").trim(),
    title: String(o.title||"").trim(),
    author: String(o.author||"").trim(),
    type: String(o.type||"custom").trim(),
    level: String(o.level||"").trim(),
    cover: String(o.cover||"").trim(),
    description: String(o.description||"").trim(),
    topics: Array.isArray(o.topics)
      ? o.topics.map(x=>String(x).trim()).filter(Boolean)
      : (o.topics ? String(o.topics).split(/[;|]/).map(s=>s.trim()).filter(Boolean) : []),
    total: Number(o.total) || 0,
    current: Number(o.current) || 0,
    unitLabel: String(o.unitLabel||"Unit").trim()
  };
}

/* Unified import validation — handles exercises, materials, topics, and full backups */
function runImportValidation(text, format){
  const report = {
    total:0, validCount:0,
    invalid:[], duplicates:[], warnings:[],
    counts: { materials:0, exercises:0, topics:0 }
  };
  const valid = { materials: [], exercises: [], topics: [], attempts: [], studySeconds: null };

  let bucket = { materials: [], exercises: [], topics: [] };

  try {
    const t = text.trim();
    if(!t) throw new Error("Input is empty.");
    if(format === "auto") format = (t.startsWith("{") || t.startsWith("[")) ? "json" : "csv";

    if(format === "json"){
      const obj = JSON.parse(t);

      if(Array.isArray(obj)){
        if(!obj.length){ report.warnings.push("The array is empty."); }
        else {
          const kind = detectObjectKind(obj[0]);
          if(!kind){
            throw new Error("Could not detect the type of this JSON array. Add a 'question'/'answer' (exercises), 'author'/'total' (materials) or 'explanation'/'level' (topics).");
          }
          bucket[kind] = obj;
        }
      } else if(obj && typeof obj === "object"){
        if(Array.isArray(obj.materials) || Array.isArray(obj.exercises) || Array.isArray(obj.topics)){
          if(Array.isArray(obj.materials)) bucket.materials = obj.materials;
          if(Array.isArray(obj.exercises)) bucket.exercises = obj.exercises;
          if(Array.isArray(obj.topics))    bucket.topics    = obj.topics;
          if(Array.isArray(obj.attempts))  valid.attempts   = obj.attempts;
          if(typeof obj.studySeconds === "number") valid.studySeconds = obj.studySeconds;
        } else {
          const kind = detectObjectKind(obj);
          if(!kind){
            throw new Error("Could not detect the type of this JSON object. Add a 'question'/'answer' (exercise), 'author'/'total' (material) or 'explanation'/'level' (topic).");
          }
          bucket[kind] = [obj];
        }
      } else {
        throw new Error("Unsupported JSON structure.");
      }
    } else {
      const rows = csvToObjects(t);
      if(!rows.length) throw new Error("No data rows found in the CSV.");
      const kind = detectObjectKind(rows[0]);
      if(!kind){
        throw new Error("Could not detect the CSV type. Include a 'question' column (exercises), 'author'/'total' (materials), or 'explanation' (topics).");
      }
      bucket[kind] = rows;
    }
  } catch(err){
    report.invalid.push("Parse error: " + esc(err.message));
    return {report, valid};
  }

  report.counts.materials = bucket.materials.length;
  report.counts.exercises = bucket.exercises.length;
  report.counts.topics    = bucket.topics.length;
  report.total = report.counts.materials + report.counts.exercises + report.counts.topics;

  /* ---- Exercises ---- */
  {
    const seen = new Set();
    const existing = new Set(DB.exercises.map(x=>x.id));
    bucket.exercises.forEach((item, i) => {
      const label = `exercise #${i+1}${item && item.id ? ` (${item.id})` : ""}`;
      const errors = [];
      ["id","topic_id","level","type","question","answer"].forEach(f=>{
        if(item[f] === undefined || item[f] === null || String(item[f]).trim() === "")
          errors.push(`missing required field '${f}'`);
      });
      if(item.type && !EXERCISE_TYPES.includes(item.type)) errors.push(`unknown exercise type '${item.type}'`);
      if(item.type === "multiple_choice" && !item.options) errors.push("multiple_choice requires 'options'");
      if(item.type === "matching" && !item.pairs) errors.push("matching requires 'pairs'");
      if(item.topic_id && !findTopic(item.topic_id) && !bucket.topics.some(t=>t.id===item.topic_id))
        report.warnings.push(`${esc(label)}: topic '${item.topic_id}' does not exist yet`);
      if(item.material_id && !findMaterial(item.material_id) && !bucket.materials.some(m=>m.id===item.material_id))
        report.warnings.push(`${esc(label)}: material '${item.material_id}' does not exist yet`);
      if(!item.explanation) report.warnings.push(`${esc(label)}: missing 'explanation'`);
      if(errors.length){ report.invalid.push(`${esc(label)}: ${errors.join(", ")}`); return; }
      if(seen.has(item.id)){ report.duplicates.push(`${esc(label)}: duplicated within the file`); return; }
      if(existing.has(item.id)){ report.duplicates.push(`${esc(label)}: already exists in your library`); return; }
      seen.add(item.id);
      valid.exercises.push(coerceExercise(item));
    });
  }

  /* ---- Materials ---- */
  {
    const seen = new Set();
    const existing = new Set(DB.materials.map(x=>x.id));
    bucket.materials.forEach((item, i) => {
      const label = `material #${i+1}${item && item.id ? ` (${item.id})` : ""}`;
      const errors = [];
      if(!item.id || !String(item.id).trim()) errors.push("missing required field 'id'");
      if(!item.title || !String(item.title).trim()) errors.push("missing required field 'title'");
      if(!item.author)      report.warnings.push(`${esc(label)}: missing 'author'`);
      if(!item.level)       report.warnings.push(`${esc(label)}: missing 'level'`);
      if(!item.description) report.warnings.push(`${esc(label)}: missing 'description'`);
      if(errors.length){ report.invalid.push(`${esc(label)}: ${errors.join(", ")}`); return; }
      if(seen.has(item.id)){ report.duplicates.push(`${esc(label)}: duplicated within the file`); return; }
      if(existing.has(item.id)){ report.duplicates.push(`${esc(label)}: already exists in your library`); return; }
      seen.add(item.id);
      valid.materials.push(coerceMaterial(item));
    });
  }

  /* ---- Topics ---- */
  {
    const seen = new Set();
    const existing = new Set(DB.topics.map(x=>x.id));
    bucket.topics.forEach((item, i) => {
      const label = `topic #${i+1}${item && item.id ? ` (${item.id})` : ""}`;
      const errors = [];
      if(!item.id || !String(item.id).trim()) errors.push("missing required field 'id'");
      if(!item.title || !String(item.title).trim()) errors.push("missing required field 'title'");
      if(!item.level || !String(item.level).trim()) errors.push("missing required field 'level'");
      if(!item.explanation) report.warnings.push(`${esc(label)}: missing 'explanation'`);
      if(errors.length){ report.invalid.push(`${esc(label)}: ${errors.join(", ")}`); return; }
      if(seen.has(item.id)){ report.duplicates.push(`${esc(label)}: duplicated within the file`); return; }
      if(existing.has(item.id)){ report.duplicates.push(`${esc(label)}: already exists in your library`); return; }
      seen.add(item.id);
      valid.topics.push(coerceTopic(item));
    });
  }

  report.validCount = valid.materials.length + valid.exercises.length + valid.topics.length;
  return {report, valid};
}

function confirmImport(){
  if(!impState.report || !impState.valid) return;
  let addedM = 0, addedE = 0, addedT = 0, addedA = 0;
  let createdTopics = 0;

  /* Topics first (so exercises can link) */
  impState.valid.topics.forEach(t=>{
    const i = DB.topics.findIndex(x=>x.id === t.id);
    if(i >= 0) DB.topics[i] = t; else DB.topics.push(t);
    addedT++;
  });

  /* Materials */
  impState.valid.materials.forEach(m=>{
    const i = DB.materials.findIndex(x=>x.id === m.id);
    if(i >= 0) DB.materials[i] = m; else DB.materials.push(m);
    addedM++;
  });

  /* Exercises — optionally create missing stub topics */
  impState.valid.exercises.forEach(item=>{
    if(impState.createMissing && item.topic_id && !findTopic(item.topic_id)){
      createStubTopic(item.topic_id, item.material_id, item.level);
      createdTopics++;
    }
    const i = DB.exercises.findIndex(x=>x.id === item.id);
    if(i >= 0) DB.exercises[i] = item; else DB.exercises.push(item);
    addedE++;
  });

  /* Attempts (optional, from full backup) */
  if(Array.isArray(impState.valid.attempts) && impState.valid.attempts.length){
    const ids = new Set(DB.attempts.map(a=>a.id));
    impState.valid.attempts.forEach(a=>{
      if(a && a.id && !ids.has(a.id)){ DB.attempts.push(a); addedA++; }
    });
  }
  if(typeof impState.valid.studySeconds === "number" && impState.valid.studySeconds > 0){
    DB.studySeconds = Math.max(DB.studySeconds || 0, impState.valid.studySeconds);
  }

  save();
  impState = { text:"", format:"auto", createMissing: impState.createMissing, report:null, valid:null };

  const parts = [];
  if(addedT) parts.push(`${addedT} topic${addedT===1?"":"s"}`);
  if(addedM) parts.push(`${addedM} material${addedM===1?"":"s"}`);
  if(addedE) parts.push(`${addedE} exercise${addedE===1?"":"s"}`);
  if(addedA) parts.push(`${addedA} attempt${addedA===1?"":"s"}`);

  let msg = `Imported: ${parts.join(", ") || "nothing"}.`;
  if(createdTopics) msg += `\nCreated ${createdTopics} missing topic${createdTopics===1?"":"s"}.`;
  alert(msg);

  /* Go to the most relevant place */
  if(addedE) go("exercises");
  else if(addedM) go("materials");
  else if(addedT) go("topics");
  else go("dashboard");
}

/* =========================================================
   11. PRACTICE
   ========================================================= */
function currentEx(){ return session ? findEx(session.ids[session.idx]) : null; }
function startSession(ids, title){
  ids = ids.filter(id=>findEx(id));
  if(!ids.length){ alert("No exercises to practice."); return; }
  session = {ids, title: title||"Practice", idx:0, correct:0, total:0, done:false, startTs: Date.now()};
  initUI();
  go("practice");
}
function initUI(){
  ui = {selected:null, bank:[], answerWords:[], matches:{}, submitted:false, lastCorrect:null, userAnswer:"", revealed:false, saved:""};
  const ex = currentEx();
  if(!ex) return;
  if(ex.type === "word_order"){
    const words = ex.words && ex.words.length ? ex.words : String(ex.answer).split(" ");
    ui.bank = shuffle(words);
  }
  if(ex.type === "matching"){
    (ex.pairs||[]).forEach((p,i)=>{ ui.matches[i] = ""; });
  }
}
function viewPractice(){
  if(!session) return `<div class="empty">No practice session.</div>`;
  if(session.done){
    const acc = pct(session.correct, session.total);
    return `<h1>Session complete</h1>
    <div class="sub">${esc(session.title)}</div>
    <div class="stat-grid">
      <div class="stat"><div class="n">${session.correct}/${session.total}</div><div class="l">Correct</div></div>
      <div class="stat"><div class="n">${acc}%</div><div class="l">Accuracy</div></div>
      <div class="stat"><div class="n">${fmtTime((Date.now()-session.startTs)/1000)}</div><div class="l">Duration</div></div>
    </div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn primary" data-action="go" data-route="exercises">Back to exercises</button>
      <button class="btn" data-action="go" data-route="mistakes">Practice mistakes</button>
      <button class="btn" data-action="go" data-route="dashboard">Dashboard</button>
    </div>`;
  }
  const ex = currentEx();
  if(!ex) { session.done = true; return viewPractice(); }
  const t = findTopic(ex.topic_id);
  const m = findMaterial(ex.material_id);
  const progressPct = pct(session.idx, session.ids.length);
  let feedback = "";
  if(ui.submitted){
    const ok = ui.lastCorrect;
    feedback = `<div class="feedback ${ok?"ok":"bad"}">
      <div class="head">${ok?"✓ Correct":"✕ Not quite"}</div>
      ${!ok ? `<div style="margin-bottom:6px"><strong>Your answer:</strong> ${esc(ui.userAnswer||"—")}<br><strong>Correct answer:</strong> ${esc(Array.isArray(ex.answer)?ex.answer[0]:ex.answer)}</div>` : ""}
      <div class="exp">${esc(ex.explanation||"")}</div>
    </div>`;
  }
  const isLast = session.idx >= session.ids.length - 1;
  return `
  <div class="practice-head">
    <div>
      <button class="btn sm" data-action="go" data-route="exercises">← Exit</button>
      <span class="small muted" style="margin-left:10px">${esc(session.title)}</span>
    </div>
    <div class="small muted">Question ${session.idx+1} / ${session.ids.length} · Score ${session.correct}/${session.total}</div>
  </div>
  <div class="bar" style="margin-bottom:20px"><i style="width:${progressPct}%"></i></div>
  <div class="card">
    <div class="row wrap" style="margin-bottom:10px">
      <span class="badge">${esc(typeLabel(ex.type))}</span>
      <span class="badge lvl">${esc(ex.level)}</span>
      ${t?`<span class="badge grey">${esc(t.title)}</span>`:""}
      ${m?`<span class="badge grey">${esc(m.title)}</span>`:""}
    </div>
    <div class="question-text">${esc(ex.question)}</div>
    ${questionHTML(ex)}
    ${feedback}
  </div>
  <div class="btn-row" style="margin-top:18px">
    ${!ui.submitted
      ? (needsSelfGrade(ex) && !ui.revealed
          ? `<button class="btn primary" data-action="reveal">Show model answer</button>`
          : (needsSelfGrade(ex)
              ? `<button class="btn primary" data-action="self" data-ok="1">I was right</button>
                 <button class="btn danger" data-action="self" data-ok="0">I was wrong</button>`
              : `<button class="btn primary" data-action="check">Check answer</button>`))
      : `<button class="btn primary" data-action="next">${isLast?"Finish session":"Next question →"}</button>`}
  </div>`;
}
function needsSelfGrade(ex){ return ex.type === "production" || ex.type === "completion"; }
function questionHTML(ex){
  const dis = ui.submitted ? "disabled" : "";
  if(ex.type === "multiple_choice"){
    return `<div class="options">${(ex.options||[]).map(o=>{
      let cls = "opt";
      if(!ui.submitted && ui.selected === o) cls += " sel";
      if(ui.submitted){
        if(norm(o) === norm(Array.isArray(ex.answer)?ex.answer[0]:ex.answer)) cls += " ok";
        else if(ui.selected === o) cls += " bad";
      }
      return `<button class="${cls}" data-action="option" data-value="${esc(o)}" ${dis}>${esc(o)}</button>`;
    }).join("")}</div>`;
  }
  if(ex.type === "matching"){
    const rights = shuffle([...new Set((ex.pairs||[]).map(p=>p[1]))]);
    return (ex.pairs||[]).map((p,i)=>{
      const sel = ui.matches[i] || "";
      let cls = "";
      if(ui.submitted) cls = norm(sel)===norm(p[1]) ? "ok" : "bad";
      return `<div class="match-row">
        <div class="left">${esc(p[0])}</div>
        <select data-action="match" data-i="${i}" ${dis} class="${cls}">
          <option value="">— choose —</option>
          ${rights.map(r=>`<option value="${esc(r)}" ${sel===r?"selected":""}>${esc(r)}</option>`).join("")}
        </select>
      </div>`;
    }).join("");
  }
  if(ex.type === "word_order"){
    return `
      <div class="chips">${ui.answerWords.map((w,i)=>`<button class="chip ans" data-action="unword" data-i="${i}" ${dis}>${esc(w)}</button>`).join("")}</div>
      <div class="chips">${ui.bank.map((w,i)=>`<button class="chip" data-action="word" data-i="${i}" ${dis}>${esc(w)}</button>`).join("")}</div>`;
  }
  if(needsSelfGrade(ex)){
    let html = `<textarea id="answer-input" class="input" rows="3" ${dis} placeholder="Write your answer…">${esc(ui.saved)}</textarea>`;
    if(ui.revealed){
      html += `<div class="feedback ok" style="margin-top:14px">
        <div class="head">Model answer</div>
        <div class="exp">${esc(Array.isArray(ex.answer)?ex.answer[0]:ex.answer)}</div>
        <div class="exp" style="margin-top:8px">${esc(ex.explanation||"")}</div>
      </div>`;
    }
    return html;
  }
  return `<input id="answer-input" class="input" placeholder="Type your answer…" value="${esc(ui.submitted ? ui.userAnswer : "")}" ${dis}>`;
}
function revealAnswer(){
  const el = document.getElementById("answer-input");
  ui.saved = el ? el.value : "";
  ui.revealed = true;
  render();
}
function submitAnswer(){
  const ex = currentEx();
  if(!ex) return;
  let userAnswer = "", correct = false;
  if(ex.type === "multiple_choice"){
    userAnswer = ui.selected || "";
    if(!userAnswer) return;
    correct = norm(userAnswer) === norm(Array.isArray(ex.answer)?ex.answer[0]:ex.answer);
  } else if(ex.type === "matching"){
    const pairs = ex.pairs || [];
    if(pairs.some((p,i)=>!ui.matches[i])) return;
    correct = pairs.every((p,i)=> norm(ui.matches[i]) === norm(p[1]));
    userAnswer = pairs.map((p,i)=>`${p[0]} → ${ui.matches[i]}`).join("; ");
  } else if(ex.type === "word_order"){
    userAnswer = ui.answerWords.join(" ");
    if(!userAnswer) return;
    correct = norm(userAnswer) === norm(ex.answer);
  } else {
    const el = document.getElementById("answer-input");
    userAnswer = el ? el.value : "";
    if(!String(userAnswer).trim()) return;
    correct = accepts(ex.answer).some(a=> norm(a) === norm(userAnswer));
  }
  finishAnswer(userAnswer, correct);
}
function finishAnswer(userAnswer, correct){
  const ex = currentEx();
  DB.attempts.push({
    id: uid(), exerciseId: ex.id, topicId: ex.topic_id, materialId: ex.material_id || null,
    correct: !!correct, userAnswer: String(userAnswer).slice(0,600), ts: Date.now()
  });
  save();
  ui.submitted = true; ui.lastCorrect = !!correct; ui.userAnswer = userAnswer;
  session.total++; if(correct) session.correct++;
  render();
}
function nextQuestion(){
  if(session.idx >= session.ids.length - 1){ session.done = true; } else { session.idx++; }
  initUI(); render();
  window.scrollTo({top:0, behavior:"instant"});
}

function toCSV(rows, headers){
  const cell = v => {
    const s = Array.isArray(v) ? v.join("|") : (v === null || v === undefined ? "" : String(v));
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return [headers.join(",")].concat(rows.map(r=>headers.map(h=>cell(r[h])).join(","))).join("\n");
}
function download(filename, text, mime){
  const blob = new Blob([text], {type: mime || "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* =========================================================
   13. PARSING + VALIDATION HELPERS
   ========================================================= */
function parseCSV(text){
  const rows = []; let row = [], field = "", inQ = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else field += c;
    }
  }
  if(field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim() !== ""));
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(rows.length < 2) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=>{ o[h] = (r[i]||"").trim(); });
    return o;
  });
}
function coerceExercise(o){
  const ex = {
    id:o.id, topic_id:o.topic_id, material_id:o.material_id||null,
    level:o.level, type:o.type, question:o.question,
    answer:o.answer, explanation:o.explanation||""
  };
  if(o.options){ ex.options = Array.isArray(o.options) ? o.options : String(o.options).split("|").map(s=>s.trim()).filter(Boolean); }
  if(o.words){ ex.words = Array.isArray(o.words) ? o.words : String(o.words).split("|").map(s=>s.trim()).filter(Boolean); }
  if(o.pairs){
    if(typeof o.pairs === "string"){ try{ ex.pairs = JSON.parse(o.pairs); }catch(e){ ex.pairs = []; } }
    else ex.pairs = o.pairs;
  }
  return ex;
}
function coerceTopic(o){
  return {
    id: String(o.id||"").trim(),
    level: String(o.level||"").trim(),
    title: String(o.title||"").trim(),
    explanation: o.explanation || "",
    examples: Array.isArray(o.examples)
      ? o.examples.map(String)
      : (o.examples ? String(o.examples).split("|").map(s=>s.trim()).filter(Boolean) : [])
  };
}
const EXERCISE_TYPES = ["multiple_choice","fill_blank","error_correction","transformation","word_order","matching","completion","production"];

function validateMaterialTopics(text, format, materialId, overwrite){
  const material = findMaterial(materialId);
  const report = { total:0, validCount:0, invalid:[], duplicates:[], warnings:[], notes:[] };
  const newTopics = [], updates = [], linkIds = [];
  let items = [];
  try {
    const t = String(text||"").trim();
    if(!t) throw new Error("Input is empty.");
    if(format === "auto") format = (t.startsWith("{") || t.startsWith("[")) ? "json" : "csv";
    if(format === "json"){
      const obj = JSON.parse(t);
      if(Array.isArray(obj)) items = obj;
      else if(obj && Array.isArray(obj.topics)) items = obj.topics;
      else if(obj && typeof obj === "object") items = [obj];
      else throw new Error("Unsupported JSON structure. Expected an array, or an object with a 'topics' array.");
    } else {
      items = csvToObjects(t);
      if(!items.length) throw new Error("No data rows found in the CSV.");
    }
  } catch(err){
    report.invalid.push("Parse error: " + esc(err.message));
    return {report, newTopics, updates, linkIds};
  }
  report.total = items.length;
  const seen = new Set();
  const fallback = materialFallbackLevel(material);
  const existingIds = new Set(DB.topics.map(x=>x.id));
  const linkedNow = new Set(material ? (material.topics||[]) : []);
  items.forEach((item, i) => {
    const label = `topic #${i+1}${item && item.id ? ` (${item.id})` : ""}`;
    const errors = [];
    if(!item.id || !String(item.id).trim()) errors.push("missing required field 'id'");
    if(!item.title || !String(item.title).trim()) errors.push("missing required field 'title'");
    const itemLevel = String(item.level||"").trim();
    if(!itemLevel){
      if(fallback){ item.level = fallback; report.warnings.push(`${esc(label)}: missing 'level' — defaulted to ${fallback} from the material`); }
      else { errors.push("missing required field 'level'"); }
    } else if(!LEVELS.includes(itemLevel)){
      report.warnings.push(`${esc(label)}: level '${esc(itemLevel)}' is not one of A1–C2`);
    }
    if(!item.explanation) report.warnings.push(`${esc(label)}: missing 'explanation'`);
    if(!item.examples)     report.warnings.push(`${esc(label)}: no 'examples'`);
    if(errors.length){ report.invalid.push(`${esc(label)}: ${errors.join(", ")}`); return; }
    const id = String(item.id).trim();
    if(seen.has(id)){ report.duplicates.push(`${esc(label)}: duplicated within the file`); return; }
    seen.add(id);
    const topic = coerceTopic({...item, id});
    if(existingIds.has(id)){
      if(overwrite){ updates.push(topic); report.notes.push(`${esc(label)}: already exists — will be overwritten`); }
      else if(linkedNow.has(id)){ report.notes.push(`${esc(label)}: already exists and is already linked — skipped`); }
      else { linkIds.push(id); report.notes.push(`${esc(label)}: already exists — will be linked, content left unchanged`); }
    } else {
      newTopics.push(topic);
    }
  });
  report.validCount = newTopics.length + updates.length + linkIds.length;
  return {report, newTopics, updates, linkIds};
}

document.addEventListener("click", (e)=>{

    case "go": go(el.dataset.route); break;
    case "topic": go("topic", el.dataset.id); break;
    case "material": go("material", el.dataset.id); break;
    case "new-topic": go("topic-form", "new"); break;
    case "edit-topic": go("topic-form", el.dataset.id); break;
    case "new-material": go("material-form", "new"); break;
    case "edit-material": go("material-form", el.dataset.id); break;

      if(!modal) break;
      modal.editing = true;
      paintModal();

        const ta = document.getElementById("modal-input");
        if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      }, 0);
      break;
    case "modal-cancel": if(!modal) break; modal.editing = false; paintModal(); break;
    case "modal-save": {
      if(!modal) break;
      const t = findTopic(modal.topicId);
      if(!t) break;
      const ta = document.getElementById("modal-input");
      const val = ta ? ta.value : "";
      if(modal.type === "explanation"){ t.explanation = val; }
      else { t.examples = val.split("\n").map(s=>s.trim()).filter(Boolean); }
      save(); closeModal(); render();
      break;
    }

    case "save-topic": {
      const form = document.getElementById("topic-form");
      if(!form) break;
      const title = form.querySelector('[name="title"]').value.trim();
      if(!title){ alert("Title is required."); break; }
      const level = form.querySelector('[name="level"]').value;
      const idInput = form.querySelector('[name="id"]').value.trim();
      const explanation = form.querySelector('[name="explanation"]').value;
      const examples = form.querySelector('[name="examples"]').value
        .split("\n").map(s=>s.trim()).filter(Boolean);
      const editing = el.dataset.editing === "1";
      if(editing){
        const t = findTopic(view.id);
        if(!t) break;
        const newId = idInput || t.id;
        if(newId !== t.id){
          if(findTopic(newId)){ alert(`A topic with ID "${newId}" already exists.`); break; }
          DB.exercises.forEach(ex=>{ if(ex.topic_id===t.id) ex.topic_id = newId; });
          DB.materials.forEach(m=>{ if(m.topics) m.topics = m.topics.map(x=> x===t.id ? newId : x); });
          t.id = newId;
        }
        t.title = title; t.level = level; t.explanation = explanation; t.examples = examples;
        save(); go("topic", t.id);
      } else {
        const id = idInput || uniqueTopicId(title);
        if(findTopic(id)){ alert(`A topic with ID "${id}" already exists.`); break; }
        DB.topics.push({id, title, level, explanation, examples});
        save(); go("topic", id);
      }
      break;
    }

`id,topic_id,material_id,level,type,question,options,words,answer,explanation
ex-001,${topicId},${materialId},B1,multiple_choice,"I _____ this movie three times.","saw|have seen|had seen|see",,have seen,"Use the Present Perfect for experience without a finished past time."
ex-002,${topicId},${materialId},B1,fill_blank,She _____ (live) in London since 2015.,,,has lived,"'Since' + a point in time signals a situation continuing to the present."`;
      impState.text = csv;
      impState.format = "csv";
      impState.report = null; impState.valid = null;
      render();
      break;
    }

    case "exp-ex-json": exportExercisesJSON(); break;
    case "exp-ex-csv":  exportExercisesCSV(); break;
    case "exp-mat-json": exportMaterialsJSON(); break;
    case "exp-mat-csv":  exportMaterialsCSV(); break;
    case "exp-top-json": exportTopicsJSON(); break;
    case "exp-top-csv":  exportTopicsCSV(); break;
    case "exp-prog-json": exportProgressJSON(); break;
    case "exp-prog-csv":  exportProgressCSV(); break;
    case "exp-all": exportAll(); break;

    case "reset":
      if(confirm("Delete ALL your data — topics, materials, exercises and progress? This cannot be undone.")){
        localStorage.removeItem(LS_KEY);
        DB = emptyDB();
        save();
        impState = { text:"", format:"auto", createMissing:true, report:null, valid:null };
        matImport = null; modal = null;
        document.body.style.overflow = "";
        go("dashboard");
      }
      break;
  }
});

document.addEventListener("change", (e)=>{
  const id = e.target.id;
  if(id === "f-topic" || id === "f-level" || id === "f-type"){
    exFilters[id.slice(2)] = e.target.value;
    render(); return;
  }
  if(e.target.dataset && e.target.dataset.action === "match" && !ui.submitted){
    ui.matches[e.target.dataset.i] = e.target.value;
    return;
  }
  if(e.target.dataset && e.target.dataset.action === "link-topic"){
    const materialId = e.target.dataset.material;
    const topicId = e.target.dataset.topic;
    const m = findMaterial(materialId);
    if(!m) return;
    m.topics = m.topics || [];
    if(e.target.checked){
      if(!m.topics.includes(topicId)) m.topics.push(topicId);
    } else {
      m.topics = m.topics.filter(x=>x !== topicId);
    }
    save();
    document.querySelectorAll('[data-topic-count]').forEach(el=>{ el.textContent = m.topics.length; });
    return;
  }
});

document.addEventListener("input", (e)=>{
  if(e.target.id === "f-q"){
    exFilters.q = e.target.value;
    const val = e.target.value;
    render();
    const box = document.getElementById("f-q");
    if(box){ box.focus(); box.setSelectionRange(val.length, val.length); }
  }
});

document.addEventListener("change", (e)=>{
  const id = e.target.id;
  if(id === "imp-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      impState.text = reader.result;
      impState.format = /\.csv$/i.test(file.name) ? "csv" : "json";
      impState.report = null; impState.valid = null;
      render();
    };
    reader.readAsText(file);
  }
  if(id === "mi-file" && e.target.files && e.target.files[0]){
    if(!matImport) return;
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      matImport.text = reader.result;
      matImport.format = /\.csv$/i.test(file.name) ? "csv" : "json";
      matImport.report = null;
      matImport.newTopics = []; matImport.updates = []; matImport.linkIds = [];
      render();
    };
    reader.readAsText(file);
  }
});

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape" && modal){
    if(modal.editing){ modal.editing = false; paintModal(); }
    else closeModal();
  }
});

if(window.matchMedia){
  try{
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e)=>{
      let stored = null;
      try{ stored = localStorage.getItem(THEME_KEY); }catch(err){}
      if(stored !== "dark" && stored !== "light"){
        THEME = e.matches ? "dark" : "light";
        applyTheme();
      }
    });
  }catch(e){}
}

setInterval(()=>{
  if(document.visibilityState === "visible"){
    DB.studySeconds = (DB.studySeconds||0) + 15;
    save();
  }
}, 15000);

/* =========================================================
   15. BOOT
   ========================================================= */
applyTheme();
render();
</script>
