<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modules</title>
<style>
  :root{
    --paper:#f7f5f0;
    --ink:#141414;
    --muted:#8a8578;
    --rule:#ded9cf;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Inter,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 40px;
  }

  /* ---------- Home button ---------- */
  .home{
    position:fixed;
    top:26px;
    left:30px;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 14px 8px 12px;
    border:1px solid var(--rule);
    border-radius:100px;
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:color .25s ease,
               border-color .25s ease,
               background .25s ease,
               transform .25s ease;
  }

  .home svg{
    width:13px;
    height:13px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .3s cubic-bezier(.2,.8,.3,1);
  }

  .home:hover{
    color:var(--ink);
    border-color:var(--ink);
    background:rgba(20,20,20,.03);
    transform:translateY(-1px);
  }

  .home:hover svg{transform:translateX(-2px)}

  .home:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:3px;
  }

  .home:active{transform:translateY(0)}

  /* ---------- Index ---------- */
  .index{
    width:100%;
    max-width:820px;
    border-top:1px solid var(--rule);
  }

  .row{
    display:grid;
    grid-template-columns:52px 1fr auto 32px;
    align-items:center;
    gap:26px;
    padding:22px 0;
    border-bottom:1px solid var(--rule);
    text-decoration:none;
    color:inherit;
    position:relative;
    transition:padding-left .42s cubic-bezier(.2,.8,.3,1);
  }

  .row::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--ink);
    transform:scaleY(0);
    transform-origin:bottom;
    transition:transform .42s cubic-bezier(.2,.8,.3,1);
    z-index:0;
  }

  .row > *{
    position:relative;
    z-index:1;
    transition:color .3s ease;
  }

  .row:hover{padding-left:24px}
  .row:hover::before{transform:scaleY(1);transform-origin:top}

  .row:hover .num,
  .row:hover .name,
  .row:hover .desc,
  .row:hover .arrow{color:var(--paper)}

  .row:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:6px;
  }

  .num{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  .name{
    font-size:clamp(16px,2vw,20px);
    font-weight:500;
    letter-spacing:-.015em;
    line-height:1.2;
  }

  .desc{
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:right;
    white-space:nowrap;
  }

  .arrow{
    display:grid;
    place-items:center;
    color:var(--muted);
    transition:transform .42s cubic-bezier(.2,.8,.3,1),color .3s ease;
  }

  .row:hover .arrow{transform:translateX(6px)}

  .arrow svg{
    width:16px;
    height:16px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:760px){
    body{padding:80px 22px 40px;align-items:flex-start}

    .home{top:18px;left:18px;padding:7px 12px 7px 10px;font-size:10px}
    .home svg{width:12px;height:12px}

    .row{
      grid-template-columns:28px 1fr 26px;
      gap:14px;
      padding:18px 0;
    }

    .row:hover{padding-left:14px}

    .desc{display:none}

    .num{font-size:12px}
    .name{font-size:15px}
    .arrow svg{width:15px;height:15px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
