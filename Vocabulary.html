<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>30 Words a Day</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#f4f5f7; --surface:#fff; --line:#e6e8ec;
    --ink:#14161c; --muted:#6b7280; --soft:#9aa0ad;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --radius:12px;
  }
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:1120px;margin:0 auto;padding:14px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:16px}
  .brand em{font-style:normal;color:var(--soft);font-weight:500}
  .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
  .streak{background:#fff7ed;color:#c2410c;font-weight:700;padding:4px 10px;border-radius:999px}
  .nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
    padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;
    display:flex;gap:6px;align-items:center;transition:.15s
  }
  .nav button:hover{background:#e9eaee;color:var(--ink)}
  .nav button.on{background:var(--ink);color:#fff}
  .nav .badge{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;
              padding:0 6px;min-width:16px;text-align:center;line-height:16px;font-weight:700}
  .nav button.on .badge{background:#fff;color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:700}
  .grid{display:grid;gap:10px}
  .g-2{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-dash{grid-template-columns:1.4fr 1fr;grid-template-areas:
    "hero side"
    "items items"}
  @media(max-width:780px){
    .g-4{grid-template-columns:repeat(2,1fr)}
    .g-3{grid-template-columns:repeat(2,1fr)}
    .g-dash{grid-template-columns:1fr;grid-template-areas:"hero" "side" "items"}
  }
  @media(max-width:480px){
    .g-2{grid-template-columns:1fr}
  }
  .hero{grid-area:hero}
  .side{grid-area:side;display:grid;gap:10px;align-content:start}
  .items{grid-area:items}
  /* Multi-column list for the Today's items card */
  .items-cols{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
    column-gap:28px;
    row-gap:0;
  }
  @media(max-width:740px){ .items-cols{grid-template-columns:1fr; column-gap:0} }
  .muted{color:var(--muted)}
  .tiny{font-size:11.5px}
  .row{display:flex;align-items:center;gap:8px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wrap{display:flex;flex-wrap:wrap;gap:6px}
  .num{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .num small{font-size:15px;color:#c8ccd4;font-weight:700}
  .bar{height:7px;background:#eef0f3;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .bar.good>i{background:var(--good)}
  .stat{background:#fafbfc;border:1px solid #eff1f4;border-radius:10px;padding:9px 11px}
  .stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .stat .k{font-size:10.5px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;
       font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{background:#f3f4f7}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:#4338ca}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#eceef2;color:var(--ink)}
  .btn.danger{color:#b91c1c;border-color:#fecaca}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.wide{width:100%;justify-content:center;text-align:center}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;
        font-size:10.5px;font-weight:700;background:#f1f2f5;color:#5b6270;letter-spacing:.01em}
  .pill.collocation{background:#eef2ff;color:#4338ca}
  .pill.phrasal{background:#e0f2fe;color:#0369a1}
  .pill.chunk{background:#fef3c7;color:#b45309}
  .pill.vocab{background:#d1fae5;color:#047857}
  .pill.new{background:#f1f2f5;color:#6b7280}
  .pill.studied{background:#e0e7ff;color:#3730a3}
  .pill.practicing{background:#fef3c7;color:#b45309}
  .pill.active{background:#d1fae5;color:#047857}
  .pill.mastered{background:#ede9fe;color:#6d28d9}
  /* Compact item rows */
  .item{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #f2f3f6;cursor:pointer}
  .item:last-child{border-bottom:0}
  .item:hover{background:#fafbfc}
  .item.sel{background:var(--accent-soft)}
  .item .t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .item .t small{display:block;font-weight:400;color:var(--soft);font-size:11px;line-height:1.25;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .cbx{width:18px;height:18px;border:1.5px solid #d1d5db;border-radius:5px;display:flex;align-items:center;
       justify-content:center;font-size:11px;font-weight:800;color:#fff;background:#fff;flex-shrink:0}
  .cbx.on{background:var(--accent);border-color:var(--accent)}
  .inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;
       background:#fff;color:var(--ink);outline:none;transition:.15s;resize:vertical}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .lbl{display:block;font-size:10.5px;font-weight:700;color:var(--soft);letter-spacing:.05em;
       text-transform:uppercase;margin:0 0 4px}
  .field{margin-bottom:10px}
  .chip{border:1px solid var(--line);background:#fff;padding:5px 11px;border-radius:999px;font:inherit;
        font-size:12px;font-weight:600;cursor:pointer;color:#4b5563;transition:.15s}
  .chip:hover{background:#f3f4f7}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .modal{position:fixed;inset:0;display:none;z-index:100}
  .modal.on{display:block}
  .modal .bg{position:absolute;inset:0;background:rgba(15,17,22,.45);backdrop-filter:blur(2px)}
  .modal .panel{position:relative;background:#fff;max-width:600px;margin:30px auto;border-radius:14px;
                max-height:calc(100vh - 60px);overflow-y:auto;padding:18px;
                box-shadow:0 24px 60px rgba(0,0,0,.25)}
  @media(max-width:600px){.modal .panel{margin:0;border-radius:0;max-height:100vh;height:100vh}}
  .bigq{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
       padding:11px 13px;border-radius:9px;font:inherit;font-size:13.5px;cursor:pointer;margin-bottom:6px;
       transition:.15s;font-weight:500}
  .opt:hover{background:#f7f8fa;border-color:#c9ced8}
  .fb{padding:10px 13px;border-radius:9px;font-size:13.5px;margin-top:8px}
  .fb.ok{background:#ecfdf5;color:#047857}
  .fb.no{background:#fef2f2;color:#b91c1c}
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  @media(max-width:520px){.mem{grid-template-columns:repeat(3,1fr);gap:5px}}
  .mem .c{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
          padding:6px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;
          background:var(--ink);color:#fff;border:2px solid transparent;transition:.18s;
          word-break:break-word;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
  .mem .c:hover{transform:translateY(-1px)}
  .mem .c.up{background:var(--accent-soft);color:#3730a3;border-color:#c7d2fe;transform:none;cursor:default}
  .mem .c.ok{background:#ecfdf5;color:#047857;border-color:var(--good);opacity:.7;transform:none;cursor:default}
  .mem .c .f{font-size:20.5px;line-height:1.2;max-height:100%;overflow:hidden;
             display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
  .mem .c .q{font-size:20px;opacity:.45;font-weight:800}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font-size:10.5px;font-weight:700;color:var(--soft);text-align:center;padding:3px 0}
  .cal .d{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;
          justify-content:center;font-size:11.5px;font-weight:600;color:var(--muted);background:#f4f5f8}
  .cal .d.today{outline:2px solid var(--ink);outline-offset:1px}
  .cal .d.l1{background:#e0e7ff;color:#3730a3}
  .cal .d.l2{background:#c7d2fe;color:#312e81}
  .cal .d.l3{background:#818cf8;color:#fff}
  .cal .d.l4{background:var(--accent);color:#fff}
  .cal .d.x{background:transparent}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);
     padding:6px 5px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:7px 5px;border-bottom:1px solid #f2f3f6}
  th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:22px 0;text-align:center;color:var(--soft);font-size:12.5px}
  .sep{height:1px;background:#f2f3f6;margin:10px 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;
         transition:.22s;pointer-events:none}
  .toast.on{opacity:1;bottom:30px}
  mark{background:#fde68a;border-radius:3px;padding:0 2px;color:#78350f;font-weight:600}
  .selbar{background:var(--accent-soft);border:1px solid #c7d2fe;border-radius:9px;padding:8px 12px;margin-top:10px}
  .csv-pv{max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fafbfc}
  .csv-pv table{font-size:11.5px}
  .csv-pv th,.csv-pv td{padding:4px 6px}
</style>
</head>
<body>

<div class="shell">
  <div class="top">
    <div class="brand">30 words <em>a day</em></div>
    <div class="meta">
      <span id="todayLabel"></span>
      <span class="streak">🔥 <b id="streakNum">0</b></span>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <main id="app"></main>
</div>

<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONSTANTS
   ============================================================ */
const CATS = ['collocation','phrasal','chunk','vocab'];
const CAT_LABEL = {collocation:'Collocation',phrasal:'Phrasal Verb',chunk:'Chunk',vocab:'Vocabulary'};
const CAT_SHORT = {collocation:'Colloc',phrasal:'Phrasal',chunk:'Chunk',vocab:'Vocab'};
const STATUS_LABEL = {new:'New',studied:'Studying',practicing:'Practicing',active:'Active',mastered:'Mastered'};
const INTERVALS = [0,1,3,7,14,30,60];
const SCHEDULE  = ['Day 0','Day 1','Day 3','Day 7','Day 14','Day 30','Mastered'];
const WRITE_REQ = {collocation:2,phrasal:1,chunk:1,vocab:2};
const LS_KEY = 'words30.v2';
const MEM_PAIRS = 6;

/* ============================================================
   HELPERS
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function iso(d=new Date()){ const t=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return t.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function fmtDate(s){ return parseISO(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtLong(s){ return parseISO(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800);
}

function mapCategory(raw){
  const s = String(raw||'').trim().toLowerCase().replace(/[_-]+/g,' ');
  if(!s) return '';
  if(['collocation','collocations','colloc','col'].includes(s)) return 'collocation';
  if(['phrasal verb','phrasal verbs','phrasal','pv','phrasalverb'].includes(s)) return 'phrasal';
  if(['chunk','chunks'].includes(s)) return 'chunk';
  if(['vocabulary','vocab','word','words'].includes(s)) return 'vocab';
  return '';
}

/* ============================================================
   CSV
   ============================================================ */
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows=[]; let row=[], f='', q=false, i=0;
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c === '"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue; }
      f+=c;i++;continue;
    }
    if(c === '"'){q=true;i++;continue;}
    if(c === ','){row.push(f);f='';i++;continue;}
    if(c === '\r'){i++;continue;}
    if(c === '\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=c;i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r => r.some(cell => String(cell).trim().length));
}

function csvToItems(rows){
  if(!rows.length) return { items:[], skipped:0, headerUsed:false, uncategorized:0 };
  const header = rows[0].map(h=>String(h||'').trim().toLowerCase());
  const aliases = {
    term:['term','word','expression','phrase','item','vocabulary','entry'],
    meaning:['meaning','definition','translation','explanation','sense','gloss'],
    example:['example sentence','example','sentence','sample sentence','sample','usage','context'],
    category:['category','type','kind','class','group','cat']
  };
  const find = k => header.findIndex(h => aliases[k].includes(h));
  let ti=find('term'), mi=find('meaning'), ei=find('example'), ci=find('category');
  const headerUsed = ti!==-1 || mi!==-1 || ei!==-1 || ci!==-1;
  if(!headerUsed){ti=0;mi=1;ei=2;ci=3;}
  if(ti===-1)ti=0; if(mi===-1)mi=1; if(ei===-1)ei=2;
  const body = headerUsed ? rows.slice(1) : rows;
  const items=[]; let skipped=0, uncategorized=0;
  for(const r of body){
    const term = String(r[ti]||'').trim();
    if(!term){skipped++;continue;}
    const rawCat = ci>=0 ? String(r[ci]||'').trim() : '';
    const category = mapCategory(rawCat);
    if(!category) uncategorized++;
    items.push({
      term,
      meaning: mi>=0 ? String(r[mi]||'').trim() : '',
      example: ei>=0 ? String(r[ei]||'').trim() : '',
      category,
      rawCategory: rawCat
    });
  }
  return { items, skipped, headerUsed, uncategorized };
}

/* ============================================================
   STATE
   ============================================================ */
let S=null, view='today', ui={}, modalId=null;

function defaultSettings(){ return { target:30, dist:{collocation:10,phrasal:5,chunk:5,vocab:10} }; }
function mk(term,category,meaning,example,source,extra){
  return Object.assign({
    id:uid(), term, category, meaning, example,
    personal:'', source:source||'', difficulty:2, notes:'', pronunciation:'', related:'',
    inbox:false, dateAdded:iso(), challengeDate:null,
    studiedAt:null, practicedAt:null, activeAt:null, masteredAt:null,
    reviews:[], stage:0, nextReview:iso()
  }, extra||{});
}
function emptyState(){ return { settings:defaultSettings(), items:[], days:{} }; }
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){const p=JSON.parse(raw); if(p && Array.isArray(p.items)) return p;}
  }catch(e){}
  return emptyState();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ============================================================
   DERIVED
   ============================================================ */
function dayOf(d){ return S.days[d] || {target:S.settings.target, dist:{...S.settings.dist}, writing:'', writeSel:[]}; }
function ensureDay(d){
  if(!S.days[d]) S.days[d] = {target:S.settings.target, dist:{...S.settings.dist}, writing:'', writeSel:[]};
  return S.days[d];
}
function statusOf(it){
  if(it.masteredAt || it.stage>=6) return 'mastered';
  if(it.stage>=3 || it.activeAt)  return 'active';
  if(it.practicedAt)              return 'practicing';
  if(it.studiedAt)                return 'studied';
  return 'new';
}
function dueItems(){ const T=iso(); return S.items.filter(i=>!i.inbox && i.nextReview<=T); }
function inboxItems(){ return S.items.filter(i=>i.inbox); }
function todayChallenge(){ const T=iso(); return S.items.filter(i=>i.challengeDate===T); }
function activeCount(){ return S.items.filter(i=>['active','mastered'].includes(statusOf(i))).length; }
function masteredCount(){ return S.items.filter(i=>statusOf(i)==='mastered').length; }

function dayStats(d){
  const I=S.items;
  return {
    collected: I.filter(i=>i.dateAdded===d).length,
    studied:   I.filter(i=>i.studiedAt===d).length,
    practiced: I.filter(i=>i.practicedAt===d).length,
    active:    I.filter(i=>i.activeAt===d).length,
    mastered:  I.filter(i=>i.masteredAt===d).length,
    target:    dayOf(d).target
  };
}
function dayActive(d){
  return S.items.some(i=>i.dateAdded===d||i.studiedAt===d||i.practicedAt===d||i.activeAt===d);
}
function streak(){
  let n=0, d=iso();
  if(!dayActive(d)) d=addDays(d,-1);
  let g=0;
  while(dayActive(d) && g++<400){ n++; d=addDays(d,-1); }
  return n;
}

/* ============================================================
   SELECTION
   ============================================================ */
function clearSelection(){ ui.selectMode=false; ui.selected=new Set(); }
function filteredLibrary(){
  ui.lib = ui.lib || {cat:'all',status:'all',q:''};
  let list = S.items.filter(i=>!i.inbox);
  if(ui.lib.cat!=='all')    list = list.filter(i=>i.category===ui.lib.cat);
  if(ui.lib.status!=='all') list = list.filter(i=>statusOf(i)===ui.lib.status);
  if(ui.lib.q){
    const q = ui.lib.q.toLowerCase();
    list = list.filter(i=>(i.term+' '+i.meaning+' '+i.example).toLowerCase().includes(q));
  }
  return list.slice().sort((a,b)=> b.dateAdded.localeCompare(a.dateAdded) || a.term.localeCompare(b.term));
}
function deleteSelected(){
  const ids=[...ui.selected];
  if(!ids.length){ toast('Nothing selected'); return; }
  if(!confirm(`Delete ${ids.length} item${ids.length===1?'':'s'}? This cannot be undone.`)) return;
  const set = new Set(ids);
  S.items = S.items.filter(i=>!set.has(i.id));
  Object.values(S.days).forEach(d=>{
    if(Array.isArray(d.writeSel)) d.writeSel = d.writeSel.filter(id=>!set.has(id));
  });
  if(modalId && set.has(modalId)) modalId=null;
  clearSelection(); save(); render();
  toast(`Deleted ${ids.length} item${ids.length===1?'':'s'}`);
}

/* ============================================================
   MUTATIONS
   ============================================================ */
function markStudied(it){
  const T=iso();
  if(!it.studiedAt) it.studiedAt = T;
  if(it.inbox) it.inbox = false;
  save();
}
function markPracticed(it){
  const T=iso();
  if(!it.practicedAt) it.practicedAt = T;
  if(!it.studiedAt)   it.studiedAt   = T;
  save();
}
function rate(it, rating){
  const T = iso();
  let s = it.stage;
  if(rating==='again')      s = 0;
  else if(rating==='hard')  s = Math.max(0, s);
  else if(rating==='good')  s = s + 1;
  else if(rating==='easy')  s = s + 2;
  s = Math.min(s, 6);
  it.stage = s;
  it.nextReview = addDays(T, INTERVALS[s]);
  it.reviews.push({date:T, rating});
  if(!it.studiedAt) it.studiedAt = T;
  if(!it.practicedAt) it.practicedAt = T;
  if(s>=3 && !it.activeAt) it.activeAt = T;
  if(s>=6 && !it.masteredAt) it.masteredAt = T;
  save();
}

function buildFromInbox(){
  const T = iso();
  const day = ensureDay(T);
  const cur = todayChallenge();
  const have={}; CATS.forEach(c=>have[c]=0);
  cur.forEach(i=>{ if(have[i.category]!==undefined) have[i.category]++; });
  let added=0;
  CATS.forEach(c=>{
    let need = day.dist[c] - have[c];
    if(need<=0) return;
    let pool = S.items.filter(i=>i.inbox && i.category===c);
    if(pool.length<need) pool = pool.concat(S.items.filter(i=>i.inbox && !i.category));
    for(const it of pool){
      if(need<=0) break;
      it.inbox = false;
      it.category = c;
      it.challengeDate = T;
      it.dateAdded = T;
      it.nextReview = T;
      need--; added++;
    }
  });
  save();
  toast(added ? `Added ${added} item${added>1?'s':''} to today` : 'No matching items in inbox');
  render();
}

   ============================================================ */
function exportData(){
  const data = JSON.stringify(S, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'words30-'+iso()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Exported');
}
function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change', ev=>{
    const file = ev.target.files && ev.target.files[0];
    document.body.removeChild(inp);
    if(!file) return;
    const rd = new FileReader();
    rd.onload = re=>{
      try{
        const p = JSON.parse(re.target.result);
        if(!p || !Array.isArray(p.items)) throw new Error('bad');
        const items = p.items.map(raw=>mk(
          String(raw.term||'').trim(),
          CATS.includes(raw.category) ? raw.category : (raw.category||''),
          raw.meaning||'', raw.example||'', raw.source||'',
          {
            id: raw.id||uid(),
            personal: raw.personal||'', difficulty: Number(raw.difficulty)||2,
            notes: raw.notes||'', pronunciation: raw.pronunciation||'', related: raw.related||'',
            inbox: !!raw.inbox, dateAdded: raw.dateAdded||iso(),
            challengeDate: raw.challengeDate||null,
            studiedAt: raw.studiedAt||null, practicedAt: raw.practicedAt||null,
            activeAt: raw.activeAt||null, masteredAt: raw.masteredAt||null,
            reviews: Array.isArray(raw.reviews)?raw.reviews:[],
            stage: Number(raw.stage)||0, nextReview: raw.nextReview||iso()
          }
        ));
        const settings = (p.settings && typeof p.settings==='object')
          ? {target:Number(p.settings.target)||30,
             dist:Object.assign({collocation:10,phrasal:5,chunk:5,vocab:10},
                    (p.settings.dist && typeof p.settings.dist==='object') ? p.settings.dist : {})}
          : defaultSettings();
        const days = (p.days && typeof p.days==='object') ? p.days : {};
        const apply = ()=>{
          S = { settings, items, days };
          save();
          ui = {lib:{cat:'all',status:'all',q:''}, addCat:'', selectMode:false, selected:new Set()};
          nav('today');
          toast(`Imported ${items.length} item${items.length===1?'':'s'}`);
        };
        if(S.items.length){
          if(confirm(`Importing will replace your current ${S.items.length} item(s). Continue?`)) apply();
        } else apply();
      }catch(err){ console.error(err); toast('Import failed'); }
    };
    rd.readAsText(file);
  });
  inp.click();
}

/* ============================================================
   CSV UPLOAD
   ============================================================ */
function openCSVUpload(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.csv,text/csv'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change', ev=>{
    const file = ev.target.files && ev.target.files[0];
    document.body.removeChild(inp);
    if(!file) return;
    const rd = new FileReader();
    rd.onload = re=>{
      try{
        const rows = parseCSV(re.target.result);
        const parsed = csvToItems(rows);
        if(!parsed.items.length){ toast('No usable rows in CSV'); return; }
        ui.csvDraft = {
          fileName: file.name,
          items: parsed.items,
          skipped: parsed.skipped,
          headerUsed: parsed.headerUsed,
          uncategorized: parsed.uncategorized
        };
        render();
      }catch(err){ console.error(err); toast('Could not parse CSV'); }
    };
    rd.readAsText(file);
  });
  inp.click();
}
function commitCSVImport(){
  const d = ui.csvDraft;
  if(!d || !d.items.length){ toast('Nothing to import'); return; }
  const T = iso();
  let added=0, unc=0;
  for(const it of d.items){
    S.items.push(mk(it.term, it.category||'', it.meaning, it.example, '', {
      inbox:true, dateAdded:T, nextReview:T
    }));
    if(!it.category) unc++;
    added++;
  }
  save();
  ui.csvDraft = null;
  toast(unc
    ? `Added ${added} item${added>1?'s':''} · ${unc} without category`
    : `Added ${added} item${added>1?'s':''} to inbox`);
  nav('inbox');
}

/* ---------- Memory game ---------- */
function viewMemory(){
  const p = ui.practice;
  if(p.pairsFound === p.totalPairs){
    return `<div class="card" style="text-align:center;padding:32px 14px">
      <div style="font-size:30px">🎉</div>
      <h2 style="margin-top:6px;text-transform:none;letter-spacing:0;color:var(--ink);font-size:16px">All matched!</h2>
      <div class="muted tiny">${p.moves} move${p.moves===1?'':'s'} · ${p.totalPairs} pair${p.totalPairs===1?'':'s'}</div>
      <div class="wrap" style="margin-top:12px;justify-content:center">
        <button class="btn pri" data-act="startPrac" data-mode="memory">New game</button>
        <button class="btn" data-act="pracStop">Back to modes</button>
      </div>
    </div>`;
  }
  const grid = p.cards.map((c,i)=>{
    const up = c.flipped || c.matched;
    const cls = c.matched ? 'ok' : (c.flipped ? 'up' : '');
    const face = up ? `<span class="f">${esc(c.text)}</span>` : `<span class="q">?</span>`;
    return `<div class="c ${cls}" data-act="memFlip" data-idx="${i}">${face}</div>`;
  }).join('');
  return `<div class="card">
    <div class="between" style="margin-bottom:10px">
      <div class="tiny muted">Moves <b>${p.moves}</b> · Pairs <b>${p.pairsFound}/${p.totalPairs}</b></div>
      <button class="btn ghost sm" data-act="pracStop">End</button>
    </div>
    <div class="mem">${grid}</div>
    <div class="tiny muted" style="margin-top:10px;text-align:center">Match each term with its meaning.</div>
  </div>`;
}

function startMemoryGame(){
  const T = iso();
  const rank = i => (i.challengeDate===T?0:2) + (i.nextReview<=T?0:1);
  let pool = S.items.filter(i=>!i.inbox && i.meaning);
  pool.sort((a,b)=> rank(a)-rank(b) || a.stage-b.stage);
  pool = pool.slice(0, MEM_PAIRS);
  if(pool.length < 2){ toast('Need at least 2 items with meanings'); return; }
  const cards = [];
  pool.forEach(it=>{
    cards.push({itemId: it.id, type:'term',    text: it.term,    flipped:false, matched:false});
    cards.push({itemId: it.id, type:'meaning', text: it.meaning, flipped:false, matched:false});
  });
  shuffle(cards);
  ui.practice = {mode:'memory', cards, flipped:[], locked:false, moves:0, pairsFound:0, totalPairs:pool.length};
  render();
}

function startPractice(mode){
  if(mode==='memory'){ startMemoryGame(); return; }
  const T = iso();
  const rank = i => (i.challengeDate===T?0:2) + (i.nextReview<=T?0:1);
  let pool = S.items.filter(i=>!i.inbox && i.meaning);
  pool.sort((a,b)=> rank(a)-rank(b) || a.stage-b.stage);
  pool = pool.slice(0,10);
  if(!pool.length){ toast('Add items with meanings first'); return; }
  ui.practice = {mode, q:pool.map(i=>i.id), idx:0, correct:0, fb:null, opts:null};
  makeQ();
  render();
}
function makeQ(){
  const p = ui.practice; if(!p) return;
  const it = S.items.find(x=>x.id===p.q[p.idx]);
  p.fb=null;
  if(!it) return;
  if(p.mode==='recognition'){
    const others = shuffle(S.items.filter(x=>x.id!==it.id && x.meaning && x.meaning!==it.meaning).map(x=>x.meaning));
    p.opts = shuffle([it.meaning, ...others.slice(0,3)]);
  } else p.opts = null;
}
function pracAnswer(given){
  const p = ui.practice;
  const it = S.items.find(x=>x.id===p.q[p.idx]);
  const ok = norm(given) === norm(it.term);
  if(ok) p.correct++;
  markPracticed(it);
  p.fb = {ok, msg: ok ? `✓ Correct — <b>${esc(it.term)}</b>` : `✗ Answer: <b>${esc(it.term)}</b>`};
  render();
}

function bindWrite(){
  const ta = $('#wtext');
  if(ta){
    ta.addEventListener('input', ()=>{
      ensureDay(iso()).writing = ta.value;
      save();
      updateWritePreview();
    });
    setTimeout(()=>ta.focus(), 30);
  }
  updateWritePreview();
}

function updateWritePreview(){
  const T = iso();
  const day = dayOf(T);
  const text = day.writing || '';
  const sel = (day.writeSel||[]).map(id=>S.items.find(i=>i.id===id)).filter(Boolean);

  const counts = {}; CATS.forEach(c=>counts[c]=0);
  sel.forEach(it=>{
    if(text.toLowerCase().includes(it.term.toLowerCase()) && counts[it.category]!==undefined) counts[it.category]++;
  });
  const el = $('#wcheck');
  if(el){
    el.innerHTML = Object.entries(WRITE_REQ).map(([c,n])=>{
      const have = counts[c], ok = have>=n;
      return `<div class="between" style="padding:3px 0;font-size:12.5px">
        <span><span class="pill ${c}">${CAT_LABEL[c]}</span></span>
        <b style="color:${ok?'#047857':'#9aa0ad'}">${ok?'✓':'·'} ${have}/${n}</b>
      </div>`;
    }).join('');
  }
  const pv = $('#wpreview');
  if(pv){
    if(!text.trim()){ pv.innerHTML = '<span class="muted">Highlighted preview appears here.</span>'; return; }
    let out = esc(text);
    sel.forEach(it=>{
      const re = new RegExp('('+escRe(esc(it.term))+')','gi');
      out = out.replace(re,'<mark>$1</mark>');
    });
    pv.innerHTML = out;
  }
}

/* ============================================================
   STATS
   ============================================================ */
function viewStats(){
  const T = iso();
  const weekStart = addDays(T,-6);
  const monthStart = T.slice(0,8)+'01';
  const all = S.items.filter(i=>!i.inbox);

  const total = all.length;
  const thisWeek = all.filter(i=>i.dateAdded>=weekStart).length;
  const thisMonth = all.filter(i=>i.dateAdded>=monthStart).length;
  const activeV = activeCount();
  const masteredV = masteredCount();
  const due = dueItems().length;
  const inboxN = inboxItems().length;

  let done=0;
  for(let i=0;i<14;i++){
    const d = addDays(T,-i);
    if(dayStats(d).collected >= dayOf(d).target) done++;
  }
  const rate = Math.round(done/14*100);

  const byCat={}; CATS.forEach(c=>byCat[c]=0);
  all.forEach(i=>{ if(byCat[i.category]!==undefined) byCat[i.category]++; });
  const maxCat = Math.max(1, ...Object.values(byCat));

  const now = parseISO(T);
  const y = now.getFullYear(), m = now.getMonth();
  const lead = (new Date(y,m,1).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  let cal = ['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<lead;i++) cal += `<div class="d x"></div>`;
  for(let d=1;d<=dim;d++){
    const ds = iso(new Date(y,m,d));
    const s = dayStats(ds);
    const ratio = s.collected/(s.target||30);
    const lvl = ratio>=1?4 : ratio>=.66?3 : ratio>=.33?2 : ratio>0?1 : 0;
    cal += `<div class="d ${lvl?'l'+lvl:''} ${ds===T?'today':''}" title="${fmtDate(ds)} · ${s.collected}/${s.target}">
      ${d}${s.collected?`<span style="font-size:9px;opacity:.8">${s.collected}</span>`:''}
    </div>`;
  }

  const rows = [];
  for(let i=0;i<14;i++){
    const d = addDays(T,-i);
    const s = dayStats(d);
    rows.push(`<tr>
      <td>${fmtDate(d)}${i===0?' <span class="tiny muted">today</span>':''}</td>
      <td class="n">${s.target}</td>
      <td class="n">${s.collected}</td>
      <td class="n">${s.studied}</td>
      <td class="n">${s.practiced}</td>
      <td class="n">${s.active}</td>
      <td class="n">${s.mastered}</td>
    </tr>`);
  }

  return `
  <div class="grid g-2" style="margin-bottom:10px">
    <div class="card">
      <h2>Overview</h2>
      <div class="grid g-4">
        ${stat('Total', total)}
        ${stat('Week', thisWeek)}
        ${stat('Month', thisMonth)}
        ${stat('Streak', streak())}
      </div>
      <div class="grid g-4" style="margin-top:8px">
        ${stat('Active', activeV)}
        ${stat('Mastered', masteredV)}
        ${stat('Due', due)}
        ${stat('Inbox', inboxN)}
      </div>
      <div style="margin-top:10px">
        <div class="between tiny"><span class="muted">Completion rate (14 days)</span><b>${rate}%</b></div>
        <div class="bar" style="margin-top:4px"><i style="width:${rate}%"></i></div>
      </div>
    </div>

    <div class="card">
      <h2>${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2>
      <div class="cal">${cal}</div>
    </div>

    <div class="card">
      <h2>By category</h2>
      ${CATS.map(c=>`
        <div style="margin-bottom:8px">
          <div class="between tiny"><span><span class="pill ${c}">${CAT_LABEL[c]}</span></span><b>${byCat[c]}</b></div>
          <div class="bar" style="margin-top:4px;height:5px"><i style="width:${Math.round(byCat[c]/maxCat*100)}%"></i></div>
        </div>`).join('')}
    </div>

    <div class="card">
      <h2>Data</h2>
      <div class="tiny muted">Stored locally · ${S.items.length} item${S.items.length===1?'':'s'}</div>
      <div class="wrap" style="margin-top:10px">
        <button class="btn" data-act="exportData">⭳ Export JSON</button>
        <button class="btn" data-act="importData">⭱ Import JSON</button>
        <button class="btn" data-act="csvUpload">⭱ Upload CSV</button>
        <button class="btn danger" data-act="resetData">Reset</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Last 14 days</h2>
    <table>
      <thead><tr>
        <th>Date</th><th class="n">Target</th><th class="n">Collected</th><th class="n">Studied</th>
        <th class="n">Practiced</th><th class="n">Active</th><th class="n">Mastered</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
  </div>`;
}

    </div>

    <div class="wrap" style="margin-top:12px">
      ${it.inbox?`<button class="btn pri" data-act="processInbox">Process → today</button>`:''}
      ${!it.studiedAt?`<button class="btn" data-act="markStudied">Mark studied</button>`:''}
      <button class="btn" data-act="openPrac">Practice</button>
      <button class="btn danger" data-act="deleteItem">Delete</button>
    </div>
  </div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e=>{
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ e.preventDefault(); nav(navEl.dataset.nav); return; }

  const toggle = e.target.closest('[data-toggle]');
  if(toggle){
    const id = toggle.dataset.toggle;
    ui.selected.has(id) ? ui.selected.delete(id) : ui.selected.add(id);
    render(); return;
  }

  const openEl = e.target.closest('[data-open]');
  if(openEl){ openItem(openEl.dataset.open); return; }

  const act = e.target.closest('[data-act]');
  if(act){ handleAct(act); return; }

  const incat = e.target.closest('[data-incat]');
  if(incat){
    const [id,c] = incat.dataset.incat.split('|');
    const it = S.items.find(i=>i.id===id);
    if(it){ it.category = it.category===c ? '' : c; save(); render(); }
    return;
  }
  const mcat = e.target.closest('[data-mcat]');
  if(mcat){
    const it = S.items.find(i=>i.id===modalId);
    if(it){ it.category = mcat.dataset.mcat; save(); renderModal(); render(); }
    return;
  }
  const libcat = e.target.closest('[data-libcat]');
  if(libcat){ ui.lib.cat = libcat.dataset.libcat; render(); return; }
  const libst = e.target.closest('[data-libst]');
  if(libst){ ui.lib.status = libst.dataset.libst; render(); return; }
  const wsel = e.target.closest('[data-wsel]');
  if(wsel){
    const day = ensureDay(iso());
    const id = wsel.dataset.wsel;
    const set = new Set(day.writeSel||[]);
    set.has(id) ? set.delete(id) : set.add(id);
    day.writeSel = [...set];
    save(); render(); return;
  }
  const catBtn = e.target.closest('[data-cat]');
  if(catBtn){
    ui.addCat = catBtn.dataset.cat;
    $$('#catPick .chip').forEach(c=>c.classList.toggle('on', c.dataset.cat===ui.addCat));
    return;
  }
  const pick = e.target.closest('[data-pick]');
  if(pick){
    const p = ui.practice;
    const it = S.items.find(x=>x.id===p.q[p.idx]);
    const ok = pick.dataset.pick === it.meaning;
    if(ok) p.correct++;
    markPracticed(it);
    p.fb = {ok, msg: ok ? `✓ Correct — <b>${esc(it.term)}</b> means "${esc(it.meaning)}"`
                        : `✗ <b>${esc(it.term)}</b> means "${esc(it.meaning)}"`};
    render(); return;
  }
});

function handleAct(el){
  const a = el.dataset.act;
  const T = iso();
  switch(a){
    case 'closeModal': closeModal(); break;

    case 'saveAdd':      doAdd(false); break;
    case 'saveAddOpen':  doAdd(true);  break;

    case 'quickAdd': {
      const inp = $('#quickTerm');
      const v = inp ? inp.value.trim() : '';
      if(!v){ toast('Type something'); return; }
      S.items.push(mk(v, '', '', '', '', {inbox:true, dateAdded:T, nextReview:T}));
      save();
      if(inp) inp.value='';
      toast('Saved · '+v);
      render();
      const again = $('#quickTerm'); if(again) again.focus();
      break;
    }

    case 'smartBuild': buildFromInbox(); break;

    case 'editDist': {
      const day = ensureDay(T);
      const html = prompt(
        'Distribution — 4 numbers, comma separated\n(collocations, phrasal, chunks, vocab)',
        CATS.map(c=>day.dist[c]).join(', ')
      );
      if(!html) return;
      const nums = html.split(',').map(s=>parseInt(s.trim(),10));
      if(nums.length!==4 || nums.some(n=>isNaN(n)||n<0)){ toast('Enter 4 numbers'); return; }
      CATS.forEach((c,i)=> day.dist[c]=nums[i]);
      day.target = nums.reduce((x,y)=>x+y,0);
      S.settings.dist = {...day.dist};
      S.settings.target = day.target;
      save(); render();
      toast('Target: '+day.target);
      break;
    }

    case 'markStudied': {
      const it = S.items.find(i=>i.id===modalId);
      if(it){ markStudied(it); renderModal(); render(); toast('Studying'); }
      break;
    }

    case 'processInbox': {
      const it = S.items.find(i=>i.id===modalId);
      if(it){
        if(!it.category){ toast('Pick a category'); return; }
        it.inbox = false;
        it.challengeDate = T;
        it.dateAdded = T;
        it.nextReview = T;
        save(); closeModal(); render();
        toast('Added to today');
      }
      break;
    }

    case 'openPrac': {
      closeModal();
      nav('practice');
      startPractice('recognition');
      break;
    }

    case 'deleteItem': {
      const it = S.items.find(i=>i.id===modalId);
      if(it && confirm('Delete "'+it.term+'"?')){
        const id = it.id;
        S.items = S.items.filter(x=>x.id!==id);
        Object.values(S.days).forEach(d=>{
          if(Array.isArray(d.writeSel)) d.writeSel = d.writeSel.filter(x=>x!==id);
        });
        save(); closeModal(); render();
      }
      break;
    }

    case 'enterSelect':
      ui.selectMode = true; ui.selected = new Set(); render();
      break;
    case 'exitSelect':
      clearSelection(); render();
      break;
    case 'selectAll': {
      const visible = (view==='library') ? filteredLibrary() : inboxItems();
      ui.selected = new Set(visible.map(i=>i.id));
      render();
      break;
    }
    case 'deselectAll': ui.selected = new Set(); render(); break;
    case 'deleteSelected': deleteSelected(); break;

    case 'startPrac': startPractice(el.dataset.mode); break;
    case 'pracStop':  ui.practice = null; render(); break;
    case 'pracNext': {
      const p = ui.practice;
      p.idx++;
      if(p.idx < p.q.length) makeQ();
      render();
      break;
    }
    case 'pracCheck': {
      const inp = $('#pracInput');
      pracAnswer(inp ? inp.value : '');
      break;
    }
    case 'pracReveal': {
      const p = ui.practice;
      const it = S.items.find(x=>x.id===p.q[p.idx]);
      markPracticed(it);
      p.fb = {ok:false, msg:`Answer: <b>${esc(it.term)}</b> — ${esc(it.meaning)}`};
      render();
      break;
    }
    case 'pracProduce': {
      const p = ui.practice;
      const it = S.items.find(x=>x.id===p.q[p.idx]);
      const inp = $('#pracInput');
      const txt = inp ? inp.value.trim() : '';
      if(!txt){ toast('Write something'); return; }
      it.personal = txt;
      markPracticed(it);
      p.correct++;
      p.fb = {ok:true, msg:'✓ Saved as personal example.'};
      save(); render();
      break;
    }

    case 'memFlip': {
      const p = ui.practice;
      if(!p || p.mode !== 'memory' || p.locked) break;
      const idx = Number(el.dataset.idx);
      const card = p.cards[idx];
      if(!card || card.flipped || card.matched) break;

      card.flipped = true;
      p.flipped.push(idx);

      if(p.flipped.length === 2){
        p.moves++;
        const [a,b] = p.flipped;
        const ca = p.cards[a], cb = p.cards[b];
        if(ca.itemId === cb.itemId && ca.type !== cb.type){
          ca.matched = true; cb.matched = true;
          p.pairsFound++; p.flipped = [];
          const it = S.items.find(x=>x.id===ca.itemId);
          if(it) markPracticed(it);
          render();
        } else {
          p.locked = true;
          render();
          setTimeout(()=>{
            if(!ui.practice || ui.practice !== p) return;
            ca.flipped = false; cb.flipped = false;
            p.flipped = []; p.locked = false;
            render();
          }, 800);
        }
        break;
      }
      render();
      break;
    }

    case 'reviewStart': {
      const due = dueItems();
      if(!due.length){ toast('Nothing due'); return; }
      ui.reviewCard = due[0].id;
      ui.reviewReveal = false;
      render();
      break;
    }
    case 'reviewReveal': ui.reviewReveal = true; render(); break;
    case 'rate': {
      const it = S.items.find(x=>x.id===ui.reviewCard);
      if(!it){ ui.reviewCard = null; render(); return; }
      rate(it, el.dataset.r);
      ui.reviewCard = null;
      ui.reviewReveal = false;
      const next = dueItems();
      if(next.length) ui.reviewCard = next[0].id;
      render();
      break;
    }

    case 'saveWriting': {
      const day = ensureDay(T);
      const ta = $('#wtext');
      day.writing = ta ? ta.value : '';
      (day.writeSel||[]).forEach(id=>{
        const it = S.items.find(i=>i.id===id);
        if(it && day.writing.toLowerCase().includes(it.term.toLowerCase())) markPracticed(it);
      });
      save(); toast('Saved'); render();
      break;
    }
    case 'clearWriting': {
      ensureDay(T).writing = '';
      save(); render();
      break;
    }

    case 'csvUpload':  openCSVUpload(); break;
    case 'csvConfirm': commitCSVImport(); break;
    case 'csvCancel':  ui.csvDraft = null; render(); break;

    case 'exportData': exportData(); break;
    case 'importData': importData(); break;
    case 'resetData': {
      if(confirm('Delete all data and start fresh?')){
        localStorage.removeItem(LS_KEY);
        S = emptyState();
        ui = {lib:{cat:'all',status:'all',q:''}, addCat:'', selectMode:false, selected:new Set()};
        save(); nav('today');
        toast('Cleared');
      }
      break;
    }
  }
}

document.addEventListener('input', e=>{
  if(e.target.id === 'libSearch'){
    ui.lib = ui.lib || {cat:'all',status:'all',q:''};
    ui.lib.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $('#libSearch');
    if(el){ el.focus(); el.setSelectionRange(pos,pos); }
    return;
  }
  const f = e.target.dataset.field;
  if(f && modalId){
    const it = S.items.find(i=>i.id===modalId);
    if(it){
      it[f] = (f==='difficulty') ? Number(e.target.value)||1 : e.target.value;
      save();
    }
  }
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(ui.selectMode){ clearSelection(); render(); return; }
    closeModal();
    return;
  }
  if(e.key === 'Enter'){
    if(e.target.id === 'quickTerm'){
      e.preventDefault();
      const card = e.target.closest('.card');
      const btn = card && card.querySelector('[data-act="quickAdd"]');
      if(btn) handleAct(btn);
      return;
    }
    if(e.target.id === 'f_term' || e.target.id === 'f_meaning'){ e.preventDefault(); doAdd(false); return; }
    if(e.target.id === 'pracInput' && ui.practice){
      const p = ui.practice;
      if(p.mode === 'production') handleAct({dataset:{act:'pracProduce'}});
      else handleAct({dataset:{act:'pracCheck'}});
      return;
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
S = load();
ui = { lib:{cat:'all',status:'all',q:''}, addCat:'', selectMode:false, selected:new Set() };
render();
</script>
</body>
</html>
